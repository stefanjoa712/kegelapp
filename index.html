<style>
  :root{
    --bg:#F6F6F4;
    --surface:#FFFFFF;
    --ink:#161616;
    --ink-soft:#4A4642;
    --wood:#E3421F;
    --wood-dark:#161616;
    --felt:#E3421F;
    --felt-dark:#B8331A;
    --brass:#B8331A;
    --brass-light:#FFFFFF;
    --wine:#7A2E2E;
    --line:#E5E1D8;
    --muted:#9A9186;
    --tint:#FDECE6;
    --font-display:'Poppins', sans-serif;
    --font-body:'Nunito', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{height:100%; min-height:100dvh; background:var(--bg); overscroll-behavior-y:contain;}
  body{margin:0; min-height:calc(100% + 1px); min-height:calc(100dvh + 1px); background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5; touch-action:manipulation; overscroll-behavior-y:contain;}
  button{font:inherit;}
  a{color:inherit;}
  *:focus-visible{outline:2px solid var(--felt); outline-offset:2px;}

  .app-header{
    position:sticky; top:0; z-index:800;
    background:var(--ink);
    border-bottom:4px solid var(--wood);
    box-sizing:border-box;
  }
  .app-header-top{
    padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;
    align-items:center;
    gap:12px;
    min-height:78px;
    box-sizing:border-box;
  }
  .header-brand{display:flex; flex-direction:column; gap:2px; background:none; border:none; padding:0; margin:0; text-align:left; cursor:pointer; font:inherit;}
  .brand-logo{height:46px; width:auto; display:block;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .header-back-btn{background:none; border:none; padding:6px; margin:0 0 0 -6px; cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; height:38px; box-sizing:border-box;}
  .header-back-btn svg{width:26px; height:26px; display:block;}
  .header-icon-btn{background:none; border:none; padding:6px; cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; height:38px; box-sizing:border-box;}
  .header-icon-btn svg{width:22px; height:22px; display:block;}
  .header-circle-btn{
    background:var(--wood); border:2px solid #fff; border-radius:50%; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,0.35);
  }
  .header-circle-btn svg{width:20px; height:20px; display:block;}
  .header-today-btn{
    background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.4); border-radius:50%;
    color:#fff; width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .header-today-btn svg{width:20px; height:20px; display:block;}
  .header-overflow-wrap{position:relative; margin:0 -6px 0 0;}
  .header-overflow-menu{
    position:absolute; top:44px; right:0; background:var(--surface); border:2px solid var(--ink);
    border-radius:8px; box-shadow:3px 3px 0 var(--ink); min-width:260px; z-index:1050; overflow:hidden;
  }
  .header-overflow-menu[hidden]{display:none;}
  .header-overflow-item{display:block; width:100%; text-align:left; background:none; border:none; padding:13px 16px; font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--wine); cursor:pointer; border-top:1px solid var(--line); white-space:nowrap;}
  .header-overflow-item:disabled{color:var(--muted); cursor:not-allowed; opacity:0.6;}
  .header-overflow-item:first-child{border-top:none;}
  .header-overflow-item.neutral{color:var(--ink);}
  .header-overflow-item:hover{background:var(--bg);}
  .header-title{font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:38px; line-height:38px; box-sizing:border-box; flex:1; min-width:0;}

  .tab-bar{display:flex; gap:8px; padding:0 16px 14px;}
  .tab-btn{
    flex:1; text-align:center; padding:9px 10px; border-radius:8px; border:none;
    background:rgba(255,255,255,0.12); font-family:var(--font-body); font-weight:800; font-size:14px;
    cursor:pointer; color:rgba(255,255,255,0.75);
  }
  .tab-btn.active{background:var(--wood); color:#fff;}

  /* Kegelabend-Tabs (5 Stück) im Fluent-2-Stil: statt einzelner Buttons mit Lücken eine
     durchgehende Kapsel (container) mit einer gleitenden aktiven "Pille" darin - so wie
     iOS-Segmented-Controls und Fluent 2 es vorsehen. Eckradius folgt Fluents 4px-Raster:
     4px für die kleineren Segmente, 8px für den größeren Außen-Container.
     Die Segmente strecken sich gleichmäßig über die volle Breite (CSS-Grid mit
     minmax(0,1fr)), aber nur bis zu einer Maximalbreite pro Segment - auf breiten
     Bildschirmen wirken sie sonst unnötig lang. Reicht die Breite selbst mit
     minimaler Segmentgröße nicht aus, fällt die Leiste automatisch auf horizontales
     Scrollen zurück (Peek-Effekt am Ende), statt umzubrechen - siehe Fluent-2-Guidance
     zu Segmented Controls. */
  .evening-tab-bar{
    display:grid; grid-template-columns:repeat(5, minmax(0, 1fr));
    background:rgba(255,255,255,0.12); border-radius:8px; padding:3px;
    gap:2px; overflow-x:auto; scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .evening-tab-bar::-webkit-scrollbar{display:none;}
  .evening-tab-bar .tab-btn{
    width:100%; max-width:100px; margin:0 auto; white-space:nowrap; scroll-snap-align:start;
    font-size:12px; padding:8px 9px; border-radius:4px; background:none;
  }
  .evening-tab-bar .tab-btn.active{background:var(--wood);}

  .container{max-width:640px; margin:0 auto; padding:24px 16px 100px; transition:transform 0.25s ease;}

  .login-screen{
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:24px 16px; box-sizing:border-box; background:var(--bg);
  }
  .login-logo{height:64px; width:auto; display:block;}
  .login-card{max-width:360px; width:100%; box-sizing:border-box;}
  .container.pull-dragging{transition:none;}

  .pull-refresh-indicator{
    position:fixed; top:66px; left:50%; z-index:850;
    width:36px; height:36px; border-radius:50%;
    background:var(--surface); border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transform:translateX(-50%) translateY(-40px) rotate(0deg);

<body>
<div id="app"></div>
<div id="update-banner" class="update-banner" hidden>
  <span>Neue Version verfügbar</span>
  <button type="button" id="update-banner-btn">Jetzt aktualisieren</button>
</div>
<div id="pull-refresh-indicator" class="pull-refresh-indicator">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M12 19l-5-5M12 19l5-5"/>
  </svg>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { initializeFirestore, persistentLocalCache, persistentSingleTabManager, doc, collection, getDoc, getDocs, getDocFromCache, getDocFromServer, setDoc, deleteDoc, deleteField, runTransaction } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
    setPersistence, browserLocalPersistence, browserSessionPersistence,
    verifyPasswordResetCode, confirmPasswordReset
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-functions.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBghOmmLWKdjlRFtau4ecODdQA7Al8fFc4",
    authDomain: "die-pudolfs.firebaseapp.com",
    projectId: "die-pudolfs",
    storageBucket: "die-pudolfs.firebasestorage.app",
    messagingSenderId: "1014092182192",
    appId: "1:1014092182192:web:a92df681ef542f87450175"
  };
  const firebaseApp = initializeApp(firebaseConfig);
  // Persistenter lokaler Cache (IndexedDB): Firestore versucht zuerst den Server, fällt bei
  // fehlender/schlechter Verbindung automatisch auf die zuletzt bekannten lokalen Daten zurück.
  // Bleibt auch zwischen App-Starts erhalten.
  const db = initializeFirestore(firebaseApp, {
    localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
  });
  const auth = getAuth(firebaseApp);
  const functions = getFunctions(firebaseApp);

  // Fester Admin-Zugang: loggt sich im Hintergrund über einen echten Firebase-Auth-Account ein,
  // damit auch der Admin unter die (später scharf geschaltete) Firestore-Regel "nur eingeloggt" fällt.
  const ADMIN_EMAIL = 'admin@die-pudolfs.internal';
  const ADMIN_PASSWORD = '2Cds7cSl4zWCu4F9';

  // Vorbereitung für Multi-Club-Fähigkeit: Club-Stammdaten und Mitglieder liegen unter
  // 'clubs/<clubId>/...' statt im gemeinsamen 'kegelbuch/'. Ein Auth-Account kann einem oder
  // mehreren Clubs zugeordnet sein (Custom Claim 'clubIds', siehe Cloud Functions inviteMember/
  // unlinkMemberAccount) - CURRENT_CLUB_ID wird erst nach dem Login bekannt (resolveActiveClub())
  // und ist bis dahin null. Kein Zugriff auf Firestore darf VOR diesem Zeitpunkt versucht werden.
  let CURRENT_CLUB_ID = null;
  // Club-Stammdaten (Name, PayPal-Name, ...) des aktuell aktiven Clubs - wird direkt nach dem
  // Setzen von CURRENT_CLUB_ID in bootstrapAuth per getClub() geladen. CLUB_NAME dient als
  // generischer Platzhalter, solange die echten Stammdaten noch nicht geladen sind (Ladebildschirm,
  // Meta-Tags vor dem Login).
  let CURRENT_CLUB_DATA = null;
  const CLUB_NAME_FALLBACK = 'Kegelclub';
  function clubDisplayName(){ return (CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.name) || CLUB_NAME_FALLBACK; }
  function clubRef(){ return doc(db, 'clubs', CURRENT_CLUB_ID); }
  function clubMembersCollection(){ return collection(db, 'clubs', CURRENT_CLUB_ID, 'members'); }
  function clubMemberDocRef(id){ return doc(db, 'clubs', CURRENT_CLUB_ID, 'members', id); }

  // Liest die Club-Zugehörigkeit (Custom Claim 'clubIds') des gerade eingeloggten Nutzers und
  // setzt CURRENT_CLUB_ID entsprechend:
  // - Admin-Account -> IMMER Auswahl über ALLE existierenden Clubs, unabhängig vom eigenen Claim.
  //   Der Admin ist kein Mitglied eines bestimmten Clubs, sondern verwaltet die App insgesamt -
  //   sein eigener Claim (falls vorhanden) ist für diese Entscheidung irrelevant.
  // - Genau ein Club (Mitglied) -> direkt übernehmen, kein Klick nötig (der heute übliche Fall).
  // - Mehrere Clubs (Mitglied) -> Auswahl-Screen zeigen (Club-Namen aus clubs/<clubId>-Stammdaten
  //   geladen), Nutzer wählt; die Wahl wird NICHT gemerkt, bei jedem Login erneut gefragt.
  // - Kein Club, kein Admin -> Fehlermeldung, kein Zugriff auf die App.
  // 'forceRefresh=true' erzwingt einen neuen ID-Token vom Server (Firebase cached Tokens bis zu
  // einer Stunde) - wichtig direkt nach einer frischen Einladung, wo der Claim serverseitig
  // gerade erst gesetzt wurde und ein gecachtes Token ihn noch nicht enthält.
  async function resolveActiveClub(user, forceRefresh){
    if(user.email===ADMIN_EMAIL){
      let allClubIds = [];
      try{ allClubIds = await getAllClubIds(); }catch(e){ /* fällt unten auf "Kein Zugriff" zurück */ }
      if(allClubIds.length===0){ renderNoClubAccessScreen(); return null; }
      if(allClubIds.length===1) return allClubIds[0];
      return await showClubSelectionScreen(allClubIds);
    }

    const tokenResult = await user.getIdTokenResult(!!forceRefresh);
    let clubIds = (tokenResult.claims && tokenResult.claims.clubIds) || [];
    if(!Array.isArray(clubIds)) clubIds = [];

    if(clubIds.length===0 && !forceRefresh){
      // Möglich, dass der Claim gerade erst gesetzt wurde und das gecachte Token ihn noch nicht
      // kennt - einmal mit erzwungenem Refresh nachschauen, bevor wir aufgeben.
      return resolveActiveClub(user, true);
    }
    if(clubIds.length===0){
      renderNoClubAccessScreen();
      return null;
    }
    if(clubIds.length===1){
      return clubIds[0];
    }
    return await showClubSelectionScreen(clubIds);

  const DEFAULT_SEATING_SIDE_NAMES = { left: 'Links', right: 'Rechts' };

  // Liest die konfigurierten Seitenbezeichnungen aus CURRENT_CLUB_DATA, mit Fallback auf die
  // Standardnamen (fehlt z.B. bei Clubs, die noch nicht gespeichert haben, oder direkt nach
  // dem Anlegen eines neuen Clubs).
  function getSeatingSideNames(){
    const names = (CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.seatingSideNames) || {};
    return {
      left: (names.left && names.left.trim()) || DEFAULT_SEATING_SIDE_NAMES.left,
      right: (names.right && names.right.trim()) || DEFAULT_SEATING_SIDE_NAMES.right
    };
  }

  // Berechnet die Kürzel für beide Seiten aus deren Bezeichnung: normalerweise der erste
  // Buchstabe (analog zum bisherigen 'S'/'K'), bei gleichem Anfangsbuchstaben werden die
  // ersten zwei, drei usw. Buchstaben genommen, bis sich die Kürzel unterscheiden (oder eine
  // Seite komplett aufgebraucht ist). Wird beim Ändern der Seitenbezeichnung einmalig berechnet
  // und in clubs/{clubId}.seatingShortLabels gespeichert (siehe saveClubSeatingConfig()), damit
  // dies nicht bei jedem Rendern erneut passieren muss.
  function computeSeatingShortLabels(leftName, rightName){
    const left = (leftName || '').trim() || DEFAULT_SEATING_SIDE_NAMES.left;
    const right = (rightName || '').trim() || DEFAULT_SEATING_SIDE_NAMES.right;
    let len = 1;
    const maxLen = Math.max(left.length, right.length);
    while(len < maxLen){
      const l = left.slice(0, len).toUpperCase();
      const r = right.slice(0, len).toUpperCase();
      if(l !== r) break;
      len++;
    }
    return {
      left: left.slice(0, len).toUpperCase() || 'L',
      right: right.slice(0, len).toUpperCase() || 'R'
    };
  }

  // Liest die gespeicherten Kürzel aus CURRENT_CLUB_DATA; berechnet sie als Fallback live neu,
  // falls sie (z.B. bei älteren Clubs, die die neuen Seitenbezeichnungen noch nicht gespeichert
  // haben) noch nicht vorliegen.
  function getSeatingShortLabels(){
    const stored = CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.seatingShortLabels;
    if(stored && stored.left && stored.right) return stored;
    const names = getSeatingSideNames();
    return computeSeatingShortLabels(names.left, names.right);
  }

  // Liefert die Seitenbezeichnungen eines KONKRETEN Kegelabends: das zum Erstellungszeitpunkt in
  // detail.seatingSideNamesSnapshot gespeicherte Paar (analog zu seatingTemplateId, siehe
  // getEveningSeatingTemplate()), mit Fallback auf die aktuell konfigurierten Namen für ältere
  // Abende von vor Einführung dieses Felds. Ein späteres Ändern der Seitenbezeichnungen in der
  // Clubverwaltung darf die Darstellung bereits angelegter Abende NICHT rückwirkend verändern.
  function getEveningSideNames(detail){
    const stored = detail && detail.seatingSideNamesSnapshot;
    if(stored && stored.left && stored.right) return stored;
    return getSeatingSideNames();
  }

  // Liefert die Seiten-Kürzel eines KONKRETEN Kegelabends: aus detail.seatingSideNamesSnapshot
  // live neu berechnet (nicht aus dem aktuellen Club-Stand), damit z.B. bei gleichem Anfangs-
  // buchstaben beider Seiten dieselbe längenauflösende Logik wie zum Erstellungszeitpunkt greift.
  // Fallback auf die aktuellen Club-Kürzel für ältere Abende ohne Snapshot.
  function getEveningShortLabels(detail){
    const stored = detail && detail.seatingSideNamesSnapshot;
    if(stored && stored.left && stored.right) return computeSeatingShortLabels(stored.left, stored.right);
    return getSeatingShortLabels();
  }

  // Katalog der wählbaren Sitzplan-Templates (Tischform + Plätze pro Seite). 'shape' steuert
  // die Geometrie in buildSeatingSVG()/buildPreviewSeatingSVG() ('trapez' = zur Kegelbahn hin
  // verjüngend wie ursprünglich, 'rechteck' = parallele Kanten, 'rund' = ovale Form mit
  // durchgehend gebogenen Kanten). 'perSide' ersetzt die früher fest verdrahtete 6 - JEDE Stelle
  // im Code, die Sitzplätze zählt oder aufzählt, muss die perSide-Zahl des jeweils relevanten
  // Templates verwenden (siehe getEveningSeatingTemplate() für bestehende Abende,
  // getClubSeatingTemplate() für neu anzulegende). 'groupLabel' gruppiert die Templates in
  // Dropdowns (siehe buildEveningSeatingTemplateOptionsHtml(), viewClubManagement()) - die
  // Reihenfolge der Gruppen richtet sich nach der ersten Fundstelle in diesem Array, daher stehen
  // Trapez-, Rechteck- und Rundtische bewusst in dieser Reihenfolge hintereinander.
  const SEATING_TEMPLATES = [
    { id:'trapez-5',    label:'Trapeztisch mit 5 Sitzplätzen pro Seite',    shape:'trapez',   perSide:5, groupLabel:'Trapeztische' },
    { id:'trapez-6',    label:'Trapeztisch mit 6 Sitzplätzen pro Seite',    shape:'trapez',   perSide:6, groupLabel:'Trapeztische' },
    { id:'trapez-7',    label:'Trapeztisch mit 7 Sitzplätzen pro Seite',    shape:'trapez',   perSide:7, groupLabel:'Trapeztische' },
    { id:'trapez-8',    label:'Trapeztisch mit 8 Sitzplätzen pro Seite',    shape:'trapez',   perSide:8, groupLabel:'Trapeztische' },
    { id:'rechteck-5',  label:'Rechteckiger Tisch mit 5 Sitzplätzen pro Seite', shape:'rechteck', perSide:5, groupLabel:'Rechteckige Tische' },
    { id:'rechteck-6',  label:'Rechteckiger Tisch mit 6 Sitzplätzen pro Seite', shape:'rechteck', perSide:6, groupLabel:'Rechteckige Tische' },
    { id:'rechteck-7',  label:'Rechteckiger Tisch mit 7 Sitzplätzen pro Seite', shape:'rechteck', perSide:7, groupLabel:'Rechteckige Tische' },
    { id:'rechteck-8',  label:'Rechteckiger Tisch mit 8 Sitzplätzen pro Seite', shape:'rechteck', perSide:8, groupLabel:'Rechteckige Tische' },
    { id:'rund-2',      label:'Runder Tisch mit 2 Sitzplätzen pro Seite',   shape:'rund',     perSide:2, groupLabel:'Runde Tische' },
    { id:'rund-3',      label:'Runder Tisch mit 3 Sitzplätzen pro Seite',   shape:'rund',     perSide:3, groupLabel:'Runde Tische' },
    { id:'rund-4',      label:'Runder Tisch mit 4 Sitzplätzen pro Seite',   shape:'rund',     perSide:4, groupLabel:'Runde Tische' }
  ];
  const DEFAULT_SEATING_TEMPLATE_ID = 'trapez-6'; // entspricht dem bisherigen, fest verdrahteten Verhalten
  function getSeatingTemplateById(templateId){
    return SEATING_TEMPLATES.find(t=>t.id===templateId) || SEATING_TEMPLATES.find(t=>t.id===DEFAULT_SEATING_TEMPLATE_ID);
  }
  // Aktuell in der Clubverwaltung konfiguriertes Template - gilt für NEU anzulegende Kegelabende
  // (siehe handleConfirmNewEvening()). Bestehende Abende behalten ihr zum Erstellungszeitpunkt
  // gespeichertes Template (detail.seatingTemplateId, siehe getEveningSeatingTemplate()) und
  // ändern sich NICHT rückwirkend, wenn der Club das Template später wechselt.
  function getClubSeatingTemplate(){
    const stored = CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.seatingTemplateId;
    return getSeatingTemplateById(stored);
  }
  // Liefert das Template eines KONKRETEN Kegelabends: das zum Erstellungszeitpunkt in
  // detail.seatingTemplateId gespeicherte, mit Fallback auf das Default-Template für ältere
  // Abende von vor Einführung dieses Felds (die hatten technisch immer 6 Plätze pro Seite,
  // Trapezform - genau das, was DEFAULT_SEATING_TEMPLATE_ID abbildet).
  function getEveningSeatingTemplate(detail){
    return getSeatingTemplateById(detail && detail.seatingTemplateId);
  }

  // Baut die <option>-Liste für die Sitzplan-Auswahl auf der "Neuer Kegelabend"-Seite
  // (#neuer-abend, siehe viewNew()): der Club-Standard steht als eigene, vorausgewählte Option
  // oben ("Standardsitzplan (<Name des Templates>)"), alle übrigen Templates folgen darunter -
  // gruppiert nach groupLabel (Trapez-/Rechteck-/Runde Tische, siehe SEATING_TEMPLATES) statt in
  // einer einzigen "Verfügbare Sitzpläne"-Gruppe. Der Wert der Standard-Option ist bewusst die
  // template-id selbst (nicht ein Sonderwert wie 'standard') - so bleibt die Auswertung beim
  // Anlegen (handleConfirmNewEvening()) einheitlich: der select-Wert IST immer direkt eine
  // gültige SEATING_TEMPLATES-id, unabhängig davon, ob die Standard-Option oder eine der
  // weiteren Optionen gewählt wurde.
  function buildEveningSeatingTemplateOptionsHtml(){
    const standardTemplate = getClubSeatingTemplate();
    const otherTemplates = SEATING_TEMPLATES.filter(t=>t.id!==standardTemplate.id);
    const groupsHtml = buildSeatingTemplateGroupsHtml(otherTemplates);
    return `
      <option value="${standardTemplate.id}" selected>Standardsitzplan (${escapeHtml(standardTemplate.label)})</option>
      ${groupsHtml}
    `;
  }

  // Baut aus einer Liste von Templates eine Reihe von <optgroup>-Blöcken, gruppiert nach
  // groupLabel (siehe SEATING_TEMPLATES) und in der Reihenfolge, in der die Gruppen dort zuerst
  // auftreten (also Trapez-, dann Rechteck-, dann Runde Tische). Gemeinsam genutzt von
  // buildEveningSeatingTemplateOptionsHtml() (Neuer Kegelabend) und der Clubverwaltung
  // (viewClubManagement()), damit beide Stellen dieselbe Gruppierung zeigen. selectedId ist
  // optional - falls gesetzt, erhält die passende <option> das selected-Attribut (wird von der
  // Clubverwaltung genutzt, die alle Templates flach mit aktueller Auswahl zeigt statt eine
  // separate "Standardsitzplan"-Option davorzustellen).
  function buildSeatingTemplateGroupsHtml(templates, selectedId){
    const groupLabels = [];
    templates.forEach(t=>{ if(!groupLabels.includes(t.groupLabel)) groupLabels.push(t.groupLabel); });
    return groupLabels.map(groupLabel=>{
      const optionsHtml = templates.filter(t=>t.groupLabel===groupLabel).map(t=>
        `<option value="${t.id}"${t.id===selectedId?' selected':''}>${escapeHtml(t.label)}</option>`
      ).join('');
      return `<optgroup label="${escapeHtml(groupLabel)}">${optionsHtml}</optgroup>`;
    }).join('');
  }

  // Baut die SEATS-Struktur dynamisch aus den Seitenbezeichnungen UND der Plätze-pro-Seite-Zahl
  // des übergebenen Templates auf. Die seatId-Präfixe 'saal'/'kneipe' bleiben aus historischen
  // Gründen bewusst bestehen (sie sind in Firestore an vielen Stellen als technischer Schlüssel
  // verankert, z.B. in roundsGivenBySeat, finesBySeat, occupiedSeatIds) - nur 'section' und
  // 'label' (reine Anzeigefelder) folgen den übergebenen Namen. template ist optional (Default:
  // aktuelles Club-Template) - wird IMMER explizit übergeben, wenn es um einen bestehenden
  // Kegelabend geht (siehe getEveningSeatingTemplate()). sideNames ist ebenfalls optional
  // (Default: aktuell konfigurierte Club-Namen) - für einen bestehenden Kegelabend MUSS hier der
  // gespeicherte Snapshot (siehe getEveningSideNames()) übergeben werden, damit ein späteres
  // Ändern der Seitenbezeichnungen in der Clubverwaltung den Abend nicht rückwirkend verändert.
  function buildSeats(template, sideNames){
    const t = template || getClubSeatingTemplate();
    const names = sideNames || getSeatingSideNames();
    const seats = [];
    for(let i=1;i<=t.perSide;i++) seats.push({id:'saal-'+i, section:names.left, label:names.left+' '+i});
    for(let i=1;i<=t.perSide;i++) seats.push({id:'kneipe-'+i, section:names.right, label:names.right+' '+i});
    return seats;
  }
  function SEATS(template, sideNames){ return buildSeats(template, sideNames); }

  // Standard-Sitzplatz, dessen Inhaber bei der Auslosungsoption "Standardplatz" automatisch
  // Schriftführer wird (siehe #clubverwaltung, Abschnitt "Sitzplan", und createEvening()).
  // Fällt auf 'kneipe-1' zurück (historischer Default, entspricht "Rechts 1" bei den
  // Standard-Seitenbezeichnungen), falls der Club noch keinen eigenen Wert gespeichert hat, oder
  // falls der gespeicherte Wert keiner der aktuell gültigen seatIds des ÜBERGEBENEN Templates
  // entspricht (z.B. nach einem Template-Wechsel mit weniger Plätzen, oder wenn beim Anlegen
  // eines Kegelabends ein anderes als das Club-Standard-Template gewählt wurde, siehe
  // handleConfirmNewEvening() und buildEveningSeatingTemplateOptionsHtml()). template ist
  // optional (Default: aktuelles Club-Template) - wird explizit übergeben, wenn ein Kegelabend
  // mit einem VOM Club-Standard abweichenden Template angelegt wird.
  const DEFAULT_STANDARD_SCHRIFTFUEHRER_SEAT_ID = 'kneipe-1';
  function getStandardSchriftfuehrerSeatId(template){
    const stored = CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.standardSchriftfuehrerSeatId;
    const validIds = buildSeats(template).map(s=>s.id);
    return (stored && validIds.includes(stored)) ? stored : DEFAULT_STANDARD_SCHRIFTFUEHRER_SEAT_ID;
  }

  // ---------- Zustand ----------
  // Ausstehender Notizen-Speichervorgang (800ms Debounce, siehe Notizen-Textarea-Handler weiter
  // unten): null, solange nichts aussteht, sonst ein Promise, das auflöst sobald der zuletzt
  // gestartete Speichervorgang abgeschlossen ist. Wird von closeEvening() awaited, damit ein
  // Kegelabend niemals mit noch nicht persistierten Notizen abgeschlossen wird.
  let pendingNotesSave = null;

  const state = {
    view:'loading',
    members:[],
    eveningsIndex:[],
    finesCatalog:[],
    gamesCatalog:[],
    financeAccounts:[],
    financeTransactions:[],
    financeArrears:[],
    financeTab:'umsaetze',
    currentArrearsName:'',
    currentTransactionId:null,
    financeRecurring:[],
    financeSavingsPots:[],
    calendarEvents:[],
    calendarOccurrenceEdits:[],
    calendarRsvps:[],
    calendarViewYear: new Date().getFullYear(),
    calendarViewMonth: new Date().getMonth()+1,
    calendarSelectedDate: todayISO(),
    calendarEditingOccurrence: null,
    currentMemberId: null,
    // Rolle des eingeloggten Nutzers (Custom Claim 'role', siehe canManageMembers()) - wird beim
    // Login einmal aus dem ID-Token gelesen (siehe bootstrapAuth). Admin-Account zählt gesondert
    // über ADMIN_EMAIL, nicht über dieses Feld. Default 'Mitglied' = read-only, bis das echte
    // Token geladen ist (nie versehentlich zu viele Rechte in der kurzen Ladezeit anzeigen).
    currentUserRole: 'Mitglied',
    currentRecurringId: null,
    currentSavingsPotId: null,
    currentFinanceAccountId: null,
    currentFineId: null,
    currentGameId: null,
    currentMemberStats: {},
    eventDetailOrigin: 'calendar',
    currentEveningDetail:null,
    confirmDeleteEveningId:null,
    justCreated:false,
    mainError:'',
    expandedYears: new Set([String(new Date().getFullYear())]),
    financeExpandedYears: new Set([String(new Date().getFullYear())]),
    eveningTab:'sitzplan',
    currentFineSeatId:null,
    currentFineName:'',
    // Zeitstempel (Date.now()) des letzten erfolgreichen Ladens pro Datentyp - Grundlage für
    // isFresh()/invalidate() (siehe unten). Ermöglicht, bei Navigation zwischen Menüpunkten auf
    // einen erneuten Ladescreen zu verzichten, wenn die Daten noch "frisch genug" sind, statt bei
    // jedem Menüwechsel alles blind neu von Firestore zu laden.
    _lastFetched:{}
  };
  let currentGuests = [];

  // ---------- Storage-Helfer (Firestore) ----------
  // Verhindert, dass ein hängender Firestore-Aufruf (z.B. bei schlechter Verbindung) die App
  // für immer im Ladezustand stecken lässt - nach STORAGE_TIMEOUT_MS wird abgebrochen.
  const STORAGE_TIMEOUT_MS = 10000;
  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise((_, reject)=> setTimeout(()=> reject(new Error('Zeitüberschreitung')), ms))
    ]);
  }

  // Zentraler Schreibschutz: wirft einen Fehler, wenn der Club im Read-Only-Modus ist
  // (abgelaufener Free-Zeitraum, subscription.accessBlocked - siehe readOnlyBannerHtml() und
  // firestore.rules/clubAccessBlocked()). Wird an den wenigen zentralen Schreibstellen der App
  // aufgerufen (setClubJSON, makeClubEntityStore.save/remove, evening-Writes) - NICHT aber in
  // saveClub() selbst, da Kassenwart/Präsident weiterhin auf "Premium" wechseln können müssen.
  // Rein clientseitiges UX (schnelle, verständliche Fehlermeldung statt eines rohen Firestore-
  // Permission-Fehlers) - die eigentliche Durchsetzung übernehmen unabhängig davon die
  // Firestore Rules.
  function assertNotAccessBlocked(){
    if(CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.subscription && CURRENT_CLUB_DATA.subscription.accessBlocked){
      throw new Error('Der kostenlose Testzeitraum ist abgelaufen. Die App kann nur noch gelesen werden.');
    }
  }

  // ---------- Club-gebundene Varianten von getJSON/getJSONOrThrow/setJSON ----------
  // Identisches Verhalten (Cache-First, Hintergrund-Abgleich, Timeout-Handling) wie zuvor die
  // gemeinsamen kegelbuch/-Varianten (inzwischen entfernt, da nach Abschluss der Multi-Club-
  // Migration nirgends mehr aufgerufen), nur dass die Dokumente unter 'clubs/<clubId>/<key>'
  // liegen. Für Daten, die nur diesen einen Club betreffen (z.B. Strafen-/Spiele-Katalog), aber
  // wo sich der Aufwand einer Aufteilung in Einzeldokumente (wie bei den Mitgliedern) nicht
  // lohnt, weil es sich um kleine, selten parallel bearbeitete Listen handelt.
  // Firestore-Dokumentpfade brauchen eine GERADE Anzahl Segmente (collection/doc/collection/doc/...).
  // 'clubs/<clubId>/<key>' hätte nur 3 Segmente und wäre kein gültiger Dokumentpfad (das schlug
  // beim ersten Versuch mit 'HTTP 400: lacks /' fehl) - daher der feste Zwischenschritt 'data' als
  // Collection-Name, macht daraus 'clubs/<clubId>/data/<key>' mit 4 Segmenten.
  function clubDocRef(key){ return doc(db, 'clubs', CURRENT_CLUB_ID, 'data', key); }
  async function getClubJSON(key, fallback, onBackgroundUpdate){
    let cacheResult;
    try{
      const cacheSnap = await getDocFromCache(clubDocRef(key));
      cacheResult = cacheSnap.exists() ? JSON.parse(cacheSnap.data().value) : fallback;
    }catch(e){
      cacheResult = undefined;
    }
    // WICHTIG: getDocFromServer() statt getDoc() für den Hintergrundabgleich - getDoc() kann bei
    // aktivem persistentLocalCache je nach SDK-interner Einschätzung den lokalen Cache bedienen,
    // statt garantiert zum Server zu gehen. Das führte dazu, dass z.B. nach dem Löschen eines
    // Kegelabends über eine Cloud Function (die am Client komplett vorbeischreibt) der stale
    // Cache-Stand dauerhaft bestehen blieb, weil auch der vermeintliche "Server-Abgleich" nur
    // denselben veralteten Cache-Wert zurücklieferte. getDocFromServer() erzwingt einen echten
    // Server-Roundtrip und schließt diese Cache-Falle aus.
    withTimeout(getDocFromServer(clubDocRef(key)), STORAGE_TIMEOUT_MS).then(snap=>{
      const serverResult = snap.exists() ? JSON.parse(snap.data().value) : fallback;
      if(onBackgroundUpdate && JSON.stringify(serverResult)!==JSON.stringify(cacheResult)){
        onBackgroundUpdate(serverResult);
      }
    }).catch(e=>{
      console.error('getClubJSON Server-Abgleich fehlgeschlagen für', key, e);
    });
    if(cacheResult!==undefined) return cacheResult;
    try{
      const snap = await withTimeout(getDoc(clubDocRef(key)), STORAGE_TIMEOUT_MS);
      return snap.exists() ? JSON.parse(snap.data().value) : fallback;
    }catch(e){
      console.error('getClubJSON fehlgeschlagen für', key, e);
      return fallback;
    }
  }
  async function getClubJSONOrThrow(key, fallback, onBackgroundUpdate){
    let cacheResult;
    try{
      const cacheSnap = await getDocFromCache(clubDocRef(key));
      cacheResult = cacheSnap.exists() ? JSON.parse(cacheSnap.data().value) : fallback;
    }catch(e){
      cacheResult = undefined;
    }
    // Siehe Kommentar in getClubJSON() oben - getDocFromServer() statt getDoc(), um den
    // Hintergrundabgleich verlässlich gegen den echten Serverstand laufen zu lassen.
    withTimeout(getDocFromServer(clubDocRef(key)), STORAGE_TIMEOUT_MS).then(snap=>{
      const serverResult = snap.exists() ? JSON.parse(snap.data().value) : fallback;
      if(onBackgroundUpdate && JSON.stringify(serverResult)!==JSON.stringify(cacheResult)){
        onBackgroundUpdate(serverResult);
      }
    }).catch(e=>{
      console.error('getClubJSONOrThrow Server-Abgleich fehlgeschlagen für', key, e);
    });
    if(cacheResult!==undefined) return cacheResult;
    const snap = await withTimeout(getDoc(clubDocRef(key)), STORAGE_TIMEOUT_MS);
    return snap.exists() ? JSON.parse(snap.data().value) : fallback;
  }
  // Erzeugt einen onBackgroundUpdate-Callback für getClubJSON(OrThrow): schreibt den
  // nachträglich vom Server eingetroffenen Wert in den angegebenen state-Key und rendert neu -
  // nur falls sich die View seit dem Aufruf nicht geändert hat (sonst würde man z.B. mitten in
  // einer anderen Ansicht landen, weil ein alter Ladevorgang spät aufgelöst hat).
  //
  // WICHTIG: state[stateKey] wird IMMER aktualisiert, auch wenn die View inzwischen gewechselt
  // hat - nur das render() wird auf die erwartete View beschränkt. Vorher wurde bei einem
  // View-Wechsel der komplette Update verworfen; da getClubJSONOrThrow()/getClubJSON() den
  // Firestore-Client-Cache (persistentLocalCache, überlebt Reloads über IndexedDB) cache-first
  // zurückgeben, blieb dadurch teils dauerhaft ein veralteter Stand (z.B. bereits gelöschte
  // Kegelabende in eveningsIndex) im state stehen: markFetched() markierte den Stand direkt nach
  // dem Cache-Read als "frisch" (FRESH_MS), und wenn der eigentliche Server-Abgleich wegen
  // zwischenzeitlicher Navigation verworfen wurde, gab es bis zum Ablauf von FRESH_MS keinen
  // erneuten Versuch mehr. Mit dem state-Update losgelöst vom render() wird der korrekte Stand
  // jetzt in jedem Fall übernommen, sobald er eintrifft - nur die sofortige Neu-Darstellung
  // bleibt der ursprünglich erwarteten View vorbehalten.
  // Zeitstempel des letzten Hintergrund-Serverabgleichs für eveningsIndex (siehe
  // backgroundStateUpdate() unten und init(), das damit eine Race Condition vermeidet: ohne
  // diesen Zeitstempel konnte init() einen bereits vom Hintergrundabgleich korrigierten
  // state.eveningsIndex-Wert direkt danach wieder mit seinem eigenen, unter Umständen
  // veralteten Rückgabewert überschreiben).
  let lastEveningsIndexBackgroundSyncAt = 0;
  function backgroundStateUpdate(stateKey, expectedView){
    return function(serverResult){
      state[stateKey] = serverResult;
      if(stateKey==='eveningsIndex') lastEveningsIndexBackgroundSyncAt = Date.now();
      if(state.view===expectedView) render();
    };
  }

  // ---------- Stale-while-revalidate-Cache für Navigation zwischen Menüpunkten ----------
  // Jede goTo*()-Funktion lädt bislang bei JEDEM Aufruf alle benötigten Daten neu von Firestore,
  // auch wenn man Sekunden vorher genau diese Daten schon hatte (z.B. Übersicht -> Kalender ->
  // zurück zur Übersicht). Das macht die App gefühlt langsam und erhöht bei vielen Requests auf
  // schlechter Verbindung das Timeout-Risiko. FRESH_MS legt fest, wie lange ein einmal geladener
  // Datentyp als "aktuell genug" gilt: innerhalb dieser Zeit wird beim erneuten Navigieren direkt
  // der vorhandene state-Wert verwendet (kein Request, kein Ladescreen). markFetched() nach jedem
  // erfolgreichen Laden setzen, invalidate() nach jedem Speichern/Löschen des jeweiligen
  // Datentyps aufrufen (siehe saveMember/deleteMember/setClubJSON/makeClubEntityStore unten) -
  // sonst würde man nach einer eigenen Änderung bis zu FRESH_MS lang den alten Stand sehen.
  const FRESH_MS = 60000;
  function isFresh(key){
    const t = state._lastFetched[key];
    return typeof t==='number' && (Date.now()-t)<FRESH_MS;
  }
  function markFetched(key){
    state._lastFetched[key] = Date.now();
  }
  function invalidate(key){
    delete state._lastFetched[key];
  }
  // Lädt einen Datentyp nur neu, wenn er nicht mehr "frisch" ist (siehe FRESH_MS oben) - sonst
  // wird sofort der vorhandene state[stateKey]-Wert zurückgegeben, ohne Firestore-Request. Nach
  // erfolgreichem Laden wird der Zeitstempel aktualisiert. fetchFn darf state[stateKey] NICHT
  // selbst setzen - das übernimmt der Aufrufer, damit alle Werte eines Promise.all-Batches erst
  // gemeinsam nach erfolgreichem Abschluss übernommen werden (kein Teil-Update bei Fehlern).
  async function fetchIfStale(stateKey, fetchFn){
    if(isFresh(stateKey)) return state[stateKey];
    const result = await fetchFn();
    markFetched(stateKey);
    return result;
  }
  // Prüft, ob ALLE übergebenen Datentypen frisch sind - wenn ja, kann die aufrufende goTo*()-
  // Funktion renderLoading() komplett überspringen und sofort mit dem vorhandenen state rendern,
  // während im Hintergrund trotzdem abgeglichen wird (siehe Verwendung in goToMain/goToCalendar
  // für Punkt B: Mitglieder gehören dort ohnehin nicht in den kritischen Ladepfad).
  function allFresh(keys){
    return keys.every(isFresh);
  }
  // Ordnet den Firestore-Dokumentnamen (kebab-case, siehe clubDocRef-Aufrufe) dem zugehörigen
  // state-Feld (camelCase) zu - nötig, damit setClubJSON automatisch den richtigen Stale-Cache-
  // Eintrag invalidieren kann, ohne dass jede Aufrufstelle das manuell tun muss.
  const CLUB_JSON_STATE_KEY = {
    'evenings-index':'eveningsIndex',
    'fines-catalog':'finesCatalog',
    'games-catalog':'gamesCatalog',
    'finance-accounts':'financeAccounts',
    'finance-recurring':'financeRecurring',
    'finance-savings-pots':'financeSavingsPots'
    // 'calendar-feed-token' bewusst nicht gemappt: wird nirgends über fetchIfStale/isFresh
    // gecacht, braucht daher keine Invalidierung.
  };
  async function setClubJSON(key, value){
    assertNotAccessBlocked();
    try{
      await withTimeout(setDoc(clubDocRef(key), { value: JSON.stringify(value) }), STORAGE_TIMEOUT_MS);
      invalidate(CLUB_JSON_STATE_KEY[key] || key);
      return true;
    }catch(e){
      console.error('setClubJSON fehlgeschlagen für', key, e);
      return false;
    }
  }

  // ---------- Generische Helper: "Einzeldokument pro Eintrag + Index" pro Club ----------
  // Gemeinsames Muster für Collections, bei denen parallele Änderungen an unterschiedlichen
  // Einträgen (auf verschiedenen Geräten) nicht kollidieren sollen - z.B. Mitglieder, Termine,
  // Rückmeldungen. Jeder Eintrag liegt als eigenes Dokument unter 'clubs/<clubId>/<collection>/<id>',
  // ein Index-Dokument 'clubs/<clubId>/<collection>/_index' enthält nur die Liste aller IDs.
  // Schreiben/Löschen läuft über eine Transaktion: Firestore wiederholt sie automatisch, falls
  // zwischenzeitlich jemand anders an GENAU DIESEM Dokument geschrieben hat - andere Einträge
  // sind davon nie betroffen, es geht also nichts durch einen kompletten Array-Überschrieb verloren.
  const INDEX_DOC_ID = '_index';
  function makeClubEntityStore(collectionName, cacheKey){
    function docRef(id){ return doc(db, 'clubs', CURRENT_CLUB_ID, collectionName, id); }
    function indexRef(){ return docRef(INDEX_DOC_ID); }

    async function getAll(){
      const indexSnap = await withTimeout(getDoc(indexRef()), STORAGE_TIMEOUT_MS);
      const index = indexSnap.exists() ? JSON.parse(indexSnap.data().value) : [];
      if(index.length===0) return [];
      const snaps = await withTimeout(
        Promise.all(index.map(id=> getDoc(docRef(id)))),
        STORAGE_TIMEOUT_MS
      );
      return snaps.filter(s=>s.exists()).map(s=> JSON.parse(s.data().value));
    }

    async function save(entry){
      assertNotAccessBlocked();
      await withTimeout(runTransaction(db, async (tx)=>{
        const iRef = indexRef();
        const indexSnap = await tx.get(iRef);
        const index = indexSnap.exists() ? JSON.parse(indexSnap.data().value) : [];
        tx.set(docRef(entry.id), { value: JSON.stringify(entry) });
        if(!index.includes(entry.id)){
          index.push(entry.id);
          tx.set(iRef, { value: JSON.stringify(index) });
        }
      }), STORAGE_TIMEOUT_MS);
      if(cacheKey) invalidate(cacheKey);
    }

    async function remove(id){
      assertNotAccessBlocked();
      await withTimeout(runTransaction(db, async (tx)=>{
        const iRef = indexRef();
        const indexSnap = await tx.get(iRef);
        const index = indexSnap.exists() ? JSON.parse(indexSnap.data().value) : [];
        tx.delete(docRef(id));
        const newIndex = index.filter(existingId=>existingId!==id);
        tx.set(iRef, { value: JSON.stringify(newIndex) });
      }), STORAGE_TIMEOUT_MS);
      if(cacheKey) invalidate(cacheKey);
    }

    return { getAll, save, remove };
  }


  // Jedes Mitglied liegt als eigenes Dokument unter 'clubs/<clubId>/members/<id>'. Ein Index-
  // Dokument 'clubs/<clubId>/members/_index' enthält nur die Liste aller IDs, damit man alle
  // Mitglieder laden kann, ohne die komplette Collection scannen zu müssen. Das verhindert das
  // früher mögliche Last-Write-Wins-Problem: Zwei Änderungen an unterschiedlichen Mitgliedern
  // (z.B. auf zwei Geräten gleichzeitig) schreiben jetzt auf unterschiedliche Dokumente und
  // können sich nicht mehr gegenseitig überschreiben. Änderungen am selben Mitglied laufen über
  // eine Transaktion, die bei einem parallelen Schreibvorgang automatisch wiederholt wird statt
  // stillschweigend Daten zu verlieren.
  // Der Pfad clubs/<clubId>/... trennt die Daten verschiedener Kegelclubs strukturell: Firestore-
  // Regeln können pro Club-Pfad greifen, ganz ohne Feld-Prüfung in jeder einzelnen Query.
  const MEMBERS_INDEX_ID = '_index';
  function memberIndexDocRef(){ return clubMemberDocRef(MEMBERS_INDEX_ID); }

  // Lädt alle Mitglieder: erst den Index (Liste der IDs), dann alle zugehörigen Dokumente parallel.
  async function getAllMembers(){
    const indexSnap = await withTimeout(getDoc(memberIndexDocRef()), STORAGE_TIMEOUT_MS);
    const index = indexSnap.exists() ? JSON.parse(indexSnap.data().value) : [];
    if(index.length===0) return [];
    const snaps = await withTimeout(
      Promise.all(index.map(id=> getDoc(clubMemberDocRef(id)))),
      STORAGE_TIMEOUT_MS
    );
    return snaps.filter(s=>s.exists()).map(s=> JSON.parse(s.data().value));
  }

  // Legt ein neues Mitglied an oder aktualisiert ein bestehendes. Läuft in einer Transaktion:
  // liest den aktuellen Serverstand des Dokuments (und ggf. des Index) und schreibt erst danach -
  // Firestore wiederholt die Transaktion automatisch, falls zwischenzeitlich jemand anders an
  // GENAU DIESEM Dokument geschrieben hat. Andere Mitglieder sind davon nie betroffen.
  async function saveMember(member){
    await withTimeout(runTransaction(db, async (tx)=>{
      const indexRef = memberIndexDocRef();
      const indexSnap = await tx.get(indexRef);
      const index = indexSnap.exists() ? JSON.parse(indexSnap.data().value) : [];
      tx.set(clubMemberDocRef(member.id), { value: JSON.stringify(member) });
      if(!index.includes(member.id)){
        index.push(member.id);
        tx.set(indexRef, { value: JSON.stringify(index) });
      }
    }), STORAGE_TIMEOUT_MS);
    invalidate('members');
  }

  // Löscht ein Mitglied: Dokument entfernen und ID transaktional aus dem Index streichen.
  async function deleteMember(memberId){
    await withTimeout(runTransaction(db, async (tx)=>{
      const indexRef = memberIndexDocRef();
      const indexSnap = await tx.get(indexRef);
      const index = indexSnap.exists() ? JSON.parse(indexSnap.data().value) : [];
      tx.delete(clubMemberDocRef(memberId));
      const newIndex = index.filter(id=>id!==memberId);
      tx.set(indexRef, { value: JSON.stringify(newIndex) });
    }), STORAGE_TIMEOUT_MS);
    invalidate('members');
  }

  // ---------- Kalender: Termine, Rückmeldungen und Serien-Ausnahmen ----------
  // Termine (calendar-events), Rückmeldungen (calendar-rsvps) und Serien-Ausnahmen
  // (calendar-occurrence-edits) nutzen dieselbe "Einzeldokument pro Eintrag"-Struktur wie die
  // Mitglieder: mehrere Personen können gleichzeitig auf unterschiedlichen Geräten einen Termin
  // anlegen/bearbeiten, zu-/absagen, oder unterschiedliche Termine EINER Serie individuell
  // anpassen (z.B. Uhrzeit für einen einzelnen Termin ändern), ohne dass sich diese Änderungen
  // gegenseitig überschreiben (kein Last-Write-Wins mehr). Der Kalender-Feed-Token bleibt als
  // einfacher Blob pro Club (siehe getClubJSON/setClubJSON oben) - ein einzelner Wert, der
  // praktisch nie parallel von mehreren Personen geschrieben wird.
  const eventsStore = makeClubEntityStore('events', 'calendarEvents');
  const rsvpsStore = makeClubEntityStore('rsvps', 'calendarRsvps');
  const occurrenceEditsStore = makeClubEntityStore('occurrence-edits', 'calendarOccurrenceEdits');

  async function getAllCalendarEvents(){ return eventsStore.getAll(); }
  async function saveCalendarEvent(event){ return eventsStore.save(event); }
  async function deleteCalendarEvent(id){ return eventsStore.remove(id); }

  async function getAllCalendarRsvps(){ return rsvpsStore.getAll(); }
  async function saveCalendarRsvp(rsvp){ return rsvpsStore.save(rsvp); }
  async function deleteCalendarRsvp(id){ return rsvpsStore.remove(id); }

  async function getAllOccurrenceEdits(){ return occurrenceEditsStore.getAll(); }
  async function saveOccurrenceEdit(edit){ return occurrenceEditsStore.save(edit); }

  // ---------- Finanz-Rückstände ----------
  // Jedes Mitglied/jeder Gast mit offenem oder früherem Rückstand bekommt ein eigenes Dokument
  // (clubs/<clubId>/arrears/<docId>) statt eines gemeinsamen Blobs mit allen Rückständen. Grund:
  // Rückstände werden an vielen, oft zeitlich nahen Stellen aktualisiert (Abend abschließen/
  // wiederöffnen/löschen, Zahlung erfassen, Umsatz stornieren) - ein kompletter Array-Überschrieb
  // hätte hier dasselbe Last-Write-Wins-Risiko wie ursprünglich bei den Mitgliedern, wenn z.B.
  // fast gleichzeitig ein Abend abgeschlossen und eine Zahlung für ein anderes Mitglied erfasst
  // wird. dockId ist die Mitglieds-ID, wo auflösbar, sonst der Name (siehe resolveArrearsDocId).
  const arrearsStore = makeClubEntityStore('arrears', 'financeArrears');
  async function getAllArrears(){ return arrearsStore.getAll(); }
  // Speichert einen Rückstands-Eintrag - außer es handelt sich um einen Gast (Dokument-ID
  // beginnt mit 'guest-', siehe resolveArrearsDocId) UND der Betrag ist auf 0 gefallen: dann wird
  // der Datensatz komplett gelöscht statt mit amount:0 gespeichert. Für Gäste ist ein Rückstand
  // ein einmaliges, abgeschlossenes Ereignis - sobald ausgeglichen, gibt es keinen Grund mehr,
  // Datensatz oder Verlauf zu behalten. Mitglieder-Datensätze bleiben bei 0€ dagegen bestehen
  // (könnten später wieder einen Rückstand aufbauen, und die Historie ist dort weiterhin nützlich).
  async function saveArrearsEntry(entry){
    const isGuest = entry.id && entry.id.startsWith('guest-');
    if(isGuest && Math.round((entry.amount||0)*100)===0){
      await arrearsStore.remove(entry.id);
      return;
    }
    return arrearsStore.save(entry);
  }

  // ---------- Finanz-Buchungen ----------
  // Jede Buchung liegt als eigenes Dokument (clubs/<clubId>/transactions/<id>) statt eines
  // gemeinsamen Blobs mit allen Buchungen. Grund: zwei unabhängige Schreibquellen können
  // kollidieren - zum einen legt/bearbeitet/löscht ein Nutzer händisch einzelne Buchungen, zum
  // anderen schreibt die tägliche Cloud Function processRecurringBookings (läuft nachts um
  // Mitternacht) automatisch neue Buchungen für fällige Daueraufträge. Ein kompletter Array-
  // Überschrieb hätte hier dasselbe Last-Write-Wins-Risiko wie ursprünglich bei den Mitgliedern -
  // fällt eine manuelle Änderung zeitlich mit dem nächtlichen Lauf zusammen, könnte eine der
  // beiden Änderungen die andere überschreiben.
  const transactionsStore = makeClubEntityStore('transactions', 'financeTransactions');
  async function getAllTransactions(){ return transactionsStore.getAll(); }
  async function saveTransaction(tx){ return transactionsStore.save(tx); }
  async function deleteTransaction(id){ return transactionsStore.remove(id); }

  // ---------- Kegelabende ----------
  // Ein Kegelabend besteht aus einem Hauptdokument (Datum, Sitzordnung/Namen, Strafenkatalog-
  // Snapshot, Notizen, Abschluss-Status - Felder, die selten und praktisch nie parallel von
  // mehreren Personen gleichzeitig geändert werden) und einer Unter-Collection mit einem
  // Dokument PRO SITZPLATZ für die eigentlichen Strafen-Zähler (finesBySeat/adHocFinesBySeat).
  // Grund für die Aufteilung: mehrere Personen tragen während des Abends gleichzeitig auf
  // unterschiedlichen Geräten Strafen für unterschiedliche Sitzplätze ein - ein kompletter
  // Überschrieb des ganzen Abend-Dokuments hätte hier das gleiche Last-Write-Wins-Risiko wie
  // ursprünglich bei den Mitgliedern. Schreiben pro Sitzplatz läuft über eine Transaktion, damit
  // auch zwei gleichzeitige Änderungen AM SELBEN Sitzplatz (z.B. zwei Personen zählen für
  // denselben Platz mit) sich nicht gegenseitig überschreiben, sondern Firestore die Transaktion
  // automatisch wiederholt.
  // Pfad: 'clubs/<clubId>/evenings/<eveningId>' (Hauptdokument) und
  // 'clubs/<clubId>/evenings/<eveningId>/seats/<seatId>' (Sitzplatz-Unterdokument).
  function eveningDocRef(eveningId){ return doc(db, 'clubs', CURRENT_CLUB_ID, 'evenings', eveningId); }
  function eveningSeatDocRef(eveningId, seatId){ return doc(db, 'clubs', CURRENT_CLUB_ID, 'evenings', eveningId, 'seats', seatId); }
  function eveningSeatsCollection(eveningId){ return collection(db, 'clubs', CURRENT_CLUB_ID, 'evenings', eveningId, 'seats'); }

  // Lädt ein Abend-Hauptdokument (ohne Sitzplatz-Strafen).
  async function getEveningMainDoc(eveningId){
    const snap = await withTimeout(getDoc(eveningDocRef(eveningId)), STORAGE_TIMEOUT_MS);
    return snap.exists() ? JSON.parse(snap.data().value) : null;
  }

  // Lädt alle Sitzplatz-Unterdokumente eines Abends als { [seatId]: {finesBySeat, adHocFinesBySeat} }.
  async function getEveningSeatFines(eveningId){
    const snaps = await withTimeout(getDocs(eveningSeatsCollection(eveningId)), STORAGE_TIMEOUT_MS);
    const result = {};
    snaps.forEach(snap=>{
      try{ result[snap.id] = JSON.parse(snap.data().value); }catch(e){ /* einzelnes defektes Dokument ignorieren */ }
    });
    return result;
  }

  // Lädt ein komplettes Abend-Detail (Hauptdokument + alle Sitzplatz-Strafen zusammengeführt) -
  // der Rest der App arbeitet weiterhin mit detail.finesBySeat/detail.adHocFinesBySeat wie bisher,
  // ohne dass an jeder Lese-/Anzeigestelle etwas geändert werden musste.
  async function getEveningDetail(eveningId){
    const [main, seatFines] = await Promise.all([
      getEveningMainDoc(eveningId),
      getEveningSeatFines(eveningId)
    ]);
    if(!main) return null;
    main.finesBySeat = {};
    main.adHocFinesBySeat = {};
    main.roundsGivenBySeat = {};
    main.roundsCarriedAwayBySeat = {};
    for(const seatId of Object.keys(seatFines)){
      if(seatFines[seatId].finesBySeat) main.finesBySeat[seatId] = seatFines[seatId].finesBySeat;
      if(seatFines[seatId].adHocFinesBySeat) main.adHocFinesBySeat[seatId] = seatFines[seatId].adHocFinesBySeat;
      if(seatFines[seatId].roundsGivenBySeat) main.roundsGivenBySeat[seatId] = seatFines[seatId].roundsGivenBySeat;
      if(seatFines[seatId].roundsCarriedAwayBySeat) main.roundsCarriedAwayBySeat[seatId] = seatFines[seatId].roundsCarriedAwayBySeat;
    }
    return main;
  }

  // Speichert NUR das Hauptdokument (ohne finesBySeat/adHocFinesBySeat/roundsGivenBySeat - die
  // laufen separat über saveEveningSeatFines). detail darf die Felder enthalten, sie werden hier
  // einfach ignoriert.
  async function saveEveningMainDoc(detail){
    assertNotAccessBlocked();
    const { finesBySeat, adHocFinesBySeat, roundsGivenBySeat, ...mainFields } = detail;
    await withTimeout(setDoc(eveningDocRef(detail.id), { value: JSON.stringify(mainFields) }), STORAGE_TIMEOUT_MS);
  }

  // Speichert die Strafen für GENAU EINEN Sitzplatz eines Abends, transaktional (falls zwei
  // Personen gleichzeitig für denselben Sitzplatz mitzählen, wiederholt Firestore die Transaktion
  // automatisch statt eine der beiden Änderungen zu verlieren). roundsCarriedAway ist optional -
  // pro Instanz markiert, ob eine offene Runde bereits an einen späteren Abend weitergereicht
  // wurde (siehe carryOverOpenRounds()); analog zu roundsGivenBySeat, aber ein eigener Zustand.
  async function saveEveningSeatFines(eveningId, seatId, fines, adHocFines, roundsGiven, roundsCarriedAway){
    assertNotAccessBlocked();
    await withTimeout(runTransaction(db, async (tx)=>{
      tx.set(eveningSeatDocRef(eveningId, seatId), { value: JSON.stringify({ finesBySeat: fines||{}, adHocFinesBySeat: adHocFines||[], roundsGivenBySeat: roundsGiven||{}, roundsCarriedAwayBySeat: roundsCarriedAway||{} }) });
    }), STORAGE_TIMEOUT_MS);
  }

  // Verschiebt das Sitzplatz-Unterdokument von einem Sitzplatz zu einem anderen (z.B. wenn eine
  // nachträglich hinzugefügte Person die Seite wechselt) - liest den alten Stand, schreibt ihn
  // unter der neuen seatId, löscht das alte Dokument.
  async function moveEveningSeatFines(eveningId, oldSeatId, newSeatId){
    assertNotAccessBlocked();
    const oldSnap = await withTimeout(getDoc(eveningSeatDocRef(eveningId, oldSeatId)), STORAGE_TIMEOUT_MS);
    if(!oldSnap.exists()) return;
    await withTimeout(setDoc(eveningSeatDocRef(eveningId, newSeatId), oldSnap.data()), STORAGE_TIMEOUT_MS);
    await withTimeout(deleteDoc(eveningSeatDocRef(eveningId, oldSeatId)), STORAGE_TIMEOUT_MS);
  }

  // direkt drauf, kein 'value'-JSON-String-Wrapper wie bei den anderen Collections - hier gibt es
  // pro Club nur eines, kein Array-Problem, das den Wrapper nötig gemacht hätte).
  // clubIdOverride erlaubt das Laden EINES BELIEBIGEN Clubs, unabhängig von CURRENT_CLUB_ID -
  // wird für die Club-Auswahl nach dem Login gebraucht, wo CURRENT_CLUB_ID noch nicht feststeht.
  async function getClub(clubIdOverride){
    const ref = clubIdOverride ? doc(db, 'clubs', clubIdOverride) : clubRef();
    const snap = await withTimeout(getDoc(ref), STORAGE_TIMEOUT_MS);
    return snap.exists() ? snap.data() : null;
  }
  async function saveClub(clubData){
    await withTimeout(setDoc(clubRef(), clubData, { merge: true }), STORAGE_TIMEOUT_MS);
    invalidate('clubData');
  }
  // Listet die IDs ALLER existierenden Clubs auf, unabhängig von einem Claim - wird nur für den
  // Admin-Sonderfall in resolveActiveClub() gebraucht (Admin hat noch keinen Claim, soll aber aus
  // allen Clubs wählen können statt fest auf einen verdrahtet zu sein).
  async function getAllClubIds(){
    const snaps = await withTimeout(getDocs(collection(db, 'clubs')), STORAGE_TIMEOUT_MS);
    return snaps.docs.map(d=> d.id);
  }


  function uid(prefix){ return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
  function todayISO(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function formatDateDE(iso){
    const parts = iso.split('-').map(Number);
    const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    return `${parts[2]}. ${months[parts[1]-1]} ${parts[0]}`;
  }
  function formatDateShortDE(iso){
    const parts = iso.split('-');
    return `${parts[2]}.${parts[1]}.${parts[0]}`;
  }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function isoDate(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
  function addDaysISO(dateStr, days){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(Date.UTC(y,m-1,d));
    dt.setUTCDate(dt.getUTCDate()+days);
    return isoDate(dt.getUTCFullYear(), dt.getUTCMonth()+1, dt.getUTCDate());
  }
  // Beginn/Ende werden als kombinierte "YYYY-MM-DDTHH:mm"-Strings (datetime-local) gespeichert.
  function dateOnly(datetimeStr){ return datetimeStr.slice(0,10); }
  function timeOnly(datetimeStr){ return datetimeStr.slice(11,16); }
  function combineDatetime(dateStr, timeStr){ return `${dateStr}T${timeStr}`; }

  // Anzahl Tage, die ein Termin dauert (0 = eintägig, 1 = zwei Tage usw.) - Basis für die Serie.
  function getEventSpanDays(event){
    const [sy,sm,sd] = dateOnly(event.start).split('-').map(Number);
    const [ey,em,ed] = dateOnly(event.end).split('-').map(Number);
    const s = Date.UTC(sy, sm-1, sd);
    const e = Date.UTC(ey, em-1, ed);
    return Math.max(0, Math.round((e-s)/86400000));
  }

  // Liefert die Beginn-Daten aller Serien-Vorkommen, die in einem bestimmten Monat beginnen.
  function getRecurrenceStartsInMonth(event, year, month){
    let occurrences = [];
    const daysInMonth = new Date(year, month, 0).getDate();
    const baseDateStr = dateOnly(event.start);
    const [by, bm, bd] = baseDateStr.split('-').map(Number);
    const baseUTC = Date.UTC(by, bm-1, bd);

    if(event.recurrence==='none' || !event.recurrence){
      if(by===year && bm===month) occurrences.push(baseDateStr);
    }else if(event.recurrence==='weekly' || event.recurrence==='biweekly' || event.recurrence==='every4weeks'){
      const intervalDays = event.recurrence==='weekly' ? 7 : event.recurrence==='biweekly' ? 14 : 28;
      for(let d=1; d<=daysInMonth; d++){
        const currentUTC = Date.UTC(year, month-1, d);
        if(currentUTC < baseUTC) continue;
        const diffDays = Math.round((currentUTC - baseUTC) / 86400000);
        if(diffDays % intervalDays === 0) occurrences.push(isoDate(year,month,d));
      }
    }else if(event.recurrence==='monthly'){
      if(year>by || (year===by && month>=bm)){
        const targetDay = Math.min(bd, daysInMonth);
        occurrences.push(isoDate(year,month,targetDay));
      }
    }else if(event.recurrence==='yearly'){
      if(month===bm && year>=by){
        const targetDay = Math.min(bd, daysInMonth);
        occurrences.push(isoDate(year,month,targetDay));
      }
    }

    // Wiederholung endet am gepflegten Enddatum (falls gesetzt) - spätere Vorkommen ausschließen.
    if(event.recurrenceEndDate){
      occurrences = occurrences.filter(d=> d<=event.recurrenceEndDate);
    }
    return occurrences;
  }

  // Liefert alle Vorkommen (Beginn-Datum), deren Zeitraum einen bestimmten Monat berührt - prüft
  // dafür auch die Vormonate mit, damit mehrtägige Termine erfasst werden, die dort begonnen haben.
  function getOccurrenceStartsOverlappingMonth(event, year, month){
    const span = getEventSpanDays(event);
    const monthsBack = Math.min(6, Math.ceil((span+1)/28) + 1);
    const starts = new Set();
    let y = year, m = month;
    for(let i=0;i<=monthsBack;i++){
      getRecurrenceStartsInMonth(event, y, m).forEach(d=>starts.add(d));
      m--; if(m<1){ m=12; y--; }
    }
    const monthStart = isoDate(year, month, 1);
    const monthEnd = isoDate(year, month, new Date(year,month,0).getDate());
    return Array.from(starts).filter(startDate=>{
      const endDate = addDaysISO(startDate, span);
      return endDate>=monthStart && startDate<=monthEnd;
    });
  }

  // Findet eine Ausnahme (bearbeitet/gelöscht) für einen bestimmten Serientermin.
  function findOccurrenceEdit(eventId, occurrenceDate){
    return state.calendarOccurrenceEdits.find(e=> e.seriesId===eventId && e.occurrenceDate===occurrenceDate) || null;
  }

  // Baut ein vollständiges Vorkommen-Objekt (inkl. angewendeter Ausnahme) für ein Serien-Vorkommen.
  function buildOccurrenceObject(ev, occurrenceDate){
    const edit = findOccurrenceEdit(ev.id, occurrenceDate);
    if(edit && edit.deleted) return null;
    const span = getEventSpanDays(ev);
    const defaultStart = combineDatetime(occurrenceDate, timeOnly(ev.start));
    const defaultEnd = combineDatetime(addDaysISO(occurrenceDate, span), timeOnly(ev.end));
    if(edit){
      return {
        seriesId: ev.id, occurrenceDate, isException: true,
        title: edit.title!==undefined ? edit.title : ev.title,
        location: edit.location!==undefined ? edit.location : ev.location,
        start: edit.start!==undefined ? edit.start : defaultStart,
        end: edit.end!==undefined ? edit.end : defaultEnd,
        recurrence: ev.recurrence
      };
    }
    return {
      seriesId: ev.id, occurrenceDate, isException: false,
      title: ev.title, location: ev.location,
      start: defaultStart, end: defaultEnd,
      recurrence: ev.recurrence
    };
  }
  function findOccurrenceByIds(seriesId, occurrenceDate){
    const ev = state.calendarEvents.find(e=>e.id===seriesId);
    if(!ev) return null;
    return buildOccurrenceObject(ev, occurrenceDate);
  }

  function getRsvpsForOccurrence(seriesId, occurrenceDate){
    return state.calendarRsvps.filter(r=> r.seriesId===seriesId && r.occurrenceDate===occurrenceDate);
  }
  function getRsvpStatusFor(seriesId, occurrenceDate, memberName){
    const entry = state.calendarRsvps.find(r=> r.seriesId===seriesId && r.occurrenceDate===occurrenceDate && r.memberName===memberName);
    return entry ? entry.status : null;
  }
  async function setRsvpStatus(seriesId, occurrenceDate, memberName, status){
    let entry = state.calendarRsvps.find(r=> r.seriesId===seriesId && r.occurrenceDate===occurrenceDate && r.memberName===memberName);
    if(!entry){ entry = {id:uid('rsvp'), seriesId, occurrenceDate, memberName}; state.calendarRsvps.push(entry); }
    entry.status = status;
    await saveCalendarRsvp(entry);
  }
  // Gruppiert alle Mitglieder nach ihrem Rückmeldungsstatus für einen bestimmten Termin.
  function categorizeRsvps(seriesId, occurrenceDate){
    const groups = { accepted:[], tentative:[], declined:[], pending:[] };
    state.members.forEach(m=>{
      const name = displayName(m);
      const status = getRsvpStatusFor(seriesId, occurrenceDate, name);
      if(status==='accepted') groups.accepted.push(name);
      else if(status==='tentative') groups.tentative.push(name);
      else if(status==='declined') groups.declined.push(name);
      else groups.pending.push(name);
    });
    return groups;
  }

  // Liefert alle Termine (inkl. Serien-Vorkommen, mit angewendeten Ausnahmen), deren Zeitraum
  // einen bestimmten Tag einschließt (auch bei mehrtägigen Terminen).
  function getEventsOnDate(dateStr){
    const [y, m] = dateStr.split('-').map(Number);
    const results = [];
    state.calendarEvents.forEach(ev=>{
      const seen = new Set();
      [-1,0,1].forEach(offset=>{
        let mm=m+offset, yy=y;
        if(mm<1){ mm=12; yy--; } if(mm>12){ mm=1; yy++; }
        getOccurrenceStartsOverlappingMonth(ev, yy, mm).forEach(startDate=>{
          if(seen.has(startDate)) return;
          seen.add(startDate);
          const occ = buildOccurrenceObject(ev, startDate);
          if(occ && dateStr>=dateOnly(occ.start) && dateStr<=dateOnly(occ.end)) results.push(occ);
        });
      });
    });
    return results.sort((a,b)=> a.start.localeCompare(b.start));
  }

  // Liefert alle Tage (als Set von YYYY-MM-DD) in einem Monat, an denen mindestens ein Termin liegt
  // (bei mehrtägigen Terminen: jeder Tag im Zeitraum).
  function getEventDatesInMonth(year, month){
    const dateSet = new Set();
    state.calendarEvents.forEach(ev=>{
      getOccurrenceStartsOverlappingMonth(ev, year, month).forEach(startDate=>{
        const occ = buildOccurrenceObject(ev, startDate);
        if(!occ) return;
        let cur = dateOnly(occ.start);
        const last = dateOnly(occ.end);
        while(cur<=last){
          dateSet.add(cur);
          cur = addDaysISO(cur, 1);
        }
      });
    });
    return dateSet;
  }

  // Liefert alle Mitglieder, die an einem bestimmten Tag (Monat+Tag) Geburtstag haben,
  // jeweils mit Name und erreichtem Alter an diesem Datum. Das Geburtsjahr selbst (0 Jahre) und
  // Jahre davor (negatives Alter) werden nicht angezeigt - analog zu getAnniversaryOnDate().
  function getBirthdaysOnDate(dateStr){
    const [y, m, d] = dateStr.split('-').map(Number);
    const results = [];
    state.members.forEach(mem=>{
      if(!mem.birthday) return;
      const [by, bm, bd] = mem.birthday.split('-').map(Number);
      if(bm===m && bd===d && y>by){
        results.push({ name: displayName(mem), age: y - by });
      }
    });
    return results;
  }

  // Liefert alle Tage (als Set von YYYY-MM-DD) in einem Monat, an denen mindestens ein Mitglied
  // Geburtstag hat (ab dem 1. Jahrestag, siehe getBirthdaysOnDate()).
  function getBirthdayDatesInMonth(year, month){
    const dateSet = new Set();
    state.members.forEach(mem=>{
      if(!mem.birthday) return;
      const [by, bm, bd] = mem.birthday.split('-').map(Number);
      if(bm===month && year>by) dateSet.add(isoDate(year, month, bd));
    });
    return dateSet;
  }

  // Vereins-Jubiläum: jährlich wiederkehrender Jahrestag des Gründungsdatums (CURRENT_CLUB_DATA.
  // foundedOn, siehe Club-Stammdaten) - analog zu member.birthday/getBirthdaysOnDate(). Das
  // Gründungsjahr selbst (0 Jahre) wird bewusst nicht angezeigt, erst ab dem 1. Jahrestag.
  function getAnniversaryOnDate(dateStr){
    const foundedOn = CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.foundedOn;
    if(!foundedOn) return null;
    const [y, m, d] = dateStr.split('-').map(Number);
    const [fy, fm, fd] = foundedOn.split('-').map(Number);
    if(fm!==m || fd!==d) return null;
    const years = y - fy;
    if(years<=0) return null;
    return { years };
  }

  // Liefert den Tag (als YYYY-MM-DD) in einem Monat, an dem das Vereins-Jubiläum liegt - analog
  // zu getBirthdayDatesInMonth(). Da es nur einen Club gibt, höchstens ein Tag pro Monat.
  function getAnniversaryDatesInMonth(year, month){
    const dateSet = new Set();
    const foundedOn = CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.foundedOn;
    if(!foundedOn) return dateSet;
    const [fy, fm, fd] = foundedOn.split('-').map(Number);
    if(fm===month && year>fy) dateSet.add(isoDate(year, month, fd));
    return dateSet;
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  // Erzeugt die Belegungsreihenfolge abwechselnd Kneipe/Saal (bzw. Saal/Kneipe), damit besetzte
  // Plätze nahe der Kegelbahn geclustert bleiben. Welche Seite zuerst drankommt (und bei ungerader
  // Teilnehmerzahl den Überhang bekommt) wird pro Abend zufällig entschieden. perSide steuert die
  // Anzahl Plätze pro Seite (siehe SEATING_TEMPLATES) - Default: aktuelles Club-Template.
  function buildSeatPriorityOrder(perSide){
    const n = perSide || getClubSeatingTemplate().perSide;
    const kneipeStarts = Math.random() < 0.5;
    const order = [];
    for(let i=1;i<=n;i++){
      order.push(kneipeStarts ? 'kneipe-'+i : 'saal-'+i, kneipeStarts ? 'saal-'+i : 'kneipe-'+i);
    }
    return order;
  }

  async function computeMemberAttendanceStats(memberName){
    let raw;
    try{ raw = await getClubJSONOrThrow('attendance-stats', {totalsByYear:{}, attendanceByMember:{}}); }
    catch(e){ raw = {totalsByYear:{}, attendanceByMember:{}}; }
    const totalsByYear = raw.totalsByYear || {};

  function guardClubManagementLeave(proceedFn){

  // Zeigt das Bestätigungs-Popup für ungespeicherte Änderungen in der Clubverwaltung.
  // "Speichern" versucht saveClubManagementForm() und navigiert nur bei Erfolg weiter (bei einem
  // Validierungs- oder Netzwerkfehler bleibt der Nutzer auf der Seite, der Fehler steht bereits
  // im Formular); "Verwerfen" navigiert ohne Speichern weiter; "Abbrechen" schließt nur das Popup.
  function showUnsavedClubChangesPrompt(proceedFn){
    showModal(`
      <h3>Ungespeicherte Änderungen</h3>
      <p>Du hast Änderungen in der Clubverwaltung vorgenommen, die noch nicht gespeichert sind. Möchtest du sie vor dem Verlassen speichern?</p>
      <p class="form-error" id="unsaved-club-changes-error"></p>
      <div class="confirm-row-buttons" style="margin-top:14px;">
        <button type="button" class="btn-secondary" id="unsaved-club-discard-btn" style="flex:1;">Verwerfen</button>
        <button type="button" class="btn-primary" id="unsaved-club-save-btn" style="flex:1;">Speichern</button>
      </div>
      <button type="button" class="btn-secondary" id="modal-cancel-btn" style="width:100%; margin-top:10px;">Abbrechen</button>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    document.getElementById('unsaved-club-discard-btn').addEventListener('click', ()=>{
      closeGenericModal();
      clubMgmtDirtyCheck = null;
      proceedFn();
    });
    document.getElementById('unsaved-club-save-btn').addEventListener('click', async (e)=>{
      const btn = e.currentTarget;
      const errEl = document.getElementById('unsaved-club-changes-error');
      btn.disabled = true; btn.textContent = 'Speichert…';
      const ok = await saveClubManagementForm();
      if(ok){
        closeGenericModal();
        proceedFn();
      }else{
        // saveClubManagementForm() schreibt den konkreten Fehler bereits in #club-form-error
        // (im Hintergrund, das Popup verdeckt es) - hier reicht ein allgemeiner Hinweis, der
        // den Nutzer zum Abbrechen und Nachschauen im Formular anleitet.
        btn.disabled = false; btn.textContent = 'Speichern';
        if(errEl) errEl.textContent = 'Speichern fehlgeschlagen. Bitte prüfe deine Eingaben oder Internetverbindung.';
      }
    });

    else if(state.eventDetailOrigin==='eventManagement') goToEventManagement();
    else goToCalendar();
  }

  function goBackFromHeaderInner(){
    if(state.view==='settings' || state.view==='clubManagement' || state.view==='finesManagement' || state.view==='gamesManagement' || state.view==='financeManagement' || state.view==='eventManagement') goToSettingsMenu();
    else if(state.view==='subscriptionPlans') goToClubManagement();
    else if(state.view==='memberDetail') goToSettings();
    else if(state.view==='fineDetail') goToFinesManagement();
    else if(state.view==='gameDetail') goToGamesManagement();
    else if(state.view==='recurringDetail') goToFinanceManagement();
    else if(state.view==='savingsPotDetail') goToFinanceManagement();
    else if(state.view==='financeAccountDetail') goToFinanceManagement();
    else if(state.view==='eventDetail') goBackFromEventDetail();
    else if(state.view==='personFineDetail' || state.view==='arrearsDetail' || state.view==='transactionDetail'){ history.back(); }
    else goToMain();
  }
  function goBackFromHeader(){
    guardClubManagementLeave(goBackFromHeaderInner);
  }
  function goToNew(){
    currentGuests = [];
    state.view = 'new';
    state.view;
    state.formError = '';
    render();
  }

  function fmtEuro(n){
    return n.toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
  }
  function roundUpToFullEuro(amount){
    const cents = Math.round(amount*100);
    return Math.ceil(cents/100);
  }
  function fineTypeLabel(type){
    if(type==='multiplier') return 'Multiplikator';
    if(type==='fremdstrafe') return 'Fremdstrafe';
    if(type==='fremdstrafe_runde') return 'Fremdstrafe + Runde';
    if(type==='pudel') return 'Pudel';
    if(type==='runde') return 'Runde';
    return type;
  }
  // Prüft, ob eine Strafenart sich wie eine Fremdstrafe verhält (andere Anwesende zahlen statt
  // des Verursachers). Umfasst 'fremdstrafe' und die kombinierte Art 'fremdstrafe_runde'.
  function isFremdstrafeType(type){
    return type==='fremdstrafe' || type==='fremdstrafe_runde';
  }
  function fineTypeIconSvg(type){
    if(type==='multiplier'){
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;

    if(type==='fremdstrafe'){
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`;
    }
    if(type==='fremdstrafe_runde'){
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 1 19 5 15 9"/><path d="M2 10V8a4 4 0 0 1 4-4h12"/><polyline points="9 23 5 19 9 15"/><path d="M22 14v2a4 4 0 0 1-4 4H6"/><path d="M15 12h5l-1 5.5h-3L15 12z" stroke-width="1.6"/></svg>`;

  // Plan-Katalog: Anzeigename, Preis und Funktionsumfang je Plan. Bewusst zentral gehalten - wird
  // sowohl für die kompakte Statusanzeige in der Clubverwaltung als auch für die volle
  // Plan-Auswahlseite (viewSubscriptionPlans()) verwendet, damit Preise/Features nur an einer
  // Stelle gepflegt werden müssen. PRO_PRICE_EUR ist der einzige Preis-Punkt (siehe Stripe-
  // Planung) - bei Einführung weiterer Tarife hier ergänzen.
  const PRO_PRICE_EUR = 4.99;

  const ICON_CHECK_SMALL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
  const ICON_INFO_SMALL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>`;

  // Formatiert das Abo eines Clubs für die kompakte Statusanzeige in der Clubverwaltung (Plan-
  // Badge + Zusatztext, farblich je Plan unterschieden). Reine Anzeige/Tracking - KEINE
  // Sperrlogik im Client; die eigentliche Durchsetzung (Read-Only nach Ablauf) läuft über
  // Firestore Rules gegen subscription.accessBlocked (siehe firestore.rules,
  // updateSubscriptionAccessStatus in functions/index.js). Konfiguration/Zuweisung des Plans
  // erfolgt über die neue Plan-Auswahlseite (viewSubscriptionPlans()); freeUntil bleibt bewusst
  // nicht editierbar (siehe dort).
  //   subscription.plan: 'free' | 'pro'
  //   subscription.priceEUR: Preis/Monat, nur relevant wenn plan !== 'free'
  //   subscription.freeUntil: ISO-Datum (YYYY-MM-DD), Ende des Free-Zeitraums
  //   subscription.accessBlocked: von der Cloud Function vorberechnet, s.o.
  function renderSubscriptionStatusCard(subscription){
    const sub = subscription || {};
    const isPro = sub.plan==='pro';
    const badgeClass = isPro ? 'plan-pro' : 'plan-free';
    const badgeLabel = isPro ? 'Premium' : 'Kostenlose Testversion';
    let detailHtml = '';
    if(sub.freeUntil){
      const expired = sub.freeUntil < todayISO();
      detailHtml = `<p class="sub-detail-text">${expired ? 'Testzeitraum abgelaufen am' : 'Läuft bis zum'} <strong>${formatDateShortDE(sub.freeUntil)}</strong></p>`;
    } else if(isPro){
      const price = (typeof sub.priceEUR==='number') ? sub.priceEUR.toFixed(2).replace('.',',') : PRO_PRICE_EUR.toFixed(2).replace('.',',');
      detailHtml = `<p class="sub-price-text">${price} €<span class="unit">/ Monat</span></p>`;
    }
    return `
      <div class="sub-status-row">
        <div class="sub-status-main">
          <span class="sub-plan-badge ${badgeClass}"><span class="sub-plan-badge-dot"></span>${badgeLabel}</span>
          ${detailHtml}
        </div>
        <button type="button" class="sub-manage-btn" id="manage-subscription-btn">Abonnement anpassen</button>
      </div>
    `;
  }

  // Löscht den kompletten Club unwiderruflich (alle Daten + Auth-Zugänge der Mitglieder, siehe
  // Cloud Function deleteClub). Erfordert die Eingabe des Worts "LÖSCHEN" (DELETE_CONFIRM_WORD
  // oben) als zweite Bestätigung - höhere Hürde als bei anderen Löschaktionen, weil hier
  // unwiderruflich ALLE Daten des Clubs verloren gehen. Beim Löschen eines einzelnen
  // Kegelabends genügt seit v1.0.83 die reine Ja/Nein-Bestätigung, ohne Texteingabe.
  function showDeleteClubModal(){
    const name = clubDisplayName();
    showModal(`
      <h3>Club löschen</h3>
      <p><strong>${escapeHtml(name)}</strong> und alle zugehörigen Daten (Mitglieder, Kegelabende, Finanzen, Termine, ...) werden unwiderruflich gelöscht. Das kann nicht rückgängig gemacht werden.</p>
      <label for="delete-club-confirm-input">Schreibe LÖSCHEN in das Feld, wenn du den Club wirklich löschen möchtest.</label>
      <input type="text" id="delete-club-confirm-input" placeholder="LÖSCHEN" autocomplete="off" autocapitalize="characters">
      <p class="form-error" id="delete-club-password-error"></p>
      <div class="confirm-row-buttons">
        <button type="button" class="btn-danger" id="confirm-delete-club-yes">Ja, endgültig löschen</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    const confirmInput = document.getElementById('delete-club-confirm-input');
    if(confirmInput){
      confirmInput.focus();
      confirmInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); const yb=document.getElementById('confirm-delete-club-yes'); if(yb) yb.click(); } });
    }
    document.getElementById('confirm-delete-club-yes').addEventListener('click', async ()=>{
      const yesBtn = document.getElementById('confirm-delete-club-yes');
      const confirmInputEl = document.getElementById('delete-club-confirm-input');
      const pwErrEl = document.getElementById('delete-club-password-error');
      const entered = confirmInputEl ? confirmInputEl.value.trim() : '';
      if(entered !== DELETE_CONFIRM_WORD){
        if(pwErrEl) pwErrEl.textContent = `Bitte gib genau "${DELETE_CONFIRM_WORD}" ein.`;
        return;
      }
      yesBtn.disabled = true; yesBtn.textContent = 'Löscht…';
      showModalLoadingOverlay('Club wird gelöscht…');
      try{
        const deleteClubFn = httpsCallable(functions, 'deleteClub');
        await deleteClubFn({ clubId: CURRENT_CLUB_ID });
        closeGenericModal();
        await logout();
      }catch(e){
        hideModalLoadingOverlay();
        if(pwErrEl) pwErrEl.textContent = 'Löschen fehlgeschlagen. Bitte prüfe deine Internetverbindung.';
        yesBtn.disabled = false; yesBtn.textContent = 'Ja, endgültig löschen';
      }
    });
  }

  function financeAccountNameById(accountId){

  function financeAccountBalance(accountId){
    const acc = state.financeAccounts.find(a=>a.id===accountId);
    const start = acc ? acc.startBalance : 0;
    const sum = state.financeTransactions.filter(t=>t.accountId===accountId).reduce((s,t)=> s+t.amount, 0);
    return start + sum;
