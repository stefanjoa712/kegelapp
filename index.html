<style>
  :root{
    --bg:#F6F6F4;
    --surface:#FFFFFF;
    --ink:#161616;
    --ink-soft:#4A4642;
    --wood:#E3421F;
    --wood-dark:#161616;
    --felt:#E3421F;
    --felt-dark:#B8331A;
    --brass:#B8331A;
    --brass-light:#FFFFFF;
    --wine:#7A2E2E;
    --line:#E5E1D8;
    --muted:#9A9186;
    --tint:#FDECE6;
    --font-display:'Poppins', sans-serif;
    --font-body:'Nunito', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  html{height:100%; min-height:100dvh; background:var(--bg); overscroll-behavior-y:contain;}
  body{margin:0; min-height:calc(100% + 1px); min-height:calc(100dvh + 1px); background:var(--bg); color:var(--ink); font-family:var(--font-body); line-height:1.5; touch-action:manipulation; overscroll-behavior-y:contain;}
  button{font:inherit;}
  a{color:inherit;}
  *:focus-visible{outline:2px solid var(--felt); outline-offset:2px;}

  .app-header{
    position:sticky; top:0; z-index:800;
    background:var(--ink);
    border-bottom:4px solid var(--wood);
    box-sizing:border-box;
  }
  .app-header-top{
    padding:14px 18px;
    padding-top:calc(14px + env(safe-area-inset-top));
    display:flex;
    align-items:center;
    gap:12px;
    min-height:78px;
    box-sizing:border-box;
  }
  .header-brand{display:flex; flex-direction:column; gap:2px; background:none; border:none; padding:0; margin:0; text-align:left; cursor:pointer; font:inherit;}
  .brand-logo{height:46px; width:auto; display:block;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}
  .header-back-btn{background:none; border:none; padding:6px; margin:0 0 0 -6px; cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; height:38px; box-sizing:border-box;}
  .header-back-btn svg{width:26px; height:26px; display:block;}
  .header-icon-btn{background:none; border:none; padding:6px; cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; height:38px; box-sizing:border-box;}
  .header-icon-btn svg{width:22px; height:22px; display:block;}
  .header-circle-btn{
    background:var(--wood); border:2px solid #fff; border-radius:50%; width:38px; height:38px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,0.35);
  }
  .header-circle-btn svg{width:20px; height:20px; display:block;}
  .header-today-btn{
    background:rgba(255,255,255,0.12); border:1.5px solid rgba(255,255,255,0.4); border-radius:50%;
    color:#fff; width:38px; height:38px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .header-today-btn svg{width:20px; height:20px; display:block;}
  .header-overflow-wrap{position:relative; margin:0 -6px 0 0;}
  .header-overflow-menu{
    position:absolute; top:44px; right:0; background:var(--surface); border:2px solid var(--ink);
    border-radius:8px; box-shadow:3px 3px 0 var(--ink); min-width:260px; z-index:1050; overflow:hidden;
  }
  .header-overflow-menu[hidden]{display:none;}
  .header-overflow-item{display:block; width:100%; text-align:left; background:none; border:none; padding:13px 16px; font-family:var(--font-body); font-weight:700; font-size:14px; color:var(--wine); cursor:pointer; border-top:1px solid var(--line); white-space:nowrap;}
  .header-overflow-item:first-child{border-top:none;}
  .header-overflow-item.neutral{color:var(--ink);}
  .header-overflow-item:hover{background:var(--bg);}
  .header-title{font-family:var(--font-display); font-size:19px; font-weight:700; margin:0; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; height:38px; line-height:38px; box-sizing:border-box; flex:1; min-width:0;}

  .tab-bar{display:flex; gap:8px; padding:0 16px 14px;}
  .tab-btn{
    flex:1; text-align:center; padding:9px 10px; border-radius:8px; border:none;
    background:rgba(255,255,255,0.12); font-family:var(--font-body); font-weight:800; font-size:14px;
    cursor:pointer; color:rgba(255,255,255,0.75);
  }
  .tab-btn.active{background:var(--wood); color:#fff;}

  .container{max-width:640px; margin:0 auto; padding:24px 16px 100px; transition:transform 0.25s ease;}

  .login-screen{
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:24px 16px; box-sizing:border-box; background:var(--bg);
  }
  .login-logo{height:64px; width:auto; display:block;}
  .login-card{max-width:360px; width:100%; box-sizing:border-box;}
  .container.pull-dragging{transition:none;}

  .pull-refresh-indicator{
    position:fixed; top:66px; left:50%; z-index:850;
    width:36px; height:36px; border-radius:50%;
    background:var(--surface); border:2px solid var(--ink); box-shadow:2px 2px 0 var(--ink);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transform:translateX(-50%) translateY(-40px) rotate(0deg);
    color:var(--felt); pointer-events:none;
  }
  .pull-refresh-indicator svg{width:18px; height:18px; display:block;}
  .pull-refresh-indicator.ready{color:var(--felt-dark);}
  .pull-refresh-indicator.spinning svg{animation:pull-spin .7s linear infinite;}
  @keyframes pull-spin{from{transform:rotate(0deg);} to{transform:rotate(360deg);}}

  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; z-index:900;
    display:flex; background:var(--surface); border-top:3px solid var(--ink);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  }
  .bottom-nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    background:none; border:none; padding:6px 4px; cursor:pointer;
    color:var(--muted); font-family:var(--font-body); font-size:11px; font-weight:700;
  }
  .bottom-nav-item svg{width:22px; height:22px; display:block;}

  .update-banner{
    position:fixed; top:0; left:0; right:0; z-index:1100;
    display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
    background:var(--felt); color:#fff; padding:10px 16px;
    padding-top:calc(10px + env(safe-area-inset-top));
    font-size:14px; font-weight:700;
  }
  .update-banner[hidden]{display:none;}
  .update-banner button{
    background:#fff; color:var(--felt-dark); border:none; padding:6px 14px; border-radius:6px;
    font-weight:800; font-size:13px; cursor:pointer;

  .fines-summary-amount.amount-due{color:var(--wine);}
  .fines-summary-amount.amount-clear{color:#1a7a3c;}

  .fine-detail-row{display:flex; align-items:center; gap:10px; padding:13px 2px; border-bottom:1px dashed var(--line); cursor:pointer;}
  .fine-detail-row.readonly{cursor:default;}
  .fine-detail-row:last-child{border-bottom:none;}
  .fine-detail-row:hover{background:var(--bg);}
  .fine-detail-icon{width:20px; height:20px; flex-shrink:0; color:var(--brass); display:flex; align-items:center; justify-content:center;}
  .fine-detail-icon svg{width:16px; height:16px; display:block;}
  .fine-detail-name{flex:1; font-weight:700; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fremdstrafe-tag{
    display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
    color:var(--brass); background:var(--tint); border-radius:5px; margin-left:8px; vertical-align:middle;
  }
  .fremdstrafe-tag svg{width:13px; height:13px; display:block;}
  .fine-detail-controls{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .fine-minus-btn{
    width:28px; height:28px; border-radius:50%; border:1.5px solid var(--line); background:#fff;
    color:var(--ink); font-size:16px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .fine-minus-btn:hover{border-color:var(--wine); color:var(--wine);}
  .fine-detail-count{font-family:var(--font-mono); font-weight:700; min-width:26px; text-align:center;}
  .fine-detail-result{font-family:var(--font-mono); font-weight:700; color:var(--ink-soft); min-width:66px; text-align:right; flex-shrink:0;}
  .adhoc-fine-row{display:flex; align-items:center; gap:10px; padding:12px 2px; border-bottom:1px dashed var(--line);}
  .adhoc-fine-row:last-child{border-bottom:none;}
  .muted{color:var(--muted); font-size:13px; margin:0;}

  .hint{background:var(--tint); border:1px solid var(--brass); color:var(--ink); padding:10px 12px; border-radius:8px; font-size:13px; margin-bottom:6px;}

  .seating-diagram{width:100%; height:auto; display:block; max-width:520px; margin:0 auto;}
  @media (prefers-reduced-motion:no-preference){
    .reveal-group{animation:reveal .35s ease backwards;}
  }
  @keyframes reveal{from{opacity:0;} to{opacity:1;}}
  .table-shape{fill:none; stroke:var(--wood-dark); stroke-width:2.5;}
  .lane-center-line{stroke:var(--brass); stroke-width:1.5; stroke-dasharray:6 6; opacity:0.55;}
  .lane-label-text{font-family:var(--font-mono); font-size:21px; font-weight:700; letter-spacing:0.14em; fill:var(--brass);}
  .side-label-text{font-family:var(--font-mono); font-size:20px; font-weight:700; letter-spacing:0.1em; fill:var(--wood-dark);}
  .chair-tick{stroke:var(--wood-dark); stroke-width:1.5;}
  .chair-body{fill:var(--wood); stroke:var(--wood-dark); stroke-width:2.5;}
  .chair-clickable{cursor:pointer;}
  .chair-clickable:hover .chair-body{filter:brightness(1.12);}
  .chair-clickable:hover .name-plate-rect{filter:brightness(0.96);}

  .stat-total-raw{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding-bottom:6px;}
  .stat-total{display:flex; justify-content:space-between; font-weight:800; font-size:16px; padding-top:10px; margin-top:6px; border-top:2px solid var(--ink);}
  .chair-body.empty{fill:var(--surface); stroke:var(--muted); stroke-width:2; stroke-dasharray:5 4;}
  .seat-label-text{font-family:var(--font-mono); font-size:21px; font-weight:700; letter-spacing:0.05em; fill:var(--brass-light);}
  .seat-label-text.empty{fill:var(--ink-soft);}
  .name-plate-rect{fill:var(--surface);}
  .name-plate-text{font-family:var(--font-body); font-weight:700; fill:var(--ink);}
  .name-plate-text.empty-text{fill:var(--ink-soft); font-style:italic; font-weight:400;}
  .guest-tag-text{font-family:var(--font-mono); font-size:15px; letter-spacing:0.06em; fill:var(--brass-light); font-weight:700;}
  .pudel-crown-badge circle{fill:var(--wood); stroke:#fff; stroke-width:2.5;}
  .pudel-crown-badge path{fill:#fff;}
  .invalid-seat-badge circle{fill:var(--wine);}
  .invalid-icon{display:inline-flex; margin-left:5px; color:var(--wine); vertical-align:middle;}
  .invalid-icon svg{width:14px; height:14px; display:block;}

  .confirm-row-buttons{display:flex; gap:10px;}
  .confirm-row-buttons > button{flex:1;}

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(22,22,22,0.6);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:1000;
  }
  .modal-card{
    background:var(--surface); border:2.5px solid var(--ink); border-radius:14px;
    padding:22px 20px; max-width:360px; width:100%; box-shadow:6px 6px 0 var(--ink);
    max-height:calc(100vh - 40px); overflow-y:auto; -webkit-overflow-scrolling:touch; box-sizing:border-box;
  }
  .modal-card h3{font-family:var(--font-display); font-size:19px; margin:0 0 10px; font-weight:700;}
  .modal-card p{margin:0 0 14px; font-size:14px; color:var(--ink-soft);}
</style>
</head>

  async function getJSON(key, shared, fallback, onBackgroundUpdate){

    try{

    });

    if(cacheResult!==undefined) return cacheResult;

    // Nichts im Cache: auf den Server-Request warten müssen wir hier zwangsläufig.
    try{
      const snap = await withTimeout(getDoc(doc(db, 'kegelbuch', key)), STORAGE_TIMEOUT_MS);
      return snap.exists() ? JSON.parse(snap.data().value) : fallback;
    }catch(e){
      console.error('getJSON fehlgeschlagen für', key, e);
      return fallback;
    }
  }
  // Wie getJSON, aber wirft bei Fehler weiter statt still den Fallback zu liefern - für Stellen,
  // an denen dem Nutzer eine Fehlermeldung mit "Erneut versuchen" gezeigt werden soll. Nutzt
  // dieselbe Cache-First-Strategie; wirft nur, wenn WEDER Cache NOCH Server etwas liefern konnten.
  async function getJSONOrThrow(key, fallback, onBackgroundUpdate){
    let cacheResult;
    try{
      const cacheSnap = await getDocFromCache(doc(db, 'kegelbuch', key));
      cacheResult = cacheSnap.exists() ? JSON.parse(cacheSnap.data().value) : fallback;
    }catch(e){
      cacheResult = undefined;
    }

    withTimeout(getDoc(doc(db, 'kegelbuch', key)), STORAGE_TIMEOUT_MS).then(snap=>{
      const serverResult = snap.exists() ? JSON.parse(snap.data().value) : fallback;
      if(onBackgroundUpdate && JSON.stringify(serverResult)!==JSON.stringify(cacheResult)){
        onBackgroundUpdate(serverResult);
      }
    }).catch(e=>{
      console.error('getJSONOrThrow Server-Abgleich fehlgeschlagen für', key, e);
    });

    if(cacheResult!==undefined) return cacheResult;

    // Nichts im Cache: hier muss der Server-Request durch, Fehler/Timeout wird weitergeworfen.
    const snap = await withTimeout(getDoc(doc(db, 'kegelbuch', key)), STORAGE_TIMEOUT_MS);
    return snap.exists() ? JSON.parse(snap.data().value) : fallback;
  }
  async function setJSON(key, value, shared){
    try{
      await withTimeout(setDoc(doc(db, 'kegelbuch', key), { value: JSON.stringify(value) }), STORAGE_TIMEOUT_MS);
      return true;
    }catch(e){
      console.error('setJSON fehlgeschlagen für', key, e);
      return false;
    }
  }

  // ---------- Kleine Helfer ----------
  function uid(prefix){ return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); }
  function todayISO(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function formatDateDE(iso){
    const parts = iso.split('-').map(Number);
    const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    return `${parts[2]}. ${months[parts[1]-1]} ${parts[0]}`;
  }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function isoDate(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
  function addDaysISO(dateStr, days){
    const [y,m,d] = dateStr.split('-').map(Number);
    const dt = new Date(Date.UTC(y,m-1,d));
    dt.setUTCDate(dt.getUTCDate()+days);
    return isoDate(dt.getUTCFullYear(), dt.getUTCMonth()+1, dt.getUTCDate());
  }
  // Beginn/Ende werden als kombinierte "YYYY-MM-DDTHH:mm"-Strings (datetime-local) gespeichert.
  function dateOnly(datetimeStr){ return datetimeStr.slice(0,10); }
  function timeOnly(datetimeStr){ return datetimeStr.slice(11,16); }
  function combineDatetime(dateStr, timeStr){ return `${dateStr}T${timeStr}`; }

  // Anzahl Tage, die ein Termin dauert (0 = eintägig, 1 = zwei Tage usw.) - Basis für die Serie.
  function getEventSpanDays(event){
    const [sy,sm,sd] = dateOnly(event.start).split('-').map(Number);
    const [ey,em,ed] = dateOnly(event.end).split('-').map(Number);
    const s = Date.UTC(sy, sm-1, sd);
    const e = Date.UTC(ey, em-1, ed);
    return Math.max(0, Math.round((e-s)/86400000));
  }

  // Liefert die Beginn-Daten aller Serien-Vorkommen, die in einem bestimmten Monat beginnen.
  function getRecurrenceStartsInMonth(event, year, month){
    let occurrences = [];
    const daysInMonth = new Date(year, month, 0).getDate();
    const baseDateStr = dateOnly(event.start);
    const [by, bm, bd] = baseDateStr.split('-').map(Number);
    const baseUTC = Date.UTC(by, bm-1, bd);

    if(event.recurrence==='none' || !event.recurrence){
      if(by===year && bm===month) occurrences.push(baseDateStr);
    }else if(event.recurrence==='weekly' || event.recurrence==='biweekly' || event.recurrence==='every4weeks'){
      const intervalDays = event.recurrence==='weekly' ? 7 : event.recurrence==='biweekly' ? 14 : 28;
      for(let d=1; d<=daysInMonth; d++){
        const currentUTC = Date.UTC(year, month-1, d);
        if(currentUTC < baseUTC) continue;
        const diffDays = Math.round((currentUTC - baseUTC) / 86400000);
        if(diffDays % intervalDays === 0) occurrences.push(isoDate(year,month,d));
      }
    }else if(event.recurrence==='monthly'){
      if(year>by || (year===by && month>=bm)){
        const targetDay = Math.min(bd, daysInMonth);
        occurrences.push(isoDate(year,month,targetDay));
      }
    }else if(event.recurrence==='yearly'){
      if(month===bm && year>=by){
        const targetDay = Math.min(bd, daysInMonth);
        occurrences.push(isoDate(year,month,targetDay));
      }
    }

    // Wiederholung endet am gepflegten Enddatum (falls gesetzt) - spätere Vorkommen ausschließen.
    if(event.recurrenceEndDate){
      occurrences = occurrences.filter(d=> d<=event.recurrenceEndDate);
    }
    return occurrences;
  }

  // Liefert alle Vorkommen (Beginn-Datum), deren Zeitraum einen bestimmten Monat berührt - prüft
  // dafür auch die Vormonate mit, damit mehrtägige Termine erfasst werden, die dort begonnen haben.
  function getOccurrenceStartsOverlappingMonth(event, year, month){
    const span = getEventSpanDays(event);
    const monthsBack = Math.min(6, Math.ceil((span+1)/28) + 1);
    const starts = new Set();
    let y = year, m = month;
    for(let i=0;i<=monthsBack;i++){
      getRecurrenceStartsInMonth(event, y, m).forEach(d=>starts.add(d));
      m--; if(m<1){ m=12; y--; }
    }
    const monthStart = isoDate(year, month, 1);
    const monthEnd = isoDate(year, month, new Date(year,month,0).getDate());
    return Array.from(starts).filter(startDate=>{
      const endDate = addDaysISO(startDate, span);
      return endDate>=monthStart && startDate<=monthEnd;
    });
  }

  // Findet eine Ausnahme (bearbeitet/gelöscht) für einen bestimmten Serientermin.
  function findOccurrenceEdit(eventId, occurrenceDate){
    return state.calendarOccurrenceEdits.find(e=> e.seriesId===eventId && e.occurrenceDate===occurrenceDate) || null;
  }

  // Baut ein vollständiges Vorkommen-Objekt (inkl. angewendeter Ausnahme) für ein Serien-Vorkommen.
  function buildOccurrenceObject(ev, occurrenceDate){
    const edit = findOccurrenceEdit(ev.id, occurrenceDate);
    if(edit && edit.deleted) return null;
    const span = getEventSpanDays(ev);
    const defaultStart = combineDatetime(occurrenceDate, timeOnly(ev.start));
    const defaultEnd = combineDatetime(addDaysISO(occurrenceDate, span), timeOnly(ev.end));
    if(edit){
      return {
        seriesId: ev.id, occurrenceDate, isException: true,
        title: edit.title!==undefined ? edit.title : ev.title,
        location: edit.location!==undefined ? edit.location : ev.location,
        start: edit.start!==undefined ? edit.start : defaultStart,
        end: edit.end!==undefined ? edit.end : defaultEnd,
        recurrence: ev.recurrence
      };
    }
    return {
      seriesId: ev.id, occurrenceDate, isException: false,
      title: ev.title, location: ev.location,
      start: defaultStart, end: defaultEnd,
      recurrence: ev.recurrence
    };
  }
  function findOccurrenceByIds(seriesId, occurrenceDate){
    const ev = state.calendarEvents.find(e=>e.id===seriesId);
    if(!ev) return null;
    return buildOccurrenceObject(ev, occurrenceDate);
  }

  function getRsvpsForOccurrence(seriesId, occurrenceDate){
    return state.calendarRsvps.filter(r=> r.seriesId===seriesId && r.occurrenceDate===occurrenceDate);
  }
  function getRsvpStatusFor(seriesId, occurrenceDate, memberName){
    const entry = state.calendarRsvps.find(r=> r.seriesId===seriesId && r.occurrenceDate===occurrenceDate && r.memberName===memberName);
    return entry ? entry.status : null;
  }
  async function setRsvpStatus(seriesId, occurrenceDate, memberName, status){
    let entry = state.calendarRsvps.find(r=> r.seriesId===seriesId && r.occurrenceDate===occurrenceDate && r.memberName===memberName);
    if(!entry){ entry = {id:uid('rsvp'), seriesId, occurrenceDate, memberName}; state.calendarRsvps.push(entry); }
    entry.status = status;
    await setJSON('calendar-rsvps', state.calendarRsvps, true);
  }
  // Gruppiert alle Mitglieder nach ihrem Rückmeldungsstatus für einen bestimmten Termin.
  function categorizeRsvps(seriesId, occurrenceDate){
    const groups = { accepted:[], tentative:[], declined:[], pending:[] };
    state.members.forEach(m=>{
      const name = displayName(m);
      const status = getRsvpStatusFor(seriesId, occurrenceDate, name);
      if(status==='accepted') groups.accepted.push(name);
      else if(status==='tentative') groups.tentative.push(name);
      else if(status==='declined') groups.declined.push(name);
      else groups.pending.push(name);
    });
    return groups;
  }

  // Liefert alle Termine (inkl. Serien-Vorkommen, mit angewendeten Ausnahmen), deren Zeitraum
  // einen bestimmten Tag einschließt (auch bei mehrtägigen Terminen).
  function getEventsOnDate(dateStr){
    const [y, m] = dateStr.split('-').map(Number);
    const results = [];
    state.calendarEvents.forEach(ev=>{
      const seen = new Set();
      [-1,0,1].forEach(offset=>{
        let mm=m+offset, yy=y;
        if(mm<1){ mm=12; yy--; } if(mm>12){ mm=1; yy++; }
        getOccurrenceStartsOverlappingMonth(ev, yy, mm).forEach(startDate=>{
          if(seen.has(startDate)) return;
          seen.add(startDate);
          const occ = buildOccurrenceObject(ev, startDate);
          if(occ && dateStr>=dateOnly(occ.start) && dateStr<=dateOnly(occ.end)) results.push(occ);
        });
      });
    });
    return results.sort((a,b)=> a.start.localeCompare(b.start));
  }

  // Liefert alle Tage (als Set von YYYY-MM-DD) in einem Monat, an denen mindestens ein Termin liegt
  // (bei mehrtägigen Terminen: jeder Tag im Zeitraum).
  function getEventDatesInMonth(year, month){
    const dateSet = new Set();
    state.calendarEvents.forEach(ev=>{
      getOccurrenceStartsOverlappingMonth(ev, year, month).forEach(startDate=>{
        const occ = buildOccurrenceObject(ev, startDate);
        if(!occ) return;
        let cur = dateOnly(occ.start);
        const last = dateOnly(occ.end);
        while(cur<=last){
          dateSet.add(cur);
          cur = addDaysISO(cur, 1);
        }
      });
    });
    return dateSet;
  }

  // Liefert alle Mitglieder, die an einem bestimmten Tag (Monat+Tag) Geburtstag haben,
  // jeweils mit Name und erreichtem Alter an diesem Datum.
  function getBirthdaysOnDate(dateStr){
    const [y, m, d] = dateStr.split('-').map(Number);
    const results = [];
    state.members.forEach(mem=>{
      if(!mem.birthday) return;
      const [by, bm, bd] = mem.birthday.split('-').map(Number);
      if(bm===m && bd===d){
        results.push({ name: displayName(mem), age: y - by });
      }
    });
    return results;
  }

  // Liefert alle Tage (als Set von YYYY-MM-DD) in einem Monat, an denen mindestens ein Mitglied
  // Geburtstag hat.
  function getBirthdayDatesInMonth(year, month){
    const dateSet = new Set();
    state.members.forEach(mem=>{
      if(!mem.birthday) return;
      const [, bm, bd] = mem.birthday.split('-').map(Number);
      if(bm===month) dateSet.add(isoDate(year, month, bd));
    });
    return dateSet;
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  // Erzeugt die Belegungsreihenfolge abwechselnd Kneipe/Saal (bzw. Saal/Kneipe), damit besetzte
  // Plätze nahe der Kegelbahn geclustert bleiben. Welche Seite zuerst drankommt (und bei ungerader
  // Teilnehmerzahl den Überhang bekommt) wird pro Abend zufällig entschieden.
  function buildSeatPriorityOrder(){
    const kneipeStarts = Math.random() < 0.5;
    const order = [];
    for(let i=1;i<=6;i++){
      order.push(kneipeStarts ? 'kneipe-'+i : 'saal-'+i, kneipeStarts ? 'saal-'+i : 'kneipe-'+i);
    }
    return order;
  }

  // Ermittelt für ein Mitglied, an wie vielen Kegelabenden pro Jahr es teilgenommen hat
  // (im Verhältnis zu allen Abenden in diesem Jahr).
  // Aktualisiert das vorab aggregierte Statistik-Dokument (attendance-stats) für einen Abend.
  // direction = +1 beim Abschließen, -1 beim Wieder-Öffnen oder Löschen eines abgeschlossenen Abends.
  async function updateAttendanceStatsForEvening(detail, direction){
    let stats;
    try{ stats = await getJSONOrThrow('attendance-stats', {totalsByYear:{}, attendanceByMember:{}}); }
    catch(e){ stats = {totalsByYear:{}, attendanceByMember:{}}; }
    if(!stats.totalsByYear) stats.totalsByYear = {};
    if(!stats.attendanceByMember) stats.attendanceByMember = {};

    const year = detail.date.slice(0,4);
    const newTotal = (stats.totalsByYear[year]||0) + direction;
    if(newTotal>0) stats.totalsByYear[year] = newTotal; else delete stats.totalsByYear[year];

    const presentMemberNames = new Set(detail.seating.filter(s=>s.name && !s.isGuest).map(s=>s.name));
    presentMemberNames.forEach(name=>{
      if(!stats.attendanceByMember[name]) stats.attendanceByMember[name] = {};
      const newCount = (stats.attendanceByMember[name][year]||0) + direction;
      if(newCount>0) stats.attendanceByMember[name][year] = newCount; else delete stats.attendanceByMember[name][year];
    });
    await setJSON('attendance-stats', stats, true);
  }

  // Liest die vorab aggregierte Statistik (ein einziges Dokument statt aller Abende einzeln).
  async function computeMemberAttendanceStats(memberName){
    let raw;
    try{ raw = await getJSONOrThrow('attendance-stats', {totalsByYear:{}, attendanceByMember:{}}); }
    catch(e){ raw = {totalsByYear:{}, attendanceByMember:{}}; }
    const totalsByYear = raw.totalsByYear || {};
    const attendedByYear = (raw.attendanceByMember && raw.attendanceByMember[memberName]) || {};
    const stats = {};
    Object.keys(totalsByYear).forEach(year=>{
      stats[year] = { attended: attendedByYear[year]||0, total: totalsByYear[year] };
    });
    return stats;
  }

  function fmtEuro(n){
    return n.toLocaleString('de-DE', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';
  }
  function roundUpToFullEuro(amount){
    const cents = Math.round(amount*100);
    return Math.ceil(cents/100);
  }
  function fineTypeLabel(type){
    if(type==='multiplier') return 'Multiplikator';
    if(type==='fremdstrafe') return 'Fremdstrafe';
    if(type==='pudel') return 'Pudel';
    if(type==='runde') return 'Runde';
    return type;
  }
  function fineTypeIconSvg(type){
    if(type==='multiplier'){
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
    }
    if(type==='fremdstrafe'){
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`;
    }
    if(type==='pudel'){
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.4 0 2 1.6 2 3.2 0 1.6-1 2.8-1 4.8s1 3.2 1 4.8-.6 3.2-2 3.2-2-1.6-2-3.2 1-3.2 1-4.8-1-3.2-1-4.8C10 4.6 10.6 3 12 3z"/><ellipse cx="12" cy="20" rx="3.4" ry="1.3"/></svg>`;
    }
    if(type==='runde'){
      return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14l-2 13H7L5 3z"/><path d="M15 3c0 0 2 2 2 5s-2 5-2 5"/><path d="M6 20h12"/></svg>`;

  function financeAccountBalance(accountId){
    const acc = state.financeAccounts.find(a=>a.id===accountId);

  function buildFinanceTransactionsTab(){
    const sorted = state.financeTransactions.slice().sort((a,b)=>{
      const dateCompare = b.date.localeCompare(a.date);
      if(dateCompare!==0) return dateCompare;
      const aCreated = a.createdAt || new Date(a.date).getTime();
      const bCreated = b.createdAt || new Date(b.date).getTime();
      return bCreated - aCreated;
    });
    if(sorted.length===0){
      return `<div class="card"><p class="empty-state">Noch keine Umsätze eingetragen. Über das „+" oben hinzufügen.</p></div>`;
    }
    const byYear = {};
    sorted.forEach(t=>{
      const year = t.date.slice(0,4);
      (byYear[year] = byYear[year] || []).push(t);
    });
    const years = Object.keys(byYear).sort((a,b)=> b.localeCompare(a));
    const listHtml = years.map(year=>{
      const expanded = state.financeExpandedYears.has(year);
      const rows = byYear[year].map(t=>{
        const isPositive = t.amount>=0;
        const locked = !!t.fromArrears;
        return `
          <div class="transaction-row" data-id="${t.id}">
            <span class="transaction-info">
              <span class="transaction-description">${escapeHtml(t.description)}${locked?' <span class="fine-type-icon" title="Aus Rückstandszahlung – nur Bezeichnung bearbeitbar" style="display:inline-flex; width:14px; height:14px; vertical-align:middle;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>':''}</span>
              <span class="transaction-meta">${formatDateDE(t.date)} · ${escapeHtml(financeAccountNameById(t.accountId))}</span>
            </span>
            <span class="transaction-amount${isPositive?' positive':' negative'}">${isPositive?'+':''}${fmtEuro(t.amount)}</span>
          </div>
        `;
      }).join('');
      return `
        <div class="year-group finance-year-group${expanded?' expanded':''}" data-year="${year}">
          <div class="year-header finance-year-header">
            <span>${year}</span>
            <span class="chevron">▸</span>
          </div>
          <div class="year-evenings">${rows}</div>
        </div>
      `;
    }).join('');
    return `<div class="card"><h2 class="section-title">Umsätze</h2>${listHtml}</div>`;
  }

  function buildFinanceArrearsTab(){
    const memberNames = new Set(state.members.map(m=>displayName(m)));
    const memberRows = state.members.map(m=>{
      const name = displayName(m);
      const entry = state.financeArrears.find(a=>a.name===name);
      return { name, amount: entry ? entry.amount : 0 };
    });
    const guestRows = state.financeArrears
      .filter(a=> !memberNames.has(a.name) && a.amount>0)
      .map(a=>({ name:a.name, amount:a.amount }));
    const allRows = [...memberRows, ...guestRows].sort((a,b)=> a.name.localeCompare(b.name,'de'));
    const totalDue = allRows.reduce((sum,r)=> sum + r.amount, 0);
    const rowsHtml = allRows.map(r=>`
      <div class="fines-summary-row" data-name="${escapeHtml(r.name)}">
        <span class="fines-summary-name">${escapeHtml(r.name)}</span>
        <span class="fines-summary-amount ${r.amount>0?'amount-due':'amount-clear'}">${fmtEuro(r.amount)}</span>
      </div>
    `).join('');
    return `
      <div class="card"><h2 class="section-title">Rückstände</h2>${rowsHtml}</div>
      <div class="card">
        <div class="stat-total"><span>Summe offener Rückstände</span><span>${fmtEuro(totalDue)}</span></div>
      </div>
    `;
  }

  function buildFinanceSavingsPotsTab(totalAmount){
    const today = todayISO();
    const activePots = state.financeSavingsPots
      .filter(p=> p.targetDate >= today)
      .sort((a,b)=> a.targetDate.localeCompare(b.targetDate));

    if(activePots.length===0){
      return `<div class="card"><p class="empty-state">Keine anstehenden Spartöpfe. In den Einstellungen unter „Finanzverwaltung" anlegen.</p></div>`;
    }

    // Reihenfolge der Verteilung:
    // 1. Jeder Topf mit einem Startbetrag bekommt diesen direkt zugewiesen - wird vom
    //    noch zu verteilenden Gesamtbetrag abgezogen.
    // 2. Töpfe mit verknüpfter monatlicher Buchung bekommen zusätzlich die Summe aller
    //    bisher dafür gebuchten Beträge direkt zugewiesen - ebenfalls abgezogen.
    // 3. Der verbleibende Betrag wird per Wasserfall (nächstes Zieldatum zuerst) auf den
    //    jeweils noch offenen Bedarf (Sparziel abzüglich bereits direkt Zugewiesenem) verteilt.
    const linkedPotIds = new Set(state.financeRecurring.filter(r=>r.potId).map(r=>r.potId));
    function bookedSumForPot(pot){
      return state.financeTransactions
        .filter(t=>t.potId===pot.id)
        .reduce((sum,t)=> sum + t.amount, 0);
    }

    const directFunding = {};
    let remaining = totalAmount;
    activePots.forEach(p=>{
      let funded = p.startAmount || 0;
      if(linkedPotIds.has(p.id)) funded += bookedSumForPot(p);
      funded = Math.round(funded*100)/100;
      directFunding[p.id] = funded;
      remaining -= funded;
    });
    remaining = Math.max(0, remaining);

    const rowsHtml = activePots.map(p=>{
      const alreadyFunded = directFunding[p.id];
      const stillNeeded = Math.max(0, p.targetAmount - alreadyFunded);
      const waterfallShare = Math.max(0, Math.min(remaining, stillNeeded));
      remaining -= waterfallShare;
      const allocated = Math.round((alreadyFunded + waterfallShare)*100)/100;
      const percent = p.targetAmount>0 ? Math.min(100, Math.round(allocated/p.targetAmount*100)) : 0;
      return `
        <div class="savings-pot-row">
          <div class="savings-pot-header">
            <span class="savings-pot-name">${escapeHtml(p.name)}</span>
            <span class="savings-pot-percent">${percent}%</span>
          </div>
          <div class="savings-pot-bar-track"><div class="savings-pot-bar-fill" style="width:${percent}%;"></div></div>
          <div class="savings-pot-meta">
            <span>${fmtEuro(allocated)} von ${fmtEuro(p.targetAmount)}</span>
            <span>Ziel: ${formatDateDE(p.targetDate)}</span>
          </div>
        </div>
      `;
    }).join('');
    return `<div class="card"><h2 class="section-title">Spartöpfe</h2>${rowsHtml}</div>`;
  }

  // ---------- Browser-Verlauf (Zurück-Button/Wisch-Geste) ----------
  let isPopstateNavigation = false;
  let lastHistorySignature = null;

  function historySignature(){
    if(state.view==='personFineDetail' && state.currentEveningDetail) return 'personFine:'+state.currentEveningDetail.id+':'+state.currentFineSeatId;
    if(state.view==='detail' && state.currentEveningDetail) return 'detail:'+state.currentEveningDetail.id;
    if(state.view==='arrearsDetail') return 'arrearsDetail:'+encodeURIComponent(state.currentArrearsName);
    if(state.view==='transactionDetail') return 'transactionDetail:'+(state.currentTransactionId||'new');
    if(state.view==='memberDetail') return 'memberDetail:'+(state.currentMemberId||'new');
    if(state.view==='recurringDetail') return 'recurringDetail:'+(state.currentRecurringId||'new');
    if(state.view==='eventDetail') return 'eventDetail:'+(state.calendarEditingOccurrence ? state.calendarEditingOccurrence.seriesId+':'+state.calendarEditingOccurrence.occurrenceDate : 'new');
    return state.view;
  }
  function hashFor(sig){
    if(sig==='settingsMenu') return '#einstellungen';
    if(sig==='settings') return '#mitglieder';
    if(sig==='finesManagement') return '#strafen';
    if(sig==='gamesManagement') return '#spiele';
    if(sig==='financeManagement') return '#finanzen-verwaltung';
    if(sig==='eventManagement') return '#terminverwaltung';
    if(sig==='finance') return '#finanzen';
    if(sig==='calendar') return '#kalender';
    if(sig==='new') return '#neuer-abend';
    if(sig.startsWith('personFine:')) return '#strafe-person';
    if(sig.startsWith('arrearsDetail:')) return '#rueckstand-person';
    if(sig.startsWith('transactionDetail:')) return '#umsatz';
    if(sig.startsWith('memberDetail:')) return '#mitglied';
    if(sig.startsWith('recurringDetail:')) return '#buchung';
    if(sig.startsWith('eventDetail:')) return '#termin';
    if(sig.startsWith('detail:')) return '#abend-'+sig.slice(7);
    return '#uebersicht';
  }

  function render(){
    if(window.__resetPullIndicator) window.__resetPullIndicator();
    const app = document.getElementById('app');
    let body = '';
    if(state.view==='main') body = viewMain();
    else if(state.view==='settingsMenu') body = viewSettingsMenu();
    else if(state.view==='settings') body = viewSettings();
    else if(state.view==='memberDetail') body = viewMemberDetail();
    else if(state.view==='finesManagement') body = viewFinesManagement();
    else if(state.view==='gamesManagement') body = viewGamesManagement();
    else if(state.view==='financeManagement') body = viewFinanceManagement();
    else if(state.view==='recurringDetail') body = viewRecurringDetail();
    else if(state.view==='finance') body = viewFinance();
    else if(state.view==='calendar') body = viewCalendar();
    else if(state.view==='eventManagement') body = viewEventManagement();
    else if(state.view==='eventDetail') body = viewEventDetail();
    else if(state.view==='arrearsDetail') body = viewArrearsDetail();
    else if(state.view==='transactionDetail') body = viewTransactionDetail();
    else if(state.view==='new') body = viewNew();
    else if(state.view==='detail') body = viewDetail(state.currentEveningDetail);
    else if(state.view==='personFineDetail') body = viewPersonFineDetail();
    app.innerHTML = headerHtml() + `<main class="container">${body}</main>` + bottomNavHtml();
    attachListeners();

    const sig = historySignature();
    if(!isPopstateNavigation && sig !== lastHistorySignature){
      const method = lastHistorySignature===null ? 'replaceState' : 'pushState';
      history[method]({sig}, '', hashFor(sig));
    }
    lastHistorySignature = sig;
  }

  // Einmaliger globaler Listener (nicht pro Render), schließt Overflow-Menüs bei Klick außerhalb.
  document.addEventListener('click', (e)=>{
    [['header-overflow-menu','header-overflow-btn'], ['header-person-overflow-menu','header-person-overflow-btn'], ['header-arrears-overflow-menu','header-arrears-overflow-btn'], ['header-tx-overflow-menu','header-tx-overflow-btn'], ['header-event-overflow-menu','header-event-overflow-btn'], ['header-member-overflow-menu','header-member-overflow-btn'], ['header-recurring-overflow-menu','header-recurring-overflow-btn']].forEach(([menuId,btnId])=>{
      const menu = document.getElementById(menuId);
      const btn = document.getElementById(btnId);
      if(menu && !menu.hidden && e.target!==btn && !menu.contains(e.target) && !(btn && btn.contains(e.target))){
        menu.hidden = true;
      }
    });
  });

  window.addEventListener('popstate', (event)=>{
    isPopstateNavigation = true;
    const sig = (event.state && event.state.sig) || 'main';
    (async ()=>{
      if(sig==='settingsMenu'){
        goToSettingsMenu();
      }else if(sig==='settings'){
        await goToSettings();
      }else if(sig==='finesManagement'){
        await goToFinesManagement();
      }else if(sig==='gamesManagement'){
        await goToGamesManagement();
      }else if(sig==='financeManagement'){
        await goToFinanceManagement();
      }else if(sig==='eventManagement'){
        await goToEventManagement();
      }else if(sig==='finance'){
        await goToFinance();
      }else if(sig==='new'){
        goToNew();
      }else if(sig.startsWith('detail:')){
        const id = sig.slice(7);
        if(state.currentEveningDetail && state.currentEveningDetail.id===id){
          state.view = 'detail';
          render();
        }else{
          await openEveningDetail(id);
        }
      }else if(sig.startsWith('personFine:')){
        const parts = sig.split(':');
        const eveningId = parts[1], seatId = parts[2];
        if(state.currentEveningDetail && state.currentEveningDetail.id===eveningId){
          const seatObj = state.currentEveningDetail.seating.find(s=>s.seatId===seatId);
          state.currentFineSeatId = seatId;
          state.currentFineName = seatObj ? seatObj.name : '';
          state.view = 'personFineDetail';
          render();
        }else{
          renderLoading('Kegelabend wird geladen…');
          try{
            const d = await getJSONOrThrow('evening-'+eveningId, null);
            if(d){
              state.currentEveningDetail = d;
              const seatObj = d.seating.find(s=>s.seatId===seatId);
              state.currentFineSeatId = seatId;
              state.currentFineName = seatObj ? seatObj.name : '';
              state.eveningTab = 'strafen';
              state.view = 'personFineDetail';
              render();
            }else{
              await goToMain();
            }
          }catch(e){
            renderError('Verbindung fehlgeschlagen. Bitte prüfe deine Internetverbindung.', goToMain);
          }
        }
      }else if(sig.startsWith('arrearsDetail:')){
        const name = decodeURIComponent(sig.slice('arrearsDetail:'.length));
        if(state.financeAccounts.length===0 && state.financeArrears.length===0){
          try{
            const [accounts, transactions, arrears] = await Promise.all([
              getJSONOrThrow('finance-accounts', []),
              getJSONOrThrow('finance-transactions', []),
              getJSONOrThrow('finance-arrears', [])
            ]);
            state.financeAccounts = accounts;
            state.financeTransactions = transactions;
            state.financeArrears = arrears;
          }catch(e){}
        }
        state.currentArrearsName = name;
        state.view = 'arrearsDetail';
        render();
      }else if(sig.startsWith('transactionDetail:')){
        const txId = sig.slice('transactionDetail:'.length);
        if(state.financeAccounts.length===0 && state.financeTransactions.length===0){
          try{
            const [accounts, transactions] = await Promise.all([
              getJSONOrThrow('finance-accounts', []),
              getJSONOrThrow('finance-transactions', [])
            ]);
            state.financeAccounts = accounts;
            state.financeTransactions = transactions;
          }catch(e){}
        }
        state.currentTransactionId = txId==='new' ? null : txId;
        state.view = 'transactionDetail';
        render();
      }else if(sig.startsWith('memberDetail:')){
        const memberId = sig.slice('memberDetail:'.length);
        if(state.members.length===0){
          try{ state.members = await getJSONOrThrow('members', []); }catch(e){}
        }
        if(memberId==='new'){
          state.currentMemberId = null;
          state.currentMemberStats = {};
          state.view = 'memberDetail';
          render();
        }else{
          state.currentMemberId = memberId;
          const m = state.members.find(x=>x.id===memberId);
          state.view = 'memberDetail';
          render();
          if(m){
            try{
              state.currentMemberStats = await computeMemberAttendanceStats(displayName(m));
              render();
            }catch(e){}
          }
        }
      }else if(sig.startsWith('recurringDetail:')){
        const recId = sig.slice('recurringDetail:'.length);
        if(state.financeAccounts.length===0 && state.financeRecurring.length===0 && state.financeSavingsPots.length===0){
          try{
            const [accounts, recurring, pots] = await Promise.all([
              getJSONOrThrow('finance-accounts', []),
              getJSONOrThrow('finance-recurring', []),
              getJSONOrThrow('finance-savings-pots', [])
            ]);
            state.financeAccounts = accounts;
            state.financeRecurring = recurring;
            state.financeSavingsPots = pots;
          }catch(e){}
        }
        state.currentRecurringId = recId==='new' ? null : recId;
        state.view = 'recurringDetail';
        render();
      }else if(sig.startsWith('eventDetail:')){
        const rest = sig.slice('eventDetail:'.length);
        if(state.calendarEvents.length===0 && state.calendarOccurrenceEdits.length===0){
          try{
            const [events, edits, rsvps, members] = await Promise.all([
              getJSONOrThrow('calendar-events', []),
              getJSONOrThrow('calendar-occurrence-edits', []),
              getJSONOrThrow('calendar-rsvps', []),
              getJSONOrThrow('members', state.members)
            ]);
            state.calendarEvents = events;
            state.calendarOccurrenceEdits = edits;
            state.calendarRsvps = rsvps;
            state.members = members;
          }catch(e){}
        }
        if(rest==='new'){
          state.calendarEditingOccurrence = null;
        }else{
          const sepIdx = rest.indexOf(':');
          const seriesId = rest.slice(0, sepIdx);
          const occurrenceDate = rest.slice(sepIdx+1);
          state.calendarEditingOccurrence = findOccurrenceByIds(seriesId, occurrenceDate);
        }
        state.view = 'eventDetail';
        render();
      }else{
        await goToMain();
      }
      isPopstateNavigation = false;
    })();
  });

  // Sucht den chronologisch nächsten anstehenden Termin (heute oder später), über Serien hinweg.
  function getNextUpcomingEvent(){
    const today = todayISO();
    let m = new Date().getMonth()+1;
    let yy = new Date().getFullYear();
    for(let i=0;i<24;i++){
      const events = [];
      state.calendarEvents.forEach(ev=>{
        getOccurrenceStartsOverlappingMonth(ev, yy, m).forEach(startDate=>{
          const occ = buildOccurrenceObject(ev, startDate);
          // "Anstehend" heißt: der Termin ist noch nicht vollständig vorbei (Ende >= heute).
          if(occ && dateOnly(occ.end)>=today) events.push(occ);
        });
      });
      if(events.length>0){
        events.sort((a,b)=> a.start.localeCompare(b.start));
        return events[0];
      }
      m++;
      if(m>12){ m=1; yy++; }
    }
    return null;
  }

  function fineTotalForSeat(detail, seatId){
    const seat = detail.seating.find(s=>s.seatId===seatId);
    if(seat && seat.invalid){
      // Fest eingetragens (nach Abschluss) oder dynamisch berechnet (während des Abends)
      if(seat.invalidAmount !== undefined) return seat.invalidAmount;
      return averageOfTotalsRounded(validPresentMemberTotals(detail, seatId));
    }
    const entries = (detail.finesBySeat && detail.finesBySeat[seatId]) || {};
    const catalog = detail.finesCatalogSnapshot || [];
    let total = 0;
    catalog.forEach(f=>{
      if(f.type==='fremdstrafe') return;
      if(f.type==='runde') return; // Runden haben keinen Euro-Betrag
      const count = entries[f.id] || 0;
      total += count * f.amount;
    });
    const adHocList = (detail.adHocFinesBySeat && detail.adHocFinesBySeat[seatId]) || [];
    adHocList.forEach(a=>{ total += a.amount; });

    // Fremdstrafen: wer sie auslöst zahlt selbst nichts, stattdessen zahlen alle anderen Anwesenden.
    const fremdstrafeFines = catalog.filter(f=>f.type==='fremdstrafe');
    if(fremdstrafeFines.length>0){
      const otherPresentSeats = detail.seating.filter(s=>s.name && s.seatId!==seatId);
      fremdstrafeFines.forEach(f=>{
        otherPresentSeats.forEach(s=>{
          const otherEntries = (detail.finesBySeat && detail.finesBySeat[s.seatId]) || {};
          const count = otherEntries[f.id] || 0;
          total += count * f.amount;
        });
      });
    }
    return total;
  }
  function roundedFineTotalForSeat(detail, seatId){
    return roundUpToFullEuro(fineTotalForSeat(detail, seatId));
  }

  // Pool für Durchschnittsberechnungen: anwesende, gültige (nicht invalide) Mitglieder - ohne Gäste.
  function validPresentMemberTotals(detail, excludeSeatId){
    return detail.seating
      .filter(s=> s.name && !s.invalid && s.seatId!==excludeSeatId)
      .map(s=> roundedFineTotalForSeat(detail, s.seatId));
  }
  function averageOfTotalsRounded(totals){
    if(totals.length===0) return 0;
    return roundUpToFullEuro(totals.reduce((a,b)=>a+b,0)/totals.length);
  }

  // Für die Übersichtsliste: kompakte Kennzahlen eines Abends (anwesende/abwesende Mitglieder,
  // Gäste, Einnahme), werden im Index-Dokument gecacht, damit die Übersicht nicht für jeden
  // Abend das volle Detail-Dokument laden muss.
  function computeEveningSummaryFields(detail){
    const occupied = detail.seating.filter(s=>s.name);
    const presentCount = occupied.filter(s=>!s.isGuest).length;
    const guestCount = occupied.filter(s=>s.isGuest).length;
    const absentList = detail.closed ? (detail.absentMembersFines || []) : [];
    const absentCount = detail.closed ? absentList.length : Math.max(0, state.members.length - presentCount);
    let income = 0;
    occupied.forEach(s=>{ income += roundedFineTotalForSeat(detail, s.seatId); });
    absentList.forEach(a=>{ income += a.amount; });
    return { presentCount, guestCount, absentCount, income };
  }
  // Aktualisiert den Index-Eintrag eines Abends mit den aktuellen Kennzahlen (mutiert state.eveningsIndex).
  function updateEveningIndexSummary(detail){
    const idx = state.eveningsIndex.findIndex(e=>e.id===detail.id);
    if(idx>=0) state.eveningsIndex[idx] = {...state.eveningsIndex[idx], ...computeEveningSummaryFields(detail)};
  }
  // Speichert ein Abend-Detail-Dokument und hält gleichzeitig die Kennzahlen im Index aktuell.
  async function saveEveningDetail(detail){
    updateEveningIndexSummary(detail);
    await Promise.all([
      setJSON('evening-'+detail.id, detail, true),
      setJSON('evenings-index', state.eveningsIndex, true)
    ]);
  }
  // Holt für Abende, deren Index-Eintrag noch keine Kennzahlen enthält (ältere Einträge vor
  // Einführung dieses Felds), einmalig das Detail-Dokument nach und cacht die Kennzahlen im Index.
  async function backfillEveningSummaries(){
    const missing = state.eveningsIndex.filter(e=> e.income===undefined);
    if(missing.length===0) return;
    try{
      const details = await Promise.all(missing.map(e=> getJSON('evening-'+e.id, true, null)));
      let changed = false;
      details.forEach((detail, i)=>{
        if(!detail) return;
        const idx = state.eveningsIndex.findIndex(x=>x.id===missing[i].id);
        if(idx>=0){ state.eveningsIndex[idx] = {...state.eveningsIndex[idx], ...computeEveningSummaryFields(detail)}; changed = true; }
      });
      if(changed){
        await setJSON('evenings-index', state.eveningsIndex, true);
        if(state.view==='main') render();
      }
    }catch(e){ console.error('Backfill der Abend-Kennzahlen fehlgeschlagen', e); }
  }

  // Ermittelt die Sitzplätze mit den meisten "Pudel"-Strafen (bei Gleichstand: alle).
  function computePudelCrownSeatIds(detail){
    const occupied = detail.seating.filter(s=>s.name);
    const catalog = detail.finesCatalogSnapshot || [];
    const pudelFineIds = catalog.filter(f=>f.type==='pudel').map(f=>f.id);
    function pudelCountForSeat(seatId){
      const entries = (detail.finesBySeat && detail.finesBySeat[seatId]) || {};
      return pudelFineIds.reduce((sum,id)=> sum + (entries[id]||0), 0);
    }
    const counts = occupied.map(s=>({seatId:s.seatId, count:pudelCountForSeat(s.seatId)}));
    const maxPudel = counts.length>0 ? Math.max(0, ...counts.map(c=>c.count)) : 0;
    return maxPudel>0 ? new Set(counts.filter(c=>c.count===maxPudel).map(c=>c.seatId)) : new Set();
  }

  function buildFinesSummary(detail){
    const bySeatId = {};
    detail.seating.forEach(s=>{ bySeatId[s.seatId] = s; });
    const interleavedOrder = [];
    for(let i=1;i<=6;i++){ interleavedOrder.push('saal-'+i, 'kneipe-'+i); }
    const occupied = interleavedOrder.map(id=>bySeatId[id]).filter(s=>s && s.name);

    const crownSeatIds = computePudelCrownSeatIds(detail);

    const rowsHtml = occupied.length===0
      ? `<p class="empty-state">Keine Teilnehmer für diesen Abend.</p>`
      : occupied.map(s=>{
        const hasCrown = crownSeatIds.has(s.seatId);
        const crownHtml = hasCrown ? `<span class="pudel-crown" title="Pudelkönig"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5L3 8z"/></svg></span>` : '';
        return `
        <div class="fines-summary-row" data-seat-id="${s.seatId}" data-name="${escapeHtml(s.name)}">
          <span class="fines-summary-name">${escapeHtml(s.name)}${crownHtml}${s.invalid ? `<span class="invalid-icon" title="Invalide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></span>` : ''}</span>

  function viewPersonFineDetail(){
    const detail = state.currentEveningDetail;
    const seatId = state.currentFineSeatId;
    const seat = detail.seating.find(s=>s.seatId===seatId);
    const closed = !!detail.closed;
    const invalid = !!(seat && seat.invalid);

    if(invalid){
      const dynamicAvg = seat.invalidAmount !== undefined
        ? seat.invalidAmount
        : averageOfTotalsRounded(validPresentMemberTotals(detail, seatId));
      return `
        <div class="card">
          <p class="hint">Diese Person ist als <strong>invalide</strong> markiert. Es werden keine Strafen gepflegt. Beim Abschließen des Abends wird der Durchschnitt der anderen Anwesenden fest hinterlegt.</p>
        </div>
        <div class="card">
          <div class="stat-total-raw"><span>Aktueller Durchschnitt (vorläufig)</span><span>${fmtEuro(dynamicAvg)}</span></div>
        </div>
      `;
    }

    const entries = (detail.finesBySeat && detail.finesBySeat[seatId]) || {};
    const catalog = detail.finesCatalogSnapshot || [];
    const nonRundenCatalog = catalog.filter(f=>f.type!=='runde');
    const rundenCatalog = catalog.filter(f=>f.type==='runde');

    function fineDetailRowHtml(f, entries, closed){
      const count = entries[f.id] || 0;
      const result = count * f.amount;
      const isFremd = f.type==='fremdstrafe';
      const isRunde = f.type==='runde';
      const resultDisplay = isFremd ? '' : isRunde ? 'Runde' : fmtEuro(result);
      return `
        <div class="fine-detail-row${closed?' readonly':''}" data-fine-id="${f.id}">
          <span class="fine-detail-name">${escapeHtml(f.name)}${isFremd ? `<span class="fremdstrafe-tag" title="Fremdstrafe">${fineTypeIconSvg('fremdstrafe')}</span>` : ''}</span>
          <span class="fine-detail-controls">
            ${closed ? '' : `<button type="button" class="fine-minus-btn" data-fine-id="${f.id}" aria-label="Um 1 verringern">−</button>`}
            <span class="fine-detail-count">${count}×</span>
          </span>
          <span class="fine-detail-result">${resultDisplay}</span>
        </div>
      `;
    }

    const rowsHtml = nonRundenCatalog.map(f=>fineDetailRowHtml(f, entries, closed)).join('');
    const rundenRowsHtml = rundenCatalog.map(f=>fineDetailRowHtml(f, entries, closed)).join('');

    const otherPresentSeats = detail.seating.filter(s=>s.name && s.seatId!==seatId);
    const fremdstrafeChargeRows = [];
    catalog.filter(f=>f.type==='fremdstrafe').forEach(f=>{
      otherPresentSeats.forEach(s=>{
        const otherEntries = (detail.finesBySeat && detail.finesBySeat[s.seatId]) || {};
        const count = otherEntries[f.id] || 0;
        if(count>0){
          fremdstrafeChargeRows.push(`
            <div class="fine-detail-row fremdstrafe-charge-row readonly">
              <span class="fine-detail-name">${escapeHtml(f.name)} durch ${escapeHtml(s.name)}</span>
              <span class="fine-detail-controls"><span class="fine-detail-count">${count}×</span></span>
              <span class="fine-detail-result">${fmtEuro(count*f.amount)}</span>
            </div>
          `);
        }
      });
    });

    const adHocList = (detail.adHocFinesBySeat && detail.adHocFinesBySeat[seatId]) || [];
    const adHocRowsHtml = adHocList.map(a=>`
      <div class="adhoc-fine-row" data-id="${a.id}">
        <span class="fine-detail-name">${escapeHtml(a.name)}</span>
        <span class="fine-detail-result">${fmtEuro(a.amount)}</span>
        ${closed ? '' : `
        <span class="row-actions">
          <button type="button" class="icon-btn edit-adhoc-btn" data-id="${a.id}" aria-label="Bearbeiten">✎</button>
          <button type="button" class="icon-btn delete-adhoc-btn" data-id="${a.id}" aria-label="Löschen">✕</button>
        </span>`}
      </div>
    `).join('');

    const total = fineTotalForSeat(detail, seatId);
    return `
      <div class="card">
        <h3 class="section-title-small">Strafen</h3>
        ${nonRundenCatalog.length===0 ? `<p class="empty-state">Für diesen Abend sind keine Strafen hinterlegt.</p>` : rowsHtml}
      </div>
      ${fremdstrafeChargeRows.length>0 ? `
      <div class="card">
        <h3 class="section-title-small">Fremdstrafen</h3>
        ${fremdstrafeChargeRows.join('')}
      </div>` : ''}
      <div class="card">
        <h3 class="section-title-small">Geldstrafen</h3>
        ${adHocList.length===0 ? `<p class="empty-state">Noch keine Geldstrafen.${closed?'':' Über das „+“ oben hinzufügen.'}</p>` : adHocRowsHtml}
      </div>
      ${rundenCatalog.length>0 ? `
      <div class="card">
        <h3 class="section-title-small">Runden</h3>
        ${rundenRowsHtml}
      </div>` : ''}
      <div class="card">
        <div class="stat-total-raw"><span>Gesamt (genau)</span><span>${fmtEuro(total)}</span></div>
        <div class="stat-total"><span>Gesamt (gerundet)</span><span>${fmtEuro(roundUpToFullEuro(total))}</span></div>
      </div>
    `;
  }

  async function adjustFineCount(fineId, delta){
    const detail = state.currentEveningDetail;
    const seatId = state.currentFineSeatId;
    if(!detail.finesBySeat) detail.finesBySeat = {};
    if(!detail.finesBySeat[seatId]) detail.finesBySeat[seatId] = {};
    const current = detail.finesBySeat[seatId][fineId] || 0;
    detail.finesBySeat[seatId][fineId] = Math.max(0, current + delta);
    render();
    await saveEveningDetail(detail);
  }

  function showCloseEveningModal(){
    showModal(`
      <h3>Kegelabend abschließen</h3>
      <p>Der Abend wird in den Nur-Lese-Modus versetzt. Für alle nicht anwesenden Mitglieder wird automatisch der gerundete Durchschnittsbetrag der anwesenden Mitglieder als Strafe hinterlegt. Fortfahren?</p>

        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    document.getElementById('confirm-close-evening-yes').addEventListener('click', async ()=>{
      const btn = document.getElementById('confirm-close-evening-yes');
      const sendEmails = document.getElementById('close-send-emails-checkbox').checked;
      btn.disabled = true; btn.textContent = 'Wird abgeschlossen…';
      const detail = state.currentEveningDetail;
      detail.skipNotificationEmail = !sendEmails;
      let allMembers = state.members;
      try{ allMembers = await getJSON('members', true, state.members); state.members = allMembers; }catch(e){}
      const presentSeats = detail.seating.filter(s=>s.name && !s.isGuest);
      const presentNames = new Set(presentSeats.map(s=>s.name));
      const avgRounded = averageOfTotalsRounded(validPresentMemberTotals(detail));
      // Invalide markierte Personen: Durchschnitt jetzt fest einfrieren.
      detail.seating.forEach(s=>{
        if(s.invalid && s.invalidAmount===undefined) s.invalidAmount = avgRounded;
      });
      const absentMembers = allMembers.filter(m=> !presentNames.has(displayName(m)));
      detail.absentMembersFines = absentMembers.map(m=>({ name: displayName(m), amount: avgRounded }));
      detail.closed = true;
      const idx = state.eveningsIndex.findIndex(e=>e.id===detail.id);
      if(idx>=0) state.eveningsIndex[idx] = {...state.eveningsIndex[idx], closed:true, ...computeEveningSummaryFields(detail)};

      // Strafen aller Anwesenden (Mitglieder + Gäste) und Abwesenden zu den offenen Rückständen addieren.
      let arrears = state.financeArrears;
      try{ arrears = await getJSON('finance-arrears', true, state.financeArrears); }catch(e){}
      // Snapshot des Rückstands VOR der heutigen Erhöhung - direkt auf dem Abend gespeichert,
      // damit die Cloud Function beim Mailversand keinen Race-Condition-Zugriff auf ein
      // separates, parallel geschriebenes Dokument braucht.
      const priorArrearsSnapshot = {};
      detail.seating.filter(s=>s.name).forEach(s=>{
        const existing = arrears.find(a=>a.name===s.name);
        priorArrearsSnapshot[s.name] = existing ? existing.amount : 0;
      });
      detail.absentMembersFines.forEach(a=>{
        if(priorArrearsSnapshot[a.name]===undefined){
          const existing = arrears.find(x=>x.name===a.name);
          priorArrearsSnapshot[a.name] = existing ? existing.amount : 0;
        }
      });
      detail.priorArrearsSnapshot = priorArrearsSnapshot;

      function addToArrears(name, amount, seatId){
        if(!amount) return;
        let entry = arrears.find(a=>a.name===name);
        if(!entry){ entry = {name, amount:0, history:[]}; arrears.push(entry); }
        if(!entry.history) entry.history = [];
        entry.amount = Math.round((entry.amount + amount)*100)/100;
        entry.history.push({
          id: uid('hist'), date: detail.date, type:'increase', delta: amount,
          note: `Strafen vom Kegelabend am ${formatDateDE(detail.date)}`, balanceAfter: entry.amount, createdAt: Date.now(),
          eveningId: detail.id, seatId: seatId||undefined
        });
      }
      detail.seating.filter(s=>s.name).forEach(s=>{
        addToArrears(s.name, roundedFineTotalForSeat(detail, s.seatId), s.seatId);
      });
      detail.absentMembersFines.forEach(a=>{ addToArrears(a.name, a.amount); });
      state.financeArrears = arrears;

      await Promise.all([
        setJSON('evening-'+detail.id, detail, true),
        setJSON('evenings-index', state.eveningsIndex, true),
        setJSON('finance-arrears', arrears, true)
      ]);
      await updateAttendanceStatsForEvening(detail, 1);
      closeGenericModal();
      render();
    });
  }

  // Nächster freier Platz nach den bestehenden Regeln: Seite mit weniger Besetzung zuerst
  // (Balance halten), darin der niedrigste freie Platz (von vorne füllen).
  function nextFreeSeatId(detail){
    const occupied = new Set(detail.seating.filter(s=>s.name).map(s=>s.seatId));
    // Zählt nur aktive (nicht invalide) Personen - eine Seite mit invaliden Personen hat effektiv
    // weniger Mitspieler und soll bei neuen Personen bevorzugt aufgefüllt werden.
    const saalActive = detail.seating.filter(s=>s.seatId.startsWith('saal-') && s.name && !s.invalid).length;
    const kneipeActive = detail.seating.filter(s=>s.seatId.startsWith('kneipe-') && s.name && !s.invalid).length;
    const preferred = kneipeActive < saalActive ? 'kneipe' : (saalActive < kneipeActive ? 'saal' : (Math.random()<0.5 ? 'kneipe':'saal'));
    const sections = [preferred, preferred==='saal'?'kneipe':'saal'];
    for(const section of sections){
      for(let i=1;i<=6;i++){
        const seatId = section+'-'+i;
        if(!occupied.has(seatId)) return seatId;
      }
    }
    return null;
  }

  // Verschiebt eine nachträglich hinzugefügte Person auf die andere Seite (Saal<->Kneipe).
  // Nimmt dabei alle zu ihrem bisherigen Sitzplatz gehörenden Daten mit (Strafen, Geldstrafen, Flags).
  // Gibt die neue seatId zurück, oder null falls auf der anderen Seite kein Platz frei ist.
  function switchAttendeeSide(detail, oldSeatId){
    const oldSeat = detail.seating.find(s=>s.seatId===oldSeatId);
    if(!oldSeat || !oldSeat.name) return null;
    const oldSection = oldSeatId.startsWith('saal-') ? 'saal' : 'kneipe';
    const newSection = oldSection==='saal' ? 'kneipe' : 'saal';
    const occupied = new Set(detail.seating.filter(s=>s.name).map(s=>s.seatId));
    let newSeatId = null;
    for(let i=1;i<=6;i++){
      const candidate = newSection+'-'+i;
      if(!occupied.has(candidate)){ newSeatId = candidate; break; }
    }
    if(!newSeatId) return null;

    const newSeat = detail.seating.find(s=>s.seatId===newSeatId);
    newSeat.name = oldSeat.name;
    newSeat.isGuest = oldSeat.isGuest;
    newSeat.addedLater = oldSeat.addedLater;
    if(oldSeat.invalid!==undefined) newSeat.invalid = oldSeat.invalid;
    if(oldSeat.invalidAmount!==undefined) newSeat.invalidAmount = oldSeat.invalidAmount;
    if(oldSeat.isSchriftfuehrer!==undefined) newSeat.isSchriftfuehrer = oldSeat.isSchriftfuehrer;

    delete oldSeat.name;
    delete oldSeat.isGuest;
    delete oldSeat.addedLater;
    delete oldSeat.invalid;
    delete oldSeat.invalidAmount;
    delete oldSeat.isSchriftfuehrer;

    if(detail.finesBySeat && detail.finesBySeat[oldSeatId]){
      detail.finesBySeat[newSeatId] = detail.finesBySeat[oldSeatId];
      delete detail.finesBySeat[oldSeatId];
    }
    if(detail.adHocFinesBySeat && detail.adHocFinesBySeat[oldSeatId]){
      detail.adHocFinesBySeat[newSeatId] = detail.adHocFinesBySeat[oldSeatId];
      delete detail.adHocFinesBySeat[oldSeatId];
    }
    return newSeatId;
  }

    const interleavedSeatOrder = [];
    for(let i=1;i<=6;i++){ interleavedSeatOrder.push('saal-'+i, 'kneipe-'+i); }

    const gameOptionsHtml = games.map(g=>`<option value="game:${g.id}">${escapeHtml(g.name)}</option>`).join('');
    const memberRowsHtml = memberSeats.length===0
      ? `<p class="empty-state">Keine Mitglieder bei diesem Abend anwesend.</p>`
      : memberSeats.map(s=>`
        <div class="bulk-member-row" data-seat-id="${s.seatId}">
          <label class="bulk-member-left">
            <input type="checkbox" class="bulk-member-checkbox" data-seat-id="${s.seatId}" data-name="${escapeHtml(s.name)}">
            <span class="bulk-member-name">${escapeHtml(s.name)}</span>

    showModal(`
      <h3>Strafen hinzufügen</h3>
      <label for="bulk-fine-select">Strafe oder Spiel</label>
      <select id="bulk-fine-select">
        ${catalog.length>0 ? `<optgroup label="Strafen">${fineOptionsHtml}</optgroup>` : ''}

      </select>

      <div class="bulk-quick-select-row">
        <button type="button" class="btn-secondary bulk-quick-btn" id="bulk-select-saal-btn">Saal</button>
        <button type="button" class="btn-secondary bulk-quick-btn" id="bulk-select-kneipe-btn">Kneipe</button>
      </div>
      <div id="bulk-members-list">${memberRowsHtml}</div>
      <p class="form-error" id="bulk-fine-form-error"></p>
      <div class="confirm-row-buttons">
        <button type="button" class="btn-primary" id="bulk-add-confirm-btn">Hinzufügen</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    const selectEl = document.getElementById('bulk-fine-select');
    function updateAmountVisibility(){
      const isGame = selectEl.value.startsWith('game:');
      document.querySelectorAll('.bulk-member-amount').forEach(inp=>{ inp.style.display = isGame ? '' : 'none'; });
    }
    selectEl.addEventListener('change', updateAmountVisibility);
    updateAmountVisibility();

    document.getElementById('bulk-select-saal-btn').addEventListener('click', ()=>{
      document.querySelectorAll('.bulk-member-checkbox').forEach(cb=>{
        cb.checked = cb.dataset.seatId.startsWith('saal-');
      });
    });
    document.getElementById('bulk-select-kneipe-btn').addEventListener('click', ()=>{
      document.querySelectorAll('.bulk-member-checkbox').forEach(cb=>{
        cb.checked = cb.dataset.seatId.startsWith('kneipe-');
      });
    });
    document.querySelectorAll('.bulk-member-amount').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        if(inp.value.trim()!==''){
          const row = inp.closest('.bulk-member-row');
          const cb = row ? row.querySelector('.bulk-member-checkbox') : null;
          if(cb) cb.checked = true;
        }
      });
    });

    document.getElementById('bulk-add-confirm-btn').addEventListener('click', async ()=>{
      const errEl = document.getElementById('bulk-fine-form-error');
      const [kind, refId] = selectEl.value.split(':');
      const checkedBoxes = Array.from(document.querySelectorAll('.bulk-member-checkbox:checked'));
      if(checkedBoxes.length===0){ if(errEl) errEl.textContent='Bitte mindestens ein Mitglied auswählen.'; return; }

      if(kind==='fine'){
        checkedBoxes.forEach(cb=>{
          const seatId = cb.dataset.seatId;
          if(!detail.finesBySeat) detail.finesBySeat = {};
          if(!detail.finesBySeat[seatId]) detail.finesBySeat[seatId] = {};
          detail.finesBySeat[seatId][refId] = (detail.finesBySeat[seatId][refId]||0) + 1;
        });
      }else{
        const game = games.find(g=>g.id===refId);
        const entries = [];
        for(const cb of checkedBoxes){
          const row = cb.closest('.bulk-member-row');
          const amountInput = row.querySelector('.bulk-member-amount');
          const amount = parseFloat((amountInput.value||'').replace(',','.'));
          if(isNaN(amount) || amount<0){
            if(errEl) errEl.textContent = 'Bitte für jedes ausgewählte Mitglied einen gültigen Betrag angeben.';
            return;
          }
          entries.push({seatId: cb.dataset.seatId, amount: Math.round(amount*100)/100});
        }
        entries.forEach(({seatId, amount})=>{
          if(!detail.adHocFinesBySeat) detail.adHocFinesBySeat = {};
          if(!detail.adHocFinesBySeat[seatId]) detail.adHocFinesBySeat[seatId] = [];
          detail.adHocFinesBySeat[seatId].push({id:uid('adhoc'), name:game.name, amount});
        });
      }
      const confirmBtn = document.getElementById('bulk-add-confirm-btn');
      confirmBtn.disabled = true; confirmBtn.textContent = 'Wird gespeichert…';
      await saveEveningDetail(detail);
      closeGenericModal();
      render();
    });
  }

  function buildSeatingSVG(detail){
    const W = 760, H = 1020;
    const tableTopY = 130, tableBottomY = 970;
    const topLX = 230, topRX = 530, botLX = 300, botRX = 460;
    const chairW = 188, chairH = 122, outward = 128, n = 6;

    const bySeatId = {};
    detail.seating.forEach(s=>{ bySeatId[s.seatId] = s; });
    const crownSeatIds = computePudelCrownSeatIds(detail);

    function edge(side, t){
      const topX = side==='left' ? topLX : topRX;
      const botX = side==='left' ? botLX : botRX;
      return { x: topX + t*(botX-topX), y: tableTopY + t*(tableBottomY-tableTopY) };
    }

    function chairGroup(seatId, side, idx){
      const t = (idx+0.5)/n;
      const e = edge(side, t);
      const cx = side==='left' ? e.x - outward : e.x + outward;
      const cy = e.y;
      const rectX = cx - chairW/2, rectY = cy - chairH/2;
      const seat = bySeatId[seatId] || { name:null, isGuest:false };
      const empty = !seat.name;
      const shortLabel = seatId.startsWith('saal') ? 'S'+seatId.split('-')[1] : 'K'+seatId.split('-')[1];
      const tickX2 = side==='left' ? rectX+chairW : rectX;
      const nameRaw = empty ? '— frei —' : seat.name;
      const fontSize = nameRaw.length>10 ? 21 : 25;
      const plateWidth = chairW-20;
      const availW = plateWidth-10;
      const estW = nameRaw.length * fontSize * 0.56;
      const textLenAttr = estW>availW ? ` textLength="${availW}" lengthAdjust="spacingAndGlyphs"` : '';
      const plateCenterY = cy+12;
      const clickable = !empty;
      const hasCrown = !empty && crownSeatIds.has(seat.seatId);
      const crownCx = cx+plateWidth/2, crownCy = plateCenterY-20;
      const crownBadgeHtml = hasCrown ? `
        <g class="pudel-crown-badge">
          <circle cx="${crownCx}" cy="${crownCy}" r="14" />
          <path transform="translate(${crownCx-9},${crownCy-9}) scale(0.75)" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5L3 8z"/>
        </g>
      ` : '';
      const invalidBadgeCx = crownCx - (hasCrown ? 34 : 0);
      const invalidBadgeHtml = (!empty && seat.invalid) ? `
        <g class="invalid-seat-badge">
          <circle cx="${invalidBadgeCx}" cy="${crownCy}" r="14"/>
          <line x1="${invalidBadgeCx-6}" y1="${crownCy-6}" x2="${invalidBadgeCx+6}" y2="${crownCy+6}" stroke-linecap="round" stroke-width="2.6" stroke="#fff"/>
          <line x1="${invalidBadgeCx+6}" y1="${crownCy-6}" x2="${invalidBadgeCx-6}" y2="${crownCy+6}" stroke-linecap="round" stroke-width="2.6" stroke="#fff"/>
        </g>
      ` : '';
      const sfText = 'SCHRIFTFÜHRER';
      const sfMaxW = chairW-16;
      const sfEstW = sfText.length * 15 * 0.56;
      const sfTextLenAttr = sfEstW>sfMaxW ? ` textLength="${sfMaxW}" lengthAdjust="spacingAndGlyphs"` : '';
      return `<g class="reveal-group${clickable?' chair-clickable':''}" style="animation-delay:${idx*45}ms"${clickable?` data-member-name="${escapeHtml(seat.name)}" data-seat-id="${seat.seatId}"`:''}>
        <line class="chair-tick" x1="${e.x}" y1="${e.y}" x2="${tickX2}" y2="${cy}" />
        <rect class="chair-body${empty?' empty':''}" x="${rectX}" y="${rectY}" width="${chairW}" height="${chairH}" rx="16" />
        <text class="seat-label-text${empty?' empty':''}" x="${cx}" y="${rectY+29}" text-anchor="middle">${shortLabel}</text>
        <rect class="name-plate-rect" x="${cx-plateWidth/2}" y="${plateCenterY-20}" width="${plateWidth}" height="40" rx="6" />
        <text class="name-plate-text${empty?' empty-text':''}" x="${cx}" y="${plateCenterY+9}" text-anchor="middle" font-size="${fontSize}"${textLenAttr}>${escapeHtml(nameRaw)}</text>
        ${(!empty && seat.isGuest) ? `<text class="guest-tag-text" x="${cx}" y="${rectY+chairH-11}" text-anchor="middle">GAST</text>` : ''}
        ${(!empty && seat.isSchriftfuehrer) ? `<text class="guest-tag-text" x="${cx}" y="${rectY+chairH-11}" text-anchor="middle"${sfTextLenAttr}>${sfText}</text>` : ''}
        ${crownBadgeHtml}
        ${invalidBadgeHtml}
      </g>`;
    }

    let chairsHtml = '';
    for(let i=0;i<n;i++) chairsHtml += chairGroup('saal-'+(i+1), 'left', i);
    for(let i=0;i<n;i++) chairsHtml += chairGroup('kneipe-'+(i+1), 'right', i);

    const tablePath = `M${topLX},${tableTopY} L${topRX},${tableTopY} L${botRX},${tableBottomY} L${botLX},${tableBottomY} Z`;

    return `<svg class="seating-diagram" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sitzplan des Kegelabends">
      <path class="table-shape" d="${tablePath}" />
      <line class="lane-center-line" x1="${W/2}" y1="${tableTopY+15}" x2="${W/2}" y2="${tableBottomY-15}" />
      <text class="lane-label-text" x="${W/2}" y="100" text-anchor="middle">Kegelbahn</text>
      <text class="side-label-text" x="115" y="55" text-anchor="middle">Saal</text>
      <text class="side-label-text" x="${W-115}" y="55" text-anchor="middle">Kneipe</text>
      ${chairsHtml}
    </svg>`;
  }

  function viewDetail(detail){
    if(!detail) return `<p class="empty-state">Konnte diesen Abend nicht laden.</p>`;
    if(state.eveningTab==='strafen'){
      return `
        ${state.justCreated ? `<p class="hint">Die Sitzordnung wurde zufällig ausgelost und gespeichert. Sie kann nicht mehr geändert werden.</p>` : ''}

    }
    if(state.eveningTab==='notizen'){
      return `
        <div class="card">
          <h2 class="section-title">Notizen</h2>
          <textarea id="evening-notes-textarea" class="notes-textarea${detail.closed?' notes-readonly':''}" placeholder="Notizen zum Kegelabend…"${detail.closed?' readonly':''}>${escapeHtml(detail.notes||'')}</textarea>

      `;

      <div class="card">

  // Eigenständige Fehleransicht mit "Erneut versuchen"-Button - für Fälle, in denen eine
  // Firestore-Anfrage in ein Timeout gelaufen ist. Header/Bottom-Nav bleiben nutzbar.
  function renderError(message, retryFn){
    const app = document.getElementById('app');
    app.innerHTML = headerHtml() + `<main class="container">
      <div class="card" style="text-align:center;">
        <p class="form-error" style="margin-bottom:14px;">${escapeHtml(message)}</p>
        <button type="button" class="btn-primary" id="error-retry-btn">Erneut versuchen</button>
      </div>
    </main>` + bottomNavHtml();
    attachGlobalNavListeners();
    const btn = document.getElementById('error-retry-btn');
    if(btn) btn.addEventListener('click', retryFn);
  }

  function attachMainListeners(){
    const newBtn = document.getElementById('new-evening-btn');
    if(newBtn) newBtn.addEventListener('click', goToNew);
    const ownArrearsPayLink = document.getElementById('own-arrears-pay-link');
    if(ownArrearsPayLink){
      ownArrearsPayLink.addEventListener('click', ()=>{
        const amount = parseFloat(ownArrearsPayLink.dataset.amount);
        window.open(buildPaypalLink(amount), '_blank');
      });
    }
    const nextEventCard = document.getElementById('next-event-card');
    if(nextEventCard){
      nextEventCard.addEventListener('click', async ()=>{
        const occurrence = findOccurrenceByIds(nextEventCard.dataset.seriesId, nextEventCard.dataset.occurrenceDate);
        if(!occurrence) return;
        try{ state.calendarRsvps = await getJSONOrThrow('calendar-rsvps', state.calendarRsvps); }catch(e){}
        goToEventDetail(occurrence, 'main');
      });
    }
    document.querySelectorAll('.year-header').forEach(header=>{
      header.addEventListener('click', ()=>{
        const group = header.closest('.year-group');
        if(!group) return;
        const year = group.dataset.year;
        const isExpanded = group.classList.toggle('expanded');
        if(isExpanded) state.expandedYears.add(year); else state.expandedYears.delete(year);
      });
    });
    document.querySelectorAll('.evening-row').forEach(row=>{
      row.addEventListener('click', ()=> openEveningDetail(row.dataset.id));
    });
  }

  async function openEveningDetail(id){
    renderLoading('Kegelabend wird geladen…');
    try{
      const detail = await getJSONOrThrow('evening-'+id, null);
      if(!detail){
        state.mainError = 'Konnte diesen Abend nicht laden.';
        state.view = 'main';
        render();
        return;
      }
      state.currentEveningDetail = detail;
      state.justCreated = false;
      state.confirmDeleteEveningId = null;
      state.mainError = '';
      state.eveningTab = 'sitzplan';
      state.view = 'detail';
      render();
    }catch(e){
      renderError('Verbindung fehlgeschlagen. Bitte prüfe deine Internetverbindung.', ()=>openEveningDetail(id));
    }
  }

  function attachMemberDetailListeners(){
    const member = state.members.find(m=>m.id===state.currentMemberId);

    const overflowBtn = document.getElementById('header-member-overflow-btn');

    if(overflowBtn && overflowMenu){
