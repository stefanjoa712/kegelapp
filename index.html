  // Zeichnet den Sitzplan eines KONKRETEN Kegelabends. Nutzt IMMER das zum Erstellungszeitpunkt
  // des Abends gespeicherte Template (detail.seatingTemplateId, siehe getEveningSeatingTemplate())
  // - ändert der Club das Template später, bleibt die Darstellung bestehender Abende bewusst
  // unverändert (siehe Anforderung "alte Abende bleiben unverändert").
  function buildSeatingSVG(detail){
    const template = getEveningSeatingTemplate(detail);
    const n = template.perSide;
    const sideNames = getEveningSideNames(detail);
    const shortLabels = getEveningShortLabels(detail);
    const bySeatId = {};
    detail.seating.forEach(s=>{ bySeatId[s.seatId] = s; });
    const crownSeatIds = computePudelCrownSeatIds(detail);

    // 'rund' bekommt eine komplett eigene, kreisförmige Geometrie (echter Kreistisch statt nur
    // gewölbter Längsseiten an zwei geraden Sitzreihen) - siehe buildRoundSeatingSVG(). Trapez
    // und Rechteck behalten die ursprüngliche Zwei-Reihen-Geometrie unterhalb.
    if(template.shape==='rund'){
      return buildRoundSeatingSVG(detail, template, sideNames, shortLabels, bySeatId, crownSeatIds);
    }

    // Grundmaße wie ursprünglich bei n=6 kalibriert (chairH=122 + Row-Abstand ergibt ca. 140px
    // pro Platz) - bei anderem n wird die Tischlänge (tableBottomY-tableTopY) proportional
    // mitskaliert, damit der Row-Abstand und damit die Stuhlgröße gleich bleiben, statt bei
    // z.B. 7 Plätzen zu eng zusammengequetscht zu werden.
    const rowSpacing = 140;
    const tableTopY = 130;
    const tableBottomY = tableTopY + n*rowSpacing;
    const W = 760, H = tableBottomY + 50;
    // Trapezform (zur Kegelbahn hin verjüngend, wie ursprünglich) vs. rechteckige Form (parallele
    // Kanten).
    const topLX = 230, topRX = 530;
    const botLX = template.shape==='trapez' ? 300 : topLX;
    const botRX = template.shape==='trapez' ? 460 : topRX;
    const chairW = 188, chairH = 122, outward = 128;

    function edge(side, t){
      const topX = side==='left' ? topLX : topRX;
      const botX = side==='left' ? botLX : botRX;
      return { x: topX + t*(botX-topX), y: tableTopY + t*(tableBottomY-tableTopY) };
    }

    function chairGroup(seatId, side, idx){
      const t = (idx+0.5)/n;
      const e = edge(side, t);
      const cx = side==='left' ? e.x - outward : e.x + outward;
      const cy = e.y;
      const rectX = cx - chairW/2, rectY = cy - chairH/2;
      const seat = bySeatId[seatId] || { name:null, isGuest:false };
      const empty = !seat.name;
      const shortLabel = (seatId.startsWith('saal') ? shortLabels.left : shortLabels.right) + seatId.split('-')[1];
      const tickX2 = side==='left' ? rectX+chairW : rectX;
      const nameRaw = empty ? '— frei —' : seat.name;
      const fontSize = nameRaw.length>10 ? 21 : 25;
      const plateWidth = chairW-20;
      const availW = plateWidth-10;
      const estW = nameRaw.length * fontSize * 0.56;
      const textLenAttr = estW>availW ? ` textLength="${availW}" lengthAdjust="spacingAndGlyphs"` : '';
      const plateCenterY = cy+12;
      const clickable = !empty;
      const hasCrown = !empty && crownSeatIds.has(seat.seatId);
      const crownCx = cx+plateWidth/2, crownCy = plateCenterY-20;
      const crownBadgeHtml = hasCrown ? `
        <g class="pudel-crown-badge">
          <circle cx="${crownCx}" cy="${crownCy}" r="14" />
          <path transform="translate(${crownCx-9},${crownCy-9}) scale(0.75)" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5L3 8z"/>
        </g>
      ` : '';
      const invalidBadgeCx = crownCx - (hasCrown ? 34 : 0);
      const invalidBadgeHtml = (!empty && seat.invalid) ? `
        <g class="invalid-seat-badge">
          <circle cx="${invalidBadgeCx}" cy="${crownCy}" r="14"/>
          <line x1="${invalidBadgeCx-6}" y1="${crownCy-6}" x2="${invalidBadgeCx+6}" y2="${crownCy+6}" stroke-linecap="round" stroke-width="2.6" stroke="#fff"/>
          <line x1="${invalidBadgeCx+6}" y1="${crownCy-6}" x2="${invalidBadgeCx-6}" y2="${crownCy+6}" stroke-linecap="round" stroke-width="2.6" stroke="#fff"/>
        </g>
      ` : '';
      const sfText = 'SCHRIFTFÜHRER';
      const sfMaxW = chairW-16;
      const sfEstW = sfText.length * 15 * 0.56;
      const sfTextLenAttr = sfEstW>sfMaxW ? ` textLength="${sfMaxW}" lengthAdjust="spacingAndGlyphs"` : '';
      return `<g class="reveal-group${clickable?' chair-clickable':''}" style="animation-delay:${idx*45}ms"${clickable?` data-member-name="${escapeHtml(seat.name)}" data-seat-id="${seat.seatId}"`:''}>
        <line class="chair-tick" x1="${e.x}" y1="${e.y}" x2="${tickX2}" y2="${cy}" />
        <rect class="chair-body${empty?' empty':''}" x="${rectX}" y="${rectY}" width="${chairW}" height="${chairH}" rx="16" />
        <text class="seat-label-text${empty?' empty':''}" x="${cx}" y="${rectY+29}" text-anchor="middle">${shortLabel}</text>
        <rect class="name-plate-rect" x="${cx-plateWidth/2}" y="${plateCenterY-20}" width="${plateWidth}" height="40" rx="6" />
        <text class="name-plate-text${empty?' empty-text':''}" x="${cx}" y="${plateCenterY+9}" text-anchor="middle" font-size="${fontSize}"${textLenAttr}>${escapeHtml(nameRaw)}</text>
        ${(!empty && seat.isGuest) ? `<text class="guest-tag-text" x="${cx}" y="${rectY+chairH-11}" text-anchor="middle">GAST</text>` : ''}
        ${(!empty && seat.isSchriftfuehrer) ? `<text class="guest-tag-text" x="${cx}" y="${rectY+chairH-11}" text-anchor="middle"${sfTextLenAttr}>${sfText}</text>` : ''}
        ${crownBadgeHtml}
        ${invalidBadgeHtml}
      </g>`;
    }

    let chairsHtml = '';
    for(let i=0;i<n;i++) chairsHtml += chairGroup('saal-'+(i+1), 'left', i);
    for(let i=0;i<n;i++) chairsHtml += chairGroup('kneipe-'+(i+1), 'right', i);

    const tablePath = `M${topLX},${tableTopY} L${topRX},${tableTopY} L${botRX},${tableBottomY} L${botLX},${tableBottomY} Z`;

    return `<svg class="seating-diagram" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sitzplan des Kegelabends">
      <path class="table-shape" d="${tablePath}" />
      <line class="lane-center-line" x1="${W/2}" y1="${tableTopY+15}" x2="${W/2}" y2="${tableBottomY-15}" />
      <text class="lane-label-text" x="${W/2}" y="100" text-anchor="middle">Kegelbahn</text>
      <text class="side-label-text" x="115" y="55" text-anchor="middle">${escapeHtml(sideNames.left)}</text>
      <text class="side-label-text" x="${W-115}" y="55" text-anchor="middle">${escapeHtml(sideNames.right)}</text>
      ${chairsHtml}
    </svg>`;
  }

  // Zeichnet den Sitzplan eines KONKRETEN Kegelabends mit rundem Tisch (Kreis statt Trapez/
  // Rechteck): die Plätze verteilen sich gleichmäßig über den jeweiligen Halbkreis (links/rechts
  // der vertikalen Kegelbahn-Achse), mit einer bewussten Lücke oben UND unten auf der Achse -
  // dadurch liegt nie ein Platz exakt auf der Grenze zwischen "links" und "rechts" (siehe
  // Anforderung "kein Platz genau mittig auf der Seitengrenze"). idx=0 ist der Platz am nächsten
  // zur Kegelbahn (oben), höhere idx wandern im Kreisbogen nach unten - analog zur bisherigen
  // Zählweise bei Trapez/Rechteck (dort war idx=0 ebenfalls die Reihe am nächsten zur Bahn).
  function buildRoundSeatingSVG(detail, template, sideNames, shortLabels, bySeatId, crownSeatIds){
    const n = template.perSide;
    // Maximale Gesamtbreite des SVG ist 760px (gleich wie Trapez/Rechteck). Der Kreis muss
    // mit seinen Stühlen darin passen. Stuhlbreite + outward bestimmen den Platzbedarf seitlich.
    // Wir berechnen R so, dass Gesamtbreite (2*(R+outward+chairW/2+sideMargin)) <= 740 bleibt.
    // Zusätzlich wächst R leicht mit n für mehr Bogenlänge, wird aber nach oben begrenzt.
    const chairW = 160, chairH = 104;
    const outward = 26;
    const sideMargin = 90; // Platz für Seitenbezeichnungen links/rechts außen
    // R: wächst mit n, aber maximal so groß, dass alles in 760px Breite passt.
    const maxR = Math.floor((760 - 2*(chairW/2 + outward + sideMargin)) / 2);
    const targetR = 170 + (n-2)*36;
    const R = Math.min(targetR, maxR);
    const cx0 = 380, cy0 = R + 160;
    const W = 760, H = cy0 + R + chairH/2 + 60;

    // Jede Seite bekommt einen Winkelbereich von gapDeg bis (180°-gapDeg), gemessen von der
    // oberen Achse (0° = senkrecht nach oben Richtung Kegelbahn) im Uhrzeigersinn für rechts,
    // gegen den Uhrzeigersinn für links - so bleibt an der 0°/180°-Achse (oben UND unten) bewusst
    // eine Lücke, statt dass ein Platz dort exakt mittig sitzt.
    const gapDeg = 14;
    function seatAngleDeg(idx){
      const span = 180 - 2*gapDeg;
      return gapDeg + (idx+0.5)/n * span;
    }
    function pointOnCircle(angleDeg, side, radius){
      const rad = angleDeg * Math.PI/180;
      const dy = -Math.cos(rad) * radius;
      const dx = Math.sin(rad) * radius * (side==='left' ? -1 : 1);
      return { x: cx0+dx, y: cy0+dy };
    }

    // Seitenbezeichnungen: auf Höhe cy0, aber weit genug außen, damit sie nicht mit den
    // seitlichsten Stühlen (Winkel ~90°, also direkt auf Höhe cy0) kollidieren.
    // Der äußerste Punkt eines Stuhls liegt bei R + outward + chairW/2 vom Kreismittelpunkt.
    const sideTextX = R + outward + chairW/2 + 18;

    function chairGroup(seatId, side, idx){
      const angle = seatAngleDeg(idx);
      const edgePoint = pointOnCircle(angle, side, R);
      const seatPoint = pointOnCircle(angle, side, R+outward);
      const cx = seatPoint.x, cy = seatPoint.y;
      const rectX = cx - chairW/2, rectY = cy - chairH/2;
      const seat = bySeatId[seatId] || { name:null, isGuest:false };
      const empty = !seat.name;
      const shortLabel = (seatId.startsWith('saal') ? shortLabels.left : shortLabels.right) + seatId.split('-')[1];
      const nameRaw = empty ? '— frei —' : seat.name;
      const fontSize = nameRaw.length>10 ? 19 : 22;
      const plateWidth = chairW-16;
      const availW = plateWidth-10;
      const estW = nameRaw.length * fontSize * 0.56;
      const textLenAttr = estW>availW ? ` textLength="${availW}" lengthAdjust="spacingAndGlyphs"` : '';
      const plateCenterY = cy+8;
      const clickable = !empty;
      const hasCrown = !empty && crownSeatIds.has(seat.seatId);
      const crownCx = cx+plateWidth/2, crownCy = plateCenterY-18;
      const crownBadgeHtml = hasCrown ? `
        <g class="pudel-crown-badge">
          <circle cx="${crownCx}" cy="${crownCy}" r="13" />
          <path transform="translate(${crownCx-8.4},${crownCy-8.4}) scale(0.7)" d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5L3 8z"/>
        </g>
      ` : '';
      const invalidBadgeCx = crownCx - (hasCrown ? 32 : 0);
      const invalidBadgeHtml = (!empty && seat.invalid) ? `
        <g class="invalid-seat-badge">
          <circle cx="${invalidBadgeCx}" cy="${crownCy}" r="13"/>
          <line x1="${invalidBadgeCx-5.5}" y1="${crownCy-5.5}" x2="${invalidBadgeCx+5.5}" y2="${crownCy+5.5}" stroke-linecap="round" stroke-width="2.4" stroke="#fff"/>
          <line x1="${invalidBadgeCx+5.5}" y1="${crownCy-5.5}" x2="${invalidBadgeCx-5.5}" y2="${crownCy+5.5}" stroke-linecap="round" stroke-width="2.4" stroke="#fff"/>
        </g>
      ` : '';
      const sfText = 'SCHRIFTFÜHRER';
      const sfMaxW = chairW-14;
      const sfEstW = sfText.length * 13 * 0.56;
      const sfTextLenAttr = sfEstW>sfMaxW ? ` textLength="${sfMaxW}" lengthAdjust="spacingAndGlyphs"` : '';
      return `<g class="reveal-group${clickable?' chair-clickable':''}" style="animation-delay:${idx*45}ms"${clickable?` data-member-name="${escapeHtml(seat.name)}" data-seat-id="${seat.seatId}"`:''}>
        <line class="chair-tick" x1="${edgePoint.x}" y1="${edgePoint.y}" x2="${cx}" y2="${cy}" />
        <rect class="chair-body${empty?' empty':''}" x="${rectX}" y="${rectY}" width="${chairW}" height="${chairH}" rx="15" />
        <text class="seat-label-text${empty?' empty':''}" x="${cx}" y="${rectY+26}" text-anchor="middle">${shortLabel}</text>
        <rect class="name-plate-rect" x="${cx-plateWidth/2}" y="${plateCenterY-18}" width="${plateWidth}" height="36" rx="6" />
        <text class="name-plate-text${empty?' empty-text':''}" x="${cx}" y="${plateCenterY+8}" text-anchor="middle" font-size="${fontSize}"${textLenAttr}>${escapeHtml(nameRaw)}</text>
        ${(!empty && seat.isGuest) ? `<text class="guest-tag-text" x="${cx}" y="${rectY+chairH-9}" text-anchor="middle">GAST</text>` : ''}
        ${(!empty && seat.isSchriftfuehrer) ? `<text class="guest-tag-text" x="${cx}" y="${rectY+chairH-9}" text-anchor="middle"${sfTextLenAttr}>${sfText}</text>` : ''}
        ${crownBadgeHtml}
        ${invalidBadgeHtml}
      </g>`;
    }

    let chairsHtml = '';
    for(let i=0;i<n;i++) chairsHtml += chairGroup('saal-'+(i+1), 'left', i);
    for(let i=0;i<n;i++) chairsHtml += chairGroup('kneipe-'+(i+1), 'right', i);

    return `<svg class="seating-diagram" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sitzplan des Kegelabends">
      <circle class="table-shape" cx="${cx0}" cy="${cy0}" r="${R}" />
      <line class="lane-center-line" x1="${cx0}" y1="${cy0-R-40}" x2="${cx0}" y2="${cy0+R}" />
      <text class="lane-label-text" x="${cx0}" y="${cy0-R-55}" text-anchor="middle">Kegelbahn</text>
      <text class="side-label-text" x="${cx0-sideTextX}" y="${cy0}" text-anchor="middle">${escapeHtml(sideNames.left)}</text>
      <text class="side-label-text" x="${cx0+sideTextX}" y="${cy0}" text-anchor="middle">${escapeHtml(sideNames.right)}</text>
      ${chairsHtml}
    </svg>`;
  }

  // Vereinfachte, nicht-interaktive Vorschau eines Sitzplan-Templates für die Clubverwaltung:
  // zeigt nur die Tischform und die Platzkürzel (kein Name, kein Klick, keine Badges) - reine
  // Live-Vorschau bei Auswahl im Template-Dropdown, unabhängig von einem konkreten Kegelabend.
  function buildPreviewSeatingSVG(template){
    // 'rund' bekommt dieselbe kreisförmige Geometrie wie buildRoundSeatingSVG() (nur ohne Namen,
    // Klick-Handler und Badges) - siehe buildRoundPreviewSeatingSVG().
    if(template.shape==='rund'){
      return buildRoundPreviewSeatingSVG(template);
    }
    const n = template.perSide;
    const rowSpacing = 84;
    const tableTopY = 70;
    const tableBottomY = tableTopY + n*rowSpacing;
    const W = 460, H = tableBottomY + 30;
    const topLX = 140, topRX = 320;
    const botLX = template.shape==='trapez' ? 175 : topLX;
    const botRX = template.shape==='trapez' ? 285 : topRX;
    const chairW = 112, chairH = 72, outward = 76;

    const sideNames = getSeatingSideNames();
    const shortLabels = getSeatingShortLabels();

    function edge(side, t){
      const topX = side==='left' ? topLX : topRX;
      const botX = side==='left' ? botLX : botRX;
      return { x: topX + t*(botX-topX), y: tableTopY + t*(tableBottomY-tableTopY) };
    }

    function chairGroup(side, idx, sidePrefixLabel){
      const t = (idx+0.5)/n;
      const e = edge(side, t);
      const cx = side==='left' ? e.x - outward : e.x + outward;
      const cy = e.y;
      const rectX = cx - chairW/2, rectY = cy - chairH/2;
      const shortLabel = sidePrefixLabel + (idx+1);
      return `<g>
        <rect class="chair-body empty" x="${rectX}" y="${rectY}" width="${chairW}" height="${chairH}" rx="10" />
        <text class="seat-label-text empty" x="${cx}" y="${cy+6}" text-anchor="middle" font-size="18">${shortLabel}</text>
      </g>`;
    }

    let chairsHtml = '';
    for(let i=0;i<n;i++) chairsHtml += chairGroup('left', i, shortLabels.left);
    for(let i=0;i<n;i++) chairsHtml += chairGroup('right', i, shortLabels.right);

    const tablePath = `M${topLX},${tableTopY} L${topRX},${tableTopY} L${botRX},${tableBottomY} L${botLX},${tableBottomY} Z`;

    return `<svg class="seating-diagram seating-diagram-preview" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vorschau des Sitzplans">
      <path class="table-shape" d="${tablePath}" />
      <line class="lane-center-line" x1="${W/2}" y1="${tableTopY+10}" x2="${W/2}" y2="${tableBottomY-10}" />
      ${chairsHtml}
    </svg>`;
  }

  // Kreisförmige Vorschau-Variante für Rundtisch-Templates (analog zu buildRoundSeatingSVG(),
  // aber vereinfacht wie buildPreviewSeatingSVG(): keine Namen, kein Klick, keine Badges - nur
  // Tischform und Platzkürzel). Nutzt dieselbe Winkel-Logik (Lücke oben UND unten auf der
  // Kegelbahn-Achse), damit die Vorschau exakt der späteren echten Sitzplan-Zeichnung entspricht.
  function buildRoundPreviewSeatingSVG(template){
    const n = template.perSide;
    const chairW = 100, chairH = 64;
    const outward = 16;
    const sideMargin = 10; // Preview hat keine Seitenbezeichnungen, nur minimaler Rand
    const maxR = Math.floor((460 - 2*(chairW/2 + outward + sideMargin)) / 2);
    const targetR = 100 + (n-2)*24;
    const R = Math.min(targetR, maxR);
    const cx0 = 230, cy0 = R + 90;
    const W = 460, H = cy0 + R + chairH/2 + 40;
    const gapDeg = 14;

    const shortLabels = getSeatingShortLabels();

    function seatAngleDeg(idx){
      const span = 180 - 2*gapDeg;
      return gapDeg + (idx+0.5)/n * span;
    }
    function pointOnCircle(angleDeg, side, radius){
      const rad = angleDeg * Math.PI/180;
      const dy = -Math.cos(rad) * radius;
      const dx = Math.sin(rad) * radius * (side==='left' ? -1 : 1);
      return { x: cx0+dx, y: cy0+dy };
    }

    function chairGroup(side, idx, sidePrefixLabel){
      const angle = seatAngleDeg(idx);
      const seatPoint = pointOnCircle(angle, side, R+outward);
      const cx = seatPoint.x, cy = seatPoint.y;
      const rectX = cx - chairW/2, rectY = cy - chairH/2;
      const shortLabel = sidePrefixLabel + (idx+1);
      return `<g>
        <rect class="chair-body empty" x="${rectX}" y="${rectY}" width="${chairW}" height="${chairH}" rx="10" />
        <text class="seat-label-text empty" x="${cx}" y="${cy+6}" text-anchor="middle" font-size="16">${shortLabel}</text>
      </g>`;
    }

    let chairsHtml = '';
    for(let i=0;i<n;i++) chairsHtml += chairGroup('left', i, shortLabels.left);
    for(let i=0;i<n;i++) chairsHtml += chairGroup('right', i, shortLabels.right);

    return `<svg class="seating-diagram seating-diagram-preview" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vorschau des Sitzplans">
      <circle class="table-shape" cx="${cx0}" cy="${cy0}" r="${R}" />
      <line class="lane-center-line" x1="${cx0}" y1="${cy0-R-20}" x2="${cx0}" y2="${cy0+R}" />
      ${chairsHtml}
    </svg>`;
  }

            <button type="button" class="btn-secondary" id="confirm-delete-evening-no">Abbrechen</button>
          </div>
        </div>
      </div>

  }

    else if(state.view==='settings') title = 'Mitgliederverwaltung';
    else if(state.view==='memberDetail') title = state.currentMemberId ? 'Mitglied bearbeiten' : 'Neues Mitglied';
    else if(state.view==='finesManagement') title = 'Strafenverwaltung';
    else if(state.view==='fineDetail') title = state.currentFineId ? 'Strafe bearbeiten' : 'Strafe hinzufügen';
    else if(state.view==='gameDetail') title = state.currentGameId ? 'Spiel bearbeiten' : 'Spiel hinzufügen';
    else if(state.view==='gamesManagement') title = 'Spieleverwaltung';
    else if(state.view==='financeManagement') title = 'Finanzverwaltung';
    else if(state.view==='recurringDetail') title = state.currentRecurringId ? 'Buchung bearbeiten' : 'Monatliche Buchung hinzufügen';
    else if(state.view==='savingsPotDetail') title = state.currentSavingsPotId ? 'Spartopf bearbeiten' : 'Spartopf hinzufügen';
    else if(state.view==='financeAccountDetail') title = state.currentFinanceAccountId ? 'Konto bearbeiten' : 'Konto/Kasse hinzufügen';
    else if(state.view==='finance') title = 'Finanzen';
    else if(state.view==='calendar') title = 'Kalender';
    else if(state.view==='eventManagement') title = 'Terminverwaltung';
    else if(state.view==='eventDetail'){
      if(!state.calendarEditingOccurrence) title = 'Termin hinzufügen';
      else{
        const baseEv = state.calendarEvents.find(e=>e.id===state.calendarEditingOccurrence.seriesId);
        if(!isEventCreator(baseEv)) title = 'Termindetails';
        else title = state.calendarEditingOccurrence.isSeriesEdit ? 'Terminserie bearbeiten' : 'Termin bearbeiten';
      }
    }
    else if(state.view==='arrearsDetail') title = state.currentArrearsName ? `Rückstand von ${state.currentArrearsName}` : '';
    else if(state.view==='transactionDetail') title = state.currentTransactionId ? 'Umsatz bearbeiten' : 'Umsatz hinzufügen';
    else if(state.view==='new') title = 'Neuer Kegelabend';
    else if(state.view==='detail' && state.currentEveningDetail) title = `Kegelabend vom ${formatDateShortDE(state.currentEveningDetail.date)}`;
    else if(state.view==='personFineDetail') title = `Strafen von ${state.currentFineName || ''}`;

    const isClosed = !!(state.currentEveningDetail && state.currentEveningDetail.closed);
    // Bearbeitungsrecht für DIESEN Abend (siehe canEditEvening()) - separat von isClosed, da ein
    // bereits geschlossener Abend für ALLE gesperrt bleibt, während ein offener Abend nur für
    // Kassenwart/Admin/den benannten Schriftführer bearbeitbar ist.
    const canEditThisEvening = !isClosed && canEditEvening(state.currentEveningDetail);
    // Der Overflow-Button selbst soll nur erscheinen, wenn mindestens einer seiner Menüpunkte
    // tatsächlich sichtbar wäre - sonst öffnet er nur ein leeres Menü.
    const hasEveningOverflowItems = canEditThisEvening || canManageFinances();
    const detailHeaderExtrasHtml = state.view==='detail' ? `
      ${canEditThisEvening ? `
      <button type="button" class="header-circle-btn" id="header-bulk-add-btn" aria-label="Strafe hinzufügen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>` : ''}
      ${hasEveningOverflowItems ? `
      <div class="header-overflow-wrap">
        <button type="button" class="header-icon-btn" id="header-overflow-btn" aria-label="Weitere Optionen">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
        <div class="header-overflow-menu" id="header-overflow-menu" hidden>
          ${canEditThisEvening ? `<button type="button" class="header-overflow-item neutral" id="header-add-attendee-btn">Mitglied/Gast hinzufügen</button>` : ''}
          ${canManageFinances() ? (isClosed
            ? `<button type="button" class="header-overflow-item neutral" id="header-overflow-reopen-btn">Kegelabend wieder öffnen</button>`
            : `<button type="button" class="header-overflow-item neutral" id="header-overflow-close-btn">Kegelabend abschließen</button>`
          ) : ''}
          ${canManageFinances() ? `<button type="button" class="header-overflow-item" id="header-overflow-delete-btn">Kegelabend löschen</button>` : ''}
        </div>
      </div>
      ` : ''}
    ` : '';

    const settingsAddBtnConfig = {
      // Nur Admin/Kassenwart/Präsident dürfen neue Mitglieder anlegen (siehe canManageMembers()) -
      // für alle anderen wird der Button gar nicht erst gerendert, statt ihn nur zu deaktivieren.
      settings: canManageMembers() ? { id: 'header-add-member-btn', label: 'Mitglied hinzufügen' } : null,
      finesManagement: canManageMembers() ? { id: 'header-add-fine-catalog-btn', label: 'Strafe hinzufügen' } : null,
      gamesManagement: canManageMembers() ? { id: 'header-add-game-btn', label: 'Spiel hinzufügen' } : null,
      finance: canManageFinances() ? { id: 'header-add-transaction-btn', label: 'Umsatz hinzufügen' } : null,
      calendar: { id: 'header-add-event-btn', label: 'Termin hinzufügen' },
    }[state.view];
    const settingsAddBtnHtml = settingsAddBtnConfig ? `
      <button type="button" class="header-circle-btn" id="${settingsAddBtnConfig.id}" aria-label="${settingsAddBtnConfig.label}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    ` : '';

    const calTodayBtnHtml = state.view==='calendar' ? `
      <button type="button" class="header-today-btn" id="header-cal-today-btn" aria-label="Heute" title="Heute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="16" rx="2"/>
          <line x1="3" y1="9.5" x2="21" y2="9.5"/>
          <line x1="7.5" y1="2.5" x2="7.5" y2="6.5"/>
          <line x1="16.5" y1="2.5" x2="16.5" y2="6.5"/>
          <path d="M9.5 14l2.2 2.2L15.5 12" stroke-width="2.2"/>
        </svg>
      </button>

  // Deaktiviert nach jedem Render alle schreibenden Bedienelemente, wenn der Club im Read-Only-
  // Modus ist (abgelaufener Free-Zeitraum, subscription.accessBlocked - siehe readOnlyBannerHtml()
  // und firestore.rules/clubAccessBlocked()). Läuft bewusst NACH allen view-spezifischen
  // attachXyzListeners()-Aufrufen: deren eigene disabled-Logik (z.B. "Speichern nur bei
  // Änderung aktiv") bleibt für den Normalfall unangetastet, wird im Blocked-Fall aber
  // übersteuert. Rein clientseitiges UX (verhindert unnötige, dann ohnehin von den Firestore
  // Rules abgelehnte Schreibversuche) - die eigentliche Durchsetzung bleibt serverseitig.
  // Ausnahme: clubManagement/subscriptionPlans bleiben unangetastet, da dort weiterhin auf
  // "Premium" gewechselt werden können muss (siehe clubAccessBlocked() in firestore.rules).
  function applyReadOnlyLockToView(){
    if(state.view==='clubManagement' || state.view==='subscriptionPlans') return;
    const accessBlocked = !!(CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.subscription && CURRENT_CLUB_DATA.subscription.accessBlocked);
    if(!accessBlocked) return;
    document.querySelectorAll('#app .btn-primary').forEach(btn=>{ btn.disabled = true; });
    document.querySelectorAll('#app input, #app select, #app textarea').forEach(el=>{ el.disabled = true; });
    // Einzelne .btn-secondary-Elemente, die direkt schreiben (z.B. "Gegeben"-Markierung bei
    // Runden) - NICHT pauschal alle .btn-secondary, da darunter auch reine "Abbrechen"/
    // "Schließen"-Buttons in Modals sind, die weiterhin bedienbar bleiben müssen.
    document.querySelectorAll('#app .round-mark-given-btn').forEach(btn=>{ btn.disabled = true; });
    document.querySelectorAll('#app .round-undo-given-btn').forEach(btn=>{ btn.disabled = true; });
    // RSVP-Buttons (Zusage/Absage/Vielleicht zu Terminen) schreiben direkt über rsvpsStore.save(),
    // sind aber weder .btn-primary noch <input> - eigene Klasse, daher separat behandelt.
    document.querySelectorAll('#app .rsvp-btn').forEach(btn=>{ btn.disabled = true; });
    // Header-Overflow-Menü-Einträge (Löschen, Abschließen, Seite wechseln, ...) schreiben direkt
    // beim Klick, ohne über ein Formular mit .btn-primary zu laufen - pauschal gesperrt BIS AUF
    // zwei Ausnahmen: "Kalender abonnieren" schreibt nichts (reiner Link/Token-Abruf) und "Club
    // löschen" muss auch bei abgelaufenem Free-Zeitraum möglich bleiben, sonst gäbe es aus einem
    // blockierten Club keinen Ausweg mehr außer dem Wechsel auf Pro.
    document.querySelectorAll('#app .header-overflow-item').forEach(btn=>{
      if(btn.id==='header-cal-subscribe-btn' || btn.id==='header-delete-club-btn') return;
      btn.disabled = true;
    });
  }

  function attachClubManagementListeners(){
    const overflowBtn = document.getElementById('header-club-overflow-btn');
    const overflowMenu = document.getElementById('header-club-overflow-menu');
    if(overflowBtn && overflowMenu){
      overflowBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        overflowMenu.hidden = !overflowMenu.hidden;
      });
    }
    const deleteClubBtn = document.getElementById('header-delete-club-btn');
    if(deleteClubBtn) deleteClubBtn.addEventListener('click', ()=>{
      if(overflowMenu) overflowMenu.hidden = true;
      showDeleteClubModal();
    });

    const manageSubBtn = document.getElementById('manage-subscription-btn');
    if(manageSubBtn) manageSubBtn.addEventListener('click', ()=>guardClubManagementLeave(goToSubscriptionPlans));

    // Info-Popup für den Standardplatz Schriftführer - vor dem readOnly-Return angehängt,
    // damit die Erklärung auch für Nutzer ohne Bearbeitungsrechte verfügbar bleibt.
    const standardSeatInfoBtn = document.getElementById('standard-seat-info-btn');
    if(standardSeatInfoBtn) standardSeatInfoBtn.addEventListener('click', ()=>{
      showModal(`
        <h3>Standardplatz Schriftführer</h3>
        <p>Bei der Option „Standardplatz" beim Auslosen eines Kegelabends wird automatisch die Person auf diesem Platz Schriftführer.</p>
        <p>Ist dieser Platz beim jeweiligen Abend nicht besetzt (z. B. weil weniger Personen anwesend sind), wird stattdessen zufällig ein Mitglied als Schriftführer ausgelost.</p>
        <div class="confirm-row-buttons">
          <button type="button" class="btn-secondary" id="modal-cancel-btn" style="flex:1;">Schließen</button>
        </div>
      `);
      document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    });

    // Info-Popup für "Standard Sitzplan" - ebenfalls vor dem readOnly-Return angehängt.
    const seatingTemplateInfoBtn = document.getElementById('seating-template-info-btn');
    if(seatingTemplateInfoBtn) seatingTemplateInfoBtn.addEventListener('click', ()=>{
      showModal(`
        <h3>Standard Sitzplan</h3>
        <p>Gilt nur für neu angelegte Kegelabende. Bereits bestehende Abende behalten ihren ursprünglichen Sitzplan.</p>
        <div class="confirm-row-buttons">
          <button type="button" class="btn-secondary" id="modal-cancel-btn" style="flex:1;">Schließen</button>
        </div>
      `);
      document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    });

    const saveBtn = document.getElementById('save-club-btn');
    if(!saveBtn){
      // Read-Only-Nutzer sehen keinen Speichern-Button und können nichts ändern - die
      // ungespeichert-Prüfung beim Verlassen ist für sie daher gegenstandslos.
      clubMgmtDirtyCheck = null;
      return;
    }

    // Änderungs-Erkennung: Speichern-Button ist nur aktiv, wenn sich mind. ein Feld
    // gegenüber dem geladenen Stand unterscheidet. clubMgmtDirtyCheck ist eine modulweite
    // Referenz auf dieselbe Prüfung, damit guardClubManagementLeave() (siehe unten) beim
    // Verlassen der Seite unabhängig von diesem Closure darauf zugreifen kann.
    const clubFieldIds = ['club-name','club-founded','club-paypal','club-iban','club-account-holder','club-seating-left','club-seating-right','club-seating-template','club-standard-seat'];
    const initialClubValues = {};
    clubFieldIds.forEach(id=>{ const el = document.getElementById(id); if(el) initialClubValues[id] = el.value; });
    const isDirty = ()=> clubFieldIds.some(id=>{
      const el = document.getElementById(id);
      return el && el.value !== initialClubValues[id];
    });
    clubMgmtDirtyCheck = isDirty;
    const updateSaveBtnState = ()=>{
      saveBtn.disabled = !isDirty();
    };
    clubFieldIds.forEach(id=>{
      const el = document.getElementById(id);
      if(el) el.addEventListener('input', updateSaveBtnState);
    });

    // Live-Vorschau des Sitzplan-Templates: bei jeder Auswahländerung wird sowohl die
    // Vorschau-SVG als auch die Optionsliste des Standardplatz-Dropdowns neu aufgebaut (die
    // Anzahl und Bezeichnung der verfügbaren Plätze hängt vom gewählten Template ab). Der
    // Standardplatz wird dabei NICHT automatisch neu gewählt, außer der bisher gewählte Platz
    // existiert im neuen Template nicht mehr (z.B. Wechsel von 7 auf 5 Plätze pro Seite) - dann
    // fällt die Auswahl auf den ersten verfügbaren Platz zurück.
    const templateSelect = document.getElementById('club-seating-template');
    const previewContainer = document.getElementById('seating-template-preview');
    const standardSeatSelect = document.getElementById('club-standard-seat');
    if(templateSelect && previewContainer && standardSeatSelect){
      templateSelect.addEventListener('change', ()=>{
        const template = getSeatingTemplateById(templateSelect.value);
        previewContainer.innerHTML = buildPreviewSeatingSVG(template);
        const previousSelection = standardSeatSelect.value;
        const seatsForTemplate = buildSeats(template);
        const stillValid = seatsForTemplate.some(seat=>seat.id===previousSelection);
        standardSeatSelect.innerHTML = seatsForTemplate.map(seat=>
          `<option value="${escapeHtml(seat.id)}"${(stillValid ? seat.id===previousSelection : seat===seatsForTemplate[0])?' selected':''}>${escapeHtml(seat.label)}</option>`
        ).join('');
        updateSaveBtnState();
      });
    }

    saveBtn.addEventListener('click', async ()=>{
      const ok = await saveClubManagementForm();
      if(ok) render();
    });
  }

  // Kapselt die eigentliche Speicherlogik der Clubverwaltung, damit sie sowohl vom
  // Speichern-Button als auch vom "Ungespeicherte Änderungen"-Popup (siehe
  // guardClubManagementLeave()) aus aufgerufen werden kann. Gibt true bei Erfolg zurück,
  // false bei Validierungsfehler oder fehlgeschlagenem Speichern - der Aufrufer entscheidet
  // anhand des Rückgabewerts, ob die anschließende Navigation stattfinden darf.
  async function saveClubManagementForm(){
    const saveBtn = document.getElementById('save-club-btn');
    const errEl = document.getElementById('club-form-error');
    const name = document.getElementById('club-name').value.trim();
    const foundedOn = document.getElementById('club-founded').value;
    const paypalName = document.getElementById('club-paypal').value.trim();
    const iban = document.getElementById('club-iban').value.replace(/\s+/g,'').toUpperCase();
    const accountHolder = document.getElementById('club-account-holder').value.trim();
    const seatingLeft = document.getElementById('club-seating-left').value.trim() || DEFAULT_SEATING_SIDE_NAMES.left;
    const seatingRight = document.getElementById('club-seating-right').value.trim() || DEFAULT_SEATING_SIDE_NAMES.right;
    const seatingTemplateId = document.getElementById('club-seating-template').value;
    const standardSeatId = document.getElementById('club-standard-seat').value;

    if(!name){ if(errEl) errEl.textContent = 'Bitte einen Clubnamen angeben.'; return false; }
    if(!foundedOn){ if(errEl) errEl.textContent = 'Bitte ein Gründungsdatum angeben.'; return false; }
    // Grobe Formatprüfung (Länderkürzel + Prüfziffer + Rest, insgesamt 15-34 Zeichen wie im
    // SEPA-Raum üblich) - keine vollständige IBAN-Prüfsummenvalidierung (Modulo-97), aber
    // reicht, um grobe Tippfehler vor dem Speichern abzufangen.
    if(iban && !/^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$/.test(iban)){
      if(errEl) errEl.textContent = 'IBAN sieht ungültig aus. Bitte prüfen.';
      return false;
    }
    if(iban && !accountHolder){
      if(errEl) errEl.textContent = 'Bitte einen Kontoinhaber für die IBAN angeben.';
      return false;
    }

    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = 'Speichert…'; }
    try{
      // Die Club-ID (Dokument-Pfad) bleibt unverändert, nur die Stammdaten selbst werden
      // aktualisiert - siehe saveClub()/clubRef() weiter oben. saveClub() nutzt merge:true,
      // daher muss ein geleertes PayPal-/IBAN-/Kontoinhaber-Feld explizit per deleteField()
      // entfernt werden - ein einfaches Weglassen des Felds im Payload würde es serverseitig
      // NICHT löschen.
      // Kürzel (z.B. 'L'/'R') werden hier einmalig aus den Bezeichnungen berechnet und
      // mitgespeichert, damit sie beim Anzeigen des Sitzplans nicht bei jedem Aufruf neu
      // berechnet werden müssen (siehe computeSeatingShortLabels()/getSeatingShortLabels()).
      const seatingShortLabels = computeSeatingShortLabels(seatingLeft, seatingRight);
      const clubUpdate = {
        name, foundedOn,
        paypalName: paypalName ? paypalName : deleteField(),
        iban: iban ? iban : deleteField(),
        accountHolder: accountHolder ? accountHolder : deleteField(),
        seatingSideNames: { left: seatingLeft, right: seatingRight },
        seatingShortLabels,
        seatingTemplateId,
        standardSchriftfuehrerSeatId: standardSeatId,
      };
      await saveClub(clubUpdate);
      CURRENT_CLUB_DATA = { ...(CURRENT_CLUB_DATA||{}), name, foundedOn };
      if(paypalName){ CURRENT_CLUB_DATA.paypalName = paypalName; } else { delete CURRENT_CLUB_DATA.paypalName; }
      if(iban){ CURRENT_CLUB_DATA.iban = iban; } else { delete CURRENT_CLUB_DATA.iban; }
      if(accountHolder){ CURRENT_CLUB_DATA.accountHolder = accountHolder; } else { delete CURRENT_CLUB_DATA.accountHolder; }
      CURRENT_CLUB_DATA.seatingSideNames = { left: seatingLeft, right: seatingRight };
      CURRENT_CLUB_DATA.seatingShortLabels = seatingShortLabels;
      CURRENT_CLUB_DATA.seatingTemplateId = seatingTemplateId;
      CURRENT_CLUB_DATA.standardSchriftfuehrerSeatId = standardSeatId;
      markFetched('clubData');
      applyClubBranding();
      clubMgmtDirtyCheck = null;
      return true;
    }catch(e){
      if(errEl) errEl.textContent = 'Speichern fehlgeschlagen. Bitte prüfe deine Internetverbindung.';
      if(saveBtn){ saveBtn.disabled = false; saveBtn.textContent = 'Speichern'; }
      return false;
    }
  }

    const openAddFineBtn = document.getElementById('header-add-fine-catalog-btn');
    if(openAddFineBtn) openAddFineBtn.addEventListener('click', ()=>goToFineDetail(null));
    // Reorder wirkt jeweils nur innerhalb seiner Box (Strafen bzw. Runden); Einträge aus der
    // anderen Box werden dabei unverändert an ihrer bisherigen Position im Katalog belassen.
    function reorderWithinSubset(newIdOrder){
      const byId = {};
      state.finesCatalog.forEach(f=>{ byId[f.id]=f; });
      const idSet = new Set(newIdOrder);
      const reorderedSubset = newIdOrder.map(id=>byId[id]).filter(Boolean);
      let cursor = 0;
      state.finesCatalog = state.finesCatalog.map(f=> idSet.has(f.id) ? reorderedSubset[cursor++] : f);
    }
    setupDragReorder('fines-list-container', async (newIdOrder)=>{
      reorderWithinSubset(newIdOrder);
      await setClubJSON('fines-catalog', state.finesCatalog);
    });
    setupDragReorder('runden-list-container', async (newIdOrder)=>{
      reorderWithinSubset(newIdOrder);
      await setClubJSON('fines-catalog', state.finesCatalog);
    });
  }

  function attachCalendarListeners(){
    const prevBtn = document.getElementById('cal-prev-month-btn');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{
      state.calendarViewMonth--;
      if(state.calendarViewMonth<1){ state.calendarViewMonth=12; state.calendarViewYear--; }
      state.calendarSelectedDate = isoDate(state.calendarViewYear, state.calendarViewMonth, 1);
      render();
    });
    const nextBtn = document.getElementById('cal-next-month-btn');
    if(nextBtn) nextBtn.addEventListener('click', ()=>{
      state.calendarViewMonth++;
      if(state.calendarViewMonth>12){ state.calendarViewMonth=1; state.calendarViewYear++; }
      state.calendarSelectedDate = isoDate(state.calendarViewYear, state.calendarViewMonth, 1);
      render();
    });
    document.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        state.calendarSelectedDate = cell.dataset.date;
        render();
      });
    });
    document.querySelectorAll('.cal-event-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const events = getEventsOnDate(state.calendarSelectedDate);
        const ev = events.find(e=> e.seriesId===row.dataset.seriesId && e.occurrenceDate===row.dataset.occurrenceDate);
        if(ev) goToEventDetail(ev);
      });
    });
    const addEventBtn = document.getElementById('header-add-event-btn');
    if(addEventBtn) addEventBtn.addEventListener('click', ()=>goToEventDetail());
    const todayBtn = document.getElementById('header-cal-today-btn');
    if(todayBtn) todayBtn.addEventListener('click', ()=>{
      const today = todayISO();
      const [y, m] = today.split('-').map(Number);
      state.calendarViewYear = y;
      state.calendarViewMonth = m;
      state.calendarSelectedDate = today;
      render();
    });
    const nextEventBtn = document.getElementById('header-cal-next-event-btn');
    if(nextEventBtn) nextEventBtn.addEventListener('click', ()=>{
      const occ = getNextUpcomingEvent();
      if(!occ) return;
      const targetDate = dateOnly(occ.start);
      const [y, m] = targetDate.split('-').map(Number);
      state.calendarViewYear = y;
      state.calendarViewMonth = m;
      state.calendarSelectedDate = targetDate;
      render();
    });
    const calOverflowBtn = document.getElementById('header-cal-overflow-btn');
    const calOverflowMenu = document.getElementById('header-cal-overflow-menu');
    if(calOverflowBtn && calOverflowMenu){
      calOverflowBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        calOverflowMenu.hidden = !calOverflowMenu.hidden;
      });
    }
    const subscribeBtn = document.getElementById('header-cal-subscribe-btn');
    if(subscribeBtn) subscribeBtn.addEventListener('click', ()=>{
      if(calOverflowMenu) calOverflowMenu.hidden = true;
      showCalendarSubscribeModal();
    });
  }

  // Liest das auf der "Neuer Kegelabend"-Seite aktuell im Sitzplan-Dropdown gewählte Template
  // (siehe buildEveningSeatingTemplateOptionsHtml()). Fällt auf das Club-Standard-Template
  // zurück, falls das Select-Element (noch) nicht existiert.
  function getSelectedNewEveningSeatingTemplate(){
    const select = document.getElementById('seating-template-select');
    return select ? getSeatingTemplateById(select.value) : getClubSeatingTemplate();
  }

  function updateSeatCounter(){
    const checkedCount = document.querySelectorAll('.member-checkbox:checked').length;
    const total = checkedCount + currentGuests.length;
    const maxSeats = getSelectedNewEveningSeatingTemplate().perSide*2;
    const counterEl = document.getElementById('seat-counter');
    if(counterEl){
      counterEl.textContent = `${total} / ${maxSeats} Plätze belegt`;
      counterEl.classList.toggle('over', total>maxSeats);
    }
    const btn = document.getElementById('confirm-btn');
    if(btn) btn.disabled = (total<1 || total>maxSeats);
    const err = document.getElementById('form-error');
    if(err) err.textContent = '';
    updateSchriftfuehrerOptions();
  }

  // Befüllt das Schriftführer-Dropdown mit den Namen der aktuell angehakten (anwesenden)
  // Mitglieder - läuft bei jeder Checkbox-Änderung neu, damit die Liste stets aktuell ist.
  // Eine bereits gewählte Person bleibt ausgewählt, solange sie weiterhin angehakt ist; wird sie
  // abgehakt, fällt die Auswahl zurück auf "Standardplatz" statt auf einen ungültigen Namen zu zeigen.
  function updateSchriftfuehrerOptions(){
    const select = document.getElementById('schriftfuehrer-select');
    if(!select) return;
    const previousValue = select.value;
    const checkedIds = Array.from(document.querySelectorAll('.member-checkbox:checked')).map(cb=>cb.dataset.id);
    const presentMembers = state.members
      .filter(m=>checkedIds.includes(m.id))
      .slice()
      .sort((a,b)=> displayName(a).localeCompare(displayName(b),'de'));
    const nameOptionsHtml = presentMembers.map(m=>`<option value="name:${m.id}">${escapeHtml(displayName(m))}</option>`).join('');
    const membersGroupHtml = presentMembers.length>0 ? `<optgroup label="Mitglieder">${nameOptionsHtml}</optgroup>` : '';
    select.innerHTML = `
      <optgroup label="Zufällig">
        <option value="standard">Standardplatz</option>
        <option value="draw">Auslosen</option>
      </optgroup>
      ${membersGroupHtml}
    `;
    const stillValid = Array.from(select.options).some(o=>o.value===previousValue);
    select.value = stillValid ? previousValue : 'standard';
  }

  // Generisches Modal, das direkt ins DOM eingefügt wird (nicht über render()),
  // damit z.B. das Formular für einen neuen Abend dabei nicht zurückgesetzt wird.
  function closeGenericModal(){
    const existing = document.getElementById('generic-modal-root');
    if(existing) existing.remove();
  }
  function showModal(cardInnerHtml){
    closeGenericModal();
    const div = document.createElement('div');
    div.id = 'generic-modal-root';
    div.innerHTML = `
      <div class="modal-backdrop" id="generic-modal-backdrop">
        <div class="modal-card" role="dialog" aria-modal="true">
          ${cardInnerHtml}
        </div>
      </div>
    `;
    document.body.appendChild(div);
    document.getElementById('generic-modal-backdrop').addEventListener('click', e=>{
      if(e.target.id==='generic-modal-backdrop') closeGenericModal();
    });
  }
  // Blendet ein Overlay mit Spinner über die aktuell offene Modal-Card, damit während des
  // Wartens auf eine Cloud Function (closeEvening/reopenEvening/deleteEvening) sichtbar ist,
  // dass etwas passiert. hideModalLoadingOverlay() entfernt es wieder (z.B. im Fehlerfall).
  function showModalLoadingOverlay(text){
    const card = document.querySelector('.modal-card');
    if(!card) return;
    hideModalLoadingOverlay();
    const overlay = document.createElement('div');
    overlay.className = 'modal-loading-overlay';
    overlay.id = 'modal-loading-overlay';
    overlay.innerHTML = `<div class="loading-spinner"></div>${escapeHtml(text)}`;
    card.appendChild(overlay);
  }
  function hideModalLoadingOverlay(){
    const overlay = document.getElementById('modal-loading-overlay');
    if(overlay) overlay.remove();
  }

  // Parameter enthält (z.B. Link aus dem Kalender-Feed: ?event=<seriesId>&date=<occurrenceDate>).
  async function applyEventDeepLinkFromUrl(){
    const params = new URLSearchParams(location.search);
    const seriesId = params.get('event');
    const occurrenceDate = params.get('date');
    if(!seriesId || !occurrenceDate) return;
    const occurrence = findOccurrenceByIds(seriesId, occurrenceDate);
    if(!occurrence) return;
    try{ state.calendarRsvps = await getAllCalendarRsvps(); markFetched('calendarRsvps'); }catch(e){}
    goToEventDetail(occurrence, 'main');
  }

  function goToEventDetail(occurrence, origin){
    state.calendarEditingOccurrence = occurrence || null;
    state.eventDetailOrigin = origin || 'calendar';
    state.view = 'eventDetail';
    render();
  }

  function isEventCreator(baseEvent){
    const currentName = getCurrentMemberName();
    if(!baseEvent || !baseEvent.createdBy) return true; // Alte Termine ohne Ersteller: jeder darf bearbeiten
    return !!currentName && currentName===baseEvent.createdBy;
  }

  function rsvpStatusIcon(status, grey){
    const greyClass = grey ? ' grey' : '';
    if(status==='accepted'){
      return `<svg viewBox="0 0 24 24" class="rsvp-icon accepted${greyClass}"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }
    if(status==='tentative'){
      return `<svg viewBox="0 0 24 24" class="rsvp-icon tentative${greyClass}"><circle cx="12" cy="12" r="11"/><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="sans-serif">?</text></svg>`;
    }
    if(status==='declined'){
      return `<svg viewBox="0 0 24 24" class="rsvp-icon declined${greyClass}"><circle cx="12" cy="12" r="11"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>`;
    }
    return `<svg viewBox="0 0 24 24" class="rsvp-icon pending${greyClass}"><circle cx="12" cy="12" r="11"/><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="sans-serif">?</text></svg>`;
  }

  function buildRsvpSectionHtml(occurrence){
    const currentName = getCurrentMemberName();
    const currentStatus = currentName ? getRsvpStatusFor(occurrence.seriesId, occurrence.occurrenceDate, currentName) : null;
    const groups = categorizeRsvps(occurrence.seriesId, occurrence.occurrenceDate);
    const rsvpButtonsHtml = currentName ? `
      <div class="card">
        <h2 class="section-title">Deine Rückmeldung</h2>
        <div class="rsvp-btn-row">
          <button type="button" class="rsvp-btn${currentStatus==='accepted'?' active accepted':''}" data-status="accepted">Zusagen</button>
          <button type="button" class="rsvp-btn${currentStatus==='tentative'?' active tentative':''}" data-status="tentative">Vorläufig</button>
          <button type="button" class="rsvp-btn${currentStatus==='declined'?' active declined':''}" data-status="declined">Absagen</button>
        </div>
      </div>
    ` : '';
    const groupSectionHtml = (label, names, status)=> `
      <div class="rsvp-group">
        <div class="rsvp-group-label"><span class="rsvp-group-icon">${rsvpStatusIcon(status)}</span>${label} <span class="member-count">(${names.length})</span></div>
        ${names.length===0 ? '<p class="empty-state rsvp-names-indent">Niemand.</p>' : names.map(n=>`<p class="rsvp-name-row">${escapeHtml(n)}</p>`).join('')}
      </div>
    `;
    return `
      ${rsvpButtonsHtml}
      <div class="card">
        <h2 class="section-title">Rückmeldungen</h2>
        ${groupSectionHtml('Zugesagt', groups.accepted, 'accepted')}
        ${groupSectionHtml('Vorläufig', groups.tentative, 'tentative')}
        ${groupSectionHtml('Abgesagt', groups.declined, 'declined')}
        ${groupSectionHtml('Rückmeldung ausstehend', groups.pending, null)}
      </div>
    `;
  }

  // Baut eine lesbare Anzeige für den Zeitraum eines Termins (auch mehrtägig).
  function formatOccurrenceRange(occ){
    const startDate = dateOnly(occ.start), startTime = timeOnly(occ.start);
    const endDate = dateOnly(occ.end), endTime = timeOnly(occ.end);
    const startPart = `${formatDateDE(startDate)} · ${startTime}`;
    if(startDate===endDate){
      return `${startPart}–${endTime}`;
    }
    return `${startPart} – ${formatDateDE(endDate)} · ${endTime}`;
  }

  function viewEventDetail(){
    const occurrence = state.calendarEditingOccurrence;
    const isEdit = !!occurrence;
    const baseEvent = isEdit ? state.calendarEvents.find(e=>e.id===occurrence.seriesId) : null;
    const canEdit = !isEdit || isEventCreator(baseEvent);
    const isSeriesOccurrence = isEdit && !occurrence.isSeriesEdit && !!(occurrence.recurrence && occurrence.recurrence!=='none');

    if(isEdit && !canEdit){
      // Nur-Lese-Ansicht für Nicht-Ersteller: keine Bearbeitung, aber Rückmeldung möglich.
      return `
        <div class="card">
          <h2 class="section-title">${escapeHtml(occurrence.title)}</h2>
          ${occurrence.location ? `<p class="cal-event-meta">${escapeHtml(occurrence.location)}</p>` : ''}
          <p class="cal-event-meta">${formatOccurrenceRange(occurrence)}</p>
          ${baseEvent && baseEvent.createdBy ? `<p class="hint" style="margin-top:10px;">Erstellt von ${escapeHtml(baseEvent.createdBy)}. Nur der Ersteller kann diesen Termin bearbeiten.</p>` : ''}
        </div>
        ${buildRsvpSectionHtml(occurrence)}
      `;
    }

    const recurrenceOptionsHtml = isSeriesOccurrence ? '' : `
      <label for="cal-ev-recurrence">Wiederholen</label>
      <select id="cal-ev-recurrence">
        <option value="none"${(!isEdit || occurrence.recurrence==='none' || !occurrence.recurrence)?' selected':''}>Nein</option>
        <option value="weekly"${(isEdit && occurrence.recurrence==='weekly')?' selected':''}>Wöchentlich</option>
        <option value="biweekly"${(isEdit && occurrence.recurrence==='biweekly')?' selected':''}>Zweiwöchentlich</option>
        <option value="every4weeks"${(isEdit && occurrence.recurrence==='every4weeks')?' selected':''}>Vierwöchentlich</option>
        <option value="monthly"${(isEdit && occurrence.recurrence==='monthly')?' selected':''}>Monatlich</option>
        <option value="yearly"${(isEdit && occurrence.recurrence==='yearly')?' selected':''}>Jährlich</option>
      </select>
      <label for="cal-ev-recurrence-end">Enddatum der Wiederholung (optional)</label>
      <input type="date" id="cal-ev-recurrence-end" value="${(isEdit && baseEvent && baseEvent.recurrenceEndDate)?baseEvent.recurrenceEndDate:''}">
    `;
    const defaultStart = isEdit ? occurrence.start : combineDatetime(state.calendarSelectedDate, '19:00');
    const defaultEnd = isEdit ? occurrence.end : combineDatetime(state.calendarSelectedDate, '21:00');
    return `
      <div class="card">
        <label for="cal-ev-title">Titel</label>
        <input type="text" id="cal-ev-title" placeholder="z. B. Kegeln" value="${isEdit?escapeHtml(occurrence.title):''}">
        <label for="cal-ev-location">Ort (optional)</label>
        <input type="text" id="cal-ev-location" placeholder="z. B. Zur Dorfschmiede" value="${isEdit?escapeHtml(occurrence.location||''):''}">
        <label for="cal-ev-start">Beginn</label>
        <input type="datetime-local" id="cal-ev-start" value="${defaultStart}">
        <label for="cal-ev-end">Ende</label>
        <input type="datetime-local" id="cal-ev-end" value="${defaultEnd}">
        ${recurrenceOptionsHtml}
        ${isSeriesOccurrence ? `<p class="hint">Dies ist Teil einer Terminserie. Änderungen betreffen nur diesen einen Termin.</p>` : ''}
        <p class="form-error" id="cal-ev-error"></p>
        <button type="button" class="btn-primary" id="save-cal-ev-btn" style="width:100%;">${isEdit?'Speichern':'Hinzufügen'}</button>
      </div>
      ${(isEdit && !occurrence.isSeriesEdit) ? buildRsvpSectionHtml(occurrence) : ''}
    `;
  }

  function showDeleteEventModal(occurrence){
    const isSeriesOccurrence = !!(occurrence.recurrence && occurrence.recurrence!=='none');
    showModal(`
      <h3>Termin löschen</h3>
      <p>„${escapeHtml(occurrence.title)}" wirklich löschen?${isSeriesOccurrence ? ' Nur dieser eine Termin der Serie wird entfernt.' : ''}</p>
      <div class="confirm-row-buttons">
        <button type="button" class="btn-danger" id="confirm-delete-event-yes">Ja, löschen</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    document.getElementById('confirm-delete-event-yes').addEventListener('click', async ()=>{
      const yesBtn = document.getElementById('confirm-delete-event-yes');
      yesBtn.disabled = true; yesBtn.textContent = 'Löscht…';
      if(!isSeriesOccurrence){
        state.calendarEvents = state.calendarEvents.filter(e=>e.id!==occurrence.seriesId);
        await deleteCalendarEvent(occurrence.seriesId);
      }else{
        let edit = findOccurrenceEdit(occurrence.seriesId, occurrence.occurrenceDate);
        if(!edit){ edit = {id:uid('caledit'), seriesId:occurrence.seriesId, occurrenceDate:occurrence.occurrenceDate}; state.calendarOccurrenceEdits.push(edit); }
        edit.deleted = true;
        await saveOccurrenceEdit(edit);
      }
      closeGenericModal();
      goBackFromEventDetail();
    });
  }

  function attachEventDetailListeners(){
    const occurrence = state.calendarEditingOccurrence;
    const isEdit = !!occurrence;
    const isSeriesOccurrence = isEdit && !occurrence.isSeriesEdit && !!(occurrence.recurrence && occurrence.recurrence!=='none');

    document.querySelectorAll('.rsvp-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const currentName = getCurrentMemberName();
        if(!currentName || !occurrence) return;
        btn.disabled = true;
        await setRsvpStatus(occurrence.seriesId, occurrence.occurrenceDate, currentName, btn.dataset.status);
        render();
      });
    });

    const overflowBtn = document.getElementById('header-event-overflow-btn');
    const overflowMenu = document.getElementById('header-event-overflow-menu');
    if(overflowBtn && overflowMenu){
      overflowBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        overflowMenu.hidden = !overflowMenu.hidden;
      });
    }
    const deleteBtn = document.getElementById('header-delete-event-btn');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
      if(overflowMenu) overflowMenu.hidden = true;
      showDeleteEventModal(occurrence);
    });

    // Kein automatischer Fokus auf das Titel-Feld - öffnet sonst sofort die Bildschirmtastatur.
    const saveBtn = document.getElementById('save-cal-ev-btn');
    if(!saveBtn) return;
    saveBtn.addEventListener('click', async ()=>{
      const errEl = document.getElementById('cal-ev-error');
      const title = document.getElementById('cal-ev-title').value.trim();
      const location = document.getElementById('cal-ev-location').value.trim();
      const start = document.getElementById('cal-ev-start').value;
      const end = document.getElementById('cal-ev-end').value;
      const recurrenceEl = document.getElementById('cal-ev-recurrence');
      const recurrence = recurrenceEl ? recurrenceEl.value : (isEdit ? occurrence.recurrence : 'none');
      const recurrenceEndEl = document.getElementById('cal-ev-recurrence-end');
      const recurrenceEndDate = recurrenceEndEl ? recurrenceEndEl.value : '';

      if(!title){ errEl.textContent='Bitte einen Titel angeben.'; return; }
      if(!start){ errEl.textContent='Bitte einen Beginn angeben.'; return; }
      if(!end){ errEl.textContent='Bitte ein Ende angeben.'; return; }
      if(end<start){ errEl.textContent='Das Ende darf nicht vor dem Beginn liegen.'; return; }
      if(recurrenceEndDate && recurrenceEndDate<dateOnly(start)){ errEl.textContent='Das Enddatum der Wiederholung darf nicht vor dem Beginn liegen.'; return; }

      const performSave = async ()=>{
        saveBtn.disabled = true; saveBtn.textContent = isEdit ? 'Speichert…' : 'Wird hinzugefügt…';
        const startDateOnly = dateOnly(start);
        if(!isEdit){
          const newId = uid('cal');
          const creatorName = getCurrentMemberName();
          const newEvent = {id:newId, title, location, start, end, recurrence, recurrenceEndDate: recurrenceEndDate||undefined, createdBy: creatorName};
          state.calendarEvents.push(newEvent);
          await saveCalendarEvent(newEvent);
          if(creatorName){
            await setRsvpStatus(newId, startDateOnly, creatorName, 'accepted');
          }
        }else if(!isSeriesOccurrence){
          const base = state.calendarEvents.find(e=>e.id===occurrence.seriesId);
          if(base){
            base.title=title; base.location=location; base.start=start; base.end=end; base.recurrence=recurrence;
            if(recurrenceEndDate) base.recurrenceEndDate = recurrenceEndDate; else delete base.recurrenceEndDate;
          }
          if(base) await saveCalendarEvent(base);
          if(occurrence.isSeriesEdit){
            // Serie wurde bearbeitet - alle Rückmeldungen zu dieser Serie zurücksetzen. Jedes
            // betroffene RSVP-Dokument einzeln löschen (kein Bulk-Überschrieb mehr möglich/nötig,
            // da RSVPs jetzt Einzeldokumente sind).
            const affected = state.calendarRsvps.filter(r=>r.seriesId===occurrence.seriesId);
            state.calendarRsvps = state.calendarRsvps.filter(r=>r.seriesId!==occurrence.seriesId);
            await Promise.all(affected.map(r=> deleteCalendarRsvp(r.id)));
          }
        }else{
          let edit = findOccurrenceEdit(occurrence.seriesId, occurrence.occurrenceDate);
          if(!edit){ edit = {id:uid('caledit'), seriesId:occurrence.seriesId, occurrenceDate:occurrence.occurrenceDate}; state.calendarOccurrenceEdits.push(edit); }
          edit.title=title; edit.location=location; edit.start=start; edit.end=end;
          delete edit.deleted;
          await saveOccurrenceEdit(edit);
        }
        state.calendarSelectedDate = startDateOnly;
        goBackFromEventDetail();
      };

      if(occurrence && occurrence.isSeriesEdit){
        showModal(`
          <h3>Terminserie speichern</h3>
          <p>Diese Änderung betrifft <strong>alle Termine dieser Serie</strong>. Außerdem werden dabei <strong>alle bisherigen Rückmeldungen</strong> zu dieser Serie zurückgesetzt. Fortfahren?</p>
          <div class="confirm-row-buttons">
            <button type="button" class="btn-primary" id="confirm-series-save-yes">Ja, speichern</button>
            <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
          </div>
        `);
        document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
        document.getElementById('confirm-series-save-yes').addEventListener('click', async ()=>{
          closeGenericModal();
          await performSave();
        });
      }else{
        await performSave();
      }
    });
  }

  function showDeleteTransactionModal(transaction){
    const isFromArrears = !!transaction.fromArrears;
    const arrearsName = transaction.arrearsName || (transaction.description.includes(' – ') ? transaction.description.split(' – ').pop() : null);
    showModal(`
      <h3>Umsatz löschen</h3>
      <p>„${escapeHtml(transaction.description)}" wirklich löschen?</p>
      ${isFromArrears ? `<p class="hint">Dieser Umsatz stammt aus einer Rückstandszahlung${arrearsName?` von <strong>${escapeHtml(arrearsName)}</strong>`:''}. Beim Löschen wird der Betrag (${fmtEuro(Math.abs(transaction.amount))}) wieder zum offenen Rückstand addiert.</p>` : ''}
      <div class="confirm-row-buttons">
        <button type="button" class="btn-danger" id="confirm-delete-transaction-yes">Ja, löschen</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    document.getElementById('confirm-delete-transaction-yes').addEventListener('click', async ()=>{
      const yesBtn = document.getElementById('confirm-delete-transaction-yes');
      yesBtn.disabled = true; yesBtn.textContent = 'Löscht…';
      state.financeTransactions = state.financeTransactions.filter(t=>t.id!==transaction.id);

      const saves = [deleteTransaction(transaction.id)];
      if(isFromArrears && arrearsName){
        let entry = state.financeArrears.find(a=>a.name===arrearsName);
        if(!entry){ entry = {id: resolveArrearsDocId(arrearsName), name:arrearsName, amount:0, history:[]}; state.financeArrears.push(entry); }
        if(!entry.id) entry.id = resolveArrearsDocId(arrearsName);
        if(!entry.history) entry.history = [];
        const addBack = Math.abs(transaction.amount);
        entry.amount = Math.round((entry.amount + addBack)*100)/100;
        entry.history.push({
          id: uid('hist'), date: todayISO(), type:'correction', delta: addBack,
          note: `Umsatz „${transaction.description}" gelöscht`, balanceAfter: entry.amount, createdAt: Date.now()
        });
        saves.push(saveArrearsEntry(entry));
      }
      await Promise.all(saves);
      closeGenericModal();
      history.back();
    });
  }

  function getArrearsEntry(name){
    return state.financeArrears.find(a=>a.name===name) || null;
  }

  function historyEntryLabel(entry){
    if(entry.type==='correction') return 'Korrektur';
    if(entry.type==='payment') return 'Zahlung';
    return 'Strafen';
  }

  function viewArrearsDetail(){
    const name = state.currentArrearsName;
    const entry = getArrearsEntry(name);
    const amount = entry ? entry.amount : 0;
    const history = (entry && entry.history) ? entry.history.slice().sort((a,b)=>{
      const dateCompare = b.date.localeCompare(a.date);
      if(dateCompare!==0) return dateCompare;
      const aCreated = a.createdAt || new Date(a.date).getTime();
      const bCreated = b.createdAt || new Date(b.date).getTime();
      return bCreated - aCreated;
    }) : [];

    const accountOptionsHtml = state.financeAccounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
    const paymentFormHtml = state.financeAccounts.length===0
      ? `<p class="empty-state">Noch kein Konto/Kasse angelegt. Lege zuerst in den Einstellungen unter „Finanzverwaltung" eines an.</p>`
      : `
        <label for="arrears-payment-amount">Zahlungsbetrag (€)</label>
        <input type="number" id="arrears-payment-amount" min="0" step="0.01" placeholder="${amount.toFixed(2)}">
        <label for="arrears-payment-text">Buchungstext (optional)</label>
        <input type="text" id="arrears-payment-text" placeholder="Bestätigte Zahlung">
        <label for="arrears-payment-account">Konto/Kasse</label>
        <select id="arrears-payment-account">${accountOptionsHtml}</select>
        <label for="arrears-payment-date">Datum</label>
        <input type="date" id="arrears-payment-date" value="${todayISO()}">
        <p class="form-error" id="arrears-payment-error"></p>
        <button type="button" class="btn-primary" id="confirm-arrears-payment-btn" style="width:100%;">Zahlungseingang bestätigen</button>
      `;

    const historyHtml = history.length===0
      ? `<p class="empty-state">Noch keine Einträge im Verlauf.</p>`
      : history.map(h=>{
        const isClickable = h.type==='increase' && h.eveningId && h.seatId;
        return `
        <div class="history-row${isClickable?' history-row-clickable':''}"${isClickable?` data-evening-id="${h.eveningId}" data-seat-id="${h.seatId}"`:''}>
          <span class="history-info">
            <span class="history-note">${escapeHtml(h.note)}</span>
            <span class="history-meta">${formatDateDE(h.date)} · ${historyEntryLabel(h)}</span>
          </span>
          <span class="history-delta ${h.delta>=0?'positive':'negative'}">${h.delta>=0?'+':''}${fmtEuro(h.delta)}</span>
        </div>
      `;
      }).join('');

    return `
      <div class="card own-arrears-card ${amount>0?'amount-due':'amount-clear'}">
        <div class="own-arrears-amount">${fmtEuro(amount)}</div>
        <div class="own-arrears-label">Offener Rückstand</div>
      </div>
      ${canManageFinances() ? `
      <div class="card">
        <h2 class="section-title">Zahlung erfassen</h2>
        ${paymentFormHtml}
      </div>
      ` : ''}
      <div class="card">
        <h2 class="section-title">Verlauf</h2>
        ${historyHtml}
      </div>
    `;
  }

  function showCorrectArrearsModal(){
    const name = state.currentArrearsName;
    const entry = getArrearsEntry(name);
    const amount = entry ? entry.amount : 0;
    showModal(`
      <h3>Rückstand korrigieren</h3>
      <p>Aktueller Rückstand: <strong>${fmtEuro(amount)}</strong></p>
      <label for="correct-arrears-amount">Neuer Rückstand (€)</label>
      <input type="number" id="correct-arrears-amount" min="0" step="0.01" value="${amount.toFixed(2)}">
      <label for="correct-arrears-note">Grund (optional)</label>
      <input type="text" id="correct-arrears-note" placeholder="z. B. Tippfehler korrigiert">
      <p class="form-error" id="correct-arrears-error"></p>
      <div class="confirm-row-buttons">
        <button type="button" class="btn-primary" id="confirm-correct-arrears-btn">Speichern</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    document.getElementById('correct-arrears-amount').focus();
    document.getElementById('confirm-correct-arrears-btn').addEventListener('click', async ()=>{
      const errEl = document.getElementById('correct-arrears-error');
      const newAmountRaw = document.getElementById('correct-arrears-amount').value.replace(',', '.');
      const newAmount = parseFloat(newAmountRaw);
      const note = document.getElementById('correct-arrears-note').value.trim();
      if(isNaN(newAmount) || newAmount<0){ errEl.textContent='Bitte einen gültigen Betrag angeben.'; return; }
      const btn = document.getElementById('confirm-correct-arrears-btn');
      btn.disabled = true; btn.textContent = 'Speichert…';

      const rounded = Math.round(newAmount*100)/100;
      let e = getArrearsEntry(name);
      if(!e){ e = {id: resolveArrearsDocId(name), name, amount:0, history:[]}; state.financeArrears.push(e); }
      if(!e.id) e.id = resolveArrearsDocId(name);
      if(!e.history) e.history = [];
      const delta = Math.round((rounded - e.amount)*100)/100;
      e.amount = rounded;
      e.history.push({
        id: uid('hist'), date: todayISO(), type:'correction', delta,
        note: note || 'Manuelle Korrektur', balanceAfter: rounded, createdAt: Date.now()
      });

      await saveArrearsEntry(e);
      if(e.id && e.id.startsWith('guest-') && Math.round(e.amount*100)===0){
        state.financeArrears = state.financeArrears.filter(a=>a!==e);
      }
      closeGenericModal();
      render();
    });
  }

  function attachArrearsDetailListeners(){

      const bookingText = document.getElementById('arrears-payment-text').value.trim() || 'Bestätigte Zahlung';
      const accountId = document.getElementById('arrears-payment-account').value;
      const date = document.getElementById('arrears-payment-date').value;
      if(isNaN(paidAmount) || paidAmount<=0){ errEl.textContent='Bitte einen gültigen Zahlungsbetrag angeben.'; return; }
      if(!date){ errEl.textContent='Bitte ein Datum angeben.'; return; }
      confirmPaymentBtn.disabled = true; confirmPaymentBtn.textContent = 'Wird bestätigt…';

      const rounded = Math.round(paidAmount*100)/100;
      const newTx = {id:uid('tx'), accountId, description:`${bookingText} – ${name}`, date, amount: rounded, fromArrears:true, arrearsName: name, createdAt: Date.now()};
      state.financeTransactions.push(newTx);

      let e = entry;
      if(!e){ e = {id: resolveArrearsDocId(name), name, amount:0, history:[]}; state.financeArrears.push(e); }
      if(!e.id) e.id = resolveArrearsDocId(name);
      if(!e.history) e.history = [];
      const before = e.amount;
      e.amount = Math.max(0, Math.round((e.amount - rounded)*100)/100);
      const actualDelta = Math.round((e.amount - before)*100)/100;
      e.history.push({
        id: uid('hist'), date, type:'payment', delta: actualDelta,
        note: bookingText, balanceAfter: e.amount, createdAt: Date.now()
      });

      await Promise.all([
        saveTransaction(newTx),
        saveArrearsEntry(e)
      ]);
      if(e.id && e.id.startsWith('guest-') && Math.round(e.amount*100)===0){
        state.financeArrears = state.financeArrears.filter(a=>a!==e);
      }
      render();
    });
  }

        <select id="new-tx-account"${disabledAttr}>${accountOptionsHtml}</select>
        <label for="new-tx-description">Bezeichnung</label>
        <input type="text" id="new-tx-description" placeholder="z. B. Kegelbahn Miete" value="${isEdit?escapeHtml(existingTransaction.description):''}"${disabledAttr}>
        <label for="new-tx-date">Datum</label>
        <input type="date" id="new-tx-date" value="${isEdit?existingTransaction.date:todayISO()}"${disabledAttr}>
        <label for="new-tx-income">Einnahme (€)</label>
        <input type="number" id="new-tx-income" min="0" step="0.01" placeholder="0,00" value="${(isEdit && !isExpenseEdit)?Math.abs(existingTransaction.amount).toFixed(2):''}"${disabledAttr}>
        <label for="new-tx-expense">Ausgabe (€)</label>
        <input type="number" id="new-tx-expense" min="0" step="0.01" placeholder="0,00" value="${isExpenseEdit?Math.abs(existingTransaction.amount).toFixed(2):''}"${disabledAttr}>
