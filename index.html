  function buildFinanceTransactionsTab(){
    const sorted = state.financeTransactions.slice().sort((a,b)=>{
      const dateCompare = b.date.localeCompare(a.date);
      if(dateCompare!==0) return dateCompare;
      const aCreated = a.createdAt || new Date(a.date).getTime();
      const bCreated = b.createdAt || new Date(b.date).getTime();
      return bCreated - aCreated;
    });
    if(sorted.length===0){
      return `<div class="card"><p class="empty-state">Noch keine Umsätze eingetragen. Über das „+" oben hinzufügen.</p></div>`;
    }
    const byYear = {};
    sorted.forEach(t=>{
      const year = t.date.slice(0,4);
      (byYear[year] = byYear[year] || []).push(t);
    });
    const years = Object.keys(byYear).sort((a,b)=> b.localeCompare(a));
    const listHtml = years.map(year=>{
      const expanded = state.financeExpandedYears.has(year);
      const rows = byYear[year].map(t=>{
        const isPositive = t.amount>=0;
        const locked = !!t.fromArrears;
        return `
          <div class="transaction-row" data-id="${t.id}">
            <span class="transaction-info">
              <span class="transaction-description">${escapeHtml(t.description)}${locked?' <span class="fine-type-icon" title="Aus Rückstandszahlung – nur Bezeichnung bearbeitbar" style="display:inline-flex; width:14px; height:14px; vertical-align:middle;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>':''}</span>
              <span class="transaction-meta">${formatDateDE(t.date)} · ${escapeHtml(financeAccountNameById(t.accountId))}</span>
            </span>
            <span class="transaction-amount${isPositive?' positive':' negative'}">${isPositive?'+':''}${fmtEuro(t.amount)}</span>
          </div>
        `;
      }).join('');
      return `
        <div class="year-group finance-year-group${expanded?' expanded':''}" data-year="${year}">
          <div class="year-header finance-year-header">
            <span>${year}</span>
            <span class="chevron">▸</span>
          </div>
          <div class="year-evenings">${rows}</div>
        </div>
      `;
    }).join('');
    return `<div class="card"><h2 class="section-title">Umsätze</h2>${listHtml}</div>`;
  }

  function buildFinanceArrearsTab(){
    const memberNames = new Set(state.members.map(m=>displayName(m)));
    const memberRows = state.members.map(m=>{
      const name = displayName(m);
      const entry = state.financeArrears.find(a=>a.name===name);
      return { name, amount: entry ? entry.amount : 0 };
    });
    const guestRows = state.financeArrears
      .filter(a=> !memberNames.has(a.name) && a.amount>0)
      .map(a=>({ name:a.name, amount:a.amount }));
    const allRows = [...memberRows, ...guestRows].sort((a,b)=> a.name.localeCompare(b.name,'de'));
    const totalDue = allRows.reduce((sum,r)=> sum + r.amount, 0);
    const rowsHtml = allRows.map(r=>`
      <div class="fines-summary-row" data-name="${escapeHtml(r.name)}">
        <span class="fines-summary-name">${escapeHtml(r.name)}</span>
        <span class="fines-summary-amount ${r.amount>0?'amount-due':'amount-clear'}">${fmtEuro(r.amount)}</span>
      </div>
    `).join('');
    return `
      <div class="card"><h2 class="section-title">Rückstände</h2>${rowsHtml}</div>
      <div class="card">
        <div class="stat-total"><span>Summe offener Rückstände</span><span>${fmtEuro(totalDue)}</span></div>
      </div>
    `;
  }

  function buildFinanceSavingsPotsTab(totalAmount){
    const today = todayISO();
    const activePots = state.financeSavingsPots
      .filter(p=> p.targetDate >= today)
      .sort((a,b)=> a.targetDate.localeCompare(b.targetDate));

    if(activePots.length===0){
      return `<div class="card"><p class="empty-state">Keine anstehenden Spartöpfe. In den Einstellungen unter „Finanzverwaltung" anlegen.</p></div>`;
    }

    // Reihenfolge der Verteilung:
    // 1. Jeder Topf mit einem Startbetrag bekommt diesen direkt zugewiesen - wird vom
    //    noch zu verteilenden Gesamtbetrag abgezogen.
    // 2. Töpfe mit verknüpfter monatlicher Buchung bekommen zusätzlich die Summe aller
    //    bisher dafür gebuchten Beträge direkt zugewiesen - ebenfalls abgezogen.
    // 3. Der verbleibende Betrag wird per Wasserfall (nächstes Zieldatum zuerst) auf den
    //    jeweils noch offenen Bedarf (Sparziel abzüglich bereits direkt Zugewiesenem) verteilt.
    const linkedPotIds = new Set(state.financeRecurring.filter(r=>r.potId).map(r=>r.potId));
    function bookedSumForPot(pot){
      return state.financeTransactions
        .filter(t=>t.potId===pot.id)
        .reduce((sum,t)=> sum + t.amount, 0);
    }

    const directFunding = {};
    let remaining = totalAmount;
    activePots.forEach(p=>{
      let funded = p.startAmount || 0;
      if(linkedPotIds.has(p.id)) funded += bookedSumForPot(p);
      funded = Math.round(funded*100)/100;
      directFunding[p.id] = funded;
      remaining -= funded;
    });
    remaining = Math.max(0, remaining);

    const rowsHtml = activePots.map(p=>{
      const alreadyFunded = directFunding[p.id];
      const stillNeeded = Math.max(0, p.targetAmount - alreadyFunded);
      const waterfallShare = Math.max(0, Math.min(remaining, stillNeeded));
      remaining -= waterfallShare;
      const allocated = Math.round((alreadyFunded + waterfallShare)*100)/100;
      const percent = p.targetAmount>0 ? Math.min(100, Math.round(allocated/p.targetAmount*100)) : 0;
      return `
        <div class="savings-pot-row">
          <div class="savings-pot-header">
            <span class="savings-pot-name">${escapeHtml(p.name)}</span>
            <span class="savings-pot-percent">${percent}%</span>
          </div>
          <div class="savings-pot-bar-track"><div class="savings-pot-bar-fill" style="width:${percent}%;"></div></div>
          <div class="savings-pot-meta">
            <span>${fmtEuro(allocated)} von ${fmtEuro(p.targetAmount)}</span>
            <span>Ziel: ${formatDateDE(p.targetDate)}</span>
          </div>
        </div>
      `;
    }).join('');
    return `<div class="card"><h2 class="section-title">Spartöpfe</h2>${rowsHtml}</div>`;
  }

  let isPopstateNavigation = false;
  let lastHistorySignature = null;

  function historySignature(){
    if(state.view==='personFineDetail' && state.currentEveningDetail) return 'personFine:'+state.currentEveningDetail.id+':'+state.currentFineSeatId;
    if(state.view==='detail' && state.currentEveningDetail) return 'detail:'+state.currentEveningDetail.id;
    if(state.view==='arrearsDetail') return 'arrearsDetail:'+encodeURIComponent(state.currentArrearsName);
    if(state.view==='transactionDetail') return 'transactionDetail:'+(state.currentTransactionId||'new');
    if(state.view==='memberDetail') return 'memberDetail:'+(state.currentMemberId||'new');
    if(state.view==='recurringDetail') return 'recurringDetail:'+(state.currentRecurringId||'new');
    if(state.view==='savingsPotDetail') return 'savingsPotDetail:'+(state.currentSavingsPotId||'new');
    if(state.view==='financeAccountDetail') return 'financeAccountDetail:'+(state.currentFinanceAccountId||'new');
    if(state.view==='fineDetail') return 'fineDetail:'+(state.currentFineId||'new');
    if(state.view==='gameDetail') return 'gameDetail:'+(state.currentGameId||'new');
    if(state.view==='eventDetail') return 'eventDetail:'+(state.calendarEditingOccurrence ? state.calendarEditingOccurrence.seriesId+':'+state.calendarEditingOccurrence.occurrenceDate : 'new');
    return state.view;
  }
  function hashFor(sig){
    if(sig==='settingsMenu') return '#einstellungen';
    if(sig==='clubManagement') return '#clubverwaltung';
    if(sig==='subscriptionPlans') return '#abonnement';
    if(sig==='settings') return '#mitglieder';
    if(sig==='finesManagement') return '#strafen';
    if(sig==='gamesManagement') return '#spiele';
    if(sig==='financeManagement') return '#finanzen-verwaltung';
    if(sig==='eventManagement') return '#terminverwaltung';
    if(sig==='finance') return '#finanzen';
    if(sig==='calendar') return '#kalender';
    if(sig==='new') return '#neuer-abend';
    if(sig.startsWith('personFine:')) return '#strafe-person';
    if(sig.startsWith('arrearsDetail:')) return '#rueckstand-person';
    if(sig.startsWith('transactionDetail:')) return '#umsatz';
    if(sig.startsWith('memberDetail:')) return '#mitglied';
    if(sig.startsWith('recurringDetail:')) return '#buchung';
    if(sig.startsWith('fineDetail:')) return '#strafe';
    if(sig.startsWith('gameDetail:')) return '#spiel';
    if(sig.startsWith('eventDetail:')) return '#termin';
    if(sig.startsWith('detail:')) return '#abend-'+sig.slice(7);
    return '#uebersicht';
  }

  function render(opts){
    if(window.__resetPullIndicator) window.__resetPullIndicator();
    const app = document.getElementById('app');
    let body = '';
    if(state.view==='main') body = viewMain();
    else if(state.view==='settingsMenu') body = viewSettingsMenu();
    else if(state.view==='clubManagement') body = viewClubManagement();
    else if(state.view==='subscriptionPlans') body = viewSubscriptionPlans();
    else if(state.view==='settings') body = viewSettings();
    else if(state.view==='memberDetail') body = viewMemberDetail();
    else if(state.view==='finesManagement') body = viewFinesManagement();
    else if(state.view==='fineDetail') body = viewFineDetail();
    else if(state.view==='gameDetail') body = viewGameDetail();
    else if(state.view==='gamesManagement') body = viewGamesManagement();
    else if(state.view==='financeManagement') body = viewFinanceManagement();
    else if(state.view==='recurringDetail') body = viewRecurringDetail();
    else if(state.view==='savingsPotDetail') body = viewSavingsPotDetail();
    else if(state.view==='financeAccountDetail') body = viewFinanceAccountDetail();
    else if(state.view==='finance') body = viewFinance();
    else if(state.view==='calendar') body = viewCalendar();
    else if(state.view==='eventManagement') body = viewEventManagement();

    else if(state.view==='transactionDetail') body = viewTransactionDetail();
    else if(state.view==='new') body = viewNew();
    else if(state.view==='detail') body = viewDetail(state.currentEveningDetail);
    else if(state.view==='personFineDetail') body = viewPersonFineDetail();
    // Read-Only-Banner (abgelaufener Free-Zeitraum) wird zentral hier vorangestellt, statt in
    // jeder viewXyz()-Funktion einzeln - so ist er auf jeder Seite sichtbar, unabhängig davon,
    // welche Aktion der Nutzer als Nächstes versucht. Ausnahme: auf der Abo-Seite selbst
    // (subscriptionPlans) wird er weggelassen, da diese Seite bereits erklärt, was zu tun ist,
    // und der Banner dort nur redundant wäre.
    const accessBlocked = !!(CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.subscription && CURRENT_CLUB_DATA.subscription.accessBlocked);
    const bannerHtml = (accessBlocked && state.view!=='subscriptionPlans') ? readOnlyBannerHtml() : '';
    app.innerHTML = headerHtml() + `<main class="container">${bannerHtml}${body}</main>` + bottomNavHtml();
    attachListeners();

    const sig = historySignature();
    const forceReplace = opts && opts.replaceCurrent;
    if(!isPopstateNavigation && (forceReplace || sig !== lastHistorySignature)){
      const method = (forceReplace || lastHistorySignature===null) ? 'replaceState' : 'pushState';
      history[method]({sig}, '', hashFor(sig));
    }
    lastHistorySignature = sig;
  }

  // Einmaliger globaler Listener (nicht pro Render), schließt Overflow-Menüs bei Klick außerhalb.
  document.addEventListener('click', (e)=>{
    [['header-overflow-menu','header-overflow-btn'], ['header-person-overflow-menu','header-person-overflow-btn'], ['header-arrears-overflow-menu','header-arrears-overflow-btn'], ['header-tx-overflow-menu','header-tx-overflow-btn'], ['header-event-overflow-menu','header-event-overflow-btn'], ['header-member-overflow-menu','header-member-overflow-btn'], ['header-club-overflow-menu','header-club-overflow-btn'], ['header-recurring-overflow-menu','header-recurring-overflow-btn'], ['header-pot-overflow-menu','header-pot-overflow-btn'], ['header-finance-acc-overflow-menu','header-finance-acc-overflow-btn'], ['header-fine-overflow-menu','header-fine-overflow-btn'], ['header-game-overflow-menu','header-game-overflow-btn'], ['header-cal-overflow-menu','header-cal-overflow-btn']].forEach(([menuId,btnId])=>{
      const menu = document.getElementById(menuId);
      const btn = document.getElementById(btnId);
      if(menu && !menu.hidden && e.target!==btn && !menu.contains(e.target) && !(btn && btn.contains(e.target))){
        menu.hidden = true;
      }
    });
  });

  window.addEventListener('popstate', (event)=>{
    const sig = (event.state && event.state.sig) || 'main';
    // Verlässt der Nutzer per Browser-Zurück/Wisch-Geste die Clubverwaltung mit ungespeicherten
    // Änderungen, hat der Browser die History-Position bereits gewechselt, bevor dieser Handler
    // läuft. Die Position wird deshalb sofort wieder auf #clubverwaltung vorgeschoben (pushState)
    // und stattdessen das Popup gezeigt; bestätigt/verwirft der Nutzer, wird die eigentliche
    // Ziel-Navigation (inkl. echtem history.back()) nachträglich ausgeführt.
    if(state.view==='clubManagement' && hasUnsavedClubManagementChanges()){
      history.pushState({sig:'clubManagement'}, '', hashFor('clubManagement'));
      showUnsavedClubChangesPrompt(()=>{ history.back(); });
      return;
    }
    isPopstateNavigation = true;
    (async ()=>{
      if(sig==='settingsMenu'){
        goToSettingsMenu();
      }else if(sig==='clubManagement'){
        await goToClubManagement();
      }else if(sig==='subscriptionPlans'){
        goToSubscriptionPlans();
      }else if(sig==='settings'){
        await goToSettings();
      }else if(sig==='finesManagement'){
        await goToFinesManagement();
      }else if(sig==='gamesManagement'){
        await goToGamesManagement();
      }else if(sig==='financeManagement'){
        await goToFinanceManagement();
      }else if(sig==='eventManagement'){
        await goToEventManagement();
      }else if(sig==='finance'){
        await goToFinance();
      }else if(sig==='new'){
        goToNew();
      }else if(sig.startsWith('detail:')){
        const id = sig.slice(7);
        if(state.currentEveningDetail && state.currentEveningDetail.id===id){
          state.view = 'detail';
          render();
        }else{
          await openEveningDetail(id);
        }
      }else if(sig.startsWith('personFine:')){
        const parts = sig.split(':');
        const eveningId = parts[1], seatId = parts[2];
        if(state.currentEveningDetail && state.currentEveningDetail.id===eveningId){
          const seatObj = state.currentEveningDetail.seating.find(s=>s.seatId===seatId);
          state.currentFineSeatId = seatId;
          state.currentFineName = seatObj ? seatObj.name : '';
          state.view = 'personFineDetail';
          render();
        }else{
          renderLoading('Kegelabend wird geladen…');
          try{
            const d = await getEveningDetail(eveningId);
            if(d){
              state.currentEveningDetail = d;
              const seatObj = d.seating.find(s=>s.seatId===seatId);
              state.currentFineSeatId = seatId;
              state.currentFineName = seatObj ? seatObj.name : '';
              state.eveningTab = 'strafen';
              state.view = 'personFineDetail';
              render();
            }else{
              await goToMain();
            }
          }catch(e){
            renderError('Verbindung fehlgeschlagen. Bitte prüfe deine Internetverbindung.', goToMain);
          }
        }
      }else if(sig.startsWith('arrearsDetail:')){
        const name = decodeURIComponent(sig.slice('arrearsDetail:'.length));
        if(state.financeAccounts.length===0 && state.financeArrears.length===0){
          try{
            const [accounts, transactions, arrears] = await Promise.all([
              getClubJSONOrThrow('finance-accounts', []),
              getAllTransactions(),
              getAllArrears()
            ]);
            state.financeAccounts = accounts;
            state.financeTransactions = transactions;
            state.financeArrears = arrears;
            markFetched('financeAccounts');
            markFetched('financeTransactions');
            markFetched('financeArrears');
          }catch(e){}
        }
        state.currentArrearsName = name;
        state.view = 'arrearsDetail';
        render();
      }else if(sig.startsWith('transactionDetail:')){
        const txId = sig.slice('transactionDetail:'.length);
        if(state.financeAccounts.length===0 && state.financeTransactions.length===0){
          try{
            const [accounts, transactions] = await Promise.all([
              getClubJSONOrThrow('finance-accounts', []),
              getAllTransactions()
            ]);
            state.financeAccounts = accounts;
            state.financeTransactions = transactions;
            markFetched('financeAccounts');
            markFetched('financeTransactions');
          }catch(e){}
        }
        state.currentTransactionId = txId==='new' ? null : txId;
        state.view = 'transactionDetail';
        render();
      }else if(sig.startsWith('memberDetail:')){
        const memberId = sig.slice('memberDetail:'.length);
        if(state.members.length===0){
          try{ state.members = await getAllMembers(); markFetched('members'); }catch(e){}
        }
        if(memberId==='new'){
          state.currentMemberId = null;
          state.currentMemberStats = {};
          state.view = 'memberDetail';
          render();
        }else{
          state.currentMemberId = memberId;
          const m = state.members.find(x=>x.id===memberId);
          state.view = 'memberDetail';
          render();
          if(m){
            try{
              state.currentMemberStats = await computeMemberAttendanceStats(displayName(m));
              render();
            }catch(e){}
          }
        }
      }else if(sig.startsWith('recurringDetail:')){
        const recId = sig.slice('recurringDetail:'.length);
        if(state.financeAccounts.length===0 && state.financeRecurring.length===0 && state.financeSavingsPots.length===0){
          try{
            const [accounts, recurring, pots] = await Promise.all([
              getClubJSONOrThrow('finance-accounts', []),
              getClubJSONOrThrow('finance-recurring', []),
              getClubJSONOrThrow('finance-savings-pots', [])
            ]);
            state.financeAccounts = accounts;
            state.financeRecurring = recurring;
            state.financeSavingsPots = pots;
            markFetched('financeAccounts');
            markFetched('financeRecurring');
            markFetched('financeSavingsPots');
          }catch(e){}
        }
        state.currentRecurringId = recId==='new' ? null : recId;
        state.view = 'recurringDetail';
        render();
      }else if(sig.startsWith('fineDetail:')){
        const fineId = sig.slice('fineDetail:'.length);
        if(state.finesCatalog.length===0){
          try{ state.finesCatalog = await getClubJSONOrThrow('fines-catalog', []); markFetched('finesCatalog'); }catch(e){}
        }
        state.currentFineId = fineId==='new' ? null : fineId;
        state.view = 'fineDetail';
        render();
      }else if(sig.startsWith('gameDetail:')){
        const gameId = sig.slice('gameDetail:'.length);
        if(state.gamesCatalog.length===0){
          try{ state.gamesCatalog = await getClubJSONOrThrow('games-catalog', []); markFetched('gamesCatalog'); }catch(e){}
        }
        state.currentGameId = gameId==='new' ? null : gameId;
        state.view = 'gameDetail';
        render();
      }else if(sig.startsWith('eventDetail:')){
        const rest = sig.slice('eventDetail:'.length);
        if(state.calendarEvents.length===0 && state.calendarOccurrenceEdits.length===0){
          try{
            const [events, edits, rsvps, members] = await Promise.all([
              getAllCalendarEvents(),
              getAllOccurrenceEdits(),
              getAllCalendarRsvps(),
              getAllMembers()
            ]);
            state.calendarEvents = events;
            state.calendarOccurrenceEdits = edits;
            state.calendarRsvps = rsvps;
            state.members = members;
            markFetched('calendarEvents');
            markFetched('calendarOccurrenceEdits');
            markFetched('calendarRsvps');
            markFetched('members');
          }catch(e){}
        }
        if(rest==='new'){
          state.calendarEditingOccurrence = null;
        }else{
          const sepIdx = rest.indexOf(':');
          const seriesId = rest.slice(0, sepIdx);
          const occurrenceDate = rest.slice(sepIdx+1);
          state.calendarEditingOccurrence = findOccurrenceByIds(seriesId, occurrenceDate);
        }
        state.view = 'eventDetail';
        render();
      }else{
        await goToMain();
      }
      isPopstateNavigation = false;
    })();
  });

  // Zeigt sofort eine Ladeanzeige, bevor auf eine Firestore-Antwort gewartet wird –
  // so wirkt ein Klick nie so, als wäre nichts passiert.
  function renderLoading(message){
    document.getElementById('app').innerHTML = headerHtml() + `<main class="container"><div class="loading"><div class="loading-spinner"></div>${escapeHtml(message)}</div></main>` + bottomNavHtml();
    attachGlobalNavListeners();
  }

  // PayPal.me-Nutzername kommt aus den Club-Stammdaten (clubs/<clubId>.paypalName, wird beim
  // Anlegen des Clubs gesetzt, siehe createClub Cloud Function). Fallback auf null, falls ein
  // Club (noch) keinen PayPal-Namen hinterlegt hat - buildPaypalLink() gibt dann null zurück,
  // Aufrufer müssen das prüfen und den PayPal-Button/Link ausblenden.
  function getPaypalUsername(){
    return (CURRENT_CLUB_DATA && CURRENT_CLUB_DATA.paypalName) || null;
  }
  function buildPaypalLink(amount){
    const username = getPaypalUsername();
    if(!username) return null;
    // PayPal.me erwartet einen Punkt als Dezimaltrennzeichen, kein Komma.
    return `https://paypal.com/paypalme/${username}/${amount.toFixed(2)}`;
  }

  // Client-seitiges Gegenstück zu canManageMembers() in firestore.rules: steuert, ob die
  // Mitgliederverwaltung als bearbeitbar oder read-only angezeigt wird. Die eigentliche
  // Durchsetzung passiert in den Firestore Rules - das hier ist NUR UI (Buttons ausblenden,
  // Formulare sperren), kein Sicherheitsmechanismus für sich allein.
  function canManageMembers(){
    const user = auth.currentUser;
    if(user && user.email===ADMIN_EMAIL) return true;
    return state.currentUserRole==='Kassenwart' || state.currentUserRole==='Präsident';
  }

  // Finanzbereich (Umsätze anlegen/bearbeiten, Rückstandszahlungen erfassen/korrigieren): enger
  // gefasst als canManageMembers() - hier darf NUR Kassenwart oder Admin, bewusst nicht Präsident.
  function canManageFinances(){
    const user = auth.currentUser;
    if(user && user.email===ADMIN_EMAIL) return true;
    return state.currentUserRole==='Kassenwart';
  }

  function getCurrentMemberName(){
    const user = auth.currentUser;
    if(!user || !user.email || user.email===ADMIN_EMAIL) return null;
    const member = state.members.find(m=> (m.email||'').toLowerCase()===user.email.toLowerCase());
    return member ? displayName(member) : null;
  }

  // Bearbeitungsrecht für einen KONKRETEN Kegelabend: Kassenwart/Admin dürfen immer, außerdem
  // die Person, die für DIESEN Abend als Schriftführer benannt wurde (kann sich von Abend zu
  // Abend unterscheiden, siehe Schriftführer-Dropdown beim Anlegen). Alle anderen Mitglieder
  // sehen den Abend nur read-only - unabhängig davon greift für bereits abgeschlossene Abende
  // weiterhin die bestehende detail.closed-Sperre für alle (auch Kassenwart/Schriftführer).
  function canEditEvening(detail){
    if(canManageFinances()) return true;
    if(!detail) return false;
    const myName = getCurrentMemberName();
    if(!myName) return false;
    return detail.seating.some(s=> s.isSchriftfuehrer && s.name===myName);
  }

  function buildOwnArrearsCardHtml(){
    const user = auth.currentUser;
    if(!user || !user.email || user.email===ADMIN_EMAIL) return '';
    const member = state.members.find(m=> (m.email||'').toLowerCase()===user.email.toLowerCase());
    if(!member) return '';
    const name = displayName(member);
    const entry = state.financeArrears.find(a=>a.name===name);
    const amount = entry ? entry.amount : 0;
    const canPayViaPaypal = amount>0 && !!getPaypalUsername();
    const isDue = amount>0;
    return `
      <div class="card own-arrears-card ${isDue?'amount-due':'amount-clear'}"${canPayViaPaypal?` id="own-arrears-pay-link" data-amount="${amount}"`:''}>
        <div class="own-arrears-amount">${fmtEuro(amount)}</div>
        <div class="own-arrears-label">Dein Rückstand${canPayViaPaypal?' · Tippen zum Bezahlen':''}</div>
      </div>
    `;
  }

  // Sucht den chronologisch nächsten anstehenden Termin (heute oder später), über Serien hinweg.
  function getNextUpcomingEvent(){
    const today = todayISO();
    let m = new Date().getMonth()+1;
    let yy = new Date().getFullYear();
    for(let i=0;i<24;i++){
      const events = [];
      state.calendarEvents.forEach(ev=>{
        getOccurrenceStartsOverlappingMonth(ev, yy, m).forEach(startDate=>{
          const occ = buildOccurrenceObject(ev, startDate);
          // "Anstehend" heißt: der Termin ist noch nicht vollständig vorbei (Ende >= heute).
          if(occ && dateOnly(occ.end)>=today) events.push(occ);
        });
      });
      if(events.length>0){
        events.sort((a,b)=> a.start.localeCompare(b.start));
        return events[0];
      }
      m++;
      if(m>12){ m=1; yy++; }
    }
    return null;
  }

  function buildNextEventCardHtml(){
    const occ = getNextUpcomingEvent();
    if(!occ) return '';
    return `
      <div class="card next-event-card" id="next-event-card" data-series-id="${occ.seriesId}" data-occurrence-date="${occ.occurrenceDate}">
        <div class="next-event-title">${escapeHtml(occ.title)}</div>
        <div class="next-event-date">${formatDateDE(dateOnly(occ.start))}</div>
      </div>
    `;
  }

  function buildOverviewTopRowHtml(){
    const arrearsHtml = buildOwnArrearsCardHtml();
    const nextEventHtml = buildNextEventCardHtml();
    if(arrearsHtml && nextEventHtml) return `<div class="overview-top-row">${arrearsHtml}${nextEventHtml}</div>`;
    return arrearsHtml || nextEventHtml;
  }

  function viewSettings(){

  function displayName(m){
    return (m.nickname && m.nickname.trim()) ? m.nickname.trim() : m.firstName;
  }

  // Rückstände werden pro Mitglied bzw. Gast in einem eigenen Dokument gespeichert (siehe
  // arrearsStore weiter oben). Als Dokument-ID dient möglichst die Mitglieds-ID, damit eine
  // spätere Umbenennung (z.B. neuer Spitzname) den Rückstand nicht "verwaist" lässt - nur wenn
  // kein passendes Mitglied gefunden wird (Gast, oder ehemaliges Mitglied ohne aktuellen
  // Datensatz), dient der Name selbst als Fallback-ID. Der Name kommt bei Gästen aus einem freien
  // Texteingabefeld - Schrägstriche würden den Firestore-Dokumentpfad sprengen (nicht erlaubt),
  // und Leerzeichen/Sonderzeichen sind zwar technisch zulässig, machen die ID aber unnötig
  // fragil für Werkzeuge, die den Pfad selbst in eine URL einsetzen (z.B. das Migrations-Script) -
  // deshalb wird alles außer Buchstaben/Ziffern/Bindestrich/Unterstrich durch '_' ersetzt.
  function resolveArrearsDocId(name){
    const member = state.members.find(m=> displayName(m)===name);
    if(member) return member.id;
    const transliterated = name
      .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
      .replace(/Ä/g,'Ae').replace(/Ö/g,'Oe').replace(/Ü/g,'Ue');
    return 'guest-' + transliterated.replace(/[^a-zA-Z0-9_-]/g, '_');
  }

  function viewNew(){
    const today = todayISO();
    const sortedMembers = state.members.slice().sort((a,b)=> displayName(a).localeCompare(displayName(b),'de'));
    const membersHtml = state.members.length===0
      ? `<p class="empty-state">Noch keine Mitglieder angelegt. <a href="#" id="goto-settings-from-new" style="color:var(--felt); text-decoration:underline;">Jetzt in den Einstellungen anlegen</a>.</p>`
      : sortedMembers.map(m=>`
        <label class="member-check-row">
          <input type="checkbox" class="member-checkbox" data-id="${m.id}">
          <span>${escapeHtml(displayName(m))}</span>
        </label>
      `).join('');
    return `
      <div class="card">
        <h2 class="section-title">Neuer Kegelabend</h2>
        <label for="date-input">Datum</label>
        <input type="date" id="date-input" value="${today}">
      </div>
      <div class="card">
        <h3 class="section-title-small">Anwesende Mitglieder</h3>
        <div id="members-checklist">${membersHtml}</div>
      </div>
      <div class="card">
        <h3 class="section-title-small">Gastkegler</h3>
        <div id="guest-list"></div>
        <div class="guest-input-row">
          <input type="text" id="guest-name-input" placeholder="Name des Gasts">
          <button type="button" class="btn-icon-add" id="add-guest-btn" aria-label="Gast hinzufügen">+</button>
        </div>
      </div>
      <div class="card">
        <h3 class="section-title-small">Sitzplan</h3>
        <select id="seating-template-select">${buildEveningSeatingTemplateOptionsHtml()}</select>
      </div>
      <div class="card">
        <h3 class="section-title-small">Schriftführer</h3>
        <select id="schriftfuehrer-select">
          <optgroup label="Zufällig">
            <option value="standard">Standardplatz</option>
            <option value="draw">Auslosen</option>
          </optgroup>
        </select>
      </div>
      <div class="card" style="text-align:center;">
        <div class="seat-counter" id="seat-counter">0 / ${getClubSeatingTemplate().perSide*2} Plätze belegt</div>
        <div class="form-error" id="form-error"></div>
        <button type="button" class="btn-primary" id="confirm-btn" disabled>Zufällig auslosen &amp; festlegen</button>
      </div>
    `;
  }

  function fineTotalForSeat(detail, seatId){
    const seat = detail.seating.find(s=>s.seatId===seatId);
    if(seat && seat.invalid){
      // Fest eingetragens (nach Abschluss) oder dynamisch berechnet (während des Abends)
      if(seat.invalidAmount !== undefined) return seat.invalidAmount;
      return averageOfTotalsRounded(validPresentMemberTotals(detail, seatId));
    }
    const entries = (detail.finesBySeat && detail.finesBySeat[seatId]) || {};
    const catalog = detail.finesCatalogSnapshot || [];
    let total = 0;
    catalog.forEach(f=>{
      if(isFremdstrafeType(f.type)) return;
      if(f.type==='runde') return; // Runden haben keinen Euro-Betrag
      const count = entries[f.id] || 0;
      total += count * f.amount;
    });
    const adHocList = (detail.adHocFinesBySeat && detail.adHocFinesBySeat[seatId]) || [];
    adHocList.forEach(a=>{ total += a.amount; });

    // Fremdstrafen (inkl. "Fremdstrafe + Runde"): wer sie auslöst zahlt selbst nichts,
    // stattdessen zahlen alle anderen Anwesenden.
    const fremdstrafeFines = catalog.filter(f=>isFremdstrafeType(f.type));
    if(fremdstrafeFines.length>0){
      const otherPresentSeats = detail.seating.filter(s=>s.name && s.seatId!==seatId);
      fremdstrafeFines.forEach(f=>{
        otherPresentSeats.forEach(s=>{
          const otherEntries = (detail.finesBySeat && detail.finesBySeat[s.seatId]) || {};
          const count = otherEntries[f.id] || 0;
          total += count * f.amount;
        });
      });
    }
    return total;
  }
  function roundedFineTotalForSeat(detail, seatId){
    return roundUpToFullEuro(fineTotalForSeat(detail, seatId));
  }

  // Pool für Durchschnittsberechnungen: anwesende, gültige (nicht invalide) Mitglieder - ohne Gäste.
  function validPresentMemberTotals(detail, excludeSeatId){
    return detail.seating
      .filter(s=> s.name && !s.invalid && s.seatId!==excludeSeatId)
      .map(s=> roundedFineTotalForSeat(detail, s.seatId));
  }
  function averageOfTotalsRounded(totals){
    if(totals.length===0) return 0;
    return roundUpToFullEuro(totals.reduce((a,b)=>a+b,0)/totals.length);
  }
  function averageOfTotalsExact(totals){
    if(totals.length===0) return 0;
    return totals.reduce((a,b)=>a+b,0)/totals.length;
  }

  // Für die Übersichtsliste: kompakte Kennzahlen eines Abends (anwesende/abwesende Mitglieder,
  // Gäste, Einnahme), werden im Index-Dokument gecacht, damit die Übersicht nicht für jeden
  // Abend das volle Detail-Dokument laden muss.
  function computeEveningSummaryFields(detail){
    const occupied = detail.seating.filter(s=>s.name);
    const presentCount = occupied.filter(s=>!s.isGuest).length;
    const guestCount = occupied.filter(s=>s.isGuest).length;
    const absentList = detail.closed ? (detail.absentMembersFines || []) : [];
    const absentCount = detail.closed ? absentList.length : Math.max(0, state.members.length - presentCount);
    let income = 0;
    occupied.forEach(s=>{ income += roundedFineTotalForSeat(detail, s.seatId); });
    absentList.forEach(a=>{ income += a.amount; });
    // hasOpenRounds landet im Index (evenings-index), damit carryOverOpenRounds() beim Anlegen
    // eines neuen Abends NICHT für jeden vergangenen Abend das komplette Detail-Dokument (inkl.
    // aller Sitzplatz-Unterdokumente) laden muss, sondern per Index vorfiltern kann. Eine Instanz
    // zählt nur, wenn sie weder gegeben NOCH bereits an einen anderen Abend weitergereicht wurde
    // (siehe carriedAway in computeRoundEntries) - sonst würde ein Abend fälschlich als "hat keine
    // offenen Runden mehr" gelten, nur weil EINE seiner mehreren offenen Runden übernommen wurde.
    const hasOpenRounds = computeRoundEntries(detail).some(e=>!e.given && !e.carriedAway);
    return { presentCount, guestCount, absentCount, income, hasOpenRounds };
  }
  // Aktualisiert den Index-Eintrag eines Abends mit den aktuellen Kennzahlen (mutiert state.eveningsIndex).
  function updateEveningIndexSummary(detail){
    const idx = state.eveningsIndex.findIndex(e=>e.id===detail.id);
    if(idx>=0) state.eveningsIndex[idx] = {...state.eveningsIndex[idx], ...computeEveningSummaryFields(detail)};
  }

  // Holt den GARANTIERT aktuellen Serverstand von evenings-index (nie aus dem lokalen Cache),
  // mit state.eveningsIndex als Fallback, falls das Dokument (noch) nicht existiert.
  async function getEveningsIndexFromServer(){
    try{
      const snap = await withTimeout(getDocFromServer(clubDocRef('evenings-index')), STORAGE_TIMEOUT_MS);
      return snap.exists() ? JSON.parse(snap.data().value) : [];
    }catch(e){
      console.error('Konnte evenings-index nicht vom Server laden, nutze lokalen Stand als Fallback', e);
      return state.eveningsIndex;
    }
  }

  // ZENTRALER Schreib-Helper für ALLE Änderungen an evenings-index (anlegen, löschen,
  // Kennzahlen aktualisieren, Karteileichen entfernen).
  //
  // WICHTIG: mutatorFn bekommt NICHT state.eveningsIndex, sondern den frisch vom Server
  // geholten Stand übergeben, und das Ergebnis wird sowohl zurückgeschrieben als auch in
  // state.eveningsIndex übernommen. Vorher bauten alle Schreibstellen direkt auf
  // state.eveningsIndex auf - war dieser lokale Stand durch den Firestore-Client-Cache
  // (persistentLocalCache, siehe initializeFirestore()) veraltet (z.B. weil ein Kegelabend
  // gerade per deleteEvening-Cloud-Function gelöscht wurde, was am Client komplett vorbeischreibt
  // und den Cache nicht invalidiert), wurde dieser veraltete Stand bei JEDEM weiteren Schreiben
  // erneut zementiert - ein bereits korrekt gelöschter Abend konnte so durch das bloße Anlegen
  // eines NEUEN Abends (dessen newIndex auf dem stale state.eveningsIndex aufbaute) versehentlich
  // wiederhergestellt werden. Indem jede Schreiboperation zwingend zuerst den echten Serverstand
  // holt und NUR darauf ihre eigene, lokal bekannte Änderung anwendet, kann kein stale Zustand
  // mehr über einen Schreibvorgang "zurückgeholt" werden.
  //
  // mutatorFn(serverIndex) muss den NEUEN Index-Array zurückgeben (reiner Funktionsstil, kein
  // In-Place-Mutieren von serverIndex nötig, aber unschädlich).
  async function updateEveningsIndex(mutatorFn){
    const serverIndex = await getEveningsIndexFromServer();
    const newIndex = mutatorFn(serverIndex);
    await setClubJSON('evenings-index', newIndex);
    state.eveningsIndex = newIndex;
    return newIndex;
  }

  // Entfernt einen Index-Eintrag, dessen zugehöriges Hauptdokument in Firestore nicht mehr
  // existiert (getEveningDetail() liefert null), aus state.eveningsIndex und speichert den
  // bereinigten Index zurück. Wird aufgerufen, wenn der Versuch, einen Abend zu öffnen
  // (openEveningDetail(), goToTodayEvening()), fehlschlägt, weil das Dokument fehlt - das ist der
  // zuverlässigste Zeitpunkt für diese Selbstheilung, weil zu diesem Zeitpunkt zweifelsfrei
  // feststeht, dass der Eintrag verwaist ist (nicht bloß ein Cache-Timing-Problem). Ein solcher
  // Karteileichen-Eintrag kann z.B. entstehen, wenn ein früherer Löschvorgang
  // (deleteEvening Cloud Function) durch eine Race Condition mit einem gleichzeitigen Schreiben
  // auf evenings-index (anderes Gerät/Tab, oder ein noch nicht abgeschlossener vorheriger
  // Speichervorgang) überschrieben wurde. Ohne diese Bereinigung blieb ein solcher Eintrag für
  // immer in evenings-index bestehen, auch nach Reload, weil sonst kein Mechanismus
  // evenings-index gegen die tatsächlich existierenden evenings-Dokumente abgleicht.
  async function removeOrphanedEveningIndexEntry(eveningId){
    // Sofortiges lokales Update für unmittelbare Anzeige, BEVOR der Server-Roundtrip
    // abgeschlossen ist (siehe render()-Aufruf unten) - der maßgebliche, dauerhaft gespeicherte
    // Stand kommt aber aus updateEveningsIndex(), das zwingend gegen den frischen Serverstand
    // arbeitet (siehe dortiger Kommentar).
    const before = state.eveningsIndex.length;
    state.eveningsIndex = state.eveningsIndex.filter(e=>e.id!==eveningId);
    if(state.eveningsIndex.length===before) return; // war ohnehin nicht (mehr) im Index
    markFetched('eveningsIndex');
    if(state.view==='main') render();
    try{
      await updateEveningsIndex(serverIndex=> serverIndex.filter(e=>e.id!==eveningId));
    }catch(e){
      console.error('Konnte verwaisten evenings-index-Eintrag nicht zurückspeichern', e);
    }
  }
  // Holt für Abende, deren Index-Eintrag noch keine Kennzahlen enthält (ältere Einträge vor
  // Einführung dieses Felds), einmalig das Detail-Dokument nach und cacht die Kennzahlen im Index.
  //
  // SELBSTHEILUNG verwaister Index-Einträge: existiert zu einem Index-Eintrag KEIN
  // Hauptdokument mehr (getEveningDetail() liefert null), wird der Eintrag hier automatisch aus
  // state.eveningsIndex entfernt und der bereinigte Index zurückgespeichert. Das kann passieren,
  // wenn eine frühere Löschung (deleteEvening Cloud Function) durch eine Race Condition den
  // Index-Eintrag stehen ließ (z.B. gleichzeitige Schreibvorgänge auf evenings-index von einem
  // anderen Gerät/Tab) oder ein noch stärker veralteter Client-Cache-Stand aus dem Delete-Zeitpunkt
  // erneut gespeichert wurde, bevor der Löschvorgang serverseitig durchgeschlagen war. Ohne diese
  // Bereinigung blieb ein solcher Karteileichen-Eintrag für immer bestehen (auch nach Reload),
  // weil es sonst keinen weiteren Mechanismus gibt, der evenings-index gegen die tatsächlich
  // existierenden evenings-Dokumente abgleicht.
  async function backfillEveningSummaries(){
    const missing = state.eveningsIndex.filter(e=> e.income===undefined);
    if(missing.length===0) return;
    try{
      const details = await Promise.all(missing.map(e=> getEveningDetail(e.id)));
      const orphanedIds = new Set();
      const summaryById = {};
      details.forEach((detail, i)=>{
        if(!detail){ orphanedIds.add(missing[i].id); return; }
        summaryById[missing[i].id] = computeEveningSummaryFields(detail);
      });
      if(Object.keys(summaryById).length===0 && orphanedIds.size===0) return;

      // Sofortiges lokales Update für unmittelbare Anzeige, bevor der Server-Roundtrip
      // abgeschlossen ist (siehe render()-Aufruf unten).
      state.eveningsIndex = state.eveningsIndex
        .filter(e=> !orphanedIds.has(e.id))
        .map(e=> summaryById[e.id] ? {...e, ...summaryById[e.id]} : e);
      if(orphanedIds.size>0) console.warn('Verwaiste evenings-index-Einträge ohne Hauptdokument entfernt:', [...orphanedIds]);
      if(state.view==='main') render();

      // Der maßgebliche, dauerhaft gespeicherte Stand kommt aus updateEveningsIndex(), das
      // zwingend gegen den frischen Serverstand arbeitet (siehe dortiger Kommentar) - wichtig,
      // weil backfillEveningSummaries() im Hintergrund ohne await läuft (siehe Aufrufstellen in
      // goToMain()/init()) und daher etwas dauern kann, während zwischenzeitlich z.B. ein
      // Abend gelöscht wurde.
      await updateEveningsIndex(serverIndex=> serverIndex
        .filter(e=> !orphanedIds.has(e.id))
        .map(e=> summaryById[e.id] ? {...e, ...summaryById[e.id]} : e)
      );
      if(state.view==='main') render();
    }catch(e){ console.error('Backfill der Abend-Kennzahlen fehlgeschlagen', e); }
  }

  // Ermittelt die Sitzplätze mit den meisten "Pudel"-Strafen (bei Gleichstand: alle).
  function computePudelCrownSeatIds(detail){
    const occupied = detail.seating.filter(s=>s.name);
    const catalog = detail.finesCatalogSnapshot || [];
    const pudelFineIds = catalog.filter(f=>f.type==='pudel').map(f=>f.id);
    function pudelCountForSeat(seatId){
      const entries = (detail.finesBySeat && detail.finesBySeat[seatId]) || {};
      return pudelFineIds.reduce((sum,id)=> sum + (entries[id]||0), 0);
    }
    const counts = occupied.map(s=>({seatId:s.seatId, count:pudelCountForSeat(s.seatId)}));
    const maxPudel = counts.length>0 ? Math.max(0, ...counts.map(c=>c.count)) : 0;
    return maxPudel>0 ? new Set(counts.filter(c=>c.count===maxPudel).map(c=>c.seatId)) : new Set();
  }

  // Berechnet die einzelnen Runden-Einträge eines Abends aus finesBySeat: für jede Strafenart vom
  // Typ 'runde' oder 'fremdstrafe_runde' (isFremdstrafeType-unabhängig - eine "Fremdstrafe + Runde"
  // löst für den Verursacher trotzdem eine eigene, zu gebende Runde aus) und jeden besetzten
  // Sitzplatz wird PRO GEZÄHLTER STRAFE ein eigener Eintrag erzeugt ("Max (Freibier)"). Jede
  // Instanz wird über ihren Index (0, 1, 2, ...) innerhalb (seatId, fineId) identifiziert - der
  // "gegeben"-Status kommt aus detail.roundsGivenBySeat[seatId][fineId], einer Liste genau dieser
  // Indizes, die individuell markiert wurden (kein Zähler mehr: jede Zeile ist unabhängig
  // abhakbar). Wird die zugrunde liegende Strafe reduziert, filtert computeRoundEntries
  // automatisch die dann nicht mehr existierenden Indizes (>= neuer count) heraus; die
  // eigentliche Bereinigung von roundsGivenBySeat passiert zusätzlich in adjustFineCount.
  // carriedAway markiert PRO EINZELNER INSTANZ (nicht pro Abend!), ob diese offene Runde bereits
  // an einen späteren Abend weitergereicht wurde - Pendant zu roundsGivenBySeat, aber für den
  // "weitergegeben statt gegeben"-Zustand. Wichtig: ein Abend kann mehrere offene Runden
  // verschiedener Personen haben, von denen nur ein Teil an einen bestimmten neuen Abend
  // übernommen werden kann (z.B. weil nicht alle Personen dort anwesend sind) - ein einziges
  // Boolean-Flag pro ABEND kann das nicht korrekt abbilden (frühere Version dieses Features hatte
  // genau diesen Fehler: roundsCarriedForward auf Abendebene führte dazu, dass die offene Runde
  // einer nicht anwesenden Person verloren ging, sobald irgendeine andere Person an diesem Abend
  // erfolgreich übernommen wurde). Jede einzelne Instanz trägt ihren Status daher selbst.
  function computeRoundEntries(detail){
    const catalog = detail.finesCatalogSnapshot || [];
    const roundFines = catalog.filter(f=> f.type==='runde' || f.type==='fremdstrafe_runde');
    const carriedOver = detail.carriedOverRounds || [];
    if(roundFines.length===0 && carriedOver.length===0) return [];
    const bySeatId = {};
    detail.seating.forEach(s=>{ bySeatId[s.seatId] = s; });
    const perSide = getEveningSeatingTemplate(detail).perSide;
    const interleavedOrder = [];
    for(let i=1;i<=perSide;i++){ interleavedOrder.push('saal-'+i, 'kneipe-'+i); }
    const occupied = interleavedOrder.map(id=>bySeatId[id]).filter(s=>s && s.name);

    const entries = [];
    occupied.forEach(seat=>{
      const seatEntries = (detail.finesBySeat && detail.finesBySeat[seat.seatId]) || {};
      const givenMap = (detail.roundsGivenBySeat && detail.roundsGivenBySeat[seat.seatId]) || {};
      const carriedAwayMap = (detail.roundsCarriedAwayBySeat && detail.roundsCarriedAwayBySeat[seat.seatId]) || {};
      roundFines.forEach(fine=>{
        const count = seatEntries[fine.id] || 0;
        if(count<=0) return;
        const givenIndices = new Set(givenMap[fine.id] || []);
        const carriedAwayIndices = new Set(carriedAwayMap[fine.id] || []);
        for(let i=0;i<count;i++){
          entries.push({
            seatId: seat.seatId,
            fineId: fine.id,
            name: seat.name,
            fineName: fine.name,
            given: givenIndices.has(i),
            carriedAway: carriedAwayIndices.has(i),
            instanceIndex: i,
            carried: false
          });
        }
      });
    });
    // Übernommene Runden aus einem vergangenen Abend (siehe carryOverOpenRounds()) - eigener
    // Datentopf ohne Bezug zu finesBySeat, damit keine Fremdstrafe-Beträge erneut ausgelöst
    // werden. Nur Personen, die an DIESEM Abend auch tatsächlich sitzen (occupied), werden
    // berücksichtigt - carryOverOpenRounds() filtert das bereits beim Anlegen, hier zusätzlich
    // defensiv, falls sich die Besetzung nachträglich ändert.
    const occupiedNames = new Set(occupied.map(s=>s.name));
    carriedOver.forEach(c=>{
      if(!occupiedNames.has(c.name)) return;
      entries.push({
        seatId: null,
        fineId: c.fineId,
        name: c.name,
        fineName: c.fineName,
        given: !!c.given,
        carriedAway: false,
        instanceIndex: c.id,
        carried: true,
        sourceDate: c.sourceDate || null
      });
    });
    return entries;
  }

  // Baut den Inhalt des "Runden"-Tabs: offene Runden oben mit "Gegeben"-Button, bereits gegebene
  // Runden weiter unten in einem eigenen Bereich "Gegebene Runden" (nur noch informativ, ohne
  // Aktions-Button). Runden können hier nur als gegeben markiert, nicht gelöscht werden -
  // Löschen/Reduzieren läuft ausschließlich über die Strafen-Zähler auf der Personen-Detailseite.
  function buildRoundsTab(detail){
    // carriedAway-Instanzen (an einen späteren Abend weitergereicht, siehe carryOverOpenRounds())
    // werden hier nicht mehr angezeigt - sie erscheinen stattdessen im neuen Abend als "carried"-
    // Eintrag. Ohne diesen Filter würden sie fälschlich weiterhin als offene Runde in diesem
    // (dem alten) Abend auftauchen, obwohl die Pflicht bereits weitergegeben wurde.
    const entries = computeRoundEntries(detail).filter(e=>!e.carriedAway);
    const closed = !!detail.closed || !canEditEvening(detail);
    if(entries.length===0){
      return `
        <div class="card">
          <h2 class="section-title">Runden</h2>
          <p class="empty-state">Noch keine Runden für diesen Abend.</p>
        </div>
      `;
    }
    const openEntries = entries.filter(e=>!e.given);
    const givenEntries = entries.filter(e=>e.given);

    function initialsFor(name){
      const member = (state.members||[]).find(m=> displayName(m)===name);
      if(member && member.firstName && member.lastName){
        return (member.firstName[0]+member.lastName[0]).toUpperCase();
      }
      const parts = String(name||'').trim().split(/\s+/).filter(Boolean);
      if(parts.length===0) return '?';
      if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
      return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
    }

    function openRowHtml(e){
      return `
        <div class="round-entry-row" data-seat-id="${e.seatId||''}" data-fine-id="${e.fineId}" data-instance-index="${e.instanceIndex}" data-carried="${e.carried?'1':'0'}">
          <span class="round-avatar">${escapeHtml(initialsFor(e.name))}</span>
          <span class="round-entry-main">
            <span class="round-entry-name">${escapeHtml(e.name)}</span>
            <span class="round-entry-badge">${escapeHtml(e.fineName)}${e.carried ? ` <span class="round-carried-tag">· übernommen vom ${e.sourceDate ? escapeHtml(formatDateShortDE(e.sourceDate)) : '?'}</span>` : ''}</span>
          </span>
          ${closed ? '' : `<button type="button" class="round-mark-given-btn" data-seat-id="${e.seatId||''}" data-fine-id="${e.fineId}" data-instance-index="${e.instanceIndex}" data-carried="${e.carried?'1':'0'}" aria-label="Als gegeben markieren" title="Als gegeben markieren"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></button>`}
        </div>
      `;
    }
    function givenRowHtml(e){
      return `
        <div class="round-entry-row given">
          <span class="round-avatar">${escapeHtml(initialsFor(e.name))}</span>
          <span class="round-entry-main">
            <span class="round-entry-name">${escapeHtml(e.name)}</span>
            <span class="round-entry-badge">${escapeHtml(e.fineName)}${e.carried ? ` <span class="round-carried-tag">· übernommen vom ${e.sourceDate ? escapeHtml(formatDateShortDE(e.sourceDate)) : '?'}</span>` : ''}</span>
          </span>
          ${closed ? `<svg class="round-given-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>` : `<button type="button" class="round-undo-given-btn" data-seat-id="${e.seatId||''}" data-fine-id="${e.fineId}" data-instance-index="${e.instanceIndex}" data-carried="${e.carried?'1':'0'}" aria-label="Rückgängig machen" title="Rückgängig machen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>`}
        </div>
      `;
    }
    const givenIsOpen = !!state.roundsGivenSectionOpen;
    return `
      <div class="card">
        <h2 class="section-title">Runden <span class="member-count">(${openEntries.length} offen)</span></h2>
        ${openEntries.length===0 && givenEntries.length===0 ? `<p class="empty-state">Alle Runden wurden gegeben.</p>` : ''}
        <div id="rounds-open-list">
          ${openEntries.map(openRowHtml).join('')}
        </div>
        ${givenEntries.length>0 ? `
          <button type="button" class="rounds-given-toggle${givenIsOpen ? ' open' : ''}" id="rounds-given-toggle-btn">
            <span class="rounds-given-toggle-label">Gegeben (${givenEntries.length})</span>
            <svg class="rounds-given-toggle-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="rounds-given-list${givenIsOpen ? '' : ' collapsed'}" id="rounds-given-list">
            ${givenEntries.map(givenRowHtml).join('')}
          </div>
        ` : ''}
      </div>
    `;
  }

  // Markiert eine einzelne Runden-Instanz als gegeben. Jede Zeile ist unabhängig: der Index der
  // angeklickten Instanz wird zur Liste in roundsGivenBySeat[seatId][fineId] hinzugefügt.
  // "carried"-Instanzen (aus carryOverOpenRounds() übernommene Runden ohne Geldbetrag, siehe
  // computeRoundEntries) liegen in detail.carriedOverRounds statt in finesBySeat/roundsGivenBySeat
  // und werden deshalb separat behandelt (eigenes carriedRoundId statt seatId+fineId+instanceIndex).
  async function markRoundGiven(seatId, fineId, instanceIndex, carried){
    const detail = state.currentEveningDetail;
    if(carried){
      const entry = (detail.carriedOverRounds||[]).find(c=>c.id===instanceIndex);
      if(entry) entry.given = true;
      render();
      await saveEveningMainDoc(detail);
      return;
    }
    if(!detail.roundsGivenBySeat) detail.roundsGivenBySeat = {};
    if(!detail.roundsGivenBySeat[seatId]) detail.roundsGivenBySeat[seatId] = {};
    const current = detail.roundsGivenBySeat[seatId][fineId] || [];
    if(!current.includes(instanceIndex)) detail.roundsGivenBySeat[seatId][fineId] = [...current, instanceIndex];
    render();
    await saveEveningSeatFinesAndIndex(detail, seatId);
  }

  // Macht eine als "gegeben" markierte Runden-Instanz wieder rückgängig (z.B. bei Fehlklick):
  // entfernt den Index aus roundsGivenBySeat[seatId][fineId], die Instanz landet danach wieder
  // in den offenen Runden. Siehe markRoundGiven() zum carried-Sonderfall.
  async function unmarkRoundGiven(seatId, fineId, instanceIndex, carried){
    const detail = state.currentEveningDetail;
    if(carried){
      const entry = (detail.carriedOverRounds||[]).find(c=>c.id===instanceIndex);
      if(entry) entry.given = false;
      render();
      await saveEveningMainDoc(detail);
      return;
    }
    if(!detail.roundsGivenBySeat || !detail.roundsGivenBySeat[seatId]) return;
    const current = detail.roundsGivenBySeat[seatId][fineId] || [];
    detail.roundsGivenBySeat[seatId][fineId] = current.filter(i=>i!==instanceIndex);
    render();
    await saveEveningSeatFinesAndIndex(detail, seatId);
  }

  function buildFinesSummary(detail){
    const bySeatId = {};
    detail.seating.forEach(s=>{ bySeatId[s.seatId] = s; });
    const perSide = getEveningSeatingTemplate(detail).perSide;
    const interleavedOrder = [];
    for(let i=1;i<=perSide;i++){ interleavedOrder.push('saal-'+i, 'kneipe-'+i); }
    const occupied = interleavedOrder.map(id=>bySeatId[id]).filter(s=>s && s.name);

    const crownSeatIds = computePudelCrownSeatIds(detail);

    const rowsHtml = occupied.length===0
      ? `<p class="empty-state">Keine Teilnehmer für diesen Abend.</p>`
      : occupied.map(s=>{
        const hasCrown = crownSeatIds.has(s.seatId);
        const crownHtml = hasCrown ? `<span class="pudel-crown" title="Pudelkönig"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 10H5L3 8z"/></svg></span>` : '';
        return `
        <div class="fines-summary-row" data-seat-id="${s.seatId}" data-name="${escapeHtml(s.name)}">
          <span class="fines-summary-name">${escapeHtml(s.name)}${crownHtml}${s.invalid ? `<span class="invalid-icon" title="Invalide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></span>` : ''}</span>
          <span class="fines-summary-amount">${fmtEuro(roundedFineTotalForSeat(detail, s.seatId))}</span>
        </div>
      `;
      }).join('');

    const absentList = detail.closed ? (detail.absentMembersFines || []) : [];
    const absentHtml = absentList.length===0 ? '' : `
      <div class="card">
        <h3 class="section-title-small">Abwesende Mitglieder</h3>
        <div class="fines-summary-header-row"><span>Name</span><span>Strafe</span></div>
        ${absentList.map(a=>`
          <div class="fines-summary-row not-clickable">
            <span class="fines-summary-name">${escapeHtml(a.name)}</span>
            <span class="fines-summary-amount">${fmtEuro(a.amount)}</span>
          </div>
        `).join('')}
      </div>
    `;

    let totalEinnahme = 0;
    occupied.forEach(s=>{ totalEinnahme += roundedFineTotalForSeat(detail, s.seatId); });
    absentList.forEach(a=>{ totalEinnahme += a.amount; });

    return `
      <div class="card">
        <div class="fines-summary-header-row"><span>Name</span><span>Aktuelle Strafen</span></div>
        ${rowsHtml}
      </div>
      ${absentHtml}
      <div class="card">
        <div class="stat-total"><span>Einnahme</span><span>${fmtEuro(totalEinnahme)}</span></div>
      </div>
    `;
  }

  function viewPersonFineDetail(){
    const detail = state.currentEveningDetail;
    const seatId = state.currentFineSeatId;
    const seat = detail.seating.find(s=>s.seatId===seatId);
    // "closed" steuert hier ob Bearbeitungs-Controls (+/-, Geldstrafe hinzufügen) angezeigt
    // werden - für Nutzer ohne Bearbeitungsrecht (siehe canEditEvening()) wirkt der Abend also
    // wie geschlossen, auch wenn er es formal nicht ist.
    const closed = !!detail.closed || !canEditEvening(detail);
    const invalid = !!(seat && seat.invalid);

    if(invalid){
      const isClosed = !!detail.closed;
      const exactAvg = seat.invalidAmount !== undefined
        ? seat.invalidAmount
        : averageOfTotalsExact(validPresentMemberTotals(detail, seatId));
      const roundedAvg = seat.invalidAmount !== undefined
        ? seat.invalidAmount
        : averageOfTotalsRounded(validPresentMemberTotals(detail, seatId));
      const hintText = isClosed
        ? 'Diese Person ist als <strong>invalide</strong> markiert. Es werden keine Strafen gepflegt. Der Durchschnitt der anderen Anwesenden wurde beim Abschließen des Abends fest hinterlegt.'
        : 'Diese Person ist als <strong>invalide</strong> markiert. Es werden keine Strafen gepflegt. Beim Abschließen des Abends wird der Durchschnitt der anderen Anwesenden fest hinterlegt.';
      const exactLabel = isClosed ? 'Durchschnitt (genau)' : 'Vorläufiger Durchschnitt (genau)';
      const roundedLabel = isClosed ? 'Durchschnitt (gerundet)' : 'Vorläufiger Durchschnitt (gerundet)';

          <div class="stat-total"><span>${roundedLabel}</span><span>${fmtEuro(roundedAvg)}</span></div>

    const entries = (detail.finesBySeat && detail.finesBySeat[seatId]) || {};
    const catalog = detail.finesCatalogSnapshot || [];
    const nonRundenCatalog = catalog.filter(f=>f.type!=='runde');
    const rundenCatalog = catalog.filter(f=>f.type==='runde');

    function fineDetailRowHtml(f, entries, closed){
      const count = entries[f.id] || 0;
      const result = count * f.amount;
      const isFremd = isFremdstrafeType(f.type);
      const isRunde = f.type==='runde';
      const resultDisplay = isFremd ? '' : isRunde ? 'Runde' : fmtEuro(result);
      return `
        <div class="fine-detail-row${closed?' readonly':''}" data-fine-id="${f.id}">
          <span class="fine-detail-name">${escapeHtml(f.name)}${isFremd ? `<span class="fremdstrafe-tag" title="Fremdstrafe">${fineTypeIconSvg('fremdstrafe')}</span>` : ''}</span>
          <span class="fine-detail-controls">
            ${closed ? '' : `<button type="button" class="fine-minus-btn" data-fine-id="${f.id}" aria-label="Um 1 verringern">−</button>`}
            <span class="fine-detail-count">${count}×</span>
          </span>
          <span class="fine-detail-result">${resultDisplay}</span>
        </div>
      `;
    }

    const visibleNonRundenCatalog = closed ? nonRundenCatalog.filter(f=>(entries[f.id]||0)>0) : nonRundenCatalog;
    const visibleRundenCatalog = closed ? rundenCatalog.filter(f=>(entries[f.id]||0)>0) : rundenCatalog;
    const rowsHtml = visibleNonRundenCatalog.map(f=>fineDetailRowHtml(f, entries, closed)).join('');
    const rundenRowsHtml = visibleRundenCatalog.map(f=>fineDetailRowHtml(f, entries, closed)).join('');

    const otherPresentSeats = detail.seating.filter(s=>s.name && s.seatId!==seatId);
    const fremdstrafeChargeRows = [];
    catalog.filter(f=>isFremdstrafeType(f.type)).forEach(f=>{
      otherPresentSeats.forEach(s=>{
        const otherEntries = (detail.finesBySeat && detail.finesBySeat[s.seatId]) || {};
        const count = otherEntries[f.id] || 0;
        if(count>0){
          fremdstrafeChargeRows.push(`
            <div class="fine-detail-row fremdstrafe-charge-row readonly">
              <span class="fine-detail-name">${escapeHtml(f.name)} durch ${escapeHtml(s.name)}</span>
              <span class="fine-detail-controls"><span class="fine-detail-count">${count}×</span></span>
              <span class="fine-detail-result">${fmtEuro(count*f.amount)}</span>
            </div>
          `);
        }
      });
    });

    const adHocList = (detail.adHocFinesBySeat && detail.adHocFinesBySeat[seatId]) || [];
    const adHocRowsHtml = adHocList.map(a=>`
      <div class="adhoc-fine-row" data-id="${a.id}">
        <span class="fine-detail-name">${escapeHtml(a.name)}</span>
        <span class="fine-detail-result">${fmtEuro(a.amount)}</span>
        ${closed ? '' : `
        <span class="row-actions">
          <button type="button" class="icon-btn edit-adhoc-btn" data-id="${a.id}" aria-label="Bearbeiten">✎</button>
          <button type="button" class="icon-btn delete-adhoc-btn" data-id="${a.id}" aria-label="Löschen">✕</button>
        </span>`}
      </div>
    `).join('');

    const total = fineTotalForSeat(detail, seatId);
    return `
      <div class="card">
        <h3 class="section-title-small">Strafen</h3>
        ${visibleNonRundenCatalog.length===0 ? `<p class="empty-state">${closed ? 'Keine Strafen vergeben.' : 'Für diesen Abend sind keine Strafen hinterlegt.'}</p>` : rowsHtml}
      </div>
      ${fremdstrafeChargeRows.length>0 ? `
      <div class="card">
        <h3 class="section-title-small">Fremdstrafen</h3>
        ${fremdstrafeChargeRows.join('')}
      </div>` : ''}
      <div class="card">
        <h3 class="section-title-small">Geldstrafen</h3>
        ${adHocList.length===0 ? `<p class="empty-state">Noch keine Geldstrafen.${closed?'':' Über das „+“ oben hinzufügen.'}</p>` : adHocRowsHtml}
      </div>
      ${visibleRundenCatalog.length>0 ? `
      <div class="card">
        <h3 class="section-title-small">Runden</h3>
        ${rundenRowsHtml}
      </div>` : ''}
      <div class="card">
        <div class="stat-total-raw"><span>Gesamt (genau)</span><span>${fmtEuro(total)}</span></div>
        <div class="stat-total"><span>Gesamt (gerundet)</span><span>${fmtEuro(roundUpToFullEuro(total))}</span></div>
      </div>
    `;
  }

  // Speichert die Strafen für einen bestimmten Sitzplatz eines Abends und hält gleichzeitig die
  // Kennzahlen im Index aktuell - gebündelter Helper für alle Stellen, die nur an EINEM Sitzplatz
  // etwas ändern (Katalog-Strafe hoch/runter zählen, Geldstrafe hinzufügen/bearbeiten/löschen).
  // roundsCarriedAwayBySeat wird IMMER mitgegeben, auch wenn diese Funktion es selbst nicht
  // ändert - saveEveningSeatFines() schreibt das Sitzplatz-Unterdokument komplett neu (tx.set
  // statt Merge), ein fehlender Wert würde ein zuvor gesetztes carriedAway-Flag sonst löschen.
  async function saveEveningSeatFinesAndIndex(detail, seatId){
    updateEveningIndexSummary(detail);
    const summary = computeEveningSummaryFields(detail);
    await Promise.all([
      saveEveningSeatFines(detail.id, seatId, (detail.finesBySeat||{})[seatId], (detail.adHocFinesBySeat||{})[seatId], (detail.roundsGivenBySeat||{})[seatId], (detail.roundsCarriedAwayBySeat||{})[seatId]),
      updateEveningsIndex(serverIndex=> serverIndex.map(e=> e.id===detail.id ? {...e, ...summary} : e))
    ]);
  }

  // Speichert die Strafen für MEHRERE Sitzplätze gleichzeitig (z.B. Sammel-Eintragung "Verlorenes
  // Spiel" für mehrere Mitspieler auf einmal) - jeder Sitzplatz läuft über seine eigene
  // Transaktion, unterschiedliche Sitzplätze können sich also weiterhin nicht kollidieren.
  async function saveEveningSeatsFinesAndIndex(detail, seatIds){
    updateEveningIndexSummary(detail);
    const summary = computeEveningSummaryFields(detail);
    const uniqueSeatIds = [...new Set(seatIds)];
    await Promise.all([
      ...uniqueSeatIds.map(seatId=> saveEveningSeatFines(detail.id, seatId, (detail.finesBySeat||{})[seatId], (detail.adHocFinesBySeat||{})[seatId], (detail.roundsGivenBySeat||{})[seatId], (detail.roundsCarriedAwayBySeat||{})[seatId])),
      updateEveningsIndex(serverIndex=> serverIndex.map(e=> e.id===detail.id ? {...e, ...summary} : e))
    ]);
  }

  async function adjustFineCount(fineId, delta){
    const detail = state.currentEveningDetail;
    const seatId = state.currentFineSeatId;
    if(!detail.finesBySeat) detail.finesBySeat = {};
    if(!detail.finesBySeat[seatId]) detail.finesBySeat[seatId] = {};
    const current = detail.finesBySeat[seatId][fineId] || 0;
    const newCount = Math.max(0, current + delta);
    detail.finesBySeat[seatId][fineId] = newCount;
    // Wird eine Runden-Strafe (type 'runde' oder 'fremdstrafe_runde') reduziert, müssen aus der
    // "gegeben"-Liste auf der Runden-Seite auch die Indizes entfernt werden, die es jetzt nicht
    // mehr gibt (>= newCount) - sonst blieben Instanzen als "gegeben" markiert, die computeRoundEntries
    // gar nicht mehr erzeugt.
    const catalog = detail.finesCatalogSnapshot || state.finesCatalog;
    const fine = catalog.find(f=>f.id===fineId);
    const isRoundFine = fine && (fine.type==='runde' || fine.type==='fremdstrafe_runde');
    if(isRoundFine && detail.roundsGivenBySeat && detail.roundsGivenBySeat[seatId] && detail.roundsGivenBySeat[seatId][fineId]){
      detail.roundsGivenBySeat[seatId][fineId] = detail.roundsGivenBySeat[seatId][fineId].filter(i=>i<newCount);
    }
    // Analog: bereits an einen späteren Abend weitergereichte Instanzen (carriedAway), die durch
    // die Reduzierung nicht mehr existieren, müssen ebenfalls entfernt werden - sonst könnte
    // computeEveningSummaryFields()/hasOpenRounds auf Basis einer Instanz rechnen, die es gar
    // nicht mehr gibt.
    if(isRoundFine && detail.roundsCarriedAwayBySeat && detail.roundsCarriedAwayBySeat[seatId] && detail.roundsCarriedAwayBySeat[seatId][fineId]){
      detail.roundsCarriedAwayBySeat[seatId][fineId] = detail.roundsCarriedAwayBySeat[seatId][fineId].filter(i=>i<newCount);
    }
    render();
    await saveEveningSeatFinesAndIndex(detail, seatId);
  }

      </select>
      <div id="geldstrafe-custom-name-wrap" style="${(showCustom || state.gamesCatalog.length===0) ? '' : 'display:none;'}">
        <label for="geldstrafe-custom-name">Bezeichnung</label>

      <p class="form-error" id="geldstrafe-form-error"></p>
      <div class="confirm-row-buttons">
        <button type="button" class="btn-primary" id="save-geldstrafe-btn">${isEdit?'Speichern':'Hinzufügen'}</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    const selectEl = document.getElementById('geldstrafe-name-select');
    const customWrap = document.getElementById('geldstrafe-custom-name-wrap');
    selectEl.addEventListener('change', ()=>{
      customWrap.style.display = selectEl.value==='__sonstiges__' ? '' : 'none';
    });
    document.getElementById('save-geldstrafe-btn').addEventListener('click', async ()=>{
      const errEl = document.getElementById('geldstrafe-form-error');
      let name;
      if(selectEl.value==='__sonstiges__'){
        name = document.getElementById('geldstrafe-custom-name').value.trim();
        if(!name){ if(errEl) errEl.textContent='Bitte eine Bezeichnung angeben.'; return; }
      }else{
        const game = state.gamesCatalog.find(g=>g.id===selectEl.value);

      const submitBtn = document.getElementById('save-geldstrafe-btn');
      submitBtn.disabled = true; submitBtn.textContent = isEdit ? 'Speichert…' : 'Wird hinzugefügt…';
      const rounded = Math.round(amount*100)/100;
      const detail = state.currentEveningDetail;
      const seatId = state.currentFineSeatId;
      if(!detail.adHocFinesBySeat) detail.adHocFinesBySeat = {};
      if(!detail.adHocFinesBySeat[seatId]) detail.adHocFinesBySeat[seatId] = [];

      closeGenericModal();
      render();

  function showCloseEveningModal(){
    showModal(`
      <h3>Kegelabend abschließen</h3>
      <p>Der Abend wird in den Nur-Lese-Modus versetzt. Für alle nicht anwesenden Mitglieder wird automatisch der gerundete Durchschnittsbetrag der anwesenden Mitglieder als Strafe hinterlegt. Fortfahren?</p>
      <label class="member-check-row" style="cursor:pointer;">
        <input type="checkbox" id="close-send-emails-checkbox" checked>
        <span>Mails an Mitglieder senden</span>
      </label>
      <p class="form-error" id="close-evening-error"></p>
      <div class="confirm-row-buttons">
        <button type="button" class="btn-primary" id="confirm-close-evening-yes">Ja, abschließen</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    document.getElementById('confirm-close-evening-yes').addEventListener('click', async ()=>{
      const btn = document.getElementById('confirm-close-evening-yes');
      const errEl = document.getElementById('close-evening-error');
      const sendEmails = document.getElementById('close-send-emails-checkbox').checked;
      const detail = state.currentEveningDetail;
      btn.disabled = true; btn.textContent = 'Wird abgeschlossen…';

      // Sicherstellen, dass wirklich ALLE lokal eingegebenen Änderungen in der Datenbank stehen,
      // bevor der Abschluss serverseitig berechnet wird:
      // - Strafen selbst speichern bei jeder Änderung sofort (kein Debounce), sind also bereits
      //   persistiert, sobald der Nutzer eine Aktion abgeschlossen hat.
      // - Notizen laufen dagegen über einen 800ms-Debounce-Timer (siehe Notizen-Textarea-Handler) -
      //   ohne dieses Warten könnte ein gerade getippter, aber noch nicht gespeicherter Notiz-Text
      //   verloren gehen bzw. der Abschluss mit veralteten Daten laufen.
      if(pendingNotesSave){ try{ await pendingNotesSave; }catch(e){} }

      showModalLoadingOverlay('Abend wird abgeschlossen…');
      try{
        const closeEveningFn = httpsCallable(functions, 'closeEvening');
        await closeEveningFn({ clubId: CURRENT_CLUB_ID, eveningId: detail.id, skipNotificationEmail: !sendEmails });
      }catch(e){
        hideModalLoadingOverlay();
        if(errEl) errEl.textContent = 'Abschließen fehlgeschlagen. Bitte prüfe deine Internetverbindung.';
        btn.disabled = false; btn.textContent = 'Ja, abschließen';
        return;
      }

      // Frischen Stand nachladen (die Function hat serverseitig berechnet und geschrieben) statt
      // die lokalen Annahmen des Clients zu übernehmen - so zeigt die Detailansicht garantiert
      // exakt das, was tatsächlich in der Datenbank steht.
      closeGenericModal();
      try{

  // Nächster freier Platz nach den bestehenden Regeln: Seite mit weniger Besetzung zuerst
  // (Balance halten), darin der niedrigste freie Platz (von vorne füllen).
  function nextFreeSeatId(detail){
    const occupied = new Set(detail.seating.filter(s=>s.name).map(s=>s.seatId));
    // Zählt nur aktive (nicht invalide) Personen - eine Seite mit invaliden Personen hat effektiv
    // weniger Mitspieler und soll bei neuen Personen bevorzugt aufgefüllt werden.
    const saalActive = detail.seating.filter(s=>s.seatId.startsWith('saal-') && s.name && !s.invalid).length;
    const kneipeActive = detail.seating.filter(s=>s.seatId.startsWith('kneipe-') && s.name && !s.invalid).length;
    const preferred = kneipeActive < saalActive ? 'kneipe' : (saalActive < kneipeActive ? 'saal' : (Math.random()<0.5 ? 'kneipe':'saal'));
    const sections = [preferred, preferred==='saal'?'kneipe':'saal'];
    const perSide = getEveningSeatingTemplate(detail).perSide;
    for(const section of sections){
      for(let i=1;i<=perSide;i++){
        const seatId = section+'-'+i;
        if(!occupied.has(seatId)) return seatId;
      }
    }
    return null;
  }

  // Verschiebt eine nachträglich hinzugefügte Person auf die andere Seite (Saal<->Kneipe).
  // Nimmt dabei alle zu ihrem bisherigen Sitzplatz gehörenden Daten mit (Strafen, Geldstrafen, Flags).
  // Gibt die neue seatId zurück, oder null falls auf der anderen Seite kein Platz frei ist.
  function switchAttendeeSide(detail, oldSeatId){
    const oldSeat = detail.seating.find(s=>s.seatId===oldSeatId);
    if(!oldSeat || !oldSeat.name) return null;
    const oldSection = oldSeatId.startsWith('saal-') ? 'saal' : 'kneipe';
    const newSection = oldSection==='saal' ? 'kneipe' : 'saal';
    const occupied = new Set(detail.seating.filter(s=>s.name).map(s=>s.seatId));
    const perSide = getEveningSeatingTemplate(detail).perSide;
    let newSeatId = null;
    for(let i=1;i<=perSide;i++){
      const candidate = newSection+'-'+i;
      if(!occupied.has(candidate)){ newSeatId = candidate; break; }
    }
    if(!newSeatId) return null;

    const newSeat = detail.seating.find(s=>s.seatId===newSeatId);
    newSeat.name = oldSeat.name;
    newSeat.isGuest = oldSeat.isGuest;
    newSeat.addedLater = oldSeat.addedLater;
    if(oldSeat.invalid!==undefined) newSeat.invalid = oldSeat.invalid;
    if(oldSeat.invalidAmount!==undefined) newSeat.invalidAmount = oldSeat.invalidAmount;
    if(oldSeat.isSchriftfuehrer!==undefined) newSeat.isSchriftfuehrer = oldSeat.isSchriftfuehrer;

    delete oldSeat.name;
    delete oldSeat.isGuest;
    delete oldSeat.addedLater;
    delete oldSeat.invalid;
    delete oldSeat.invalidAmount;
    delete oldSeat.isSchriftfuehrer;

    if(detail.finesBySeat && detail.finesBySeat[oldSeatId]){
      detail.finesBySeat[newSeatId] = detail.finesBySeat[oldSeatId];
      delete detail.finesBySeat[oldSeatId];
    }
    if(detail.adHocFinesBySeat && detail.adHocFinesBySeat[oldSeatId]){
      detail.adHocFinesBySeat[newSeatId] = detail.adHocFinesBySeat[oldSeatId];
      delete detail.adHocFinesBySeat[oldSeatId];
    }
    if(detail.roundsGivenBySeat && detail.roundsGivenBySeat[oldSeatId]){
      detail.roundsGivenBySeat[newSeatId] = detail.roundsGivenBySeat[oldSeatId];
      delete detail.roundsGivenBySeat[oldSeatId];
    }
    return newSeatId;
  }
