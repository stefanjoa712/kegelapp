    const unlinkBtn = document.getElementById('member-detail-unlink-btn');
    if(unlinkBtn) unlinkBtn.addEventListener('click', ()=>{ if(member) showUnlinkAccountModal(member); });

    // Kein automatischer Fokus auf das Vorname-Feld - öffnet sonst sofort die Bildschirmtastatur.
    const saveBtn = document.getElementById('save-member-detail-btn');
    if(!saveBtn) return;
    saveBtn.addEventListener('click', async ()=>{
      const fn = document.getElementById('member-first-name').value.trim();
      const ln = document.getElementById('member-last-name').value.trim();
      const nick = document.getElementById('member-nickname').value.trim();
      const email = document.getElementById('member-email').value.trim();
      const birthday = document.getElementById('member-birthday').value;
      const role = document.getElementById('member-role').value;
      const errEl = document.getElementById('member-detail-error');
      if(!fn || !ln){ errEl.textContent='Bitte Vor- und Nachnamen angeben.'; return; }
      if(email && !/^\S+@\S+\.\S+$/.test(email)){ errEl.textContent='Bitte eine gültige E-Mail-Adresse angeben.'; return; }
      saveBtn.disabled = true; saveBtn.textContent = member ? 'Speichert…' : 'Wird hinzugefügt…';
      if(member){
        member.firstName=fn; member.lastName=ln; member.nickname=nick; member.email=email; member.role=role;
        if(birthday) member.birthday=birthday; else delete member.birthday;
      }else{
        const newMember = {id:uid('m'), firstName:fn, lastName:ln, nickname:nick, email, role};
        if(birthday) newMember.birthday = birthday;
        state.members.push(newMember);
      }
      await setJSON('members', state.members, true);
      goToSettings();
    });
  }

  function attachRecurringDetailListeners(){
    const r = state.financeRecurring.find(x=>x.id===state.currentRecurringId);

    const overflowBtn = document.getElementById('header-recurring-overflow-btn');
    const overflowMenu = document.getElementById('header-recurring-overflow-menu');
    if(overflowBtn && overflowMenu){
      overflowBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        overflowMenu.hidden = !overflowMenu.hidden;
      });
    }
    const deleteBtn = document.getElementById('header-delete-recurring-btn');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
      if(overflowMenu) overflowMenu.hidden = true;
      if(r) showDeleteRecurringModal(r);
    });

    const saveBtn = document.getElementById('save-rec-detail-btn');
    if(!saveBtn) return;
    saveBtn.addEventListener('click', async ()=>{
      const errEl = document.getElementById('rec-detail-error');
      const description = document.getElementById('rec-description').value.trim();
      const accountId = document.getElementById('rec-account').value;
      const incomeRaw = document.getElementById('rec-income').value.replace(',', '.');
      const expenseRaw = document.getElementById('rec-expense').value.replace(',', '.');
      const income = incomeRaw==='' ? 0 : parseFloat(incomeRaw);
      const expense = expenseRaw==='' ? 0 : parseFloat(expenseRaw);
      const nextDate = document.getElementById('rec-next-date').value;
      const potId = document.getElementById('rec-pot').value;

      if(!description){ errEl.textContent='Bitte eine Bezeichnung angeben.'; return; }
      if(!nextDate){ errEl.textContent='Bitte die nächste Ausführung angeben.'; return; }
      if(isNaN(income) || isNaN(expense) || income<0 || expense<0){ errEl.textContent='Bitte gültige Beträge angeben.'; return; }
      if((income>0) === (expense>0)){ errEl.textContent='Bitte entweder eine Einnahme oder eine Ausgabe angeben (nicht beides oder keins).'; return; }

      const amount = income>0 ? Math.round(income*100)/100 : -Math.round(expense*100)/100;
      saveBtn.disabled = true; saveBtn.textContent = r ? 'Speichert…' : 'Wird hinzugefügt…';

      if(r){
        r.description=description; r.accountId=accountId; r.amount=amount; r.nextDate=nextDate;
        if(potId) r.potId=potId; else delete r.potId;
      }else{
        const newRec = {id:uid('rec'), description, accountId, amount, nextDate};
        if(potId) newRec.potId = potId;
        state.financeRecurring.push(newRec);
      }
      await setJSON('finance-recurring', state.financeRecurring, true);
      goToFinanceManagement();
    });
  }

  function attachCalendarListeners(){
    const prevBtn = document.getElementById('cal-prev-month-btn');
    if(prevBtn) prevBtn.addEventListener('click', ()=>{
      state.calendarViewMonth--;
      if(state.calendarViewMonth<1){ state.calendarViewMonth=12; state.calendarViewYear--; }
      state.calendarSelectedDate = isoDate(state.calendarViewYear, state.calendarViewMonth, 1);
      render();
    });
    const nextBtn = document.getElementById('cal-next-month-btn');
    if(nextBtn) nextBtn.addEventListener('click', ()=>{
      state.calendarViewMonth++;
      if(state.calendarViewMonth>12){ state.calendarViewMonth=1; state.calendarViewYear++; }
      state.calendarSelectedDate = isoDate(state.calendarViewYear, state.calendarViewMonth, 1);
      render();
    });
    document.querySelectorAll('.cal-cell[data-date]').forEach(cell=>{
      cell.addEventListener('click', ()=>{
        state.calendarSelectedDate = cell.dataset.date;
        render();
      });
    });
    document.querySelectorAll('.cal-event-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const events = getEventsOnDate(state.calendarSelectedDate);
        const ev = events.find(e=> e.seriesId===row.dataset.seriesId && e.occurrenceDate===row.dataset.occurrenceDate);
        if(ev) goToEventDetail(ev);
      });
    });
    const addEventBtn = document.getElementById('header-add-event-btn');
    if(addEventBtn) addEventBtn.addEventListener('click', ()=>goToEventDetail());
    const todayBtn = document.getElementById('header-cal-today-btn');
    if(todayBtn) todayBtn.addEventListener('click', ()=>{
      const today = todayISO();
      const [y, m] = today.split('-').map(Number);
      state.calendarViewYear = y;
      state.calendarViewMonth = m;
      state.calendarSelectedDate = today;
      render();
    });
    const nextEventBtn = document.getElementById('header-cal-next-event-btn');
    if(nextEventBtn) nextEventBtn.addEventListener('click', ()=>{
      const occ = getNextUpcomingEvent();
      if(!occ) return;
      const targetDate = dateOnly(occ.start);
      const [y, m] = targetDate.split('-').map(Number);
      state.calendarViewYear = y;
      state.calendarViewMonth = m;
      state.calendarSelectedDate = targetDate;
      render();
    });
    const subscribeBtn = document.getElementById('cal-subscribe-btn');
    if(subscribeBtn) subscribeBtn.addEventListener('click', ()=>showCalendarSubscribeModal());
  }

  // Liefert den bestehenden Feed-Token oder erzeugt einmalig einen neuen (lazy).
  async function getOrCreateCalendarFeedToken(){
    let token = await getJSONOrThrow('calendar-feed-token', null);
    if(!token){

      await setJSON('calendar-feed-token', token, true);

  async function showCalendarSubscribeModal(){
    showModal(`<p class="empty-state">Link wird vorbereitet…</p>`);

    showModal(`

  function renderGuestList(){
    const container = document.getElementById('guest-list');
    if(!container) return;
    if(currentGuests.length===0){
      container.innerHTML = `<p class="empty-state-small">Noch keine Gäste hinzugefügt.</p>`;
    }else{
      container.innerHTML = currentGuests.map(g=>`<div class="guest-row"><span>${escapeHtml(g.name)}</span><button type="button" class="remove-guest-btn" data-id="${g.id}" aria-label="Gast entfernen">✕</button></div>`).join('');
      container.querySelectorAll('.remove-guest-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          currentGuests = currentGuests.filter(g=>g.id!==btn.dataset.id);
          renderGuestList();
        });
      });
    }
    updateSeatCounter();
  }

  function updateSeatCounter(){
    const checkedCount = document.querySelectorAll('.member-checkbox:checked').length;
    const total = checkedCount + currentGuests.length;
    const counterEl = document.getElementById('seat-counter');
    if(counterEl){
      counterEl.textContent = `${total} / 12 Plätze belegt`;
      counterEl.classList.toggle('over', total>12);
    }
    const btn = document.getElementById('confirm-btn');
    if(btn) btn.disabled = (total<1 || total>12);
    const err = document.getElementById('form-error');
    if(err) err.textContent = '';
  }

  function addGuest(){

    }

      const errEl = document.getElementById('fine-form-error');
      if(!name){ if(errEl) errEl.textContent='Bitte einen Namen angeben.'; return; }
      let amount = 0;
      if(type!=='runde'){
        const amountRaw = document.getElementById('new-fine-amount').value.replace(',', '.');

        if(isNaN(amount) || amount<0){ if(errEl) errEl.textContent='Bitte einen gültigen Betrag angeben.'; return; }
      }
      const submitBtn = document.getElementById('add-fine-btn');
      submitBtn.disabled = true; submitBtn.textContent = isEdit ? 'Speichert…' : 'Wird hinzugefügt…';
      const rounded = type==='runde' ? 0 : Math.round(amount*100)/100;

      closeGenericModal();
      render();
    });

      if(isNaN(targetAmount) || targetAmount<=0){ errEl.textContent='Bitte ein gültiges Sparziel angeben.'; return; }
      if(!targetDate){ errEl.textContent='Bitte ein Zieldatum angeben.'; return; }
      if(isNaN(startAmount) || startAmount<0){ errEl.textContent='Bitte einen gültigen Startbetrag angeben.'; return; }

      const btn = document.getElementById('save-pot-btn');
      btn.disabled = true; btn.textContent = isEdit ? 'Speichert…' : 'Wird hinzugefügt…';

      if(isEdit){
        const p = state.financeSavingsPots.find(x=>x.id===existingPot.id);
        if(p){ p.name=name; p.targetAmount=Math.round(targetAmount*100)/100; p.targetDate=targetDate; p.startAmount=Math.round(startAmount*100)/100; }
      }else{
        state.financeSavingsPots.push({id:uid('pot'), name, targetAmount:Math.round(targetAmount*100)/100, targetDate, startAmount:Math.round(startAmount*100)/100});
      }
      await setJSON('finance-savings-pots', state.financeSavingsPots, true);
      closeGenericModal();
      render();
    });
  }

  function goToEventDetail(occurrence, origin){
    state.calendarEditingOccurrence = occurrence || null;
    state.eventDetailOrigin = origin || 'calendar';
    state.view = 'eventDetail';
    render();
  }

  function isEventCreator(baseEvent){
    const currentName = getCurrentMemberName();
    if(!baseEvent || !baseEvent.createdBy) return true; // Alte Termine ohne Ersteller: jeder darf bearbeiten
    return !!currentName && currentName===baseEvent.createdBy;
  }

  function rsvpStatusIcon(status, grey){
    const greyClass = grey ? ' grey' : '';
    if(status==='accepted'){
      return `<svg viewBox="0 0 24 24" class="rsvp-icon accepted${greyClass}"><circle cx="12" cy="12" r="11"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    }
    if(status==='tentative'){
      return `<svg viewBox="0 0 24 24" class="rsvp-icon tentative${greyClass}"><circle cx="12" cy="12" r="11"/><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="sans-serif">?</text></svg>`;
    }
    if(status==='declined'){
      return `<svg viewBox="0 0 24 24" class="rsvp-icon declined${greyClass}"><circle cx="12" cy="12" r="11"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>`;
    }
    return `<svg viewBox="0 0 24 24" class="rsvp-icon pending${greyClass}"><circle cx="12" cy="12" r="11"/><text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="sans-serif">?</text></svg>`;
  }

  function buildRsvpSectionHtml(occurrence){
    const currentName = getCurrentMemberName();
    const currentStatus = currentName ? getRsvpStatusFor(occurrence.seriesId, occurrence.occurrenceDate, currentName) : null;
    const groups = categorizeRsvps(occurrence.seriesId, occurrence.occurrenceDate);
    const rsvpButtonsHtml = currentName ? `
      <div class="card">
        <h2 class="section-title">Deine Rückmeldung</h2>
        <div class="rsvp-btn-row">
          <button type="button" class="rsvp-btn${currentStatus==='accepted'?' active accepted':''}" data-status="accepted">Zusagen</button>
          <button type="button" class="rsvp-btn${currentStatus==='tentative'?' active tentative':''}" data-status="tentative">Vorläufig</button>
          <button type="button" class="rsvp-btn${currentStatus==='declined'?' active declined':''}" data-status="declined">Absagen</button>
        </div>
      </div>
    ` : '';
    const groupSectionHtml = (label, names, status)=> `
      <div class="rsvp-group">
        <div class="rsvp-group-label"><span class="rsvp-group-icon">${rsvpStatusIcon(status)}</span>${label} <span class="member-count">(${names.length})</span></div>
        ${names.length===0 ? '<p class="empty-state rsvp-names-indent">Niemand.</p>' : names.map(n=>`<p class="rsvp-name-row">${escapeHtml(n)}</p>`).join('')}
      </div>
    `;
    return `
      ${rsvpButtonsHtml}
      <div class="card">
        <h2 class="section-title">Rückmeldungen</h2>
        ${groupSectionHtml('Zugesagt', groups.accepted, 'accepted')}
        ${groupSectionHtml('Vorläufig', groups.tentative, 'tentative')}
        ${groupSectionHtml('Abgesagt', groups.declined, 'declined')}
        ${groupSectionHtml('Rückmeldung ausstehend', groups.pending, null)}
      </div>
    `;
  }

  // Baut eine lesbare Anzeige für den Zeitraum eines Termins (auch mehrtägig).
  function formatOccurrenceRange(occ){
    const startDate = dateOnly(occ.start), startTime = timeOnly(occ.start);
    const endDate = dateOnly(occ.end), endTime = timeOnly(occ.end);
    const startPart = `${formatDateDE(startDate)} · ${startTime}`;
    if(startDate===endDate){
      return `${startPart}–${endTime}`;
    }
    return `${startPart} – ${formatDateDE(endDate)} · ${endTime}`;
  }

  function viewEventDetail(){
    const occurrence = state.calendarEditingOccurrence;
    const isEdit = !!occurrence;
    const baseEvent = isEdit ? state.calendarEvents.find(e=>e.id===occurrence.seriesId) : null;
    const canEdit = !isEdit || isEventCreator(baseEvent);
    const isSeriesOccurrence = isEdit && !occurrence.isSeriesEdit && !!(occurrence.recurrence && occurrence.recurrence!=='none');

    if(isEdit && !canEdit){
      // Nur-Lese-Ansicht für Nicht-Ersteller: keine Bearbeitung, aber Rückmeldung möglich.
      return `
        <div class="card">
          <h2 class="section-title">${escapeHtml(occurrence.title)}</h2>
          ${occurrence.location ? `<p class="cal-event-meta">${escapeHtml(occurrence.location)}</p>` : ''}
          <p class="cal-event-meta">${formatOccurrenceRange(occurrence)}</p>
          ${baseEvent && baseEvent.createdBy ? `<p class="hint" style="margin-top:10px;">Erstellt von ${escapeHtml(baseEvent.createdBy)}. Nur der Ersteller kann diesen Termin bearbeiten.</p>` : ''}
        </div>
        ${buildRsvpSectionHtml(occurrence)}
      `;
    }

    const recurrenceOptionsHtml = isSeriesOccurrence ? '' : `
      <label for="cal-ev-recurrence">Wiederholen</label>
      <select id="cal-ev-recurrence">
        <option value="none"${(!isEdit || occurrence.recurrence==='none' || !occurrence.recurrence)?' selected':''}>Nein</option>
        <option value="weekly"${(isEdit && occurrence.recurrence==='weekly')?' selected':''}>Wöchentlich</option>
        <option value="biweekly"${(isEdit && occurrence.recurrence==='biweekly')?' selected':''}>Zweiwöchentlich</option>
        <option value="every4weeks"${(isEdit && occurrence.recurrence==='every4weeks')?' selected':''}>Vierwöchentlich</option>
        <option value="monthly"${(isEdit && occurrence.recurrence==='monthly')?' selected':''}>Monatlich</option>
        <option value="yearly"${(isEdit && occurrence.recurrence==='yearly')?' selected':''}>Jährlich</option>
      </select>
      <label for="cal-ev-recurrence-end">Enddatum der Wiederholung (optional)</label>
      <input type="date" id="cal-ev-recurrence-end" value="${(isEdit && baseEvent && baseEvent.recurrenceEndDate)?baseEvent.recurrenceEndDate:''}">
    `;
    const defaultStart = isEdit ? occurrence.start : combineDatetime(state.calendarSelectedDate, '19:00');
    const defaultEnd = isEdit ? occurrence.end : combineDatetime(state.calendarSelectedDate, '21:00');
    return `
      <div class="card">
        <label for="cal-ev-title">Titel</label>
        <input type="text" id="cal-ev-title" placeholder="z. B. Kegeln" value="${isEdit?escapeHtml(occurrence.title):''}">
        <label for="cal-ev-location">Ort (optional)</label>
        <input type="text" id="cal-ev-location" placeholder="z. B. Zur Dorfschmiede" value="${isEdit?escapeHtml(occurrence.location||''):''}">
        <label for="cal-ev-start">Beginn</label>
        <input type="datetime-local" id="cal-ev-start" value="${defaultStart}">
        <label for="cal-ev-end">Ende</label>
        <input type="datetime-local" id="cal-ev-end" value="${defaultEnd}">
        ${recurrenceOptionsHtml}
        ${isSeriesOccurrence ? `<p class="hint">Dies ist Teil einer Terminserie. Änderungen betreffen nur diesen einen Termin.</p>` : ''}
        <p class="form-error" id="cal-ev-error"></p>
        <button type="button" class="btn-primary" id="save-cal-ev-btn" style="width:100%;">${isEdit?'Speichern':'Hinzufügen'}</button>
      </div>
      ${(isEdit && !occurrence.isSeriesEdit) ? buildRsvpSectionHtml(occurrence) : ''}
    `;
  }

  function showDeleteEventModal(occurrence){
    const isSeriesOccurrence = !!(occurrence.recurrence && occurrence.recurrence!=='none');
    showModal(`
      <h3>Termin löschen</h3>
      <p>„${escapeHtml(occurrence.title)}" wirklich löschen?${isSeriesOccurrence ? ' Nur dieser eine Termin der Serie wird entfernt.' : ''}</p>
      <div class="confirm-row-buttons">
        <button type="button" class="btn-danger" id="confirm-delete-event-yes">Ja, löschen</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    document.getElementById('confirm-delete-event-yes').addEventListener('click', async ()=>{
      const yesBtn = document.getElementById('confirm-delete-event-yes');
      yesBtn.disabled = true; yesBtn.textContent = 'Löscht…';
      if(!isSeriesOccurrence){
        state.calendarEvents = state.calendarEvents.filter(e=>e.id!==occurrence.seriesId);
        await setJSON('calendar-events', state.calendarEvents, true);
      }else{
        let edit = findOccurrenceEdit(occurrence.seriesId, occurrence.occurrenceDate);
        if(!edit){ edit = {id:uid('caledit'), seriesId:occurrence.seriesId, occurrenceDate:occurrence.occurrenceDate}; state.calendarOccurrenceEdits.push(edit); }
        edit.deleted = true;
        await setJSON('calendar-occurrence-edits', state.calendarOccurrenceEdits, true);
      }
      closeGenericModal();
      goBackFromEventDetail();
    });
  }

  function attachEventDetailListeners(){
    const occurrence = state.calendarEditingOccurrence;
    const isEdit = !!occurrence;
    const isSeriesOccurrence = isEdit && !occurrence.isSeriesEdit && !!(occurrence.recurrence && occurrence.recurrence!=='none');

    document.querySelectorAll('.rsvp-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const currentName = getCurrentMemberName();
        if(!currentName || !occurrence) return;
        btn.disabled = true;
        await setRsvpStatus(occurrence.seriesId, occurrence.occurrenceDate, currentName, btn.dataset.status);
        render();
      });
    });

    const overflowBtn = document.getElementById('header-event-overflow-btn');
    const overflowMenu = document.getElementById('header-event-overflow-menu');
    if(overflowBtn && overflowMenu){
      overflowBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        overflowMenu.hidden = !overflowMenu.hidden;
      });
    }
    const deleteBtn = document.getElementById('header-delete-event-btn');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
      if(overflowMenu) overflowMenu.hidden = true;
      showDeleteEventModal(occurrence);
    });

    // Kein automatischer Fokus auf das Titel-Feld - öffnet sonst sofort die Bildschirmtastatur.
    const saveBtn = document.getElementById('save-cal-ev-btn');
    if(!saveBtn) return;
    saveBtn.addEventListener('click', async ()=>{
      const errEl = document.getElementById('cal-ev-error');
      const title = document.getElementById('cal-ev-title').value.trim();
      const location = document.getElementById('cal-ev-location').value.trim();
      const start = document.getElementById('cal-ev-start').value;
      const end = document.getElementById('cal-ev-end').value;
      const recurrenceEl = document.getElementById('cal-ev-recurrence');
      const recurrence = recurrenceEl ? recurrenceEl.value : (isEdit ? occurrence.recurrence : 'none');
      const recurrenceEndEl = document.getElementById('cal-ev-recurrence-end');
      const recurrenceEndDate = recurrenceEndEl ? recurrenceEndEl.value : '';

      if(!title){ errEl.textContent='Bitte einen Titel angeben.'; return; }
      if(!start){ errEl.textContent='Bitte einen Beginn angeben.'; return; }
      if(!end){ errEl.textContent='Bitte ein Ende angeben.'; return; }
      if(end<start){ errEl.textContent='Das Ende darf nicht vor dem Beginn liegen.'; return; }
      if(recurrenceEndDate && recurrenceEndDate<dateOnly(start)){ errEl.textContent='Das Enddatum der Wiederholung darf nicht vor dem Beginn liegen.'; return; }

      const performSave = async ()=>{
        saveBtn.disabled = true; saveBtn.textContent = isEdit ? 'Speichert…' : 'Wird hinzugefügt…';
        const startDateOnly = dateOnly(start);
        if(!isEdit){
          const newId = uid('cal');
          const creatorName = getCurrentMemberName();
          state.calendarEvents.push({id:newId, title, location, start, end, recurrence, recurrenceEndDate: recurrenceEndDate||undefined, createdBy: creatorName});
          await setJSON('calendar-events', state.calendarEvents, true);
          if(creatorName){
            await setRsvpStatus(newId, startDateOnly, creatorName, 'accepted');
          }
        }else if(!isSeriesOccurrence){
          const base = state.calendarEvents.find(e=>e.id===occurrence.seriesId);
          if(base){
            base.title=title; base.location=location; base.start=start; base.end=end; base.recurrence=recurrence;
            if(recurrenceEndDate) base.recurrenceEndDate = recurrenceEndDate; else delete base.recurrenceEndDate;
          }
          await setJSON('calendar-events', state.calendarEvents, true);
          if(occurrence.isSeriesEdit){
            // Serie wurde bearbeitet - alle Rückmeldungen zu dieser Serie zurücksetzen.
            state.calendarRsvps = state.calendarRsvps.filter(r=>r.seriesId!==occurrence.seriesId);
            await setJSON('calendar-rsvps', state.calendarRsvps, true);
          }
        }else{
          let edit = findOccurrenceEdit(occurrence.seriesId, occurrence.occurrenceDate);
          if(!edit){ edit = {id:uid('caledit'), seriesId:occurrence.seriesId, occurrenceDate:occurrence.occurrenceDate}; state.calendarOccurrenceEdits.push(edit); }
          edit.title=title; edit.location=location; edit.start=start; edit.end=end;
          delete edit.deleted;
          await setJSON('calendar-occurrence-edits', state.calendarOccurrenceEdits, true);
        }
        state.calendarSelectedDate = startDateOnly;
        goBackFromEventDetail();
      };

      if(occurrence && occurrence.isSeriesEdit){
        showModal(`
          <h3>Terminserie speichern</h3>
          <p>Diese Änderung betrifft <strong>alle Termine dieser Serie</strong>. Außerdem werden dabei <strong>alle bisherigen Rückmeldungen</strong> zu dieser Serie zurückgesetzt. Fortfahren?</p>
          <div class="confirm-row-buttons">
            <button type="button" class="btn-primary" id="confirm-series-save-yes">Ja, speichern</button>
            <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
          </div>
        `);
        document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
        document.getElementById('confirm-series-save-yes').addEventListener('click', async ()=>{
          closeGenericModal();
          await performSave();
        });
      }else{
        await performSave();
      }
    });
  }

  function showFinanceAccountFormModal(existingAccount){
    const isEdit = !!existingAccount;
    showModal(`
      <h3>${isEdit ? 'Konto bearbeiten' : 'Konto/Kasse hinzufügen'}</h3>
      <label for="new-finance-name">Bezeichnung</label>
      <input type="text" id="new-finance-name" placeholder="z. B. Vereinskasse" value="${isEdit?escapeHtml(existingAccount.name):''}">

      <input type="number" id="new-finance-balance" min="0" step="0.01" placeholder="0,00"
        value="${isEdit?existingAccount.startBalance.toFixed(2):''}"${isEdit?' readonly disabled':''}>
      ${isEdit ? `<p class="hint" style="margin-top:-6px;">Der Start-Kontostand kann nachträglich nicht mehr geändert werden.</p>` : ''}
      <p class="form-error" id="finance-form-error"></p>
      <div class="confirm-row-buttons">
        <button type="button" class="btn-primary" id="add-finance-account-btn">${isEdit?'Speichern':'Hinzufügen'}</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    document.getElementById('new-finance-name').focus();
    document.getElementById('add-finance-account-btn').addEventListener('click', async ()=>{
      const name = document.getElementById('new-finance-name').value.trim();

      const submitBtn = document.getElementById('add-finance-account-btn');
      submitBtn.disabled = true; submitBtn.textContent = isEdit ? 'Speichert…' : 'Wird hinzugefügt…';
      if(isEdit){
        const a = state.financeAccounts.find(x=>x.id===existingAccount.id);
        if(a){ a.name=name; }
      }else{
        const balanceRaw = document.getElementById('new-finance-balance').value.replace(',', '.');
        const startBalance = parseFloat(balanceRaw);
        if(isNaN(startBalance)){
          if(errEl) errEl.textContent='Bitte einen gültigen Start-Kontostand angeben.';
          submitBtn.disabled = false; submitBtn.textContent = 'Hinzufügen';
          return;
        }
        state.financeAccounts.push({id:uid('acc'), name, startBalance: Math.round(startBalance*100)/100});
      }
      await setJSON('finance-accounts', state.financeAccounts, true);
      closeGenericModal();
      render();
    });

  function showDeleteTransactionModal(transaction){
    const isFromArrears = !!transaction.fromArrears;
    const arrearsName = transaction.arrearsName || (transaction.description.includes(' – ') ? transaction.description.split(' – ').pop() : null);
    showModal(`
      <h3>Umsatz löschen</h3>
      <p>„${escapeHtml(transaction.description)}" wirklich löschen?</p>
      ${isFromArrears ? `<p class="hint">Dieser Umsatz stammt aus einer Rückstandszahlung${arrearsName?` von <strong>${escapeHtml(arrearsName)}</strong>`:''}. Beim Löschen wird der Betrag (${fmtEuro(Math.abs(transaction.amount))}) wieder zum offenen Rückstand addiert.</p>` : ''}
      <div class="confirm-row-buttons">
        <button type="button" class="btn-danger" id="confirm-delete-transaction-yes">Ja, löschen</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);
    document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
    document.getElementById('confirm-delete-transaction-yes').addEventListener('click', async ()=>{
      const yesBtn = document.getElementById('confirm-delete-transaction-yes');
      yesBtn.disabled = true; yesBtn.textContent = 'Löscht…';
      state.financeTransactions = state.financeTransactions.filter(t=>t.id!==transaction.id);

      const saves = [setJSON('finance-transactions', state.financeTransactions, true)];
      if(isFromArrears && arrearsName){
        let entry = state.financeArrears.find(a=>a.name===arrearsName);
        if(!entry){ entry = {name:arrearsName, amount:0, history:[]}; state.financeArrears.push(entry); }
        if(!entry.history) entry.history = [];
        const addBack = Math.abs(transaction.amount);
        entry.amount = Math.round((entry.amount + addBack)*100)/100;
        entry.history.push({
          id: uid('hist'), date: todayISO(), type:'correction', delta: addBack,
          note: `Umsatz „${transaction.description}" gelöscht`, balanceAfter: entry.amount, createdAt: Date.now()
        });
        saves.push(setJSON('finance-arrears', state.financeArrears, true));
      }
      await Promise.all(saves);
      closeGenericModal();
      history.back();
    });
  }

  function getArrearsEntry(name){
    return state.financeArrears.find(a=>a.name===name) || null;
  }

  function historyEntryLabel(entry){
    if(entry.type==='correction') return 'Korrektur';
    if(entry.type==='payment') return 'Zahlung';
    return 'Strafen';
  }

  function viewArrearsDetail(){
    const name = state.currentArrearsName;
    const entry = getArrearsEntry(name);
    const amount = entry ? entry.amount : 0;
    const history = (entry && entry.history) ? entry.history.slice().sort((a,b)=>{
      const dateCompare = b.date.localeCompare(a.date);
      if(dateCompare!==0) return dateCompare;
      const aCreated = a.createdAt || new Date(a.date).getTime();
      const bCreated = b.createdAt || new Date(b.date).getTime();
      return bCreated - aCreated;
    }) : [];

    const accountOptionsHtml = state.financeAccounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('');
    const paymentFormHtml = state.financeAccounts.length===0
      ? `<p class="empty-state">Noch kein Konto/Kasse angelegt. Lege zuerst in den Einstellungen unter „Finanzverwaltung" eines an.</p>`
      : `
        <label for="arrears-payment-amount">Zahlungsbetrag (€)</label>
        <input type="number" id="arrears-payment-amount" min="0" step="0.01" placeholder="${amount.toFixed(2)}">
        <label for="arrears-payment-text">Buchungstext (optional)</label>
        <input type="text" id="arrears-payment-text" placeholder="Bestätigte Zahlung">
        <label for="arrears-payment-account">Konto/Kasse</label>
        <select id="arrears-payment-account">${accountOptionsHtml}</select>
        <label for="arrears-payment-date">Datum</label>
        <input type="date" id="arrears-payment-date" value="${todayISO()}">
        <p class="form-error" id="arrears-payment-error"></p>
        <button type="button" class="btn-primary" id="confirm-arrears-payment-btn" style="width:100%;">Zahlungseingang bestätigen</button>
      `;

    const historyHtml = history.length===0
      ? `<p class="empty-state">Noch keine Einträge im Verlauf.</p>`
      : history.map(h=>{
        const isClickable = h.type==='increase' && h.eveningId && h.seatId;
        return `
        <div class="history-row${isClickable?' history-row-clickable':''}"${isClickable?` data-evening-id="${h.eveningId}" data-seat-id="${h.seatId}"`:''}>
          <span class="history-info">
            <span class="history-note">${escapeHtml(h.note)}</span>
            <span class="history-meta">${formatDateDE(h.date)} · ${historyEntryLabel(h)}</span>
          </span>
          <span class="history-delta ${h.delta>=0?'positive':'negative'}">${h.delta>=0?'+':''}${fmtEuro(h.delta)}</span>
        </div>
      `;
      }).join('');

    return `
      <div class="card own-arrears-card ${amount>0?'amount-due':'amount-clear'}">
        <div class="own-arrears-amount">${fmtEuro(amount)}</div>
        <div class="own-arrears-label">Offener Rückstand</div>
      </div>
      <div class="card">
        <h2 class="section-title">Zahlung erfassen</h2>
        ${paymentFormHtml}
      </div>
      <div class="card">
        <h2 class="section-title">Verlauf</h2>
        ${historyHtml}
      </div>
    `;
  }

  function showCorrectArrearsModal(){
    const name = state.currentArrearsName;
    const entry = getArrearsEntry(name);
    const amount = entry ? entry.amount : 0;
    showModal(`
      <h3>Rückstand korrigieren</h3>
      <p>Aktueller Rückstand: <strong>${fmtEuro(amount)}</strong></p>
      <label for="correct-arrears-amount">Neuer Rückstand (€)</label>

      <label for="correct-arrears-note">Grund (optional)</label>

      <p class="form-error" id="correct-arrears-error"></p>
      <div class="confirm-row-buttons">
        <button type="button" class="btn-primary" id="confirm-correct-arrears-btn">Speichern</button>
        <button type="button" class="btn-secondary" id="modal-cancel-btn">Abbrechen</button>
      </div>
    `);

        note: bookingText, balanceAfter: e.amount, createdAt: Date.now()
      });

  // ---------- Drag & Drop zum manuellen Sortieren (Pointer Events, touch- und mausfähig) ----------
  function setupDragReorder(containerId, onReorder){
    const container = document.getElementById(containerId);
    if(!container) return;
    container.querySelectorAll('.draggable-row').forEach(row=>{
      const handle = row.querySelector('.drag-handle');
      if(!handle) return;
      handle.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        const startY = e.clientY;
        const rect = row.getBoundingClientRect();
        const placeholder = document.createElement('div');
        placeholder.className = 'drag-placeholder';
        placeholder.style.height = rect.height+'px';
        row.after(placeholder);
        row.classList.add('dragging');
        row.style.position='fixed';
        row.style.zIndex='999';
        row.style.width=rect.width+'px';
        row.style.left=rect.left+'px';
        row.style.top=rect.top+'px';
        row.style.pointerEvents='none';

        function onMove(ev){
          row.style.top = (rect.top + (ev.clientY-startY)) + 'px';
          const siblings = Array.from(container.querySelectorAll('.draggable-row:not(.dragging)'));
          let placed = false;
          for(const sib of siblings){
            const sRect = sib.getBoundingClientRect();
            if(ev.clientY < sRect.top + sRect.height/2){
              container.insertBefore(placeholder, sib);
              placed = true;
              break;
            }
          }
          if(!placed) container.appendChild(placeholder);
        }
        function onUp(){
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          row.style.position=''; row.style.zIndex=''; row.style.width=''; row.style.left=''; row.style.top=''; row.style.pointerEvents='';
          row.classList.remove('dragging');
          placeholder.replaceWith(row);
          const newIdOrder = Array.from(container.querySelectorAll('.draggable-row')).map(el=>el.dataset.id);
          onReorder(newIdOrder);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  }

  async function handleConfirmNewEvening(){
    const dateInput = document.getElementById('date-input');
    const date = (dateInput && dateInput.value) ? dateInput.value : todayISO();
    const checkedIds = Array.from(document.querySelectorAll('.member-checkbox:checked')).map(cb=>cb.dataset.id);
    const selectedMembers = state.members.filter(m=>checkedIds.includes(m.id));
    const participants = [
      ...selectedMembers.map(m=>({name:displayName(m), isGuest:false})),
      ...currentGuests.map(g=>({name:g.name, isGuest:true}))
    ];
    const errEl = document.getElementById('form-error');
    const btn = document.getElementById('confirm-btn');
    const originalBtnText = btn ? btn.textContent : '';

    // Schnelle, lokale Prüfungen zuerst - kein Netzwerk nötig, keine Ladeanzeige erforderlich.
    if(participants.length<1){ if(errEl) errEl.textContent='Wähle mindestens einen Teilnehmer aus.'; return; }
    if(participants.length>12){ if(errEl) errEl.textContent='Maximal 12 Teilnehmer möglich – es gibt nur 12 Plätze.'; return; }

    // Ab hier braucht es das Netzwerk - sofort sichtbares Feedback geben, damit ein Klick
    // nie so wirkt, als wäre nichts passiert.
    if(errEl) errEl.innerHTML = '';
    if(btn){ btn.disabled = true; btn.textContent = 'Wird geprüft…'; }

    state.eveningsIndex = await getJSON('evenings-index', true, state.eveningsIndex);
    const existing = state.eveningsIndex.find(e=>e.date===date);
    if(existing){
      if(btn){ btn.disabled = false; btn.textContent = originalBtnText; }
      showDuplicateDateModal(date, existing.id);
      return;
    }

    if(btn){ btn.textContent = 'Wird ausgelost…'; }

    // Aktuelle Strafenliste als feste Kopie für diesen Abend übernehmen - spätere Änderungen
    // in der Strafenverwaltung dürfen diesen Abend nicht mehr beeinflussen.
    const finesCatalogAtCreation = await getJSON('fines-catalog', true, state.finesCatalog);
    state.finesCatalog = finesCatalogAtCreation;

    const occupiedSeatIds = buildSeatPriorityOrder().slice(0, participants.length);
    const schriftfuehrerCheckbox = document.getElementById('schriftfuehrer-checkbox');
    const drawSchriftfuehrer = !!(schriftfuehrerCheckbox && schriftfuehrerCheckbox.checked);

    let shuffledParticipants;
    if(!drawSchriftfuehrer && occupiedSeatIds.includes('kneipe-1')){
      // K1 wird automatisch Schriftführer - dort darf deshalb kein Gast landen.
      const members = participants.filter(p=>!p.isGuest);
      if(members.length>0){
        const forcedMember = members[Math.floor(Math.random()*members.length)];
        const rest = shuffle(participants.filter(p=>p!==forcedMember));
        const otherSeatIds = occupiedSeatIds.filter(id=>id!=='kneipe-1');
        const tempAssignment = { 'kneipe-1': forcedMember };
        otherSeatIds.forEach((seatId, i)=>{ tempAssignment[seatId] = rest[i]; });
        shuffledParticipants = occupiedSeatIds.map(id=>tempAssignment[id]);
      }else{
        shuffledParticipants = shuffle(participants);
      }
    }else{
      shuffledParticipants = shuffle(participants);
    }

    const seatAssignment = {};
    occupiedSeatIds.forEach((seatId, i)=>{ seatAssignment[seatId] = shuffledParticipants[i]; });

    let schriftfuehrerSeatId = null;
    if(drawSchriftfuehrer){
      const memberSeatIds = occupiedSeatIds.filter((seatId, i)=> !shuffledParticipants[i].isGuest);
      if(memberSeatIds.length>0){
        schriftfuehrerSeatId = memberSeatIds[Math.floor(Math.random()*memberSeatIds.length)];
      }
    }else if(seatAssignment['kneipe-1'] && !seatAssignment['kneipe-1'].isGuest){
      schriftfuehrerSeatId = 'kneipe-1';
    }

    const seating = SEATS.map(seat=>{
      const p = seatAssignment[seat.id];
      return {
        seatId:seat.id, section:seat.section, label:seat.label,
        name: p ? p.name : null, isGuest: p ? p.isGuest : false,
        isSchriftfuehrer: seat.id===schriftfuehrerSeatId
      };
    });

    const id = uid('e');
    const detail = { id, date, seating, finesBySeat: {}, finesCatalogSnapshot: finesCatalogAtCreation };
    const newIndex = [...state.eveningsIndex, {id, date, ...computeEveningSummaryFields(detail)}];
    await Promise.all([
      setJSON('evening-'+id, detail, true),
      setJSON('evenings-index', newIndex, true)
    ]);
    state.eveningsIndex = newIndex;

    state.currentEveningDetail = detail;
    state.justCreated = true;
    state.eveningTab = 'sitzplan';
    state.view = 'detail';
    render();
  }

      const detail = state.currentEveningDetail;

      const newIndex = state.eveningsIndex.filter(e=>e.id!==id);
      const saves = [
        deleteKey('evening-'+id, true),
        setJSON('evenings-index', newIndex, true)
      ];

      // Wurde der Abend abgeschlossen, wurden dabei Rückstände erhöht - beim Löschen müssen
      // genau diese Beträge wieder abgezogen werden.
      if(detail.closed){
        let arrears = state.financeArrears;
        try{ arrears = await getJSON('finance-arrears', true, state.financeArrears); }catch(e){}
        function subtractFromArrears(name, amount){
          if(!amount) return;
          let entry = arrears.find(a=>a.name===name);
          if(!entry){ entry = {name, amount:0, history:[]}; arrears.push(entry); }
          if(!entry.history) entry.history = [];
          entry.amount = Math.round((entry.amount - amount)*100)/100;
          entry.history.push({
            id: uid('hist'), date: todayISO(), type:'correction', delta: -amount,
            note: `Kegelabend vom ${formatDateDE(detail.date)} gelöscht`, balanceAfter: entry.amount
          });
        }
        detail.seating.filter(s=>s.name).forEach(s=>{
          subtractFromArrears(s.name, roundedFineTotalForSeat(detail, s.seatId));
        });
        (detail.absentMembersFines||[]).forEach(a=>{ subtractFromArrears(a.name, a.amount); });
        state.financeArrears = arrears;
        saves.push(setJSON('finance-arrears', arrears, true));
      }

      await Promise.all(saves);
      if(detail.closed){
        await updateAttendanceStatsForEvening(detail, -1);
      }
      state.eveningsIndex = newIndex;
      state.confirmDeleteEveningId = null;
      goToMain();
    });
    const noBtn = document.getElementById('confirm-delete-evening-no');
    if(noBtn) noBtn.addEventListener('click', ()=>{ state.confirmDeleteEveningId=null; render(); });
  }

      if(personOverflowMenu) personOverflowMenu.hidden = true;
      showUnmarkInvalidModal();
    });
    const shareGuestBtn = document.getElementById('header-share-guest-btn');
    if(shareGuestBtn) shareGuestBtn.addEventListener('click', async ()=>{
      if(personOverflowMenu) personOverflowMenu.hidden = true;
      const detail = state.currentEveningDetail;
      const seat = detail.seating.find(s=>s.seatId===state.currentFineSeatId);
      if(!seat) return;
      if(!seat.shareToken){
        seat.shareToken = uid('share');
        await setJSON('evening-'+detail.id, detail, true);
      }
      const shareUrl = `https://us-central1-die-pudolfs.cloudfunctions.net/shareGuestBill?token=${seat.shareToken}`;
      const shareTitle = `Strafen vom Kegelabend – ${seat.name}`;
      if(navigator.share){
        try{ await navigator.share({ title: shareTitle, url: shareUrl }); }catch(e){ /* Abgebrochen - ignorieren */ }
      }else{
        try{
          await navigator.clipboard.writeText(shareUrl);
          showModal(`
            <h3>Link kopiert</h3>
            <p>Der Link wurde in die Zwischenablage kopiert:</p>
            <p style="word-break:break-all; font-family:var(--font-mono); font-size:13px;">${escapeHtml(shareUrl)}</p>
            <div class="confirm-row-buttons">
              <button type="button" class="btn-secondary" id="modal-cancel-btn" style="flex:1;">Schließen</button>
            </div>
          `);
          document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
        }catch(e){
          showModal(`
            <h3>Link zum Teilen</h3>
            <p style="word-break:break-all; font-family:var(--font-mono); font-size:13px;">${escapeHtml(shareUrl)}</p>
            <div class="confirm-row-buttons">
              <button type="button" class="btn-secondary" id="modal-cancel-btn" style="flex:1;">Schließen</button>
            </div>
          `);
          document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
        }
      }
    });
    const switchSideBtn = document.getElementById('header-switch-side-btn');
    if(switchSideBtn) switchSideBtn.addEventListener('click', async ()=>{
      if(personOverflowMenu) personOverflowMenu.hidden = true;
      const detail = state.currentEveningDetail;
      const oldSeatId = state.currentFineSeatId;
      const newSeatId = switchAttendeeSide(detail, oldSeatId);
      if(!newSeatId){
        showModal(`
          <h3>Kein Platz frei</h3>
          <p>Auf der anderen Seite ist aktuell kein Platz mehr frei.</p>
          <div class="confirm-row-buttons">
            <button type="button" class="btn-secondary" id="modal-cancel-btn" style="flex:1;">Schließen</button>
          </div>
        `);
        document.getElementById('modal-cancel-btn').addEventListener('click', closeGenericModal);
        return;
      }
      state.currentFineSeatId = newSeatId;
      await setJSON('evening-'+detail.id, detail, true);
      render();
    });
    document.querySelectorAll('.edit-adhoc-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const detail = state.currentEveningDetail;
        const seatId = state.currentFineSeatId;
        const list = (detail.adHocFinesBySeat && detail.adHocFinesBySeat[seatId]) || [];
        const entry = list.find(x=>x.id===btn.dataset.id);
        if(entry) showAddGeldstrafeModal(entry);
      });
    });
    document.querySelectorAll('.delete-adhoc-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const detail = state.currentEveningDetail;
        const seatId = state.currentFineSeatId;
        const list = (detail.adHocFinesBySeat && detail.adHocFinesBySeat[seatId]) || [];
        const entry = list.find(x=>x.id===btn.dataset.id);
        if(entry) showDeleteAdHocFineModal(entry);
      });
    });
  }

  // ---------- Pull-to-Refresh ----------
  (function setupPullToRefresh(){
    const THRESHOLD = 70;
    const MAX_PULL = 110;
    let startY = null;
    let pulling = false;
    let currentPull = 0;

    function scrollTop(){ return window.scrollY || document.documentElement.scrollTop || 0; }
    function getIndicator(){ return document.getElementById('pull-refresh-indicator'); }
    function getContainer(){ return document.querySelector('main.container'); }

    function updateIndicator(pull){
      const el = getIndicator();
      const container = getContainer();
      const progress = Math.min(pull / THRESHOLD, 1);
      const clamped = Math.min(pull, MAX_PULL);
      if(el){
        el.style.opacity = String(progress);
        el.style.transform = `translateX(-50%) translateY(${clamped-40}px) rotate(${progress*180}deg)`;
        el.classList.toggle('ready', progress>=1);
      }
      if(container) container.style.transform = `translateY(${clamped}px)`;
    }

    function resetIndicator(){
      const el = getIndicator();
      const container = getContainer();
      if(el){ el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(-40px) rotate(0deg)'; el.classList.remove('ready','spinning'); }
      if(container){ container.classList.remove('pull-dragging'); container.style.transform=''; }
      currentPull = 0;
    }
    window.__resetPullIndicator = resetIndicator;

    async function doRefresh(){
      const el = getIndicator();
      const container = getContainer();
      if(container){ container.classList.remove('pull-dragging'); container.style.transform = `translateY(${THRESHOLD}px)`; }
      if(el){ el.classList.add('spinning'); el.classList.add('ready'); }
      try{
        if(state.view==='main'){
          const [members, eveningsIndex] = await Promise.all([
            getJSON('members', true, state.members),
            getJSON('evenings-index', true, state.eveningsIndex)
          ]);
          state.members = members;
          state.eveningsIndex = eveningsIndex;
        }else if(state.view==='settings'){
          state.members = await getJSON('members', true, state.members);
        }else if(state.view==='detail' && state.currentEveningDetail){
          const fresh = await getJSON('evening-'+state.currentEveningDetail.id, true, state.currentEveningDetail);
          if(fresh) state.currentEveningDetail = fresh;
        }
        render();
        const newContainer = getContainer();
        if(newContainer){
          newContainer.style.transition = 'none';
          newContainer.style.transform = `translateY(${THRESHOLD}px)`;
          requestAnimationFrame(()=>{
            newContainer.style.transition = '';
            newContainer.style.transform = '';
          });
        }
      } finally {
        resetIndicator();
      }
    }

    document.addEventListener('touchstart', e=>{
      if(scrollTop()>0 || state.view==='new' || document.getElementById('generic-modal-root')){
        pulling = false;
        return;
      }
      startY = e.touches[0].clientY;
      pulling = true;
      const container = getContainer();
      if(container) container.classList.add('pull-dragging');
    }, {passive:true});

    document.addEventListener('touchmove', e=>{
      if(!pulling || startY===null) return;
      const delta = e.touches[0].clientY - startY;
      if(delta<=0 || scrollTop()>0){
        if(currentPull>0) resetIndicator();
        return;
      }
      e.preventDefault();
      currentPull = delta * 0.5;
      updateIndicator(currentPull);
    }, {passive:false});

    document.addEventListener('touchend', ()=>{
      if(!pulling){ startY=null; return; }
      pulling = false;
      startY = null;
      if(currentPull >= THRESHOLD){
        doRefresh();
      }else{
        resetIndicator();
      }
    });
  })();

  // ---------- Update-Prüfung ----------
  // Löst gezielt das iOS-Problem, dass zum Home-Bildschirm hinzugefügte Seiten neue
  // Versionen nicht automatisch bemerken: aktiv beim Server nachfragen und den Nutzer informieren.
  let updateAvailable = false;
  async function checkForUpdate(){
    if(updateAvailable) return;
    try{
      const res = await fetch(location.pathname + '?_v=' + Date.now(), { cache: 'no-store' });
      if(!res.ok) return;
      const html = await res.text();
      const match = html.match(/APP_VERSION\s*=\s*'([^']+)'/);
      if(match && match[1] !== APP_VERSION){
        updateAvailable = true;
        const banner = document.getElementById('update-banner');
        if(banner) banner.hidden = false;
      }
    }catch(e){ /* offline o.ä. - einfach ignorieren */ }
  }
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(); });
  window.addEventListener('focus', checkForUpdate);
  window.addEventListener('pageshow', checkForUpdate);
  setInterval(checkForUpdate, 5 * 60 * 1000);

  // ---------- Auth: Login, "eingeloggt bleiben", Einladungslink zum Passwort-Setzen ----------
  function renderLoginScreen(infoMsg){
    document.getElementById('app').innerHTML = `
      <div class="login-screen">
        <img src="${LOGO_DATA_URI}" alt="Die Pudolfs Kegelclub" class="login-logo">
        <div class="card login-card">
          <h2 class="section-title">Anmelden</h2>
          ${infoMsg ? `<p class="hint" style="margin-bottom:14px;">${escapeHtml(infoMsg)}</p>` : ''}
          <label for="login-email">E-Mail</label>
          <input type="email" id="login-email" placeholder="name@beispiel.de" autocomplete="username">
          <label for="login-password">Passwort</label>
          <input type="password" id="login-password" placeholder="Passwort" autocomplete="current-password">
          <label class="member-check-row" style="cursor:pointer;">
            <input type="checkbox" id="login-stay-checkbox" checked>
            <span>Eingeloggt bleiben</span>
          </label>
          <p class="form-error" id="login-error"></p>
          <button type="button" class="btn-primary" id="login-submit-btn" style="width:100%;">Anmelden</button>
        </div>
      </div>
    `;
    const emailInput = document.getElementById('login-email');
    emailInput.focus();
    const submit = async ()=>{
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const stay = document.getElementById('login-stay-checkbox').checked;
      const errEl = document.getElementById('login-error');
      errEl.textContent = '';
      if(!email || !password){ errEl.textContent = 'Bitte E-Mail und Passwort angeben.'; return; }
      const btn = document.getElementById('login-submit-btn');
      btn.disabled = true; btn.textContent = 'Meldet an…';
      try{
        await setPersistence(auth, stay ? browserLocalPersistence : browserSessionPersistence);
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged übernimmt danach automatisch den App-Start.
      }catch(e){
        btn.disabled = false; btn.textContent = 'Anmelden';
        errEl.textContent = 'Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.';
      }
    };
    document.getElementById('login-submit-btn').addEventListener('click', submit);
    document.getElementById('login-password').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  }

  async function renderSetPasswordScreen(oobCode){
    document.getElementById('app').innerHTML = `<div class="loading">Link wird geprüft…</div>`;
    let email;
    try{
      email = await verifyPasswordResetCode(auth, oobCode);
    }catch(e){
      document.getElementById('app').innerHTML = `
        <div class="login-screen">
          <div class="card login-card">
            <h2 class="section-title">Link ungültig</h2>
            <p>Dieser Einladungslink ist ungültig oder abgelaufen. Bitte eine neue Einladung anfordern.</p>
          </div>
        </div>
      `;
      return;
    }
    document.getElementById('app').innerHTML = `
      <div class="login-screen">
        <img src="${LOGO_DATA_URI}" alt="Die Pudolfs Kegelclub" class="login-logo">
        <div class="card login-card">
          <h2 class="section-title">Passwort festlegen</h2>
          <p>Für ${escapeHtml(email)}</p>
          <label for="setpw-password">Neues Passwort</label>
          <input type="password" id="setpw-password" placeholder="Mindestens 6 Zeichen" autocomplete="new-password">
          <p class="form-error" id="setpw-error"></p>
          <button type="button" class="btn-primary" id="setpw-submit-btn" style="width:100%;">Passwort speichern</button>
        </div>
      </div>
    `;
    document.getElementById('setpw-password').focus();
    document.getElementById('setpw-submit-btn').addEventListener('click', async ()=>{
      const pw = document.getElementById('setpw-password').value;
      const errEl = document.getElementById('setpw-error');
      errEl.textContent = '';
      if(!pw || pw.length<6){ errEl.textContent='Passwort muss mindestens 6 Zeichen haben.'; return; }
      const btn = document.getElementById('setpw-submit-btn');
      btn.disabled = true; btn.textContent = 'Speichert…';
      try{
        await confirmPasswordReset(auth, oobCode, pw);
        history.replaceState(null, '', location.pathname);
        renderLoginScreen('Passwort gespeichert! Du kannst dich jetzt anmelden.');
      }catch(e){
        btn.disabled = false; btn.textContent = 'Passwort speichern';
        errEl.textContent = 'Fehler beim Speichern. Bitte eine neue Einladung anfordern.';
      }
    });
  }

  async function logout(){
    try{ await signOut(auth); }catch(e){ /* ignorieren */ }
  }

  // ---------- Start ----------
  async function init(){
    document.getElementById('app').innerHTML = `<div class="loading">Die Pudolfs – wird geladen…</div>`;
    const updateBtn = document.getElementById('update-banner-btn');
    if(updateBtn) updateBtn.addEventListener('click', ()=>{ location.reload(); });
    try{
      const [members, eveningsIndex, arrears, calendarEvents, calendarOccurrenceEdits] = await Promise.all([
        getJSONOrThrow('members', []),
        getJSONOrThrow('evenings-index', []),
        getJSONOrThrow('finance-arrears', []),
        getJSONOrThrow('calendar-events', []),
        getJSONOrThrow('calendar-occurrence-edits', [])
      ]);
      state.members = members;
      state.eveningsIndex = eveningsIndex;
      state.financeArrears = arrears;
      state.calendarEvents = calendarEvents;
      state.calendarOccurrenceEdits = calendarOccurrenceEdits;
      state.view = 'main';
      render();
      backfillEveningSummaries();
      // iOS-Standalone-PWA-Trick: ein winziger echter Scroll zwingt WebKit dazu, die tatsächliche
      // Viewport-/Safe-Area-Größe beim Kaltstart korrekt neu zu berechnen. Body ist jetzt immer
      // minimal höher als der Bildschirm, damit hier wirklich etwas zum Scrollen vorhanden ist.
      requestAnimationFrame(()=>{
        window.scrollTo(0, 1);
        requestAnimationFrame(()=>{ window.scrollTo(0, 0); });
      });
      setTimeout(checkForUpdate, 2000);
      updateOwnLastLogin();
    }catch(e){
      state.view = 'main';
      renderError('Verbindung fehlgeschlagen. Bitte prüfe deine Internetverbindung.', init);
    }
  }

  // Trägt beim Login den Zeitpunkt beim verknüpften Mitglied ein (Admin-Account übersprungen).
  async function updateOwnLastLogin(){
    try{
      const user = auth.currentUser;
      if(!user || user.email===ADMIN_EMAIL) return;
      const member = state.members.find(m=> (m.email||'').toLowerCase()===user.email.toLowerCase());
      if(!member) return;
      member.lastLogin = new Date().toISOString();
      member.hasAccount = true;
      await setJSON('members', state.members, true);
    }catch(e){ /* nicht kritisch, einfach ignorieren */ }
  }

  (function bootstrapAuth(){
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');
    if(mode==='resetPassword' && oobCode){
      renderSetPasswordScreen(oobCode);
      return;
    }
    onAuthStateChanged(auth, (user)=>{
      if(user){
        init();
      }else{
        renderLoginScreen();
      }
    });
  })();
</script>
