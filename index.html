  function attachTransactionDetailListeners(){
    const overflowBtn = document.getElementById('header-tx-overflow-btn');
    const overflowMenu = document.getElementById('header-tx-overflow-menu');
    if(overflowBtn && overflowMenu){
      overflowBtn.addEventListener('click', (e)=>{
        e.stopPropagation();
        overflowMenu.hidden = !overflowMenu.hidden;
      });
    }
    const deleteBtn = document.getElementById('header-delete-tx-btn');
    if(deleteBtn) deleteBtn.addEventListener('click', ()=>{
      if(overflowMenu) overflowMenu.hidden = true;
      const t = state.financeTransactions.find(x=>x.id===state.currentTransactionId);
      if(t) showDeleteTransactionModal(t);
    });
    const saveBtn = document.getElementById('save-tx-btn');
    if(!saveBtn) return;
    saveBtn.addEventListener('click', async ()=>{
      const existingTransaction = state.currentTransactionId ? state.financeTransactions.find(t=>t.id===state.currentTransactionId) : null;
      const isEdit = !!existingTransaction;
      const isLocked = isEdit && !!existingTransaction.fromArrears;
      const errEl = document.getElementById('tx-form-error');

      if(isLocked){
        const description = document.getElementById('new-tx-description').value.trim();
        if(!description){ errEl.textContent='Bitte eine Bezeichnung angeben.'; return; }
        saveBtn.disabled = true; saveBtn.textContent = 'Speichert…';
        const t = state.financeTransactions.find(x=>x.id===existingTransaction.id);
        if(t) t.description = description;
        if(t) await saveTransaction(t);
        history.back();
        return;
      }

      const accountId = document.getElementById('new-tx-account').value;
      const description = document.getElementById('new-tx-description').value.trim();
      const date = document.getElementById('new-tx-date').value;
      const incomeRaw = document.getElementById('new-tx-income').value.replace(',', '.');
      const expenseRaw = document.getElementById('new-tx-expense').value.replace(',', '.');
      const income = incomeRaw==='' ? 0 : parseFloat(incomeRaw);
      const expense = expenseRaw==='' ? 0 : parseFloat(expenseRaw);

      if(!description){ errEl.textContent='Bitte eine Bezeichnung angeben.'; return; }
      if(!date){ errEl.textContent='Bitte ein Datum angeben.'; return; }
      if(isNaN(income) || isNaN(expense) || income<0 || expense<0){ errEl.textContent='Bitte gültige Beträge angeben.'; return; }
      if((income>0) === (expense>0)){ errEl.textContent='Bitte entweder eine Einnahme oder eine Ausgabe angeben (nicht beides oder keins).'; return; }

      const amount = income>0 ? Math.round(income*100)/100 : -Math.round(expense*100)/100;
      saveBtn.disabled = true; saveBtn.textContent = isEdit ? 'Speichert…' : 'Wird hinzugefügt…';

      let savedTx;
      if(isEdit){
        const t = state.financeTransactions.find(x=>x.id===existingTransaction.id);
        if(t){ t.accountId=accountId; t.description=description; t.date=date; t.amount=amount; }
        savedTx = t;
      }else{
        savedTx = {id:uid('tx'), accountId, description, date, amount, createdAt: Date.now()};
        state.financeTransactions.push(savedTx);
      }
      if(savedTx) await saveTransaction(savedTx);
      history.back();
    });
  }

  // ---------- Drag & Drop zum manuellen Sortieren (Pointer Events, touch- und mausfähig) ----------
  function setupDragReorder(containerId, onReorder){
    const container = document.getElementById(containerId);
    if(!container) return;
    container.querySelectorAll('.draggable-row').forEach(row=>{
      const handle = row.querySelector('.drag-handle');
      if(!handle) return;
      handle.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        const startY = e.clientY;
        const rect = row.getBoundingClientRect();
        const placeholder = document.createElement('div');
        placeholder.className = 'drag-placeholder';
        placeholder.style.height = rect.height+'px';
        row.after(placeholder);
        row.classList.add('dragging');
        row.style.position='fixed';
        row.style.zIndex='999';
        row.style.width=rect.width+'px';
        row.style.left=rect.left+'px';
        row.style.top=rect.top+'px';
        row.style.pointerEvents='none';

        function onMove(ev){
          row.style.top = (rect.top + (ev.clientY-startY)) + 'px';
          const siblings = Array.from(container.querySelectorAll('.draggable-row:not(.dragging)'));
          let placed = false;
          for(const sib of siblings){
            const sRect = sib.getBoundingClientRect();
            if(ev.clientY < sRect.top + sRect.height/2){
              container.insertBefore(placeholder, sib);
              placed = true;
              break;
            }
          }
          if(!placed) container.appendChild(placeholder);
        }
        function onUp(){
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
          row.style.position=''; row.style.zIndex=''; row.style.width=''; row.style.left=''; row.style.top=''; row.style.pointerEvents='';
          row.classList.remove('dragging');
          placeholder.replaceWith(row);
          const newIdOrder = Array.from(container.querySelectorAll('.draggable-row')).map(el=>el.dataset.id);
          onReorder(newIdOrder);
        }
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      });
    });
  }

  // Übernimmt offene Runden aus vergangenen Abenden (Datum < neues Datum) in den neu angelegten
  // Abend, aber NUR für Personen, die auch tatsächlich an diesem neuen Abend teilnehmen. Landet
  // in einem separaten Feld (carriedOverRounds statt finesBySeat), damit bei "Fremdstrafe + Runde"
  // kein zweiter Geldbetrag entsteht - hier geht es rein um die Rundenpflicht.
  //
  // WICHTIG: die Markierung "diese Runde wurde bereits weitergereicht" passiert PRO EINZELNER
  // INSTANZ (roundsCarriedAwayBySeat, analog zu roundsGivenBySeat), NICHT pro Abend. Ein Abend
  // kann mehrere offene Runden verschiedener Personen haben; nimmt nur ein Teil dieser Personen
  // am neuen Abend teil, dürfen die übrigen, nicht übernommenen Instanzen weiterhin als offene
  // Quelle für spätere Abende gelten. Eine frühere Version markierte stattdessen den GESAMTEN
  // Quell-Abend als "abgearbeitet", sobald irgendeine seiner Runden übernommen wurde - das ließ
  // die offene Runde einer an diesem Zwischen-Abend abwesenden Person unwiederbringlich verloren
  // gehen, sobald irgendeine andere Person erfolgreich übernommen hatte.
  async function carryOverOpenRounds(newDate, participantNames){
    const sourceIndexEntries = state.eveningsIndex.filter(e=> e.date < newDate && e.hasOpenRounds);
    if(sourceIndexEntries.length===0) return [];

    const carried = [];
    const touchedOldDetails = [];
    for(const indexEntry of sourceIndexEntries){
      const oldDetail = await getEveningDetail(indexEntry.id);
      if(!oldDetail) continue;
      const oldEntries = computeRoundEntries(oldDetail).filter(e=>!e.given && !e.carriedAway);
      let changed = false;
      oldEntries.forEach(e=>{
        if(!participantNames.has(e.name)) return;
        carried.push({ id: uid('cr'), fineId: e.fineId, fineName: e.fineName, name: e.name, given: false, sourceEveningId: oldDetail.id, sourceDate: oldDetail.date });
        changed = true;
        if(e.carried){
          // Diese Instanz war selbst schon eine übernommene Runde aus einem noch älteren Abend
          // (carriedOverRounds-Eintrag mit eigener id in e.instanceIndex) - hier wird sie ein
          // weiteres Mal weitergereicht, das Original-Objekt bekommt dafür sein eigenes
          // carriedAway-Flag (kein Sitzplatz vorhanden, daher eigenes Feld statt der Seat-Map).
          const origEntry = (oldDetail.carriedOverRounds||[]).find(c=>c.id===e.instanceIndex);
          if(origEntry) origEntry.carriedAway = true;
        }else{
          if(!oldDetail.roundsCarriedAwayBySeat) oldDetail.roundsCarriedAwayBySeat = {};
          if(!oldDetail.roundsCarriedAwayBySeat[e.seatId]) oldDetail.roundsCarriedAwayBySeat[e.seatId] = {};
          const current = oldDetail.roundsCarriedAwayBySeat[e.seatId][e.fineId] || [];
          if(!current.includes(e.instanceIndex)) oldDetail.roundsCarriedAwayBySeat[e.seatId][e.fineId] = [...current, e.instanceIndex];
        }
      });
      if(changed) touchedOldDetails.push(oldDetail);
    }
    // roundsCarriedAwayBySeat liegt wie roundsGivenBySeat im Sitzplatz-Unterdokument, NICHT im
    // Hauptdokument - deshalb pro betroffenem Sitzplatz über saveEveningSeatFines speichern.
    // carriedOverRounds (für den carried-Sonderfall oben) liegt dagegen im Hauptdokument.
    await Promise.all(touchedOldDetails.map(async d=>{
      const seatIds = new Set([
        ...Object.keys(d.roundsCarriedAwayBySeat||{}),
      ]);
      await Promise.all([...seatIds].map(seatId=> saveEveningSeatFines(d.id, seatId, (d.finesBySeat||{})[seatId], (d.adHocFinesBySeat||{})[seatId], (d.roundsGivenBySeat||{})[seatId], (d.roundsCarriedAwayBySeat||{})[seatId])));
      await saveEveningMainDoc(d);
    }));
    // evenings-index aktualisieren, damit spätere Abend-Anlagen den korrekten hasOpenRounds-Stand
    // sehen (ein Abend kann jetzt hasOpenRounds:false haben, wenn ALLE seine Instanzen entweder
    // gegeben oder weitergereicht wurden).
    if(touchedOldDetails.length>0){
      const summaryById = {};
      touchedOldDetails.forEach(d=>{ summaryById[d.id] = computeEveningSummaryFields(d); });
      await updateEveningsIndex(serverIndex=> serverIndex.map(e=> summaryById[e.id] ? {...e, ...summaryById[e.id]} : e));
      state.eveningsIndex = state.eveningsIndex.map(e=> summaryById[e.id] ? {...e, ...summaryById[e.id]} : e);
    }
    return carried;
  }

  // Gibt eine Liste carriedOverRounds-Einträge wieder an ihre Quell-Instanz zurück (macht das
  // carriedAway-Flag rückgängig), sofern die jeweilige Runde noch offen war (given:false) - eine
  // bereits gegebene Runde muss nicht zurückgegeben werden, die Pflicht wurde ja bereits erfüllt.
  // Wird beim Löschen eines Abends aufgerufen (siehe attachDetailListeners()), damit übernommene,
  // aber noch offene Rundenpflichten nicht ersatzlos verschwinden, nur weil der Abend, der sie
  // übernommen hatte, wieder gelöscht wird. Arbeitet jetzt (wie carryOverOpenRounds) auf
  // Instanz-Ebene: nur die konkret betroffene Runde wird zurückgegeben, nicht der ganze Abend.
  async function releaseCarriedRoundsToSource(carriedOverRounds){
    const openCarried = (carriedOverRounds||[]).filter(c=>!c.given && c.sourceEveningId);
    if(openCarried.length===0) return;
    const sourceIds = [...new Set(openCarried.map(c=>c.sourceEveningId))];
    const touchedOldDetails = [];
    for(const sourceId of sourceIds){
      const oldDetail = await getEveningDetail(sourceId);
      if(!oldDetail) continue;
      const relevant = openCarried.filter(c=>c.sourceEveningId===sourceId);
      let changed = false;
      relevant.forEach(c=>{
        // Fall 1: die übernommene Runde stammt direkt aus finesBySeat des Quell-Abends
        // (roundsCarriedAwayBySeat). Fall 2: sie war dort selbst schon eine carriedOverRounds-
        // Instanz (carried, siehe carryOverOpenRounds) - dann carriedAway dort zurücksetzen.
        // Da carried-Einträge keine seatId/instanceIndex-Zahl haben, wird zuerst versucht, per
        // fineId+name eine passende carriedAway-Markierung in roundsCarriedAwayBySeat zu finden;
        // schlägt das fehl, wird stattdessen der carriedOverRounds-Eintrag mit gleichem
        // fineId+name gesucht.
        const seatsWithFine = Object.keys(oldDetail.roundsCarriedAwayBySeat||{});
        let resolved = false;
        for(const seatId of seatsWithFine){
          const seatObj = (oldDetail.seating||[]).find(s=>s.seatId===seatId);
          if(!seatObj || seatObj.name!==c.name) continue;
          const list = (oldDetail.roundsCarriedAwayBySeat[seatId]||{})[c.fineId] || [];
          if(list.length>0){
            oldDetail.roundsCarriedAwayBySeat[seatId][c.fineId] = list.slice(0, -1);
            changed = true; resolved = true;
            break;
          }
        }
        if(!resolved){
          const origEntry = (oldDetail.carriedOverRounds||[]).find(cc=> cc.fineId===c.fineId && cc.name===c.name && cc.carriedAway);
          if(origEntry){ origEntry.carriedAway = false; changed = true; }
        }
      });
      if(changed) touchedOldDetails.push(oldDetail);
    }
    await Promise.all(touchedOldDetails.map(async d=>{
      const seatIds = Object.keys(d.roundsCarriedAwayBySeat||{});
      await Promise.all(seatIds.map(seatId=> saveEveningSeatFines(d.id, seatId, (d.finesBySeat||{})[seatId], (d.adHocFinesBySeat||{})[seatId], (d.roundsGivenBySeat||{})[seatId], (d.roundsCarriedAwayBySeat||{})[seatId])));
      await saveEveningMainDoc(d);
    }));
    if(touchedOldDetails.length>0){
      const summaryById = {};
      touchedOldDetails.forEach(d=>{ summaryById[d.id] = computeEveningSummaryFields(d); });
      await updateEveningsIndex(serverIndex=> serverIndex.map(e=> summaryById[e.id] ? {...e, ...summaryById[e.id]} : e));
      state.eveningsIndex = state.eveningsIndex.map(e=> summaryById[e.id] ? {...e, ...summaryById[e.id]} : e);
    }
  }

  async function handleConfirmNewEvening(){
    const dateInput = document.getElementById('date-input');
    const date = (dateInput && dateInput.value) ? dateInput.value : todayISO();
    const checkedIds = Array.from(document.querySelectorAll('.member-checkbox:checked')).map(cb=>cb.dataset.id);
    const selectedMembers = state.members.filter(m=>checkedIds.includes(m.id));
    const participants = [
      ...selectedMembers.map(m=>({name:displayName(m), isGuest:false})),
      ...currentGuests.map(g=>({name:g.name, isGuest:true}))
    ];
    const errEl = document.getElementById('form-error');
    const btn = document.getElementById('confirm-btn');
    const originalBtnText = btn ? btn.textContent : '';

    // Sitzplan-Template wird HIER EINMALIG aus der Formular-Auswahl gelesen und für den
    // gesamten weiteren Ablauf (Validierung, Sitzverteilung, Speicherung) verwendet - so bleibt
    // die Erstellung konsistent, selbst wenn der Club sein Standard-Template zwischenzeitlich in
    // einem anderen Tab ändert. Wird im detail-Objekt gespeichert (siehe unten) - bestehende
    // Abende bleiben dadurch beim späteren Wechsel des Club-Templates unverändert (siehe
    // getEveningSeatingTemplate()).
    const seatingTemplate = getSelectedNewEveningSeatingTemplate();

    // Schnelle, lokale Prüfungen zuerst - kein Netzwerk nötig, keine Ladeanzeige erforderlich.
    const maxSeats = seatingTemplate.perSide*2;
    if(participants.length<1){ if(errEl) errEl.textContent='Wähle mindestens einen Teilnehmer aus.'; return; }
    if(participants.length>maxSeats){ if(errEl) errEl.textContent=`Maximal ${maxSeats} Teilnehmer möglich – es gibt nur ${maxSeats} Plätze.`; return; }

    // Ab hier braucht es das Netzwerk - sofort sichtbares Feedback geben, damit ein Klick
    // nie so wirkt, als wäre nichts passiert.
    if(errEl) errEl.innerHTML = '';
    if(btn){ btn.disabled = true; btn.textContent = 'Wird geprüft…'; }

    state.eveningsIndex = await getClubJSON('evenings-index', state.eveningsIndex);
    markFetched('eveningsIndex');
    const existing = state.eveningsIndex.find(e=>e.date===date);
    if(existing){
      if(btn){ btn.disabled = false; btn.textContent = originalBtnText; }
      showDuplicateDateModal(date, existing.id);
      return;
    }

    if(btn){ btn.textContent = 'Wird ausgelost…'; }

    // Aktuelle Strafenliste als feste Kopie für diesen Abend übernehmen - spätere Änderungen
    // in der Strafenverwaltung dürfen diesen Abend nicht mehr beeinflussen.
    const finesCatalogAtCreation = await getClubJSON('fines-catalog', state.finesCatalog);
    state.finesCatalog = finesCatalogAtCreation;
    markFetched('finesCatalog');

    const occupiedSeatIds = buildSeatPriorityOrder(seatingTemplate.perSide).slice(0, participants.length);
    const schriftfuehrerSelect = document.getElementById('schriftfuehrer-select');
    const schriftfuehrerChoice = schriftfuehrerSelect ? schriftfuehrerSelect.value : 'standard';
    const isStandardplatz = schriftfuehrerChoice === 'standard';
    // Der Standardplatz ist in der Clubverwaltung konfigurierbar (siehe
    // getStandardSchriftfuehrerSeatId(), Default 'kneipe-1'). Bei "Standardplatz" landet zwingend
    // ein Mitglied (kein Gast) auf diesem Platz und wird automatisch Schriftführer - bei
    // "Auslosen" und einer konkreten Namenswahl bleibt die Sitzverlosung hingegen komplett
    // normal/zufällig, der Schriftführer wird erst danach bestimmt. seatingTemplate wird HIER
    // explizit übergeben (statt den Default zu nutzen), da der Nutzer auf dieser Seite ein vom
    // Club-Standard abweichendes Template für diesen Abend gewählt haben könnte.
    const standardSeatId = getStandardSchriftfuehrerSeatId(seatingTemplate);

    let shuffledParticipants;
    if(isStandardplatz && occupiedSeatIds.includes(standardSeatId)){
      // Der Standardplatz wird automatisch Schriftführer - dort darf deshalb kein Gast landen.
      const members = participants.filter(p=>!p.isGuest);
      if(members.length>0){
        const forcedMember = members[Math.floor(Math.random()*members.length)];
        const rest = shuffle(participants.filter(p=>p!==forcedMember));
        const otherSeatIds = occupiedSeatIds.filter(id=>id!==standardSeatId);
        const tempAssignment = { [standardSeatId]: forcedMember };
        otherSeatIds.forEach((seatId, i)=>{ tempAssignment[seatId] = rest[i]; });
        shuffledParticipants = occupiedSeatIds.map(id=>tempAssignment[id]);
      }else{
        shuffledParticipants = shuffle(participants);
      }
    }else{
      shuffledParticipants = shuffle(participants);
    }

    const seatAssignment = {};
    occupiedSeatIds.forEach((seatId, i)=>{ seatAssignment[seatId] = shuffledParticipants[i]; });

    let schriftfuehrerSeatId = null;
    if(isStandardplatz){
      if(seatAssignment[standardSeatId] && !seatAssignment[standardSeatId].isGuest){
        schriftfuehrerSeatId = standardSeatId;
      }else{
        // Standardplatz existiert bei diesem Abend nicht (weniger Teilnehmer als der
        // Standardplatz-Index erfordert) - in diesem Fall wird stattdessen wie bei "Auslosen"
        // zufällig ein Mitglied (kein Gast) unter allen besetzten Plätzen bestimmt (siehe auch
        // Hinweis im Info-Popup "Standardplatz Schriftführer" in der Clubverwaltung).
        const memberSeatIds = occupiedSeatIds.filter((seatId, i)=> !shuffledParticipants[i].isGuest);
        if(memberSeatIds.length>0){
          schriftfuehrerSeatId = memberSeatIds[Math.floor(Math.random()*memberSeatIds.length)];
        }
      }
    }else if(schriftfuehrerChoice==='draw'){
      const memberSeatIds = occupiedSeatIds.filter((seatId, i)=> !shuffledParticipants[i].isGuest);
      if(memberSeatIds.length>0){
        schriftfuehrerSeatId = memberSeatIds[Math.floor(Math.random()*memberSeatIds.length)];
      }
    }else if(schriftfuehrerChoice.startsWith('name:')){
      // Konkrete Person gewählt: bleibt auf ihrem zufällig verlosten Platz, wird dort nur markiert.
      const chosenMemberId = schriftfuehrerChoice.slice('name:'.length);
      const chosenMember = state.members.find(m=>m.id===chosenMemberId);
      if(chosenMember){
        const chosenName = displayName(chosenMember);
        const foundSeatId = occupiedSeatIds.find((seatId, i)=> !shuffledParticipants[i].isGuest && shuffledParticipants[i].name===chosenName);
        if(foundSeatId) schriftfuehrerSeatId = foundSeatId;
      }
    }

    // Seitenbezeichnungen werden HIER EINMALIG als fester Snapshot übernommen - analog zu
    // seatingTemplateId. Ein späteres Ändern in der Clubverwaltung (#clubverwaltung) darf die
    // Darstellung dieses bereits angelegten Abends nicht rückwirkend verändern (siehe
    // getEveningSideNames()/getEveningShortLabels()).
    const seatingSideNamesAtCreation = getSeatingSideNames();
    const seating = SEATS(seatingTemplate, seatingSideNamesAtCreation).map(seat=>{
      const p = seatAssignment[seat.id];
      return {
        seatId:seat.id, section:seat.section, label:seat.label,
        name: p ? p.name : null, isGuest: p ? p.isGuest : false,
        isSchriftfuehrer: seat.id===schriftfuehrerSeatId
      };
    });

    const id = uid('e');
    // seatingTemplateId und seatingSideNamesSnapshot werden fest mit dem Abend gespeichert
    // (analog zu finesCatalogSnapshot) - siehe getEveningSeatingTemplate()/getEveningSideNames():
    // ein späterer Wechsel des Club-Templates bzw. der Seitenbezeichnungen darf die Darstellung
    // dieses bereits angelegten Abends nicht rückwirkend verändern.
    const participantNames = new Set(participants.map(p=>p.name));
    const carriedOverRounds = await carryOverOpenRounds(date, participantNames);

    const detail = { id, date, seating, finesBySeat: {}, finesCatalogSnapshot: finesCatalogAtCreation, seatingTemplateId: seatingTemplate.id, seatingSideNamesSnapshot: seatingSideNamesAtCreation, carriedOverRounds };
    const newIndexEntry = {id, date, ...computeEveningSummaryFields(detail)};
    await Promise.all([
      saveEveningMainDoc(detail),
      updateEveningsIndex(serverIndex=> [...serverIndex, newIndexEntry])
    ]);

    state.currentEveningDetail = detail;
    state.justCreated = true;
    state.eveningTab = 'sitzplan';
    state.view = 'detail';
    render();
  }

  // ---------- Pull-to-Refresh ----------
  (function setupPullToRefresh(){
    const THRESHOLD = 70;
    const MAX_PULL = 110;
    let startY = null;
    let pulling = false;
    let currentPull = 0;

    function scrollTop(){ return window.scrollY || document.documentElement.scrollTop || 0; }
    function getIndicator(){ return document.getElementById('pull-refresh-indicator'); }
    function getContainer(){ return document.querySelector('main.container'); }

    function updateIndicator(pull){
      const el = getIndicator();
      const container = getContainer();
      const progress = Math.min(pull / THRESHOLD, 1);
      const clamped = Math.min(pull, MAX_PULL);
      if(el){
        el.style.opacity = String(progress);
        el.style.transform = `translateX(-50%) translateY(${clamped-40}px) rotate(${progress*180}deg)`;
        el.classList.toggle('ready', progress>=1);
      }
      if(container) container.style.transform = `translateY(${clamped}px)`;
    }

    function resetIndicator(){
      const el = getIndicator();
      const container = getContainer();
      if(el){ el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(-40px) rotate(0deg)'; el.classList.remove('ready','spinning'); }
      if(container){ container.classList.remove('pull-dragging'); container.style.transform=''; }
      currentPull = 0;
    }
    window.__resetPullIndicator = resetIndicator;

    async function doRefresh(){
      const el = getIndicator();
      const container = getContainer();
      if(container){ container.classList.remove('pull-dragging'); container.style.transform = `translateY(${THRESHOLD}px)`; }
      if(el){ el.classList.add('spinning'); el.classList.add('ready'); }
      try{
        if(state.view==='main'){
          const [members, eveningsIndex] = await Promise.all([
            getAllMembers(),
            getClubJSON('evenings-index', state.eveningsIndex)
          ]);
          state.members = members;
          state.eveningsIndex = eveningsIndex;
          markFetched('members');
          markFetched('eveningsIndex');
        }else if(state.view==='settings'){
          state.members = await getAllMembers();
          markFetched('members');
        }else if(state.view==='detail' && state.currentEveningDetail){
          const fresh = await getEveningDetail(state.currentEveningDetail.id);
          if(fresh) state.currentEveningDetail = fresh;
        }
        render();
        const newContainer = getContainer();
        if(newContainer){
          newContainer.style.transition = 'none';
          newContainer.style.transform = `translateY(${THRESHOLD}px)`;
          requestAnimationFrame(()=>{
            newContainer.style.transition = '';
            newContainer.style.transform = '';
          });
        }
      } finally {
        resetIndicator();
      }
    }

    document.addEventListener('touchstart', e=>{
      if(scrollTop()>0 || state.view==='new' || document.getElementById('generic-modal-root') || !getContainer()){
        pulling = false;
        return;
      }
      startY = e.touches[0].clientY;
      pulling = true;
      const container = getContainer();
      if(container) container.classList.add('pull-dragging');
    }, {passive:true});

    document.addEventListener('touchmove', e=>{
      if(!pulling || startY===null) return;
      const delta = e.touches[0].clientY - startY;
      if(delta<=0 || scrollTop()>0){
        if(currentPull>0) resetIndicator();
        return;
      }
      e.preventDefault();
      currentPull = delta * 0.5;
      updateIndicator(currentPull);
    }, {passive:false});

    document.addEventListener('touchend', ()=>{
      if(!pulling){ startY=null; return; }
      pulling = false;
      startY = null;
      if(currentPull >= THRESHOLD){
        doRefresh();
      }else{
        resetIndicator();
      }
    });
  })();

  // ---------- Update-Prüfung ----------
  // Löst gezielt das iOS-Problem, dass zum Home-Bildschirm hinzugefügte Seiten neue
  // Versionen nicht automatisch bemerken: aktiv beim Server nachfragen und den Nutzer informieren.
  let updateAvailable = false;
  async function checkForUpdate(){
    if(updateAvailable) return;
    try{
      const res = await fetch(location.pathname + '?_v=' + Date.now(), { cache: 'no-store' });
      if(!res.ok) return;
      const html = await res.text();
      const match = html.match(/APP_VERSION\s*=\s*'([^']+)'/);
      if(match && match[1] !== APP_VERSION){
        updateAvailable = true;
        const banner = document.getElementById('update-banner');
        if(banner) banner.hidden = false;
      }
    }catch(e){ /* offline o.ä. - einfach ignorieren */ }
  }
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkForUpdate(); });
  window.addEventListener('focus', checkForUpdate);
  window.addEventListener('pageshow', checkForUpdate);
  setInterval(checkForUpdate, 5 * 60 * 1000);

          <label for="cc-first-name">Vorname</label>
          <input type="text" id="cc-first-name" placeholder="Vorname">
          <label for="cc-last-name">Name</label>
          <input type="text" id="cc-last-name" placeholder="Nachname">
          <label for="cc-nickname">Spitzname (optional)</label>
          <input type="text" id="cc-nickname" placeholder="Wird auf dem Sitzplan statt des Vornamens angezeigt">
          <label for="cc-email">E-Mail-Adresse</label>
          <input type="email" id="cc-email" placeholder="name@beispiel.de">

          <p class="form-error" id="cc-error"></p>
          <button type="button" class="btn-primary" id="cc-submit-btn" style="width:100%;">Kegelclub anlegen</button>
        </div>
        <p class="muted" id="cc-back-link" style="margin-top:16px; text-align:center; cursor:pointer; text-decoration:underline;">Zurück zur Anmeldung</p>
      </div>
    `;
    document.getElementById('cc-back-link').addEventListener('click', ()=> history.back());
    document.getElementById('cc-name').focus();

    document.getElementById('cc-submit-btn').addEventListener('click', async ()=>{
      const clubName = document.getElementById('cc-name').value.trim();
      const foundedOn = document.getElementById('cc-founded').value;
      const paypalName = document.getElementById('cc-paypal').value.trim();
      const firstName = document.getElementById('cc-first-name').value.trim();
      const lastName = document.getElementById('cc-last-name').value.trim();
      const nickname = document.getElementById('cc-nickname').value.trim();
      const email = document.getElementById('cc-email').value.trim();
      const errEl = document.getElementById('cc-error');
      errEl.textContent = '';

      if(!clubName){ errEl.textContent = 'Bitte einen Clubnamen angeben.'; return; }
      if(!foundedOn){ errEl.textContent = 'Bitte ein Gründungsdatum angeben.'; return; }
      if(!firstName || !lastName || !email){ errEl.textContent = 'Bitte Vorname, Name und E-Mail-Adresse des Kassenwarts angeben.'; return; }

      const btn = document.getElementById('cc-submit-btn');
      btn.disabled = true; btn.textContent = 'Wird angelegt…';
      try{
        const createClubFn = httpsCallable(functions, 'createClub');
        await createClubFn({ clubName, foundedOn, paypalName, firstName, lastName, nickname, email });
        renderLoginScreen('Kegelclub angelegt! Der Kassenwart bekommt gleich eine E-Mail zum Festlegen des Passworts.');
      }catch(e){
        btn.disabled = false; btn.textContent = 'Kegelclub anlegen';
        errEl.textContent = 'Kegelclub konnte nicht angelegt werden. Bitte später erneut versuchen.';
      }
    });
  }

  // Zeigt an, dass der eingeloggte Account keinem Club zugeordnet ist (Custom Claim 'clubIds'
  // fehlt oder ist leer) - z.B. wenn ein Account manuell in der Firebase Console angelegt wurde,
  // statt über die reguläre Einladung (inviteMember), die den Claim automatisch setzt.
  function renderNoClubAccessScreen(){
    document.getElementById('app').innerHTML = `
      <div class="login-screen">
        <img src="${LOGO_DATA_URI}" alt="Kegelclub Logo" class="login-logo">
        <div class="card login-card">
          <h2 class="section-title">Kein Zugriff</h2>
          <p class="hint" style="margin-bottom:14px;">Dieser Account ist aktuell keinem Kegelclub zugeordnet. Bitte wende dich an eine Person, die dich einladen kann.</p>
          <button type="button" class="btn-secondary" id="no-club-logout-btn" style="width:100%;">Abmelden</button>
        </div>
      </div>
    `;
    document.getElementById('no-club-logout-btn').addEventListener('click', async ()=>{ await signOut(auth); });
  }

  // Zeigt eine Auswahl der Clubs, denen der eingeloggte Account zugeordnet ist (mehr als einer),
  // und gibt die gewählte clubId zurück, sobald der Nutzer klickt. Die Wahl wird bewusst NICHT
  // gemerkt - bei jedem Login wird erneut gefragt.
  async function showClubSelectionScreen(clubIds){
    document.getElementById('app').innerHTML = `
      <div class="login-screen">
        <img src="${LOGO_DATA_URI}" alt="Kegelclub Logo" class="login-logo">
        <div class="card login-card">
          <h2 class="section-title">Club auswählen</h2>
          <p class="hint" style="margin-bottom:14px;">Dieser Account gehört zu mehreren Kegelclubs. Mit welchem möchtest du dich verbinden?</p>
          <div id="club-selection-list" class="loading" style="padding:20px 0;"><div class="loading-spinner"></div></div>
        </div>
      </div>
    `;
    const clubs = await Promise.all(clubIds.map(async id=>{
      let data = null;
      try{ data = await getClub(id); }catch(e){ /* Name unbekannt, ID als Fallback anzeigen */ }
      return { id, name: (data && data.name) || id };
    }));
    return new Promise(resolve=>{
      const listEl = document.getElementById('club-selection-list');
      listEl.className = '';
      listEl.innerHTML = clubs.map(c=>`
        <div class="member-row-full club-selection-row" data-club-id="${escapeHtml(c.id)}" style="cursor:pointer;">
          <div class="member-row-full-main">
            <div class="member-row">
              <span>${escapeHtml(c.name)}</span>
            </div>
          </div>
          <svg class="cal-event-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </div>
      `).join('');
      listEl.querySelectorAll('.club-selection-row').forEach(row=>{
        row.addEventListener('click', ()=> resolve(row.dataset.clubId));
      });
    });
  }

  async function renderSetPasswordScreen(oobCode){
    document.getElementById('app').innerHTML = `<div class="loading"><div class="loading-spinner"></div>Link wird geprüft…</div>`;
    let email;
    try{
      email = await verifyPasswordResetCode(auth, oobCode);
    }catch(e){
      document.getElementById('app').innerHTML = `
        <div class="login-screen">
          <div class="card login-card">
            <h2 class="section-title">Link ungültig</h2>
            <p>Dieser Einladungslink ist ungültig oder abgelaufen. Bitte eine neue Einladung anfordern.</p>
          </div>
        </div>
      `;
      return;
    }
    document.getElementById('app').innerHTML = `
      <div class="login-screen">
        <img src="${LOGO_DATA_URI}" alt="Kegelclub Logo" class="login-logo">
        <div class="card login-card">
          <h2 class="section-title">Passwort festlegen</h2>
          <p>Für ${escapeHtml(email)}</p>
          <label for="setpw-password">Neues Passwort</label>
          <input type="password" id="setpw-password" placeholder="Mindestens 6 Zeichen" autocomplete="new-password">
          <p class="form-error" id="setpw-error"></p>
          <button type="button" class="btn-primary" id="setpw-submit-btn" style="width:100%;">Passwort speichern</button>
        </div>
      </div>
    `;
    document.getElementById('setpw-password').focus();
    document.getElementById('setpw-submit-btn').addEventListener('click', async ()=>{
      const pw = document.getElementById('setpw-password').value;
      const errEl = document.getElementById('setpw-error');
      errEl.textContent = '';
      if(!pw || pw.length<6){ errEl.textContent='Passwort muss mindestens 6 Zeichen haben.'; return; }
      const btn = document.getElementById('setpw-submit-btn');
      btn.disabled = true; btn.textContent = 'Speichert…';
      try{
        await confirmPasswordReset(auth, oobCode, pw);
        history.replaceState(null, '', location.pathname);
        renderLoginScreen('Passwort gespeichert! Du kannst dich jetzt anmelden.');
      }catch(e){
        btn.disabled = false; btn.textContent = 'Passwort speichern';
        errEl.textContent = 'Fehler beim Speichern. Bitte eine neue Einladung anfordern.';
      }
    });
  }

  async function logout(){
    try{ await signOut(auth); }catch(e){ /* ignorieren */ }
  }

  // Aktualisiert Browser-Tab-Titel und Apple-Web-App-Titel mit dem echten Clubnamen, sobald
  // CURRENT_CLUB_DATA geladen ist (wird in bootstrapAuth() direkt nach dem Login aufgerufen).
  // Vor dem Login zeigen die statischen HTML-Attribute weiterhin den generischen Platzhalter.
  function applyClubBranding(){
    document.title = clubDisplayName();
    const appleTitleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
    if(appleTitleMeta) appleTitleMeta.setAttribute('content', clubDisplayName());
  }

  // ---------- Start ----------
  async function init(){
    document.getElementById('app').innerHTML = `<div class="loading"><div class="loading-spinner"></div>${clubDisplayName()} – wird geladen…</div>`;
    const updateBtn = document.getElementById('update-banner-btn');
    if(updateBtn) updateBtn.addEventListener('click', ()=>{ location.reload(); });
    try{
      // WICHTIG: eveningsIndex wird hier bewusst NICHT aus dem Promise.all-Ergebnis in
      // state.eveningsIndex übernommen (siehe unten). getClubJSONOrThrow() startet parallel zu
      // seinem eigenen Rückgabewert einen Hintergrund-Serverabgleich (onBackgroundUpdate,
      // hier backgroundStateUpdate('eveningsIndex','main')), der state.eveningsIndex bereits
      // während dieses Promise.all noch läuft mit dem korrekten Serverstand überschreiben kann
      // (z.B. wenn der Server schneller antwortet als die anderen Requests in diesem Promise.all).
      // Eine anschließende, bedingungslose Zuweisung state.eveningsIndex = eveningsIndex hätte
      // diesen bereits korrigierten Wert wieder mit dem ursprünglichen (unter Umständen
      // veralteten Cache-)Rückgabewert überschrieben - das führte dazu, dass ein kurz zuvor
      // gelöschter Kegelabend nach einem Reload trotz bereits korrekt bereinigter Datenbank
      // weiterhin angezeigt wurde. Stattdessen wird hier ein Platzhalter-Marker verglichen:
      // nur falls der Hintergrundabgleich zwischenzeitlich NICHT bereits zugeschlagen hat, wird
      // der Promise.all-Rückgabewert übernommen.
      const eveningsIndexFetchStartedAt = Date.now();
      const [members, eveningsIndex, arrears, calendarEvents, calendarOccurrenceEdits] = await Promise.all([
        getAllMembers(),
        getClubJSONOrThrow('evenings-index', [], backgroundStateUpdate('eveningsIndex', 'main')),
        getAllArrears(),
        getAllCalendarEvents(),
        getAllOccurrenceEdits()
      ]);
      state.members = members;
      // Nur übernehmen, wenn seit Start dieses Ladevorgangs noch KEIN Hintergrundabgleich für
      // eveningsIndex stattgefunden hat (siehe Kommentar oben und markEveningsIndexBackgroundSync()).
      if(lastEveningsIndexBackgroundSyncAt < eveningsIndexFetchStartedAt){
        state.eveningsIndex = eveningsIndex;
      }
      state.financeArrears = arrears;
      state.calendarEvents = calendarEvents;
      state.calendarOccurrenceEdits = calendarOccurrenceEdits;
      markFetched('members');
      markFetched('eveningsIndex');
      markFetched('financeArrears');
      markFetched('calendarEvents');
      markFetched('calendarOccurrenceEdits');
      state.view = 'main';
      render();
      applyEventDeepLinkFromUrl();
      backfillEveningSummaries();
      // iOS-Standalone-PWA-Trick: ein winziger echter Scroll zwingt WebKit dazu, die tatsächliche
      // Viewport-/Safe-Area-Größe beim Kaltstart korrekt neu zu berechnen. Body ist jetzt immer
      // minimal höher als der Bildschirm, damit hier wirklich etwas zum Scrollen vorhanden ist.
      requestAnimationFrame(()=>{
        window.scrollTo(0, 1);
        requestAnimationFrame(()=>{ window.scrollTo(0, 0); });
      });
      setTimeout(checkForUpdate, 2000);
      updateOwnLastLogin();
    }catch(e){
      state.view = 'main';
      renderError('Verbindung fehlgeschlagen. Bitte prüfe deine Internetverbindung.', init);
    }
  }

  // Trägt beim Login den Zeitpunkt beim verknüpften Mitglied ein (Admin-Account übersprungen).
  async function updateOwnLastLogin(){
    try{
      const user = auth.currentUser;
      if(!user || user.email===ADMIN_EMAIL) return;
      const member = state.members.find(m=> (m.email||'').toLowerCase()===user.email.toLowerCase());
      if(!member) return;
      member.lastLogin = new Date().toISOString();
      member.hasAccount = true;
      await saveMember(member);
    }catch(e){ /* nicht kritisch, einfach ignorieren */ }
  }

  (function bootstrapAuth(){
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode');
    const oobCode = params.get('oobCode');
    if(mode==='resetPassword' && oobCode){
      renderSetPasswordScreen(oobCode);
      return;
    }
    onAuthStateChanged(auth, async (user)=>{
      if(user){
        document.getElementById('app').innerHTML = `<div class="loading"><div class="loading-spinner"></div>Wird geprüft…</div>`;
        const clubId = await resolveActiveClub(user);
        if(!clubId) return; // renderNoClubAccessScreen() wurde bereits von resolveActiveClub gezeigt
        // Stale-Cache (siehe isFresh()/fetchIfStale() oben) ist rein zeitbasiert und kennt keinen
        // Club-Bezug - bei jedem Club-Kontextwechsel (Login, Logout, Wechsel des ausgewählten
        // Clubs) muss er daher komplett verworfen werden. Sonst könnte z.B. nach einem Logout und
        // erneutem Login mit einem ANDEREN Club ein noch nicht abgelaufener Zeitstempel fälschlich
        // Daten des vorherigen Clubs als "frisch genug" für den neuen Club durchgehen lassen.
        state._lastFetched = {};
        CURRENT_CLUB_ID = clubId;
        try{ CURRENT_CLUB_DATA = await getClub(); markFetched('clubData'); }catch(e){ CURRENT_CLUB_DATA = null; /* Fallback-Name wird verwendet */ }
        // Rollen-Claim laden (siehe canManageMembers()) - steuert nur die UI-Anzeige, die
        // eigentliche Durchsetzung übernehmen die Firestore Rules unabhängig davon. Ein gecachtes
        // Token kann bis zu 1h alt sein; das ist für Rollenwechsel in einem Kegelclub unkritisch.
        try{
          const tokenResult = await user.getIdTokenResult();
          state.currentUserRole = (tokenResult.claims && tokenResult.claims.role) || 'Mitglied';
        }catch(e){ state.currentUserRole = 'Mitglied'; }
        applyClubBranding();
        init();
      }else{
        state._lastFetched = {};
        CURRENT_CLUB_ID = null;
        CURRENT_CLUB_DATA = null;
        renderLoginScreen();
      }
    });
  })();
</script>
</body>
</html>
