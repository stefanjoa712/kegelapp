name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Generiert version.json aus der APP_VERSION-Konstante in index.html, damit der schlanke
      # Update-Check (siehe checkForUpdate() in index.html, #72) nie von der tatsächlich
      # deployten Version abweicht - ohne diesen Schritt müsste APP_VERSION bei jedem Release
      # manuell zusätzlich in version.json gepflegt werden.
      - name: Generate version.json from APP_VERSION
        run: |
          VERSION=$(grep -oP "APP_VERSION\s*=\s*'\K[^']+" index.html)
          if [ -z "$VERSION" ]; then
            echo "Konnte APP_VERSION nicht aus index.html extrahieren" >&2
            exit 1
          fi
          printf '{"version":"%s"}\n' "$VERSION" > version.json
          cat version.json
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: die-pudolfs

  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prüft, ob sich etwas im functions/-Verzeichnis geändert hat - der Functions-Deploy läuft
      # nur dann, damit nicht bei jedem reinen Hosting-Push unnötig ein Functions-Deploy mitläuft.
      - name: Check for functions changes
        id: functions-changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            functions:
              - 'functions/**'
      - uses: actions/setup-node@v4
        if: steps.functions-changed.outputs.functions == 'true'
        with:
          node-version: '22'
      - name: Install function dependencies
        if: steps.functions-changed.outputs.functions == 'true'
        working-directory: functions
        run: npm install
      - name: Authenticate to Google Cloud
        id: auth
        if: steps.functions-changed.outputs.functions == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_FUNCTIONS_SERVICE_ACCOUNT }}'
          create_credentials_file: true
      - name: Deploy Cloud Functions
        if: steps.functions-changed.outputs.functions == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: '${{ steps.auth.outputs.credentials_file_path }}'
        run: npx firebase-tools deploy --only functions --project die-pudolfs --non-interactive --force

  deploy-firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prüft, ob sich firestore.rules in diesem Push geändert hat - der Rules-Deploy läuft nur
      # dann, damit nicht bei jedem Hosting/Functions-Push unnötig ein Rules-Deploy mitläuft.
      - name: Check for firestore.rules changes
        id: rules-changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rules:
              - 'firestore.rules'
      - uses: actions/setup-node@v4
        if: steps.rules-changed.outputs.rules == 'true'
        with:
          node-version: '22'
      - name: Authenticate to Google Cloud
        id: auth
        if: steps.rules-changed.outputs.rules == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_FUNCTIONS_SERVICE_ACCOUNT }}'
          create_credentials_file: true
      - name: Deploy Firestore Rules
        if: steps.rules-changed.outputs.rules == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: '${{ steps.auth.outputs.credentials_file_path }}'
        run: npx firebase-tools deploy --only firestore:rules --project die-pudolfs --non-interactive --force

  deploy-storage-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prüft, ob sich storage.rules in diesem Push geändert hat - der Rules-Deploy läuft nur
      # dann, damit nicht bei jedem Hosting/Functions-Push unnötig ein Rules-Deploy mitläuft.
      - name: Check for storage.rules changes
        id: storage-rules-changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rules:
              - 'storage.rules'
      - uses: actions/setup-node@v4
        if: steps.storage-rules-changed.outputs.rules == 'true'
        with:
          node-version: '22'
      - name: Authenticate to Google Cloud
        id: auth
        if: steps.storage-rules-changed.outputs.rules == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_FUNCTIONS_SERVICE_ACCOUNT }}'
          create_credentials_file: true
      - name: Deploy Storage Rules
        if: steps.storage-rules-changed.outputs.rules == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: '${{ steps.auth.outputs.credentials_file_path }}'
        run: npx firebase-tools deploy --only storage --project die-pudolfs --non-interactive --force
